<!doctype html>
<!-- THREADS-BUILD 2026-10-06
     Threads: the one page. Replaces review.html (Ops Review) and the thread-tracker artifact.
     Spec: Codename: Riker/bridge/THREADS-SPEC.md. Data model §3, lanes §4, surfaces §9, XP §10.

     Same contract as index.html / review.html: this shell holds NO data. Everything loads from
     Firestore after Google sign-in through the named app 'bridge' (never [DEFAULT]).

     Reads:   threads/*, threads/{slug}/parked/*, threads/{slug}/log/*, bridge_state/_threads
     Writes (all as Sam, all through a transaction that checks version == old + 1):
       threads/{slug}            answer an ask · edit current/next/due/resume · set lane · close/reopen/park
       threads/{slug}/parked/*   promote (→ next) · drop
       threads/{slug}/log/*      one entry per write
       xp/{date}                 asks_answered +3 · next_advanced_by_sam +2 · threads_closed +10 (§10)
       bridge_state/_threads     {seen_at} on load — what "moved while you were away" is measured against

     Invariants enforced here BEFORE the write (the rules file enforces them again):
       one open ask per thread · version bump · active cap (THREADS_CAP) on open/reopen.
     The page never creates asks (the runner and sessions do, via threads.py). It answers them. -->

<style>

<body>
<div id="gate"><div class="box"><h1>Threads</h1><p>Sam's workstreams. Sign in with the Google account this page belongs to.</p><button id="signin">Sign in with Google</button><div id="gateErr"></div></div></div>
<div class="frame">
  <aside class="rail"><div class="blk top">Threads</div><div class="blk b2">Needs you</div><div class="blk b3">Active</div><div class="blk b4">Parked</div><div class="blk bot"></div></aside>
  <main>
    <div class="top">
      <h1>Threads<small id="stamp">…</small></h1>
      <div><div class="counts"><div class="needs"><b id="cNeeds">–</b>needs you</div><div><b id="cActive">–</b>active / <span id="cap"></span></div><div class="quiet"><b id="cQuiet">–</b>gone quiet</div><div><b id="cParked">–</b>parked</div></div><div class="acct" id="acct"></div></div>
    </div>
    <div id="status" class="hint">reading…</div>
    <section id="needsSec"><h2 class="needs">Needs you <span class="n" id="needsN"></span></h2><div id="needs"></div></section>

      <div class="row"><button class="tb" id="selAll">select all</button><button class="tb" id="selNone">clear</button><span class="hint">tick cards, then "carryall" to copy one resume prompt for a new session</span></div>
      <div class="grid" id="active"></div></section>

<div id="toast"></div>
<script>
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function laNowIso(){return new Date().toLocaleString('sv-SE',{timeZone:'America/Los_Angeles'}).replace(' ','T');}
function dayKey(){return laNowIso().slice(0,10);}
function ago(iso){var t=Date.parse(iso);if(!t)return '';var m=Math.round((Date.now()-t)/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';var h=Math.round(m/60);if(h<48)return h+'h ago';return Math.round(h/24)+'d ago';}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._h);toast._h=setTimeout(function(){t.classList.remove('on');},2600);}
function status(m){$('#status').textContent=m||'';}

var app=firebase.initializeApp(window.FIREBASE_CONFIG,'bridge');
var auth=firebase.auth(app), db=firebase.firestore(app), FV=firebase.firestore.FieldValue;
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(e){$('#gateErr').textContent='persistence: '+e.code;});
var provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
$('#signin').addEventListener('click',function(){auth.signInWithPopup(provider).catch(function(e){if(/popup-blocked|operation-not-supported|cancelled-popup/.test(e.code))return auth.signInWithRedirect(provider);$('#gateErr').textContent=e.code+' '+(e.message||'');});});
auth.getRedirectResult().catch(function(e){$('#gateErr').textContent=e.code;});
var booted=null, ME='';
auth.onAuthStateChanged(function(u){
  if(!u||!u.email){$('#gate').classList.add('on');return;}
  if(window.BRIDGE_ALLOWED.indexOf(u.email)<0){$('#gate').classList.add('on');$('#gateErr').textContent='This page is Sam\'s. Signed in as '+u.email;return;}
  if(booted===u.uid)return;booted=u.uid;ME=u.email;
  $('#gate').classList.remove('on');
  $('#acct').innerHTML=esc(u.email)+' · <button id="out">sign out</button>';
  $('#out').addEventListener('click',function(){auth.signOut().then(function(){location.reload();});});
  load();
});

/* ---------- state ---------- */
var T={}, SEEN_AT=null, SEL={}, OPEN=null;
function askOpen(d){return !!(d.ask&&d.ask.answer==null);}
function isQuiet(d){var at=d.last_touched&&d.last_touched.at;if(!at)return false;return (Date.now()-Date.parse(at))/864e5>=window.QUIET_DAYS;}
function movedAway(d){var lt=d.last_touched||{};if(!SEEN_AT||!lt.at)return false;var s=lt.surface||'';return lt.at>SEEN_AT&&(s==='runner'||s.indexOf('task:')===0);}
function activeCount(){return Object.keys(T).filter(function(k){return T[k].status==='active';}).length;}

function load(){
  status('reading…');
  $('#stamp').textContent=new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles',weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'});
  $('#cap').textContent=window.THREADS_CAP;
  Promise.all([db.collection('threads').get(), db.collection('bridge_state').doc('_threads').get()]).then(function(r){
    T={};r[0].forEach(function(doc){T[doc.id]=doc.data();});
    SEEN_AT=(r[1].exists&&r[1].data().seen_at)||null;
    render();
    status('');
    // mark seen AFTER render so the badges reflect what you had not yet looked at
    db.collection('bridge_state').doc('_threads').set({seen_at:laNowIso(),by:'threads.html'},{merge:true}).catch(function(e){status('seen_at: '+e.code);});
  }).catch(function(e){status('read failed: '+e.code+' '+(e.message||'')+' — the page shows nothing rather than stale data');});
}

/* ---------- writes: one transaction shape, invariants first ---------- */
function writeThread(slug, mutate, summary, kind, xp){
  var ref=db.collection('threads').doc(slug);
  return db.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      if(!snap.exists)throw new Error('thread vanished: '+slug);
      var cur=snap.data(); var next=JSON.parse(JSON.stringify(cur));
      var err=mutate(next,cur); if(err)throw new Error(err);
      next.version=(cur.version||0)+1; next.updated_at=laNowIso();
      if(next.ask&&next.ask.answer==null&&!(cur.ask&&cur.ask.answer==null)&&JSON.stringify(next.ask)!==JSON.stringify(cur.ask)) throw new Error('page never opens asks');
      tx.set(ref,next);
      tx.set(ref.collection('log').doc(laNowIso().replace(/[:]/g,'')+'-'+Math.random().toString(16).slice(2,8)),{at:laNowIso(),surface:'desktop',summary:summary,kind:kind});
      if(xp){var x={};x[xp[0]]=FV.increment(xp[1]);x.by_thread={};x.by_thread[slug]=FV.increment(xp[1]);tx.set(db.collection('xp').doc(dayKey()),x,{merge:true});}
      return next;
    });
  }).then(function(next){T[slug]=next;render();if(OPEN===slug)openPanel(slug);return next;})
    .catch(function(e){toast('refused: '+(e.message||e.code));throw e;});
}
function answer(slug, text){
  if(!text)return;
  writeThread(slug,function(n,c){if(!askOpen(c))return 'no open ask';n.ask=Object.assign({},c.ask,{answer:text,answered_at:laNowIso(),answered_by:ME});
    n.last_touched={at:laNowIso(),surface:'desktop',ref:'answer'};},'answered '+(T[slug].ask||{}).key+': '+text.slice(0,120),'ask_answered',['asks_answered',3])
  .then(function(){db.collection('ledger').doc(laNowIso().replace(/[:]/g,'')+'-'+slug).set({ts:laNowIso(),source:'sam',thread:slug,action_class:'ask:'+((T[slug].ask||{}).key||''),proposed:((T[slug].ask||{}).options||[]).join(','),decision:text,note:'threads.html',override:false});toast('answered · +3');});
}
function settleFlag(slug,key){writeThread(slug,function(n){if(!n.flags||!n.flags[key])return 'no flag';n.flags[key].state='settled';n.flags[key].settled_at=laNowIso();n.flags[key].settled_by='sam';},'settled '+key,'flag');}
function saveFields(slug,f){
  var advanced=false;
  writeThread(slug,function(n,c){['current','next','due','resume_prompt','title'].forEach(function(k){if(f[k]!==undefined)n[k]=f[k];});
    if(f.next!==undefined&&f.next!==c.next){advanced=true;n.last_touched={at:laNowIso(),surface:'desktop',ref:'edit'};}
    if(f.lane!==undefined){if(['sam','auto','ask'].indexOf(f.lane)<0)return 'bad lane';n.lane=f.lane;}},
    'edited'+(f.next!==undefined?' next: '+String(f.next).slice(0,100):''),'moved', advanced?['next_advanced_by_sam',2]:null)
  .then(function(){if(f.lane!==undefined&&f.lane!==T[slug].lane){}toast(advanced?'saved · +2':'saved');});
}
function setStatus(slug,st,displaces){
  writeThread(slug,function(n,c){
    if(st==='active'&&c.status!=='active'&&activeCount()>=window.THREADS_CAP&&!displaces)return 'active cap '+window.THREADS_CAP+' reached: park or close one first';
    n.status=st;if(displaces)n.displaces=displaces;},st,st==='closed'?'closed':'reopened',st==='closed'?['threads_closed',10]:null)
  .then(function(){toast(st==='closed'?'closed · +10':st);});
}
function promote(slug,pid,text){
  writeThread(slug,function(n,c){n.next=text;n.parked_count=Math.max(0,(c.parked_count||0)-1);n.last_touched={at:laNowIso(),surface:'desktop',ref:'unpark'};},'next ← parked: '+text.slice(0,80),'moved',['next_advanced_by_sam',2])
  .then(function(){return db.collection('threads').doc(slug).collection('parked').doc(pid).delete();}).then(function(){openPanel(slug);toast('promoted · +2');});
}
function dropParked(slug,pid){
  writeThread(slug,function(n,c){n.parked_count=Math.max(0,(c.parked_count||0)-1);},'dropped a parked item','moved')
  .then(function(){return db.collection('threads').doc(slug).collection('parked').doc(pid).delete();}).then(function(){openPanel(slug);});
}

/* ---------- render ---------- */
function chip(c,t){return '<span class="chip '+c+'">'+esc(t)+'</span>';}
function card(slug,d){
  var chips=chip('lane-'+d.lane,d.lane)+chip('',d.project)+(askOpen(d)?chip('askc','needs you'):'')+(movedAway(d)?chip('moved','moved while you were away'):'')+(isQuiet(d)?chip('quiet','gone quiet'):'')+(d.due?chip('','due '+d.due):'');
  var flags=Object.keys(d.flags||{}).filter(function(k){return d.flags[k].state==='open';}).length;
  return '<div class="card'+(SEL[slug]?' sel':'')+'" data-slug="'+esc(slug)+'">'+
    '<label class="pick" onclick="event.stopPropagation()"><input type="checkbox" data-sel="'+esc(slug)+'"'+(SEL[slug]?' checked':'')+'></label>'+
    '<div class="ttl">'+esc(d.title)+'</div><div class="chips">'+chips+'</div>'+
    '<div class="kv"><b>current</b>'+esc(d.current||'—')+'</div><div class="kv"><b>next</b>'+esc(d.next||'—')+'</div>'+
    '<div class="meta">'+(d.last_touched?ago(d.last_touched.at)+' · '+esc(d.last_touched.surface):'')+(flags?' · '+flags+' open flag'+(flags>1?'s':''):'')+(d.parked_count?' · '+d.parked_count+' parked':'')+'</div></div>';
}
function render(){
  var slugs=Object.keys(T);
  var active=slugs.filter(function(k){return T[k].status==='active';}).sort(function(a,b){return (T[a].due||'9999').localeCompare(T[b].due||'9999')||((T[b].last_touched||{}).at||'').localeCompare((T[a].last_touched||{}).at||'');});
  var parked=slugs.filter(function(k){return T[k].status==='parked';});
  var needs=[];
  slugs.forEach(function(k){var d=T[k];if(d.status==='closed')return;
    if(askOpen(d))needs.push({slug:k,kind:'ask',d:d});
    Object.keys(d.flags||{}).forEach(function(key){var f=d.flags[key];if(f.state==='open'&&f.level==='fail')needs.push({slug:k,kind:'flag',key:key,f:f,d:d});});
  });
  $('#cNeeds').textContent=needs.length;$('#cActive').textContent=active.length;$('#cQuiet').textContent=active.filter(function(k){return isQuiet(T[k]);}).length;$('#cParked').textContent=parked.length;
  $('#needsN').textContent=needs.length?needs.length+' open':'nothing waiting on you';$('#activeN').textContent=active.length+' of '+window.THREADS_CAP;
  $('#needs').innerHTML=needs.map(function(n){
    if(n.kind==='flag')return '<div class="flagrow"><div class="t"><b>'+esc(n.d.title)+'</b> · <span class="hint">'+esc(n.key)+' · first seen '+ago(n.f.first_seen)+'</span><br>'+esc(n.f.text)+'</div><button class="tb" data-settle="'+esc(n.slug)+'|'+esc(n.key)+'">settled</button></div>';
    var a=n.d.ask;
    return '<div class="ask"><div class="who">'+esc(n.d.title)+' · asked by '+esc(a.by||'?')+' · '+ago(a.since)+'</div><p class="q">'+esc(a.text)+'</p><div class="opts">'+
      (a.options||[]).map(function(o){return '<button class="tb mag" data-ans="'+esc(n.slug)+'" data-val="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+
      '<input placeholder="or type a reply and press Enter" data-ansin="'+esc(n.slug)+'"></div></div>';
  }).join('')||'<div class="hint">—</div>';
  $('#active').innerHTML=active.map(function(k){return card(k,T[k]);}).join('')||'<div class="hint">No active threads. Open one from a session: threads.py open …</div>';
  $('#parked').innerHTML=parked.map(function(k){return card(k,T[k]);}).join('')||'<div class="hint">nothing parked</div>';
  $('#parkedSum').textContent='Parked threads ('+parked.length+')';
  var n=Object.keys(SEL).filter(function(k){return SEL[k];}).length;$('#carry').classList.toggle('on',n>0);$('#carryN').textContent=n+' selected';
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-ans]');if(b){answer(b.getAttribute('data-ans'),b.getAttribute('data-val'));return;}
  b=e.target.closest('[data-settle]');if(b){var p=b.getAttribute('data-settle').split('|');settleFlag(p[0],p[1]);return;}
  var c=e.target.closest('.card');if(c&&!e.target.closest('.pick')){openPanel(c.getAttribute('data-slug'));return;}
});
document.addEventListener('change',function(e){var s=e.target.getAttribute&&e.target.getAttribute('data-sel');if(s){SEL[s]=e.target.checked;render();}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-ansin')){answer(e.target.getAttribute('data-ansin'),e.target.value.trim());}
  if(e.key==='Escape')closePanel();});
$('#selAll').addEventListener('click',function(){Object.keys(T).forEach(function(k){if(T[k].status==='active')SEL[k]=true;});render();});
$('#selNone').addEventListener('click',function(){SEL={};render();});
$('#carryGo').addEventListener('click',function(){
  var picks=Object.keys(SEL).filter(function(k){return SEL[k];});
  var txt=picks.map(function(k){var d=T[k];return '## '+d.title+' ['+d.project+' · lane '+d.lane+']\nCurrent: '+(d.current||'')+'\nNext: '+(d.next||'')+(d.due?'\nDue: '+d.due:'')+(d.resume_prompt?'\n\n'+d.resume_prompt:'');}).join('\n\n---\n\n');
  txt='Pick up these threads. Read each one\'s files before acting. At closeout, update each with: python3 "Codename: Riker/bridge/threads.py" touch <slug> --current "..." --next "..." --surface desktop --ref <session>.\n\n'+txt;
  navigator.clipboard.writeText(txt).then(function(){toast('carryall copied ('+picks.length+' threads)');});
});

/* ---------- detail panel ---------- */
function closePanel(){$('#panel').classList.remove('on');OPEN=null;}
$('#pclose').addEventListener('click',closePanel);
function openPanel(slug){
  var d=T[slug];if(!d)return;OPEN=slug;$('#panel').classList.add('on');
  var ref=db.collection('threads').doc(slug);
  var b=$('#pbody');
  b.innerHTML='<h3>'+esc(d.title)+'</h3><div class="chips">'+chip('lane-'+d.lane,d.lane)+chip('',d.project)+chip('',d.status)+chip('','v'+d.version)+'</div>'+
    '<div class="row"><button class="tb" id="copyResume">copy resume prompt</button>'+
    (d.status==='active'?'<button class="tb" id="parkT">park thread</button><button class="tb" id="closeT">close thread</button>':'<button class="tb" id="reopenT">reopen</button>')+'</div>'+
    '<div class="fld"><label>title</label><input id="fTitle" value="'+esc(d.title)+'"></div>'+
    '<div class="fld"><label>current</label><textarea id="fCurrent">'+esc(d.current||'')+'</textarea></div>'+
    '<div class="fld"><label>next (editing this pays +2)</label><textarea id="fNext">'+esc(d.next||'')+'</textarea></div>'+
    '<div class="fld"><label>due (YYYY-MM-DD or blank)</label><input id="fDue" value="'+esc(d.due||'')+'"></div>'+
    '<div class="fld"><label>lane</label><select id="fLane">'+['sam','ask','auto'].map(function(l){return '<option'+(l===d.lane?' selected':'')+'>'+l+'</option>';}).join('')+'</select></div>'+
    '<div class="fld"><label>resume prompt</label><textarea id="fResume">'+esc(d.resume_prompt||'')+'</textarea></div>'+
    '<div class="row"><button class="tb on" id="saveF">save</button></div>'+
    (d.ask?'<h2>ask</h2><div class="hint">'+esc(d.ask.key)+' · '+esc(d.ask.text)+(d.ask.answer!=null?'<br>→ '+esc(d.ask.answer)+' ('+ago(d.ask.answered_at)+')':' · OPEN')+'</div>':'')+
    '<h2>flags</h2><div id="pflags">'+(Object.keys(d.flags||{}).map(function(k){var f=d.flags[k];return '<div class="li"><div class="t"><b>'+esc(k)+'</b> '+esc(f.level)+' · '+esc(f.state)+'<br>'+esc(f.text)+'<br><span class="hint">first '+ago(f.first_seen)+' · last '+ago(f.last_seen)+'</span></div>'+(f.state==='open'?'<button class="tb" data-settle="'+esc(slug)+'|'+esc(k)+'">settled</button>':'')+'</div>';}).join('')||'<div class="hint">none</div>')+'</div>'+
    '<h2>parked <span class="n" id="pcount">cap '+esc(d.parked_cap||8)+'</span></h2><div id="pparked" class="hint">loading…</div>'+
    '<h2>trail</h2><div id="plog" class="hint">loading…</div>';
  $('#copyResume').addEventListener('click',function(){navigator.clipboard.writeText(d.resume_prompt||('Pick up thread "'+d.title+'". Current: '+d.current+' Next: '+d.next)).then(function(){toast('copied');});});
  $('#saveF').addEventListener('click',function(){saveFields(slug,{title:$('#fTitle').value.trim(),current:$('#fCurrent').value.trim(),next:$('#fNext').value.trim(),due:$('#fDue').value.trim()||null,lane:$('#fLane').value,resume_prompt:$('#fResume').value});});
  if($('#parkT'))$('#parkT').addEventListener('click',function(){setStatus(slug,'parked');});
  if($('#closeT'))$('#closeT').addEventListener('click',function(){if(confirmClose(d))setStatus(slug,'closed');});
  if($('#reopenT'))$('#reopenT').addEventListener('click',function(){setStatus(slug,'active');});
  ref.collection('parked').orderBy('added').get().then(function(q){
    var rows=[];q.forEach(function(p){var x=p.data();rows.push('<div class="li"><div class="t">'+esc(x.text)+'<br><span class="hint">'+esc(x.source||'')+' · '+ago(x.added)+(x.from_todo_id?' · '+esc(x.from_todo_id):'')+'</span></div><button class="tb" data-promote="'+esc(p.id)+'">make it next</button><button class="tb" data-drop="'+esc(p.id)+'">drop</button></div>');});
    $('#pparked').innerHTML=rows.join('')||'nothing parked';
    $('#pparked').querySelectorAll('[data-promote]').forEach(function(bt){bt.addEventListener('click',function(){var pid=bt.getAttribute('data-promote');var t=bt.parentNode.querySelector('.t').childNodes[0].textContent;promote(slug,pid,t);});});
    $('#pparked').querySelectorAll('[data-drop]').forEach(function(bt){bt.addEventListener('click',function(){dropParked(slug,bt.getAttribute('data-drop'));});});
  }).catch(function(e){$('#pparked').textContent='parked: '+e.code;});
  ref.collection('log').orderBy('at','desc').limit(40).get().then(function(q){var rows=[];q.forEach(function(l){var x=l.data();rows.push('<div class="logrow">'+esc(x.at.slice(0,16).replace('T',' '))+' · '+esc(x.surface)+' · '+esc(x.kind)+' — '+esc(x.summary)+'</div>');});$('#plog').innerHTML=rows.join('')||'no trail yet';}).catch(function(e){$('#plog').textContent='trail: '+e.code;});
}
/* A close is the one irreversible-feeling verb; no browser confirm() (it blocks automation), a two-tap instead. */
var closeArmed=null;function confirmClose(d){if(closeArmed===d.slug){closeArmed=null;return true;}closeArmed=d.slug;toast('tap "close thread" again to close '+d.title);setTimeout(function(){closeArmed=null;},4000);return false;}
</script>
</body>
</html>
