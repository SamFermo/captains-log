<script>
(function(){
'use strict';

/* Accent carries MEANING, not identity.
     magenta = this wants something from you
     cyan    = this is here to inform you
   Six different hues told Sam nothing he could not already read off the glyph and the
   label, and made every tile shout at the same volume. Two hues let the grid say, at a
   glance and before any reading happens, which half of the morning is work. */
/* Array order IS ring order, clockwise from twelve o'clock. `live` marks a card
   with no payload section: weather is fetched by the page, so it must not be
   dropped from the ring just because the 4am run does not write it. */
var CARDS = [
  {k:'punch',    label:'Punch List', glyph:'✓', ac:'var(--mag)'},
  {k:'inbox',    label:'Inbox',      glyph:'✉', ac:'var(--mag)'},
  {k:'service',  label:'Service',    glyph:'▲', ac:'var(--mag)'},
  {k:'calendar', label:'Calendar',   glyph:'◷', ac:'var(--cyan)'},
  /* News sat here until 2026-08-06 and the Boothby study card took its slot the
     same day (row 4, columns 5/9, the shape restored from the commented SLOT
     entry rather than reinvented).

     CYAN, and that is the considered call rather than the default. Study informs
     him most mornings; it only wants something when a segment is prepared and
     unsat. That is exactly Calendar's carve-out — a cyan card may carry a count
     when something is genuinely due — and it is why the badge rule below is
     narrow. A magenta study card would shout every morning of a course.

     `live:true` because it draws from `bridge_data/boothby`, not from
     `bridge/{date}`. Without it `cardMissing()` sees a card in CARDS with no
     payload section and renders "the 4am run did not write this card", which is
     both false and impossible to act on: that run is never going to write it.
     Boothby carries its own absent and unreachable states, the same way weather
     carries its own. */
  {k:'boothby',  label:'Study',      glyph:'✎', ac:'var(--cyan)', live:true},
  /* Renamed Training 2026-09-03: the sheet now holds Worf's session plus the
     routine steps, and intake moved to the landing page. Same key, same ids,
     same scoring — a rename must never detach a tick. */
  {k:'routine',  label:'Training',   glyph:'◐', ac:'var(--cyan)'}
];

/* ── the mobile icon set ───────────────────────────────────────────────────
   Drawn rather than typed. The `glyph` field above is a Unicode mark set in the
   body face, which is right at 10.5px beside a label and crude at 38px, and 38px
   is what the mobile face needs (see the icon mosaic block in the CSS). Sam's
   call, 2026-08-06.

   Hairline strokes in currentColor at the same weight as the weather icons that
   are already in this file, so the two sets read as one hand. 24-unit viewBox,
   stroke-width 1.7, which lands at ~2.7px on a 38px face and stays a line
   drawing rather than a filled shape — the tile's accent is already carrying
   state on the edge and the inner glow, and a 38px block of it would shout.

   NO WEATHER ENTRY. Weather keeps its real face on mobile, which is the whole
   exception Sam named, so an icon for it would be dead code that invites someone
   to wire it up later. */
var ICONS={
  punch:    '<path d="M4.5 12.6l5 5 10-11.2"/>',
  inbox:    '<rect x="3" y="5.5" width="18" height="13" rx="1.6"/><path d="M3.7 6.7L12 13l8.3-6.3"/>',
  service:  '<path d="M3 17.6l5.5-5.6 3.5 3 6.2-7"/><path d="M13.6 8h4.6v4.6"/>',
  calendar: '<rect x="3.5" y="5.5" width="17" height="15" rx="1.6"/>'+
            '<path d="M3.5 10.2h17M8 3.4v4.2M16 3.4v4.2"/>',
  /* An open book. Two leaves meeting at a spine, drawn as one continuous outline
     so it stays a line drawing at 38px like the other four rather than turning
     into a filled block. The spine is a separate stroke because without it the
     shape reads as a cloud. */
  boothby:  '<path d="M12 7.2C10.4 5.9 8.4 5.3 6 5.3H3.5v12.6H6c2.4 0 4.4.6 6 1.9'+
            'c1.6-1.3 3.6-1.9 6-1.9h2.5V5.3H18c-2.4 0-4.4.6-6 1.9z"/>'+
            '<path d="M12 7.2v12.6"/>'
};
/* Routine is the one icon that carries a reading rather than an identity. The
   old mark was ◐, a part-filled circle, and the honest version of that is an arc
   that actually tracks the chain: circumference at r 9 is 56.549, so `done` steps
   of `total` is that fraction of it, started at twelve. Same idiom as the dial,
   one radius down. It is why Routine needs no count badge. */
function routineIconSvg(){
  var st=routineSteps(), n=st.length, d=n?routineDone():0;
  var C=56.549, len=n?(d/n)*C:0;
  return '<circle cx="12" cy="12" r="9" opacity=".26"/>'+
         '<circle cx="12" cy="12" r="9" transform="rotate(-90 12 12)" '+
         'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"/>';
}
function iconSvg(c){
  var body = (c.k==='routine') ? routineIconSvg() : ICONS[c.k];
  if(!body) return '';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" '+
         'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+body+'</svg>';
}

var $=function(s){return document.querySelector(s);};
var el=function(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});};
/* Physical acknowledgement that a tick landed. Removed after it plays so the
   class can be re-added on the next one. */
function hit(node){
  if(!node)return;
  node.classList.remove('hit');void node.offsetWidth;node.classList.add('hit');
  setTimeout(function(){node.classList.remove('hit');},400);
}

var db=null,user=null,DATA=null,DATE=null;
/* `synced` is READ but never written, as of 2026-08-06. It was the flag that
   separated "Sam ticked this today" from "this has been handed off", which were
   genuinely different facts and conflating them is what made Sync never clear.
   Sync is gone, so nothing produces the fact any more.

   The field is still loaded, deliberately. Old bridge_state docs carry it, and a
   loader that chokes on a key it no longer understands is a worse bug than a
   field nobody reads. Do not "clean this up" by deleting the load line. */
/* intakeJp: has the intake jackpot already played today. Persisted, not in-memory —
   see showIntakeJackpot() for why this one needs a guard when the session payout does not. */
/* `dismissed` holds inbox rows Sam has cleared TODAY. It lives in
   bridge_state/{date} rather than anywhere persistent precisely so it expires at
   midnight: a thread still unanswered tomorrow is still work tomorrow. */
var state={done:[],marked:[],ro:[],synced:[],dismissed:[],water:0,cider:false,vits:false,
           pack:[],   /* farm-dinner pack-list ticks, 2026-09-04. Daily, no XP. */
           intakeJp:false,routineJp:false,homeSeen:[],homeXp:0,study:false,
           /* The rowing rework, 2026-08-25. `workout` becomes the daily ROW tick
              (rows are now scheduled every day), `str` is the strength tick on the
              days Worf scheduled one, `meters` is today's rowed distance, typed in
              by Sam. All three live on bridge_state/{date} and expire at the 4am
              boundary like every other daily tick. */
           str:false,meters:0};
/* Boothby's course projection and the finished-book shelf. BOOTHBY null with
   BOOTHBY_ERR null means the key has not been published yet; BOOTHBY_ERR set
   means the read failed. The card draws those two differently and neither as an
   empty course. */
var BOOTHBY=null, BOOTHBY_ERR=null, BOOKS_DONE=[];
/* The month's NOI, from bridge_data/noi. Same three-state contract as BOOTHBY and
   TARGETS: null with NOI_ERR null means push_noi.py has not run, NOI_ERR set means the
   read failed, and the scorecard row says which. `NOI.estimated` distinguishes the
   projection from Tim's booked figure and the card must READ that flag rather than
   assuming, because the same key carries both. */
var NOI=null, NOI_ERR=null;
/* The two device-owned book lists that joined `finished` on 2026-08-06: the books Sam
   added himself, and the suggestion ids he has said no to. Both live on
   bridge_state/_books beside BOOKS_DONE and are written by the same saveBooks() call.
   They are separate from Boothby's published shelf on purpose — see the comment above
   boothbyBooks(). */
var BOOKS_OWN=[], BOOKS_NO=[];
/* 96oz, as eight 12oz cups. Sized on 2026-08-04 against the US National Academies
   figure of 3.7L total water a day for men: that number INCLUDES water from food
   (roughly a fifth of it) and from every other drink, coffee included, so plain
   water lands near 96oz rather than the full 125. The familiar "eight glasses"
   is 64oz and has no strong evidence behind it, which would have made it a soft
   target for someone on his feet through a hot service. */
var WATER_TARGET=8, WATER_OZ=12;

/* ══ THE WEIGHTS ═══════════════════════════════════════════════════════════
   Phase 2, set 2026-08-04. This is the REVERSIBLE layer and that is the whole
   reason it was written second. RANKS ratchets: a threshold can never be revised
   without either stranding Sam at a rank he no longer qualifies for or demoting
   him. These numbers carry no such debt and can be retuned any morning without
   touching a single earned rank. So the ladder fixed the time horizon first and
   these were fitted to it afterwards.

   Fitted BLIND, and that is worth writing down rather than discovering later.
   The only history in the ledger is 7/30, 7/31 and 8/2, which were Sam building
   this system: he was adding punch items faster than he closed them and nothing
   scored but task completion. Those rows predict nothing about a finished board,
   so there is no empirical base under these numbers at all. The calibration is
   the first real fortnight. If standing() reads above ~9/day across it, they are
   running hot and they come down. Nothing about that strands a rank.

   Sized so a normal day lands near the ~8/day the ladder assumes. Ceiling is
   higher, deliberately: a perfect day should feel like a perfect day.

   NO FRACTIONS ANYWHERE. An earlier cut priced fire cider and the multivitamin at
   0.5 each, which puts a non-integer into xpTotal() and therefore into both the
   rank comparison and the number printed on the strip. The strip would read 15.5,
   and rounding for display would recreate exactly the three-different-numbers bug
   that paintReactor already had to be moved to fix. Doubling every threshold to
   absorb halves is not available either, because thresholds ratchet. Integers. */
var W={
  punch:1,    punchCap:5,     // a closed punch item, capped per day
  /* THE ROUTINE DROPPED FROM 3 TO 1 ON 2026-08-10, and the 3 did not vanish, it moved
     into the WEEK. Sam's reasoning: "doing the routine cycle shouldn't get me more
     points in a day than a study session. The study session is significantly more
     challenging than a short walk and some arm circles. However getting 7 days straight
     of completing the routine is an achievement."
     So the daily tick now sits BELOW study at 2, which is the ordering he asked for, and
     the real money is routineWeek, paid on the completed week. See routineWeekAward(). */
  routine:1,                  // the WHOLE routine block, all or nothing. See routineXp().
  routineWeek:8,              // the 7/7 week, RANK ONLY. Scales down convexly. See routineWeekAward().
  perfectMonth:10,            // every day in a calendar month, RANK ONLY.
  workout:2,                  // the daily ROW. Since 2026-08-25 Worf schedules a 20-minute
                              // row every day, so this tick is daily. Its OWN tick,
                              // deliberately NOT inside the all-or-nothing routine block.
                              // Priced level with study: a 20-minute row is real work,
                              // Sam's call 2026-08-25. See rowXp().
  strength:2,                 // a Worf-scheduled strength session, three a week. Its own
                              // tick beside the row, same day sometimes. See strengthXp().
  /* THE ROWING WEEK, 2026-08-25. Everything weekly here is RANK ONLY through the
     award channel, Sam's restated rule: weekly scores tally separately from daily
     so the daily averages stay clean. Four pieces, settled together each Monday as
     one `wf:` award: the row-days tiers (5/7 pays 2, 6/7 pays 4, 7/7 pays 6 — top
     tier only, not stacked), the strength tiers (1/3 pays 1, 2/3 pays 2, 3/3 pays
     3), one point per full `metersPer` rowed, and `metersGoalBonus` on reaching
     `metersGoal` regardless of whether the meters came daily or lumped — the
     regardless is Sam's, verbatim. The goal was set from his own tracked baseline:
     the June 20-minute rows averaged 3,115m, times seven is 21,805, floored to a
     round 21,000 so it is reachable on pace he has already shown. Tiers and goal
     retune freely like every other weight; see rowWeekBonus()/strengthWeekBonus(). */
  metersPer:4000,             // 1 rank point per full 4,000m rowed in a week
  metersGoal:21000,           // the weekly meters goal, from the June baseline
  metersGoalBonus:4,          // on reaching metersGoal, daily or lumped alike
  sessionCap:3,               // work a SESSION closed, credited automatically. See creditClosed().
  intake:3,                   // water + fire cider + multivitamin, all or nothing
  home:3,     homeCap:6,      // CLEARING Amy's house list. See checkHomeCleared().
  study:2,    // Boothby daily study tick — WIRED 2026-08-06, see studyXp()
  /* ASSESS WENT 3 → 8 ON 2026-08-11, and the old 3 was indefensible on its own terms.
     A study tick pays 2 for sitting down, pass or fail. The assessment is an hour of
     graded pressure that CAN fail, and a fail pays zero, so at 3 the paper was worth
     one and a half unpressured ticks in the best case and less than one in
     expectation. Sam's read, and he is right: "the assessments should probably be
     worth more than just a point more than a study session."
     8 makes a pass worth four study sessions, about a week of showing up. */
  assess:8,   // a Boothby assessment PASSED — rank only, see boothbyXp()
  course:25   // a whole Boothby COURSE completed — rank only, see boothbyXp()
  /* `win` IS GONE FROM THIS TABLE, and its absence is the design rather than an omission.
     Work-win point values live in `bridge_data/targets.points` and are read from there —
     covers_record, week_sales, week_labor_band, week_labor_excellent. The scorecard has
     been PRINTING those numbers since 2026-08-06 while `W.win` sat unwired beside them,
     which is two sources of truth for one payout waiting to disagree. Scoring from the
     same field the card prints means the row and the ledger cannot drift apart.
     Consequence, and it is correct: if the targets doc fails to read, no win pays. You
     cannot score against a benchmark you could not reach, and the card already says so
     out loud rather than drawing every row at zero.
     See creditCoversRecord() for the daily award and creditWeekWins() for the two
     weekly ones. */
};
/* `study` was a confirmed number with no source to read from until 2026-08-06,
   when the Boothby card gave it one. It is a self-reported tick on the study
   card, deliberately: Sam's rule is that a completed study session scores 2 and
   is NOT pass or fail, because it is credit for sitting down. Marking it from
   the transcript instead would pay only for passing, which is a different
   behaviour and one the assessment already covers.

   `assess` is new the same day and it is a DIFFERENT KIND of point. A study tick
   is a daily action, so it moves the arc and the streak through dayXp(). An
   assessment is the weekly, longer award, so it moves RANK ONLY and is added in
   xpTotal() rather than dayXp(). That is the first governing decision of the
   whole commission — daily actions move the arc, longer awards move rank — and
   folding a 3-point Sunday into the daily arc would spike one day of the week
   exactly the way a weekly digest must not.

   SET 2026-08-11, and this closes open question 1 in Boothby's handoff, which had
   been sitting since 08-04. A unit pass is 8 and a whole course is 25, both rank
   only. The sizing, done against the whole board the way Sam asked rather than
   decided in isolation: at the ladder's assumed 8/day a year is ~2,900 points, and
   twelve courses of six units is ~72 passes, so 8 a pass is ~576 a year, close to
   20% of the annual budget. Twelve completions add 300, another 10%. With the daily
   tick at 2 the whole study track lands near 40% of a year's rank progress, which
   is a lot for one track and is meant to be — it is the only track that can fail.

   CORRECTING THE NOTE THAT USED TO SIT HERE. It claimed anything above 6 a pass
   would make study the MAJORITY of his rank progress. That does not reproduce:
   at 6 a pass, with the daily tick paid every single day, the track is ~40%, not
   a majority. The claim was overstated and it was about to be used as a ceiling in
   the very conversation that set these numbers. Redo the arithmetic before quoting
   a share, and note the sensitivity — if a course actually runs twelve assessments
   a month rather than six, every figure above doubles and 8 is too high.

   BOTH VALUES REPRICE RETROACTIVELY, because boothbyXp() recomputes from the
   transcript on every load rather than banking. That is why the change was made
   with exactly one row on the board: the repricing cost 5 points today and would
   have been a visible jump in rank at any later date.

   `win` still has no surface and dayXp() still does not sum it. A scoring path
   with no way to fire is a path nobody can test. Wire it when the source lands. */

/* THE ROUTINE IS ALL-OR-NOTHING TOO, from 2026-08-05, and it pays a flat 3 for the
   whole block rather than 1 a step. Sam's call, and the same shape he chose for
   intake: every movement gets its own checkbox because ticking them one at a time
   is the satisfying part, but the block only scores when every one is ticked.

   This replaces `routineCap`, which existed because the page could not trust the
   feeder's step COUNT — five neck-roll checkboxes were jointly worth five closed
   punch items, and the captain's log rewrites this payload every morning, so any
   run could move the ladder by changing the length of a list. A flat block value
   subsumes that entirely: 5 steps or 2, the routine is worth 3 and only when
   finished. The count can now change freely without touching the economy.

   It also closes a hole the cap left open. With `routineCap:3` against a 5-step
   payload, ticking any 3 of 5 scored full marks and the last two were free. */

/* ALL THREE OR NOTHING. Sam's call, 2026-08-04, and it is stricter than the
   0/1/2 water tier it replaces: 96oz AND the fire cider AND the multivitamin, or
   this track pays nothing at all. Same ceiling as before, materially harder to
   reach, which pulls the daily AVERAGE down even though the maximum is unmoved.

   The known failure mode, recorded so it is recognised if it shows up rather than
   rediscovered: at 6pm on five cups with the cider missed, the day is already
   lost and nothing rewards finishing the water. Partial credit is what keeps the
   back half of a day live. If Sam finds himself stopping at five, the fix is a

   item removed it from the payload and it was worth nothing at all — the more work
   got done for him, the less his ledger showed.

var saveTimer=null;

/* THE BRIDGE'S DAY RUNS 4am TO 4am, not midnight to midnight. Sam's call 2026-08-05,
   and the reason is simply that he is often up past midnight: at 12:12am the counter
   reset and the water he had drunk that evening became unreachable, because the day it
   belonged to had already ended.

   the state doc, the routine ids, the ledger rows, the streak. So the boundary is
   defined once, here, and the whole app moves together. Shifting only the intake counter
   was considered and rejected: two definitions of "today" in one file drift.

   It also closes two things that were already wrong.

   the page had nothing to show every night from midnight and leaned on the stale
   fallback to look sane. It now asks for the day it is actually still in, and that
   brief exists. The fallback stays for a genuinely failed run, which is what it was for.

   while the screen was still showing yesterday's steps. When the real brief landed at
   4:24 with a different list, index 0 could be a different habit.

   04:30, so between 4:00 and roughly 4:30 the day has turned but the brief has not been
   written. The stale bar covers it and says so. 5am would close the gap and stop
   matching the name.

   spring-forward day, when 4am is only three absolute hours after midnight, and it would

   pages used '[DEFAULT]' they were sharing one storage slot, and every visit to the portal

   restored an anonymous user, `u.email` was null, and onAuthStateChanged dropped straight to
   the sign-in gate. That is the whole reason the Bridge asked for a login every morning
   despite LOCAL persistence being set correctly the entire time.

auth.onAuthStateChanged(function(u){

     a single read happened, which is why Amy could not reach anything: there was nowhere
     for her to land.

     Her address is deliberately NOT added to BRIDGE_ALLOWED. That list holds Sam's two
     addresses, which are already public, and this repo is public — putting a family
     member's personal address in it would ship it to GitHub. Identity for the house list

  if(window.BRIDGE_ALLOWED.indexOf((u.email||'').toLowerCase())<0){

    // rendering bug. Previously any exception in here fell through to the read-failure
    // catch below, and a plain ReferenceError in renderRecap was shown to Sam as
    // "could not refresh" — sending him to look at Firestore for a typo in this file.
    function finish(){
    try{ render(); }
    catch(err){
      RENDER_ERR=err;
      // #panelHost, not the old #grid. This handler is the one path whose entire
      // job is to report a failure, so a stale selector here means a render bug
      // throws a SECOND time inside its own reporter and Sam sees a blank page
      // with no explanation at all.
      var ph=$('#panelHost');
      if(ph) ph.innerHTML='<div class="empty">'+
        'This page failed to draw itself. The data loaded fine.<br><br>'+
        esc((err&&err.message)||String(err))+'</div>';
      var box=$('#recap');box.classList.remove('hide');box.classList.add('fail');box.open=true;
      $('#rcTitle').innerHTML='<b>Display error</b> · the data is fine, the page is not';
    }
    // AFTER render, so a rendering bug cannot stop the day being recorded, and
    // guarded on DATA so a failed read never writes a row claiming Sam showed up
    // to a brief that was never there.
    //
    // paintReactor runs AGAIN between the two, and it is not redundant. render()
    // paints the strip from the ledger as it was READ, then saveLedger rewrites
    // today's row from the live quest set. Without the repaint the strip shows a
    // total that no longer matches what was just persisted, and checkPromotion
    // then judges against a third number Sam never saw. All three have to agree.
    /* checkWeekly() rides at the end of the same sequence as checkJackpot and for the
       same reason: both CREDIT first and then repaint, so the strip and the ladder
       already agree before either modal is drawn. Do not move it above saveLedger —
       the load-bearing ordering is saveLedger → paintReactor → checkPromotion, and
       rank reads a total that only exists after the ledger write. */
    if(DATA){ saveLedger(); paintReactor(); checkPromotion(); checkJackpot(); checkWeekly(); }
    btn.classList.remove('spin');
    }
  }).catch(function(e){
    var code=(e&&e.code)||'';
    var transient=(code==='permission-denied'||code==='unavailable'||code==='unauthenticated');
    if(transient && retries<3){
      retries++;
      return new Promise(function(res){setTimeout(res,400*retries);}).then(load);
    }
    retries=0;
    btn.classList.remove('spin');
    if(DATA){ // keep what is on screen, but say it is stale
      LOAD_ERR={code:code,message:(e&&e.message)||String(e),stale:true};
      renderLoadError();
      return;
    }
    LOAD_ERR={code:code,message:(e&&e.message)||String(e),stale:false};
    render();
  });
}
var retries=0, LOAD_ERR=null, RENDER_ERR=null;
/* SRC_DATE is the date of the brief being DISPLAYED. DATE stays today, always.
   That separation is the whole point: check-offs, the streak ledger and queue
   items are "what Sam did today" and must key to today even when the content on
   screen came from yesterday. Tick something off the stale brief at 1am and it is
   still ticked when the 4am run replaces the content, because the ids are
   content-derived and the state doc never moved. */
var SRC_DATE=null, STALE=null, LOOKBACK_ERR=null;
var LOOKBACK_DAYS=4;

function lookBack(){
  LOOKBACK_ERR=null;
  var days=[], d=new Date(DATE+'T12:00:00');
  for(var i=0;i<LOOKBACK_DAYS;i++){ d.setDate(d.getDate()-1); days.push(dayKey(d)); }
  return Promise.all(days.map(function(k){
    return db.collection('bridge').doc(k).get().then(function(s){
      return s.exists?{date:k,data:s.data()}:null;
    });
  })).then(function(res){
    for(var i=0;i<res.length;i++) if(res[i]) return res[i];   // days[] is newest first
    return null;
  }).catch(function(e){
    /* Loud, not silent. If the lookback itself failed we must not let the page
       imply there was simply nothing to find — that is the same lie as rendering
       a failed read as an empty day, which is the bug this whole file is built
       around avoiding. The reason gets printed in the empty-state message. */
    LOOKBACK_ERR=(e&&e.code)||(e&&e.message)||String(e);
    return null;
  });
}

function renderLoadError(){
  var box=$('#recap');
  box.classList.remove('hide');box.classList.add('fail');box.open=true;
  $('#rcTitle').innerHTML='<b>Could not refresh</b> · showing the last good copy';
  var b=$('#rcBody');b.innerHTML='';
  b.appendChild(el('div','rc-fails','<h4>Read failed</h4><div>'+
    esc((LOAD_ERR.code||'unknown')+' — '+LOAD_ERR.message)+
    '</div><div>What you see below is the last copy that loaded, not necessarily current.</div>'));
}
$('#refresh').addEventListener('click',load);

function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(!user)return;
    db.collection('bridge_state').doc(DATE).set({
      /* `synced` is deliberately absent, and the write is {merge:true}, so any
         value an old doc already carries is left alone rather than blanked. */
      done:state.done,marked:state.marked,ro:state.ro,dismissed:state.dismissed,
      water:state.water,cider:!!state.cider,vits:!!state.vits,
      intake_jp:!!state.intakeJp,routine_jp:!!state.routineJp,
      home_seen:state.homeSeen||[],home_xp:state.homeXp||0,study:!!state.study,
      workout:!!state.workout,str:!!state.str,meters:state.meters||0,
      orders_seen:state.ordersSeen||'',
      pack:state.pack||[],
      updated_at:new Date().toISOString(),by:user.email},{merge:true}).catch(function(){});
    /* saveLedger, THEN repaint, THEN judge the promotion — the same order the load
       path uses, and for the same reason. saveLedger is what folds today's row into
       ledger.days, and rank() reads that. The synchronous paintReactor at the bottom
       of this function runs BEFORE this timeout fires, so it necessarily paints the
       rank total from a ledger that does not yet contain today. Without this line the
       strip keeps showing the pre-tick total until some unrelated event repaints it.
       Measured 2026-08-04: completing the intake block persisted xp:3 correctly while
       the strip sat on 12/50 indefinitely, and only corrected on closing the sheet.
       The bug predates the weights; the 3-point intake jump is what made it visible,
       next to a row that says "Complete · +3". */
    saveLedger(); paintReactor(); checkPromotion();
  },600);
  dock();
  // Live, while the sheet is still open over the top: the node value and the XP
  // arc move as he ticks, so closing the sheet confirms what he already saw. This
  // pass is still worth making: the arc comes from questSet(), which is current
  // immediately, so it tracks the tick with no delay. Only the ledger-derived rank
  // total lags, and the repaint above is what settles it.
  paintTiles();
  paintReactor();
}

/* ── the ledger ────────────────────────────────────────────────────────────
   Today's quest board is the FEATURED punch items plus the routine steps, and
   nothing else. Scoring against all 243 open items would print a 2% completion
   bar every morning before coffee, which is a participation medal running in
   reverse: a number that can never move is not feedback, it is weather. The
   featured set is already the list Sam is actually trying to clear, it is
   already computed in build_punch.py, and it resets daily, so it can genuinely
   reach full. The 243 gets its own honest readout as a backlog with a
   direction, because a backlog has a trend, not a percentage. */
/* TWO different questions, which used to be one and were both answered wrong.

   `offered` / `done` is the day's QUEST BOARD: the featured short list plus the
   routine steps. It is the denominator of the XP arc, and it has to stay the
   short list — counting all 278 open items would render five closes as a 2% arc.

   `closed` is what Sam ACTUALLY ticked, featured or not. Closing something from
   the "Everything" tab is the same work as closing it from "Priority", and
   scoring only the featured subset is exactly why the ledger recorded 1 on
   2026-07-31 when the state doc for that day holds 5, and 2 on 2026-08-02 when
   the state doc holds 6. XP counts `closed`. The arc counts `done`. */
/* punch and routine are counted SEPARATELY as well as together, because they are
   capped separately (see W). `closed` stays as their sum so the ledger rows written
   before the weights shipped keep meaning what they meant. */
function questSet(){
  var board=[], all=[], pDone=0, rDone=0;
  allPunchItems().forEach(function(i){
    all.push(i.id);
    if(i.featured!==false) board.push(i.id);
    if(state.done.indexOf(i.id)>=0) pDone++;
  });
  var st=(DATA&&DATA.routine&&DATA.routine.steps)||[];
  for(var i=0;i<st.length;i++){
    var rid='routine-'+DATE+'-'+i;
    board.push(rid); all.push(rid);
    if(state.done.indexOf(rid)>=0) rDone++;
  }
  var done=0;
  board.forEach(function(id){ if(state.done.indexOf(id)>=0) done++; });
  return {ids:board,total:board.length,done:done,
          closed:pDone+rDone,punch:pDone,routine:rDone};
}

/* Today's score. The ONE place a day's XP is computed, so the ledger, the strip
   and the promotion check can never be reading three different numbers. */
function dayXp(){
  var q=questSet();
  /* Tick-derived ONLY. Session credit is deliberately not added here: this value is
     what saveLedger writes into the day row, and xpTotal() adds session points on top
     of every row. Folding them in here too would count the same work twice, and the
     strip, the ladder and the weekly bars would each disagree by a different amount. */
  return Math.min(q.punch,W.punchCap)*W.punch
       + routineXp()
       + intakeXp()
       + homeXp()
       + studyXp()
       + rowXp()
       + strengthXp();
}
/* The daily study tick. Self-reported and binary, and it pays whether the session
   went well or badly — Sam's rule, 2026-08-06: it is credit for sitting down, not
   for being right. The assessment is where being right is scored.
   Guarded on a course actually existing, so the tick cannot be earned on a
   morning when there is no course to sit and no card to sit it from. */
function studyXp(){ return (state.study && boothbyCourse()) ? W.study : 0; }
function boothbyCourse(){ return (BOOTHBY && BOOTHBY.course) || null; }

/* ── THE WORF TICK ──────────────────────────────────────────────────────────
   Added 2026-08-10. Worf's training block, surfaced on the Routine card but
   scored SEPARATELY from it.

   Sam floated giving Worf its own tab. It is not one, for two reasons. The
   mosaic is seven tiles and an eighth is the single most expensive change
   available in this file — fitDial derives every mask from where the grid put
   things, and canon is that new cards arrive as pill-reached sheets rather than
   as another tile. And a workout is a morning habit, so it belongs where the
   rest of his morning already is.

   IT IS NOT INSIDE THE ALL-OR-NOTHING BLOCK, and that is the load-bearing
   choice. Folding a workout into routineXp() would mean one missed session
   destroys the whole routine day, which then costs the weekly award as well:
   three days a week where a single miss is worth roughly six points. The
   separate tick costs 2 and leaves the routine intact.

   GATED ON A SCHEDULED DAY, never shown otherwise. This is what makes a farm
   Sunday free rather than a penalty. Sam, 2026-08-10: "the worf workout should
   also not get scheduled on a normal sunday" — the schedule is Worf's to set and
   this side simply renders what it is told. No key for today, no tick, nothing
   lost. Which is also the failure mode when bridge_data/worf cannot be read, and
   that is the safe direction to fail in: an unreachable schedule costs him
   nothing, where a tick drawn on a guess would cost him a point he never had a
   chance to earn. WORF_ERR carries the reason so the card can say so. */
var WORF=null, WORF_ERR=null;
/* ── THE ROWING REWORK, 2026-08-25 ──────────────────────────────────────────
   The regimen changed: a 20-minute row EVERY day plus three strength sessions a
   week, so a day can now carry two sessions. The doc shape grew accordingly:

     days[DATE] = { "row":      {"title":"20 min Row", "mins":20},
                    "strength": {"title":"...", "kind":"strength", "mins":30} }

   Either key may be absent, and absence keeps its old meaning: no key, no tick,
   no cost. The LEGACY flat shape {title,kind,mins} is still read — a stale doc
   from before the rework renders as its one session rather than as nothing,
   because a schedule Sam earned ticks against must not vanish under him on the
   morning the schema moves. Legacy kind 'row' maps to the row slot; anything
   else maps to strength, which is what those sessions were. */
function worfDay(){
  var d=(WORF&&WORF.days)||null;
  return (d && d[DATE]) ? d[DATE] : null;
}
function rowSlot(){
  var v=worfDay(); if(!v) return null;
  if(v.row) return v.row;
  return (v.title && v.kind==='row') ? v : null;
}
function strengthSlot(){
  var v=worfDay(); if(!v) return null;
  if(v.strength) return v.strength;
  return (v.title && v.kind && v.kind!=='row') ? v : null;
}
function rowXp(){ return (state.workout && rowSlot()) ? W.workout : 0; }
function strengthXp(){ return (state.str && strengthSlot()) ? W.strength : 0; }
/* Weekly tiers, RANK ONLY, settled by creditWeeks(). Top tier only, never summed:
   a 7/7 week pays 6, not 2+4+6. Below the bottom tier they pay nothing, same
   reasoning as the routine week's four-day floor — a consolation point for a
   half-kept habit is how a score stops meaning anything. */
function rowWeekBonus(n){ return n>=7?6 : n>=6?4 : n>=5?2 : 0; }
function strengthWeekBonus(n){ return n>=3?3 : n>=2?2 : n>=1?1 : 0; }
/* This ISO week's training read, computed from ledger rows plus today's live
   state, because saveLedger writes today's row on every tick and the sums must
   agree with what the award will eventually settle. One source, three readings. */
function weekTraining(){
  var wkKey=isoKeyOf(DATE), rows=0, st=0, m=0;
  (ledger.days||[]).forEach(function(x){
    if(!x||!x.d||isoKeyOf(x.d)!==wkKey) return;
    if(x.wk===1) rows++;
    if(x.st===1) st++;
    m+=(+x.m||0);
  });
  return {rows:rows, st:st, m:m};
}
/* All-time meters: the bank (which carries the June seed and every trimmed row)
   plus every row still in the window past the watermark. Mirrors xpTotal()'s
   shape exactly, and for the same reason: without the bank this is a 60-day
   rolling window wearing a lifetime total's clothes. */
function lifetimeMeters(){
  var t=METERS_BANKED;
  (ledger.days||[]).forEach(function(x){
    if(!x||!x.d) return;
    if(METERS_BANKED_THROUGH && x.d<=METERS_BANKED_THROUGH) return;
    t+=(+x.m||0);
  });
  return t;
}

/* The control. Built as intake's sibling on the same `.wtr` shell rather than as an
   eighth routine step, because a routine step is inside the all-or-nothing block and
   this deliberately is not. Same shell, different scoring, and the note line says so
   out loud — all-or-nothing scoring was invisible on intake until it did, and the
   inverse is just as invisible here.
   Returns null on a day with nothing scheduled, and the caller appends nothing. */
function workoutRow(){
  var rs=rowSlot(), ss=strengthSlot();
  if(!rs && !ss) return null;
  var box=el('div','wtr wkt');
  var head=el('div','wtr-top');
  head.innerHTML='<span class="wtr-k mono">Training</span><span class="wtr-v"></span>';
  box.appendChild(head);

  var note=el('div','wtr-note');
  var sum=el('div','wk-sum');
  function fmtM(n){ return (+n||0).toLocaleString('en-US'); }
  function refresh(){
    var done=(rs&&state.workout?1:0)+(ss&&state.str?1:0);
    var of=(rs?1:0)+(ss?1:0);
    head.querySelector('.wtr-v').innerHTML=done+'<small>/'+of+' done</small>';
    var earned=rowXp()+strengthXp();
    var left=[];
    if(rs&&!state.workout) left.push('the row');
    if(ss&&!state.str) left.push('strength');
    note.className='wtr-note'+(left.length?'':' done');
    note.innerHTML=left.length
      ? '<span>Still open &middot; '+esc(left.join(' and '))+'</span>'
      : '<span>Logged &middot; +'+earned+'</span>';
    /* The week and the long game, on one quiet line each. weekTraining() reads
       the same rows the Monday award will settle, so this number and the payout
       can never tell two stories about one week. */
    var wt=weekTraining();
    sum.innerHTML='<div>Week: <b>'+wt.rows+'/7</b> rows &middot; <b>'+wt.st+'/3</b> strength &middot; '+
      '<b>'+fmtM(wt.m)+'</b> of '+fmtM(W.metersGoal)+'m</div>'+
      '<div>All-time: <b>'+fmtM(lifetimeMeters())+'m</b> rowed</div>';
  }
  function flush(){
    /* Flush rather than wait on saveState's 600ms debounce, same reason the routine
       block flushes: the strip must not show a total the ledger has not been told
       about yet. No payout modal here on purpose — a tick is a tick, not a jackpot,
       and the board already has three things that interrupt. The weekly bonuses
       land Monday through checkWeekly(), which is where the ceremony belongs. */
    saveLedger(); paintReactor(); checkPromotion();
  }
  /* One line per session. The row line carries the meters entry; strength carries
     only its class title. Both checkboxes are the same .row/.ck idiom as the
     routine steps, scored separately from them and from each other. */
  function sessionLine(slot,key,extra){
    var row=el('div','row');
    var ck=el('input'); ck.type='checkbox'; ck.className='ck';
    ck.checked=!!state[key];
    ck.addEventListener('change',function(){
      state[key]=ck.checked;
      /* flush BEFORE refresh, not after: refresh()'s week line reads ledger rows,
         and saveLedger is what folds this tick into today's row. Painted the other
         way round the line lags one tap behind — caught in the harness before it
         shipped, which is the whole reason the harness exists. */
      saveState(); flush(); refresh();
    });
    row.appendChild(ck);
    row.appendChild(el('span','r-txt',esc(slot.title||'Training')));
    /* A LITERAL '·', not '&middot;' — this string goes through esc(), which turned
       the entity into visible text on the served page. Caught on the live card. */
    var meta=[slot.kind,(slot.mins?slot.mins+' min':'')].filter(Boolean).join(' · ');
    if(meta) row.appendChild(el('div','r-more','<div>'+esc(meta)+'</div>'));
    if(extra) row.appendChild(extra);
    return row;
  }
  if(rs){
    /* The meters entry. type=number invites spinners and lets iOS keep a minus
       key; tel + a digit filter is the plain ten-key. 16px font is load-bearing,
       see the .mtr CSS. Committed on change (blur), not per keystroke, so the
       ledger is not rewritten once per digit. */
    var mline=el('div','mtr-line');
    mline.innerHTML='<span class="lbl mono">METERS</span>';
    var inp=el('input','mtr'); inp.type='tel'; inp.inputMode='numeric';
    inp.setAttribute('aria-label','Meters rowed today');
    inp.placeholder='0';
    if(state.meters>0) inp.value=state.meters;
    inp.addEventListener('input',function(){ inp.value=inp.value.replace(/[^0-9]/g,'').slice(0,6); });
    inp.addEventListener('change',function(){
      state.meters=Math.max(0,parseInt(inp.value,10)||0);
      saveState(); flush(); refresh();   // flush before refresh, same reason as the ticks
    });
    mline.appendChild(inp);
    mline.appendChild(el('span','unit','m today'));
    box.appendChild(sessionLine(rs,'workout',null));
    box.appendChild(mline);
  }
  if(ss) box.appendChild(sessionLine(ss,'str',null));
  box.appendChild(note);
  box.appendChild(sum);
  refresh();
  return box;
}

/* Does the brief say today is a day off? The payload already knows: rest days
   carry it on a chip and in the routine card's caption ("mobility · rest day",
   "OFF DAY"). Read rather than inferred, so the streak can stop treating a
   deliberate rest exactly like a day the Bridge was ignored. */
function isRestDay(){
  if(!DATA) return false;
  var hay=((DATA.chips||[]).map(function(c){return c&&c.label||'';}).join(' ')+' '+
           ((DATA.routine&&DATA.routine.unit)||'')).toLowerCase();
  return /\brest day\b|\boff day\b/.test(hay);
}
/* Called on every successful load AND after every state change. The load call is
   the whole point of `opened`: the streak measures showing up, so a day Sam reads
   the brief and ticks nothing still has to leave a mark. Before this it had one
   call site inside saveState(), which is why 2026-08-01 and 2026-08-03 have no
   row at all despite briefs existing for both. */
function saveLedger(){
  if(!user||!DATE||!DATA) return;          // never write a day we could not read
  var q=questSet();
  var days=(ledger.days||[]).filter(function(d){return d && d.d!==DATE;});
  /* `rt` IS WHAT MAKES THE WEEKLY ROUTINE AWARD COMPUTABLE, and it is on the row for a
     specific reason. The routine tick itself lives on bridge_state/{date}, one document
     per day, so counting a week off the ticks means seven extra reads every morning to
     score something that only changes once a week. The row is already written daily and
     already read in one shot as _streak.days, so the flag rides along for free.
     It records whether the block was COMPLETED, not whether it was offered: a day with
     no routine steps at all reads false, which is right, because there was nothing to
     finish. See routineWeekAward().
     `wk` is the Worf tick and is tri-state on purpose — 1 done, 0 scheduled and missed,
     absent when Worf scheduled nothing. A day with no workout must not read as a missed
     one, which is the same distinction this file draws everywhere else between a thing
     that failed and a thing that was never asked for. Not yet scored weekly; it is here
     so the history exists when it is. */
  /* THE KEY IS OMITTED, NOT SET TO undefined, and that distinction cost a deploy.
     The first cut wrote `wk: _wk ? (state.workout?1:0) : undefined` and reasoned that
     undefined meant "absent". It does not. `{wk: undefined}` is a key that EXISTS
     carrying undefined, which is indistinguishable from an absent key while it stays
     in memory and fatal the moment it crosses into Firestore: `.set()` rejects the
     whole document with `invalid-argument — Unsupported field value: undefined`.
     It throws SYNCHRONOUSLY, so the `.catch()` on the promise never saw it, saveLedger
     died where it stood, and paintReactor / checkPromotion / checkJackpot / checkWeekly
     downstream of it never ran at all. One unserialisable field took out the entire
     post-load chain, and the page reported it as a failed READ because that is the only
     failure surface the loader has.
     A tri-state that relies on undefined works in JS semantics and does not survive a
     serialisation boundary. If a field is genuinely optional here, omit the key. */
  var _row={d:DATE,opened:true,rest:isRestDay(),
            closed:q.closed,offered:q.total,done:q.done,
            water:state.water,cider:!!state.cider,vits:!!state.vits,
            rt:routineXp()>0,
            open:allPunchItems().length,xp:dayXp()};
  /* `wk` is the ROW tick since 2026-08-25 (rows are scheduled daily, so it now
     appears most days), `st` the strength tick with the same tri-state contract:
     1 done, 0 scheduled and missed, absent when nothing was scheduled. Rows
     written before the rework carry `wk` meaning "the day's one session", which
     is fine: the weekly training award only settles weeks from the rework
     forward, so the old meaning is never scored under the new rule.
     `m` is the day's rowed meters and is OMITTED at zero rather than written as
     0 — same key-omission discipline as `wk`, and the same Firestore lesson. */
  if(rowSlot()) _row.wk = state.workout ? 1 : 0;
  if(strengthSlot()) _row.st = state.str ? 1 : 0;
  if((state.meters||0)>0) _row.m = state.meters;
  days.push(_row);
  days.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});
  /* ══ THE 60-DAY CLIFF ══════════════════════════════════════════════════
     This trim used to just throw the oldest row away, and xpTotal() summed exactly
     what survived. The consequence was not a wobble, it was the end of the
     commission being cumulative: past 60 rows you drop as much as you earn, so the
     total FLATTENS PERMANENTLY at roughly sixty times the daily rate. Reproduced
     2026-08-05 against this code at a steady 5/day — day 60 read 307, day 61 read
     300, and day 62 read 300, and it never moves again. That ceiling clears Petty
     Officer and Chief Petty Officer and then never reaches Ensign at 450. Not
     slowly. Never. And because the trim WRITES the shortened array back to
     _streak, the rows were being destroyed in Firestore, not merely hidden.

     Worse, SESSION_XP is not trimmed, so it kept compounding while Sam's own ticks
     asymptoted to a constant. Left alone, the only thing moving his rank in the
     long run would have been work a session did for him, which inverts the design.

     The fix banks what is dropped instead of discarding it. XP_BANKED_THROUGH is a
     watermark, and it is what makes this idempotent: saveLedger runs on every load
     and after every tick, so without it a row could be banked twice and inflate the
     total in the other direction. Only rows strictly newer than the watermark are
     ever added, and the watermark only moves forward.

     Session credit needs no banking. A day that leaves `days` is still in
     SESSION_XP, and xpTotal()'s second loop picks it up there, so it is counted
     exactly once either way. */
  if(days.length>60){
    var drop=days.slice(0, days.length-60);
    days=days.slice(days.length-60);
    drop.forEach(function(x){
      if(!x||!x.d) return;
      if(XP_BANKED_THROUGH && x.d<=XP_BANKED_THROUGH) return;   // already banked
      XP_BANKED += (typeof x.xp==='number') ? x.xp : (x.closed||0);
      if(x.d>XP_BANKED_THROUGH) XP_BANKED_THROUGH=x.d;
    });
    /* Meters bank the same dropped rows, with their own watermark, because the
       two banks were seeded at different moments and must be free to disagree
       about where "already banked" begins. */
    drop.forEach(function(x){
      if(!x||!x.d) return;
      if(METERS_BANKED_THROUGH && x.d<=METERS_BANKED_THROUGH) return;
      METERS_BANKED += (+x.m||0);
      if(x.d>METERS_BANKED_THROUGH) METERS_BANKED_THROUGH=x.d;
    });
  }
  ledger.days=days;
  db.collection('bridge_state').doc('_streak').set({
    days:days,rank_key:rank().key,
    xp_banked:XP_BANKED, xp_banked_through:XP_BANKED_THROUGH,
    m_banked:METERS_BANKED, m_banked_through:METERS_BANKED_THROUGH,
    updated_at:new Date().toISOString(),by:user.email},{merge:true}).catch(function(){});
}
function dayKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function ledgerMap(){
  var m={}; (ledger.days||[]).forEach(function(x){ if(x&&x.d) m[x.d]=x; }); return m;
}
/* Consecutive days ending today, counted backwards, where at least one quest closed.
   Today only counts once something has actually been ticked, so an unopened morning
   does not read as a break at 6:01am. A day with no ledger entry at all IS a break —
   that is the honest reading, because nothing was closed on it. */
/* SHOWING UP, not output. Any recorded day counts: opened, marked as rest, or
   with something closed. Sam's call on 2026-08-04, and the reason is that a
   streak which punishes a rest day is a streak you resent and then abandon.

   The honest limit, worth knowing: a rest day Sam never OPENS leaves no row, and
   a missing row is still a break, because nothing on the device can know a day
   was a rest day if the page was never loaded that day. If that bites, the fix
   is a grace day rather than guessing backwards. */
function streakDays(){
  var m=ledgerMap(), n=0, d=new Date(DATE+'T12:00:00');
  if(!m[DATE]) d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){
    var e=m[dayKey(d)];
    if(e && (e.opened || e.rest || (e.closed||0)>0)){n++;d.setDate(d.getDate()-1);}
    else break;
  }
  return n;
}
/* ══ THE COMMISSION ════════════════════════════════════════════════════════
   Rank was an S-through-E grade computed from the last fourteen days, and it fell
   when the pace fell. The old comment defended that: a level which only ratchets
   up is a participation trophy. That argument is right, and this replaces it
   rather than ignoring it.

   A COMMISSION ratchets. You are not busted down to Ensign for a slow fortnight,
   in Starfleet or here. It is earned against CUMULATIVE xp, so it can only ever
   move forward, and it is a permanent record of what has actually been done.

   The pace question the old grade was answering does not disappear, it moves:
   `standing()` below reads the last fourteen days and is free to fall, which is
   how it works in the fleet too. Rank is permanent, fitness reports are not.

   THE THRESHOLDS ARE SET BEFORE THE WEIGHTS, AND THAT ORDER IS DELIBERATE.
   Because a commission ratchets, a threshold is the one number that cannot be
   revised later without either stranding Sam at a rank he no longer qualifies for
   or demoting him, and both are unacceptable. Weights are the opposite: they can
   be retuned any morning without touching a single earned rank. So the ladder
   fixes the TIME HORIZON now and the weights get fitted to it afterwards.

   Sized against a phase-2 rate of ~8 points a day (water, reading, learning, the
   routine, a derived work win, plus three or four punch closes, allowing for
   missed days). That puts Petty Officer inside a week, Ensign at two months,
   Lieutenant at a year, Captain at five and a half years, and Admiral at
   thirteen. Sam's requirement was that Admiral take years, possibly decades, and
   that it must not be reachable by spamming glasses of water. The gaps grow
   geometrically for exactly that reason: the early rungs are close enough
   together that the first promotion lands while the habit is still forming, and
   the late ones are far enough apart that no volume of trivial ticks shortcuts
   them.

   Until phase 2 lands, only punch closes score, so the real rate is nearer four a
   day and every rung takes roughly twice as long as the figures above. That is
   the correct behaviour, not a miscalibration: the ladder is sized for the
   finished system, and the pace catches up when the tracks come online. */
var RANKS=[
  {k:'crewman', ab:'CRM',  name:'Crewman',              at:0},
  {k:'po',      ab:'PO',   name:'Petty Officer',        at:50},
  {k:'cpo',     ab:'CPO',  name:'Chief Petty Officer',  at:150},
  {k:'ensign',  ab:'ENS',  name:'Ensign',               at:450},
  {k:'ltjg',    ab:'LTJG', name:'Lieutenant JG',        at:1200},
  {k:'lt',      ab:'LT',   name:'Lieutenant',           at:2800},
  {k:'lcdr',    ab:'LCDR', name:'Lieutenant Commander', at:5600},
  {k:'cdr',     ab:'CDR',  name:'Commander',            at:10000},
  {k:'capt',    ab:'CAPT', name:'Captain',              at:16000},
  {k:'como',    ab:'COMO', name:'Commodore',            at:22500},
  {k:'radm',    ab:'RADM', name:'Rear Admiral',         at:29500},
  {k:'adm',     ab:'ADM',  name:'Admiral',              at:38000}
];
/* ── the collar ────────────────────────────────────────────────────────────
   Sam's call, 2026-08-06: rank bars for the three enlisted rungs, Crewman
   through Chief Petty Officer, and pips from Ensign. Bars specifically, not
   chevrons. It is correct to protocol and it makes the commission to Ensign a
   visible change in KIND rather than one more pip, which is the rung on this
   ladder most worth earning.

   Flag rank is the same trick a third time: the pips move onto a filled plate.
   So the twelve rungs read as three registers a glance apart rather than as
   twelve counts of the same dot, which is the entire reason for using an
   insignia instead of printing the number.

   Hollow pips at Lieutenant JG and Lieutenant Commander are TNG protocol, and
   they are also the only thing separating those two rungs from Ensign and
   Lieutenant at a glance.

   Keyed off RANKS[i].k rather than the index, because the index is a position in
   an array that could be inserted into and the key is the rank. Anything not in
   the table falls back to a single bar rather than throwing: this function draws
   an ornament, and an ornament must never be able to take the page down.

   Sam did NOT take empty sockets for unearned pips, so an unearned rung is not
   drawn. The gap to the next one is carried by the XP bar underneath, which is
   the honest instrument for it anyway. */
var COLLAR={
  crewman:{bars:1}, po:{bars:2}, cpo:{bars:3},
  ensign:{pips:'S'},   ltjg:{pips:'SH'},  lt:{pips:'SS'},
  lcdr:{pips:'SSH'},   cdr:{pips:'SSS'},  capt:{pips:'SSSS'},
  como:{pips:'S',flag:true}, radm:{pips:'SS',flag:true}, adm:{pips:'SSS',flag:true}
};
function rankCollar(key){
  var c=COLLAR[key]||{bars:1}, out='';
  if(c.bars){ for(var i=0;i<c.bars;i++) out+='<i class="bar"></i>'; }
  else { for(var j=0;j<c.pips.length;j++)
           out+='<i class="pip'+(c.pips[j]==='H'?' hollow':'')+'"></i>'; }
  return '<span class="rh-col'+(c.flag?' flag':'')+'">'+out+'</span>';
}
/* The most a day can be worth, DERIVED rather than written down. Every term is a
   real scoring path that can actually fire today: the punch cap, the two
   all-or-nothing blocks, the house-list cap, and the session credit ceiling.
   W.study and W.win are deliberately absent, exactly as they are absent from
   dayXp() — a track with no source to read from cannot be earned, so counting it
   in the ceiling would draw a row of marks Sam can never fill.
   Derived because W retunes any morning and a hardcoded 20 starts lying the
   first time it does. */
function dayCeiling(){
  /* W.study joined this on 2026-08-06 when it got a surface, and it belongs here
     for the same reason the others do: it is a path that can actually fire today.
     W.assess does NOT, and that is not an oversight — an assessment is a rank-only
     award and never enters a day's arc, so counting it in the ceiling would draw a
     row of marks Sam cannot fill on six days out of seven. W.course is absent for
     the same reason and more strongly: it fires about once a month. W.win still has
     no surface at all.
     This is the line that keeps the 2026-08-11 reweighting honest. assess went to 8
     and course arrived at 25, and if either had leaked in here the ceiling would
     have jumped from 20 to 53 and every arc on the strip would have collapsed
     against a bar Sam cannot reach on a normal Tuesday. */
  /* The workout joins the ceiling ONLY on a day Worf actually scheduled one, which
     is the same test rowXp() and strengthXp() apply. On a rest day, a farm Sunday, or any
     morning bridge_data/worf could not be read, there is no tick to fill and the
     ceiling must not draw a mark for it. Sam's whole reason for keeping the workout
     out of the all-or-nothing block was that an unscheduled day should cost nothing,
     and a ceiling that counted it anyway would put the cost straight back. */
  return W.punchCap*W.punch + W.routine + W.intake + W.homeCap + W.sessionCap + W.study
       + (rowSlot()?W.workout:0) + (strengthSlot()?W.strength:0);
}

/* `xp` falls back to `closed` so rows written before this shipped still count,
   and so a backfilled row needs only the one field. */
function xpTotal(){
  /* Two sources, one number. Ledger rows carry what Sam ticked; SESSION_XP carries what
     sessions closed for him. They are summed here rather than merged into the rows so a
     day can be credited long after its row was written, and so a row never has to be
     rewritten — rewriting rows is how a ledger starts disagreeing with itself. Days that
     have session credit but no row at all (he never opened the Bridge that day) still
     count: the work happened. */
  /* Starts from XP_BANKED, which is everything the 60-row window has already dropped.
     Without it this sum is a 60-day rolling window wearing a cumulative total's
     clothes, and the ladder becomes unreachable. See the trim in saveLedger().
     Rows at or before the watermark are skipped defensively: they should already be
     out of `days`, but a backfill that reintroduced one would otherwise count twice. */
  var t=XP_BANKED, seen={};
  (ledger.days||[]).forEach(function(x){
    if(!x||!x.d) return;
    seen[x.d]=1;
    if(!(XP_BANKED_THROUGH && x.d<=XP_BANKED_THROUGH))
      t += (typeof x.xp==='number') ? x.xp : (x.closed||0);
    t += sessionXpOn(x.d);
  });
  for(var d in SESSION_XP) if(!seen[d]) t += sessionXpOn(d);
  /* awardXp() SUBSUMES boothbyXp() rather than sitting beside it. If you are here
     because you added a rank-only award and the total did not move, check that it
     went into AWARDS and not into a fourth term added to this line. */
  return t + awardXp();
}

/* Assessment credit, and it is RANK ONLY — added here and never in dayXp(), so a
   Sunday pass moves the commission without spiking that day's arc or its streak.
   First governing decision of the whole system: daily actions move the arc,
   longer awards move rank.

   THE TRANSCRIPT IS THE AUTHORITY, AND THAT IS STRUCTURAL HERE RATHER THAN A NOTE.
   These points are derived from `scorecard.entries`, which push_boothby.py copies
   verbatim out of `records/transcript.md`. The page keeps NO independent count of
   passes anywhere, so there is nothing on this side that CAN disagree with the
   transcript — correcting the file corrects the score on the next push, with no
   reconciliation step and nowhere for a second opinion to live. If a future
   session adds a pass counter, it must read these rows, not count events.

   Boothby is both examiner and scorekeeper, which is exactly the arrangement that
   needs the paper trail to be load-bearing rather than advisory.

   A FAIL PAYS ZERO and is deliberately not negative: the study tick already paid
   for sitting down and taking points back off a day he showed up is the shape
   that makes people stop showing up.

   COURSE COMPLETIONS RIDE THE SAME CHANNEL, added 2026-08-11 with W.course. They
   are deliberately NOT in the AWARDS bank next door, and the difference is the one
   that channel's own comment draws: an award is banked because its evidence AGES
   OUT (the ledger keeps 60 rows, the Revel window 35 nights), so recomputing it
   later would score a week whose proof has gone. The transcript ages out of
   nothing. It is append-only and permanent, so a completion recomputes forever and
   stays correctable by editing the file, which is the whole point of the arrangement.

   `courses_done` comes from push_boothby.py counting `**Completed:** YYYY-MM-DD`
   lines under the transcript's course headers. Same intolerance as the pass match,
   and for the same reason: a course is 25 points and a loose match would award rank
   by accident. A course with no completion line is simply not finished, which is
   the correct reading of a missing marker. */
function boothbyXp(){
  var sc=(BOOTHBY && BOOTHBY.scorecard) || {};
  var rows=sc.entries || [];
  var n=0;
  rows.forEach(function(e){ if(e && e.result==='pass') n++; });
  /* Defensive `||0`: a payload pushed by a build of the script that predates
     courses_done leaves the key absent, and absent must read as none finished
     rather than as NaN poisoning xpTotal() and therefore the rank comparison. */
  return n*W.assess + (+sc.courses_done||0)*W.course;
}

/* ══ THE AWARD CHANNEL ═══════════════════════════════════════════════════════
   Added 2026-08-10. Everything that is RANK ONLY and PERIODIC lands here: the
   weekly routine award, the weekly work wins, the perfect month.

   WHY IT IS ONE CHANNEL AND NOT THREE. The routine week and the work-win week
   were specified in the same conversation and were about to be built by two
   different sessions. Two independently invented "rank only" paths would each
   have needed their own bank, their own idempotence guard and their own hook into
   xpTotal(), and the first time one of them was refactored they would have started
   disagreeing about what a week is. There is one bank, one guard, one sum.

   AN AWARD IS BANKED, NOT RECOMPUTED. This is the difference between it and
   boothbyXp(), and the difference is deliberate in both directions. A pass is
   recomputed from the transcript on every load because the transcript is the
   authority and must be able to correct the score by being edited. An award is
   computed once from data that AGES OUT — the ledger keeps 60 rows, the Revel
   window is 35 nights — so recomputing it later would silently re-score a week
   whose evidence has gone and quietly pay zero for a week that was won.

   AWARDS_THROUGH is the watermark, and it is what makes crediting idempotent
   across the reloads this page does constantly. Same shape as XP_BANKED_THROUGH
   and for the same reason: creditWeeks() runs on every load, so without a
   monotonic floor a week could be paid twice as easily as never.

   NOTHING HERE TOUCHES dayXp(). First governing decision of the whole system, and
   Sam restated it on 2026-08-10 in his own terms: "The weekly scores should also
   be tallied seperately from daily so that our understanding of daily averages is
   not effected." standing() reads ledger rows, which are dayXp-derived, so routing
   an award through here keeps it out of the pace reading automatically. That
   matters more than it looks: standing() IS the instrument for the weights
   calibration due around 2026-08-18, and a weekly lump landing in it would read as
   a hot economy on the one morning the number is being trusted. */
var AWARDS={}, AWARDS_THROUGH='';

function awardXp(){
  var t=boothbyXp();
  for(var k in AWARDS) t += (+((AWARDS[k]||{}).pts)||0);
  return t;
}

/* '2026-W32'. Zero-padded so the keys sort lexically, which is the whole reason
   AWARDS_THROUGH can be a simple string compare. */
function isoKeyOf(k){
  var w=isoWeekOf(k);
  return w.year+'-W'+(w.week<10?'0':'')+w.week;
}

/* CONVEX, AND THAT IS THE POINT. Sam's ask: "7 days gets me the high score, and it
   scales down from there." A linear scale pays 6 for six days, which makes the
   seventh day worth one point like every other, and the seventh day is the whole
   achievement. Cubed, the run pays 8 / 5 / 2 / 1 / 0 / 0 / 0, so the last day is
   worth three and the difference between a good week and a perfect one is visible.
   Below four days it pays nothing rather than a consolation point, because a
   consolation point for a half-kept habit is how a score stops meaning anything. */
function routineWeekAward(n){
  if(n<4) return 0;
  return Math.floor(W.routineWeek*Math.pow(n/7,3));
}
/* Consecutive PERFECT weeks compound. Only 7/7 extends a run; a 6/7 week pays its
   5 and resets the multiplier, because "multiple perfect weeks" was the ask and a
   near-miss is not one. Capped at 2x so a long run cannot outrun the ladder. */
function perfectMult(run){
  return run>=8?2 : run>=4?1.5 : run>=2?1.25 : 1;
}

/* Every complete week the ledger can still see, credited once.
   A week is COMPLETE when its Sunday is strictly before today, so the week in
   progress is never scored and Monday morning always finds Sunday's week waiting.
   That is the fix for the thing Sam noticed on 2026-08-10: the week rolled over at
   midnight and there was no moment anywhere that said it had been won. */
function creditWeeks(){
  var rows=(ledger.days||[]).filter(function(x){ return x&&x.d; });
  if(!rows.length) return {award:0, weeks:[], worf:[]};

  var byWeek={};
  rows.forEach(function(x){
    var wk=isoKeyOf(x.d);
    (byWeek[wk]=byWeek[wk]||[]).push(x);
  });

  var thisWeek=isoKeyOf(DATE), out=[], outWf=[], award=0, dirty=false;
  Object.keys(byWeek).sort().forEach(function(wk){
    if(wk>=thisWeek) return;                       // in progress, not yet scorable
    if(AWARDS_THROUGH && wk<=AWARDS_THROUGH) return;   // already settled

    if(!AWARDS['rt:'+wk]){
      var n=byWeek[wk].filter(function(x){ return !!x.rt; }).length;
      /* The run is counted backwards from the week BEFORE this one, over weeks that
         have already been settled, so it survives the ledger trim: a dropped row
         cannot retroactively break a streak that was already paid. */
      var run=0;
      if(n===7){
        run=1;
        var probe=wk;
        while(true){
          probe=prevIsoKey(probe);
          var prior=AWARDS['rt:'+probe];
          if(prior && prior.n===7){ run++; } else break;
        }
      }
      var pts=Math.floor(routineWeekAward(n)*perfectMult(run));
      AWARDS['rt:'+wk]={pts:pts, n:n, run:run, at:DATE};
      award+=pts; dirty=true;
      out.push({week:wk, n:n, run:run, pts:pts});
    }

    /* THE TRAINING WEEK, added 2026-08-25 with the rowing rework. One award, four
       parts: the row-days tier, the strength tier, a point per full W.metersPer
       rowed, and the goal bonus at W.metersGoal — daily or lumped alike, which is
       Sam's rule verbatim. Settled from the same rows at the same moment as the
       routine week, under the same watermark, because a second independently
       invented weekly path is exactly what the award channel exists to refuse.
       No multiplier here: the convex-run machinery is the routine's, and stacking
       a second compounding curve on the same Monday would let two streaks outrun
       the ladder together. Revisit only with the whole board in view. */
    if(!AWARDS['wf:'+wk]){
      var wr=byWeek[wk].filter(function(x){ return x.wk===1; }).length;
      var ws=byWeek[wk].filter(function(x){ return x.st===1; }).length;
      var wm=byWeek[wk].reduce(function(s,x){ return s+(+x.m||0); },0);
      var wpts=rowWeekBonus(wr)+strengthWeekBonus(ws)
             +Math.floor(wm/W.metersPer)
             +(wm>=W.metersGoal?W.metersGoalBonus:0);
      AWARDS['wf:'+wk]={pts:wpts, rows:wr, st:ws, m:wm, at:DATE};
      award+=wpts; dirty=true;
      /* Weeks with nothing trained settle silently at zero — the entry still
         lands in AWARDS so the week can never be re-scored, but the modal is not
         told about a week of nothing. Same shape as the sub-floor routine week. */
      if(wr>0||ws>0||wm>0) outWf.push({week:wk, rows:wr, st:ws, m:wm, pts:wpts});
    }

    if(wk>AWARDS_THROUGH) AWARDS_THROUGH=wk;
  });

  if(dirty) saveAwards();
  return {award:award, weeks:out, worf:outWf};
}

/* Walk one ISO week back. Done by date arithmetic rather than by decrementing the
   number, because week 1 of a year does not follow week 52 of the previous one
   reliably — some years have 53. Seven days back and re-derive. */
function prevIsoKey(wk){
  var d=mondayOfIsoKey(wk);
  d.setDate(d.getDate()-7);
  return isoKeyOf(dayKey(d));
}
/* Monday of an ISO week key, as a Date. Derived from 4 January, which is in week 1
   by definition in every year, rather than from 1 January, which is in week 52 or 53
   of the previous year about three years in seven. */
function mondayOfIsoKey(wk){
  var y=+wk.slice(0,4), n=+wk.slice(6);
  var d=new Date(y,0,4);
  d.setDate(d.getDate()-((d.getDay()+6)%7)+(n-1)*7);
  return d;
}
function isoKeyRange(wk){
  var a=mondayOfIsoKey(wk), b=new Date(a); b.setDate(b.getDate()+6);
  return {start:dayKey(a), end:dayKey(b)};
}

function saveAwards(){
  if(!user) return;
  db.collection('bridge_state').doc('_streak')
    .set({awards:AWARDS, awards_through:AWARDS_THROUGH, week_tgt:WEEK_TGT},{merge:true})
    .catch(function(){});
}

/* Points earned ON a given date by an award that carries one. Used by standing() so a
   daily-flavoured award moves the pace reading, and by nothing else.
   THE `d` FIELD IS THE WHOLE MECHANISM. An award with no `d` is rank-only and invisible
   to the daily average, which is what Sam asked for on the weekly rows: "The weekly
   scores should also be tallied seperately from daily so that our understanding of daily
   averages is not effected." An award WITH a `d` lands on that date and spikes it, which
   is what he asked for on the covers record. One bank, one sum for rank, and this one
   field decides which of the two behaviours an award has. */
function winXpOn(d){
  var t=0;
  for(var k in AWARDS){ var a=AWARDS[k]; if(a && a.d===d) t+=(+a.pts||0); }
  return t;
}

/* ══ WORK WINS ═══════════════════════════════════════════════════════════════
   Wired 2026-08-10. Until this landed, `W.win` had been a number in the weights
   table with no code path behind it since the scorecard was rewritten on 08-06:
   the card printed what a covers record or a held labor band was WORTH while
   nothing anywhere could pay it. Sam closed the week of 3–9 August having taken
   all three and was paid zero.

   POINT VALUES COME FROM `bridge_data/targets.points`, NOT FROM W. The card has
   been printing those same fields all along, and scoring from anywhere else is how
   a row that says "3 pts" ends up paying 1. If targets cannot be read, nothing
   pays, and that is correct rather than unfortunate: there is no benchmark to have
   beaten. The card already says so out loud instead of drawing zeros. */
var WEEK_TGT={};

/* ONE-TIME BACKFILL, and it is here rather than in a script because the snapshot it
   repairs lives on the device and nothing else can write it.

   The week of 3–9 August 2026 was scored against $71,570.07, and Sam beat it with
   $80,287.60 while holding labor at 30.005%. He was paid nothing, which is the whole
   reason this feature exists. But snapWeekTarget() only started banking targets the day
   it shipped, which is AFTER that week closed, and by then push_targets.py had already
   overwritten the doc with week 33's $67,996.02. Without this line the one week that
   prompted the build is the one week that cannot be scored.

   The figure is not typed from memory. It is what `week_target()` in push_targets.py
   returns for any date in ISO week 32, re-derived from `weekly-series.json` on
   2026-08-10 against the same 2025-08-04 comparison week the live doc used.

   SELF-LIMITING, so it needs no cleanup. It only fills a key that is absent, and once
   the week is settled `AWARDS['wk:2026-W32']` exists and this can never fire again.
   Leaving it in place costs nothing and deleting it later risks nothing. Do not add a
   second entry here for a week that ships normally; if a future week is missing its
   bar, the snapshot broke and the fix is there, not another hardcoded number. */
var WEEK_TGT_SEED={
  '2026-W32':{product_sales:71570.07, basis:'same ISO week, previous year', covers:1198}
};
function seedWeekTargets(){
  for(var k in WEEK_TGT_SEED){
    if(!WEEK_TGT[k] && !AWARDS['wk:'+k]) WEEK_TGT[k]=WEEK_TGT_SEED[k];
  }
}

/* THE WEEK'S TARGET HAS TO BE REMEMBERED, because it does not survive the week.
   push_targets.py republishes `targets.week` for the CURRENT ISO week every 4am, so
   by the time Sam opens the Bridge on Monday at 6am the yardstick the finished week
   was measured against has already been overwritten with next week's. Verified
   2026-08-10: week 32 ran against $71,570 and week 33 against $67,996, and the swap
   happens two hours before he looks.
   So each load banks the live target under its own week key. By the time the week
   closes, its bar is already saved and the score is computed against the number that
   was actually in force, not against whatever replaced it. Eight weeks kept, because
   this rides in a doc that is read on every single load. */
function snapWeekTarget(){
  var t=(TARGETS&&TARGETS.week)||null;
  if(!t || !isFinite(+t.product_sales)) return;
  /* A target published for a DIFFERENT week is not this week's bar. The card already
     draws that case as stale rather than believing it, and banking it would freeze the
     wrong number into the ledger permanently, where nothing downstream could tell. */
  if(t.iso_week!=null && +t.iso_week!==isoWeekOf(DATE).week) return;
  var wk=isoKeyOf(DATE);
  if(WEEK_TGT[wk] && WEEK_TGT[wk].product_sales===+t.product_sales) return;   // unchanged
  WEEK_TGT[wk]={product_sales:+t.product_sales, basis:t.basis||'', covers:t.covers||null};
  var keys=Object.keys(WEEK_TGT).sort();
  while(keys.length>8) delete WEEK_TGT[keys.shift()];
  saveAwards();
}

/* THE COVERS RECORD, and it is scored off `record_date` rather than by comparing last
   night against the bar. That comparison cannot work: push_targets.py moves the record
   TO the record-setting night, so by the time the page reads it the night that broke it
   merely equals it, and a ">" test pays nothing while a ">=" test pays every night that
   ties. Awarding once per record-holding DATE is exact, self-limiting and needs no
   memory of what the record used to be.
   It carries `d`, so it lands on the night the room was actually full. Sam's call:
   "a record night earning a visibly big day is the point."
   Bounded to 60 days so shipping this cannot pay out for a record set last winter. */
function creditCoversRecord(){
  var T=TARGETS||{}, cv=T.covers||{}, pts=(T.points||{});
  var d=cv.record_date, n=+cv.record_year;
  if(!d || !isFinite(n)) return null;
  if(!isFinite(+pts.covers_record) || +pts.covers_record<=0) return null;
  /* MANAGER LOG ONLY. Sam's standing rule, restated 2026-08-10: "Revel includes in
     house to go orders and other things in the cover count and can be inaccurate in
     either direction." push_targets.py now refuses to set the record from Revel at all
     and names the manager in record_source, so a source that still smells of Revel
     means the upstream pipeline regressed and this must not quietly pay against it. */
  if(!cv.record_source || /revel|baseline/i.test(cv.record_source)) return null;
  var cut=new Date(DATE+'T12:00:00'); cut.setDate(cut.getDate()-60);
  if(d < dayKey(cut)) return null;
  var key='rec:'+d;
  if(AWARDS[key]) return null;
  AWARDS[key]={pts:+pts.covers_record, d:d, n:n, src:cv.record_source};
  saveAwards();
  return {date:d, n:n, pts:+pts.covers_record, src:cv.record_source};
}

/* THE COMPLETED WEEK: sales against the bar, labor inside the band. RANK ONLY, no `d`.
   Asynchronous because it is the one award that needs Revel, and it only reaches for
   Revel on a load where a week is actually owed — once a week, not every morning.

   BOTH ROWS ARE SCORED OFF THE SNAPSHOT, never off the live targets doc, for the
   reason snapWeekTarget() exists.

   BELOW the band pays, and that is not a bug. `excellent_below` is a second and larger
   award stacked on top, so beating the target hard pays 2 where holding it pays 1.
   Awarding nothing for coming in under the band would mean the best labor week of the
   year scored less than an average one, which is not what the points table means and is
   the reading the card already rejects in its own comment. */
function creditWeekWins(){
  if(!TARGETS) return Promise.resolve(null);
  var thisWeek=isoKeyOf(DATE);
  var owed=Object.keys(WEEK_TGT).filter(function(wk){
    return wk<thisWeek && !AWARDS['wk:'+wk];
  }).sort();
  if(!owed.length) return Promise.resolve(null);

  return loadRevel().then(function(){
    var pts=(TARGETS.points)||{}, labT=(TARGETS.labor)||{}, out=[], dirty=false;
    owed.forEach(function(wk){
      var rg=isoKeyRange(wk);
      var days=(REVEL.days||[]).filter(function(x){
        return x && x._date>=rg.start && x._date<=rg.end;
      });
      /* A PARTIAL WEEK IS NOT A LOST WEEK. Scoring six nights against a seven-night bar
         understates the total and would report a week he won as a week he missed, which
         is the same lie as an empty day that looks like a failed read. So an incomplete
         week is left UNCREDITED and retried on the next load, and only gives up once it
         has aged past the Revel window, where waiting can no longer help. */
      if(days.length<7 || REVEL.err){
        var age=(new Date(DATE+'T12:00:00')-new Date(rg.end+'T12:00:00'))/86400000;
        if(age<=REVEL_WINDOW-7) return;                 // still reachable, try again later
        AWARDS['wk:'+wk]={pts:0, week:wk, nodata:true, nights:days.length, at:DATE};
        dirty=true;
        out.push({week:wk, nodata:true, nights:days.length, pts:0});
        return;
      }
      var prod=sum(days,function(d){return d.product;});
      var wage=sum(days,function(d){return (d.labor||{}).clocked_wages;});
      var tgt=+(WEEK_TGT[wk]||{}).product_sales;
      var labPct=prod?(wage/prod*100):null;
      var hi=isFinite(+labT.band_high)?+labT.band_high:null;
      var exc=isFinite(+labT.excellent_below)?+labT.excellent_below:null;

      var salesMet=!!(isFinite(tgt) && tgt>0 && prod>=tgt);
      var labExc = labPct!=null && exc!=null && labPct<exc;
      var labMet = labPct!=null && hi!=null && labPct<=hi;

      var p=0;
      if(salesMet) p += (+pts.week_sales||0);
      if(labExc)   p += (+pts.week_labor_excellent||0);
      else if(labMet) p += (+pts.week_labor_band||0);

      AWARDS['wk:'+wk]={pts:p, week:wk, prod:prod, tgt:tgt, lab:labPct,
                        sales:salesMet, band:labMet, exc:labExc, at:DATE};
      dirty=true;
      out.push({week:wk, pts:p, prod:prod, tgt:tgt, lab:labPct,
                sales:salesMet, band:labMet, exc:labExc});
    });
    if(dirty) saveAwards();
    if(!out.length) return null;
    return {weeks:out, award:out.reduce(function(a,b){return a+b.pts;},0)};
  }).catch(function(){ return null; });   // a failed Revel read leaves the week owed
}

function rank(){
  var xp=xpTotal(), i=0;
  for(var j=0;j<RANKS.length;j++) if(xp>=RANKS[j].at) i=j;
  var cur=RANKS[i], next=RANKS[i+1]||null;
  return {i:i,key:cur.k,ab:cur.ab,name:cur.name,xp:xp,next:next,
          toNext: next ? next.at-xp : 0,
          span: next ? (xp-cur.at)/(next.at-cur.at) : 1};
}
/* The pace reading the old grade used to carry, kept separate so it can fall
