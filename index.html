          state.water=Math.max(0,Math.min(WATER_TARGET,(state.water||0)+d));
        }
        /* Transition into complete, guarded by the persisted flag, exactly as before. */
        var fire = !was && intakeXp() && !state.intakeJp;
        if(fire) state.intakeJp=true;
        paint(); saveState();
        if(fire){
          // saveLedger first or the modal prints the pre-intake total (2026-08-04).
          saveLedger(); paintReactor(); checkPromotion();
          showIntakeJackpot();
        }
      });
    });
  }
  paint();
  return wrap;
}

BUILD.routine=function(b,sec){
  /* Intake moved to the landing 2026-09-03; this sheet is Training. */
  /* Worf's session, on the days Worf scheduled one. Null on every other day, and the
     card looks exactly as it did before — no empty shell, no greyed row, nothing to
     read as a thing he failed to do. */
  var _wk=workoutRow();
  if(_wk) b.appendChild(_wk);
  /* The stat blocks ("Day: off", "Walk: 30 min", "Mobility: 5 min") were removed
     2026-09-03 at Sam's request. The payload may still carry `stats`; nothing reads it. */
  if((sec.steps||[]).length){
    /* ONE SECTION, every item its own checkbox, scored as a block. Sam's call
       2026-08-05, and it replaced a collapsible <details> group titled "Mobility,
       5 min" — a title the page was inventing, which was wrong the moment the
       payload carried anything that was not mobility.
       Built to read as intake's sibling: same .wtr shell, same header shape, same
       .wtr-note carrying what is still outstanding. All-or-nothing scoring is
       invisible without that line, exactly as it was for intake. */
    var det=el('div','wtr rtn');
    var head=el('div','wtr-top');
    head.innerHTML='<span class="wtr-k mono">Routine</span><span class="wtr-v">'+
      routineDone()+'<small>/'+sec.steps.length+' done</small></span>';
    det.appendChild(head);
    var note=el('div','wtr-note');
    /* Repaints in place rather than rebuilding the block. A rebuild would collapse
       any expander the reader had open, and on a five-step routine that is most of
       what is on screen. */
    function refresh(){
      var n=routineDone(), total=sec.steps.length, left=total-n;
      head.querySelector('.wtr-v').innerHTML=n+'<small>/'+total+' done</small>';
      note.className='wtr-note'+(left?'':' done');
      note.innerHTML=left
        ? '<span>Needs all '+total+' · '+left+' to go</span>'
        : '<span>Complete · +'+W.routine+'</span>';
    }
    var gb=el('div','g-body');
    sec.steps.forEach(function(raw,i){
      var st=stepShape(raw);
      var id=routineId(i);
      var row=el('label','row');
      var ck=el('input');ck.type='checkbox';ck.className='ck';ck.setAttribute('data-id',id);
      if(state.done.indexOf(id)>=0)ck.checked=true;
      ck.addEventListener('change',function(){
        var was=routineXp();
        if(ck.checked){if(state.done.indexOf(id)<0)state.done.push(id);hit(row);}
        else state.done=state.done.filter(function(x){return x!==id;});
        /* Transition into complete, not the state of being complete — the same
           contract as intake, so re-ticking the last box cannot replay the payout,
           and the persisted flag stops a reload replaying it either. */
        var fire = !was && routineXp() && !state.routineJp;
        if(fire) state.routineJp=true;   // set BEFORE saveState so it persists
        refresh(); saveState();
        if(fire){
          /* saveLedger first: the modal prints rank(), which reads xpTotal(), which
             sums the rows saveLedger writes — and saveState only calls it behind a
             600ms debounce. Without the flush the payout announces the old total. */
          saveLedger(); paintReactor(); checkPromotion();
          showRoutineJackpot();
        }
      });
      row.appendChild(ck);
      row.appendChild(el('span','r-txt',esc(st.label)));
      if(st.detail.length){
        /* Same expander contract as the punch list, and the same two guards: .row is
           a <label>, so without preventDefault AND stopPropagation, opening the
           movements would tick the habit off. */
        var more=el('div','r-more');
        more.innerHTML=st.detail.map(function(d){return '<div>'+esc(d)+'</div>';}).join('');
        more.style.display='none';
        var acts=el('div','acts');
        var mb=el('button','mini more','⋯');
        mb.setAttribute('aria-expanded','false');
        mb.setAttribute('aria-label','Show the movements');
        mb.addEventListener('click',function(e){
          e.preventDefault();e.stopPropagation();
          var open=more.style.display!=='none';
          more.style.display=open?'none':'block';
          mb.classList.toggle('on',!open);
          mb.setAttribute('aria-expanded',String(!open));
        });
        acts.appendChild(mb); row.appendChild(acts); row.appendChild(more);
      }
      gb.appendChild(row);
    });
    det.appendChild(gb);
    refresh();
    det.appendChild(note);
    b.appendChild(det);
  }
  if(sec.note)b.appendChild(el('p','note',esc(sec.note)));
};

/* ── the service record ─────────────────────────────────────────────────────
   Everything the ledger knows, which until now was only three numbers on a strip.
   Synthetic like QCARD: it is not in CARDS, draws from bridge_state rather than
   the daily payload, and therefore can never read as a "missing" card. */
var RCARD={k:'_rank',label:'Service record',glyph:'▲',ac:'var(--amber)'};
BUILD._rank=function(b){
  var r=rank(), sd=streakDays(), st=standing(), m=ledgerMap();

  var head=el('div');
  head.innerHTML='<div class="rk-hero"><span class="rk-name">'+esc(r.name)+'</span>'+
    '<span class="rk-ab mono">'+esc(r.ab)+'</span></div>'+
    '<div class="rk-sub">'+r.xp+' point'+(r.xp===1?'':'s')+' logged'+
      (sd?' · '+sd+' day streak':' · no streak')+
      (st.word?' · '+esc(st.word)+' pace':' · '+esc(st.note))+'</div>';
  b.appendChild(head);

  var prog=el('div');
  prog.innerHTML = r.next
    ? '<div class="rk-bar"><i style="width:'+Math.max(2,Math.min(100,Math.round(r.span*100)))+'%"></i></div>'+
      '<div class="rk-sub"><b style="color:var(--ink)">'+r.toNext+'</b> to '+esc(r.next.name)+
      ', at '+r.next.at+' points</div>'
    : '<div class="rk-bar"><i style="width:100%"></i></div>'+
      '<div class="rk-sub">Top of the ladder.</div>';
  b.appendChild(prog);

  // ── the week ──────────────────────────────────────────────────────────
  var wk=[], peak=1;
  for(var i=6;i>=0;i--){
    var dd=new Date(DATE+'T12:00:00'); dd.setDate(dd.getDate()-i);
    var e=m[dayKey(dd)];
    var _k=dayKey(dd), _sx=sessionXpOn(_k);
    // A day with session credit but no row is still a day that scored. Without the
    // second clause it renders as "never opened" while its points sit in the total.
    var xp=e?((typeof e.xp==='number'?e.xp:(e.closed||0))+_sx):(_sx||null);
    if(xp!=null && xp>peak) peak=xp;
    wk.push({dd:dd,xp:xp,rest:!!(e&&e.rest)});
  }
  var wkTotal=wk.reduce(function(n,x){return n+(x.xp||0);},0);
  var wkSec=el('details','grp'); wkSec.open=true;
  wkSec.innerHTML='<summary><span class="g-name"><span class="g-dot"></span>Last 7 days</span>'+
    '<span class="g-meta"><span class="g-count mono">'+wkTotal+' pts</span>'+
    '<span class="g-car">▸</span></span></summary>';
  var wkBody=el('div','g-body');
  var bars='<div class="rk-week">';
  wk.forEach(function(x){
    var h=x.xp==null?6:Math.max(6,Math.round((x.xp/peak)*100));
    var cls=x.xp==null?'none':(x.rest?'rest':'');
    bars+='<div><b>'+(x.xp==null?'·':x.xp)+'</b>'+
          '<i class="'+cls+'" style="height:'+h+'%"></i>'+
          '<span>'+x.dd.toLocaleDateString('en-US',{weekday:'narrow'})+'</span></div>';
  });
  bars+='</div><div class="rk-sub">Cyan is a rest day. A faint stub is a day the '+
        'Bridge was never opened.</div>';
  wkBody.innerHTML=bars;
  wkSec.appendChild(wkBody); b.appendChild(wkSec);

  // ── the month ─────────────────────────────────────────────────────────
  var mk=DATE.slice(0,7);
  var md=(ledger.days||[]).filter(function(x){return x&&String(x.d).indexOf(mk)===0;});
  function _rowXp(x){ return (typeof x.xp==='number'?x.xp:(x.closed||0))+sessionXpOn(x.d); }
  var mxp=md.reduce(function(n,x){return n+_rowXp(x);},0);
  var mbest=md.reduce(function(n,x){var v=_rowXp(x);return v>n?v:n;},0);
  var mSec=el('details','grp'); mSec.open=true;
  mSec.innerHTML='<summary><span class="g-name"><span class="g-dot"></span>'+
    esc(new Date(DATE+'T12:00:00').toLocaleDateString('en-US',{month:'long'}))+
    '</span><span class="g-meta"><span class="g-count mono">'+mxp+' pts</span>'+
    '<span class="g-car">▸</span></span></summary>';
  var mBody=el('div','g-body');
  mBody.innerHTML='<div class="stats"><div class="stat"><div class="k">Points</div>'+
    '<div class="v">'+mxp+'</div></div>'+
    '<div class="stat"><div class="k">Days logged</div><div class="v">'+md.length+'</div></div>'+
    '<div class="stat"><div class="k">Best day</div><div class="v">'+mbest+'</div></div></div>';
  mSec.appendChild(mBody); b.appendChild(mSec);

  // ── what sessions closed ──────────────────────────────────────────────
  /* Deliberately HERE and not on the punch card. The punch card's entire job is what
     is still open; a list of finished items inside it is the card contradicting itself,
     which is exactly what made 2026-08-04 confusing — sixteen done things sitting in a
     list of things to do. Finished work belongs in the record, next to the points it
     earned. Read-only on purpose: session credit is automatic, so a checkbox here would
     be a second scoring path for one piece of work, and two paths drift. */
  var ckeys=Object.keys(CLOSED).sort().reverse().filter(function(k){
    return (CLOSED[k].items||[]).length; });
  if(ckeys.length){
    var cTotal=0;
    ckeys.forEach(function(k){ cTotal+=(CLOSED[k].items||[]).length; });
    var cSec=el('details','grp'); cSec.open=false;
    cSec.innerHTML='<summary><span class="g-name"><span class="g-dot"></span>Closed for you</span>'+
      '<span class="g-meta"><span class="g-count mono">'+cTotal+'</span>'+
      '<span class="g-car">▸</span></span></summary>';
    var cb2=el('div','g-body'), crows='';
    ckeys.forEach(function(k){
      var doc=CLOSED[k], net=(typeof doc.net==='number')?doc.net:
        ((doc.open_before||0)-(doc.open_after||0));
      crows+='<div class="rk-sub" style="margin:9px 0 4px;color:var(--ink)"><b>'+esc(k)+'</b> · '+
        (doc.items||[]).length+' closed · backlog '+(net>0?'down '+net:net===0?'flat':'up '+(-net))+
        ' · '+sessionXpOn(k)+' pt'+(sessionXpOn(k)===1?'':'s')+'</div>';
      (doc.items||[]).forEach(function(it){
        crows+='<div class="row" style="padding-left:2px"><span class="r-txt">'+
          '<span class="pill done">done</span>'+esc(it.text)+'</span></div>';
      });
    });
    cb2.innerHTML=crows; cSec.appendChild(cb2); b.appendChild(cSec);
  }

  // ── the whole ladder ──────────────────────────────────────────────────
  var lad=el('details','grp'); lad.open=false;
  lad.innerHTML='<summary><span class="g-name"><span class="g-dot"></span>The ladder</span>'+
    '<span class="g-meta"><span class="g-count mono">'+(r.i+1)+' of '+RANKS.length+'</span>'+
    '<span class="g-car">▸</span></span></summary>';
  var lb=el('div','g-body'), rows='';
  RANKS.forEach(function(x,i){
    var cls=i<r.i?'done':i===r.i?'now':'';
    rows+='<div class="rk-rung '+cls+'"><span class="pip"></span>'+
      '<span class="n">'+esc(x.name)+'</span>'+
      '<span class="x mono">'+(x.at===0?'start':x.at)+'</span></div>';
  });
  lb.innerHTML=rows; lad.appendChild(lb); b.appendChild(lad);
};

/* ── the work queue, reviewable ─────────────────────────────────────────────
   The queue was write-only from the phone: Sam could put things into it and see
   a count, but had no way to see WHAT was in it, which makes "3 queued" a number
   he has to trust rather than read. */
/* ══ THE HOUSE LIST ════════════════════════════════════════════════════════
   Amy's to-dos for Sam, and the first thing on the Bridge that another person writes.

   ONE doc, home_list/items, holding an array. Not a doc per item: this is a short list
   edited by two people who live together, so the read is one round trip and the whole
   list renders instantly. The trade-off is real and worth naming — two simultaneous
   edits are last-write-wins — but items carry stable ids, so the losing edit is
   recoverable by eye rather than silently merged wrong.

   It is NOT in bridge/, which the 4am feeder rewrites wholesale every morning and would
   erase her list daily. It is NOT in bridge_state/, which is Sam-only in both directions
   by design and is the one collection no other writer may touch.

   The seen-markers live on Sam's side in bridge_state, not here. Whether he has read an
   item is his business, it should not be in a document she can see, and keeping it out
   means her doc stays a clean shared list rather than a read-receipt log. */
var HOME={items:[]}, HOME_ERR=null;
/* The bank of item ids already paid for, and it lives in _streak rather than in
   bridge_state/{date} on purpose. Per-date it would reset at 4am, and the next morning
   a list that was already cleared and already paid would look like a fresh unpaid batch
   and pay again. Same reason PAID_IDS sits there for session credit. */
var HOME_PAID=[];

function homeDoc(){ return db.collection('home_list').doc('items'); }
function homeId(){
  // Date.now is fine here: this is an id, not a scheduling decision, and a collision
  // needs two items created in the same millisecond by the same person.
  return 'h'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
}
function saveHome(){
  return homeDoc().set({items:HOME.items,
    updated_at:new Date().toISOString(),
    updated_by:(user&&user.email)||''},{merge:true});
}
function homeAdd(text){
  text=String(text||'').trim();
  if(!text) return Promise.resolve();
  HOME.items.push({id:homeId(),text:text,by:(user&&user.email)||'',
                   added_at:new Date().toISOString(),done:false});
  return saveHome();
}
function homeOpen(){ return (HOME.items||[]).filter(function(i){return i&&!i.done;}); }
/* Items that would pay if the list were cleared right now: Amy's, not already banked.
   Sam's own items are excluded from the COUNT, not from the clearing — he still has to
   finish them to empty the list, they just do not pay. Both of them can write to
   home_list, so without that rule he could add "put socks on", tick it and mint a point.
   Scoring only what someone else asked for closes it at the root, and it means the track
   measures the thing it exists for. */
function homePayable(){
  return (HOME.items||[]).filter(function(i){
    return i && HOME_PAID.indexOf(i.id)<0 &&
           window.BRIDGE_ALLOWED.indexOf(String(i.by||'').toLowerCase())<0;
  });
}
function homeXp(){ return Math.min(state.homeXp||0, W.homeCap); }

/* ══ CLEARING THE LIST ═════════════════════════════════════════════════════
   Sam's design, 2026-08-05, and it is better than the per-item scoring I proposed.

   Emptying the list pays min(items in this batch, 3). A one-item list pays 1, a two-item
   list pays 2, anything from three up pays 3. Then the batch is banked, so when Amy adds
   something new the count starts again and clearing THAT pays too, the same day.

   The reset is the whole point and it is a behavioural fix, not a generosity one. With a
   flat daily cap, a list arriving at 4pm that he had already earned from would be worth
   nothing until tomorrow — so the rational move would be to leave his wife's new request
   sitting overnight. A scoring rule that makes the right thing feel like a waste is a
   broken scoring rule.

   TRANSITION, not state, exactly like intake and the routine: this only runs from a tick.
   Loading a page whose list is already empty pays nothing, which is what stops a reload
   from manufacturing a payout. HOME_PAID then stops an untick-retick doing it.

   homeCap is a backstop, not a lever. Six is two full lists in one day and it should
   never bind; it exists so the one track whose supply another person controls cannot
   have an unbounded tail. */
function checkHomeCleared(){
  var items=HOME.items||[];
  if(!items.length) return 0;
  if(items.some(function(i){ return i && !i.done; })) return 0;   // not cleared
  var batch=homePayable();
  // Bank every id in the cleared list, including Sam's own, so nothing lingers unpaid
  // and reappears as a batch later. Trimmed to what is still on the list, or this array
  // grows forever inside a doc read on every load.
  var live={}; items.forEach(function(i){ if(i&&i.id) live[i.id]=1; });
  HOME_PAID=HOME_PAID.concat(items.map(function(i){return i.id;}))
                     .filter(function(id,ix,a){ return live[id] && a.indexOf(id)===ix; });
  db.collection('bridge_state').doc('_streak')
    .set({home_paid:HOME_PAID},{merge:true}).catch(function(){});
  if(!batch.length) return 0;                 // cleared, but nothing of Amy's left to pay
  var room=Math.max(0, W.homeCap-(state.homeXp||0));
  var pts=Math.min(batch.length, W.home, room);
  if(pts>0){ state.homeXp=(state.homeXp||0)+pts; }
  return pts;
}
/* Items Amy added that Sam has not opened the card on yet. `by` is compared against
   BRIDGE_ALLOWED rather than against her address, for the same reason her address is not
   in the client at all: the page can tell "not Sam" without ever being told who is. */
function homeFresh(){
  var seen=state.homeSeen||[];
  return (HOME.items||[]).filter(function(i){
    return i && !i.done && seen.indexOf(i.id)<0 &&
           window.BRIDGE_ALLOWED.indexOf(String(i.by||'').toLowerCase())<0;
  });
}

/* ── Amy's view ────────────────────────────────────────────────────────────
   Reached by loadHomeOnly(), which is the ONLY thing a non-Sam household account runs.
   It requests home_list and nothing else, so his brief is never even asked for. */
function loadHomeOnly(){
  $('#app').classList.add('hide');
  $('#amy').classList.remove('hide');
  $('#amySub').textContent='Signed in as '+((user&&user.email)||'');
  return homeDoc().get().then(function(s){
    HOME={items:(s.exists?(s.data().items||[]):[])};
    HOME_ERR=null; paintAmy();
  }).catch(function(e){
    var code=(e&&e.code)||'';
    HOME_ERR=code||String(e);
    /* permission-denied and "the network fell over" are different facts and must not
       look the same, which is the property this whole file is built around. One means
       this account is not on the household list; the other means try again. */
    $('#amyBody').innerHTML='';
    $('#amyErr').textContent = code==='permission-denied'
      ? 'This account does not have access to the house list. Ask Sam to add '+
        ((user&&user.email)||'this address')+'.'
      : 'Could not load the list ('+HOME_ERR+'). This is a connection problem, not a '+
        'permissions one. Pull down to retry.';
  });
}

function paintAmy(){
  var host=$('#amyBody'); if(!host) return;
  $('#amyErr').textContent='';
  host.innerHTML='';
  var open=HOME.items.filter(function(i){return i&&!i.done;});
  var done=HOME.items.filter(function(i){return i&&i.done;});

  function row(it){
    var r=el('div','amy-row'+(it.done?' done':''));
    r.appendChild(el('span','amy-tick'));
    var t=el('div','t',esc(it.text));
    if(it.done) t.appendChild(el('div','who','crossed off'));
    r.appendChild(t);
    // Only the person who added an item can remove it. Sam crosses things OFF; taking
    // an item off the list entirely is the author's call, not the doer's.
    if(!it.done && String(it.by||'').toLowerCase()===String((user&&user.email)||'').toLowerCase()){
      var x=el('button','amy-x','×');
      x.setAttribute('aria-label','Remove');
      x.addEventListener('click',function(){
        HOME.items=HOME.items.filter(function(y){return y.id!==it.id;});
        paintAmy(); saveHome().catch(function(e){
          $('#amyErr').textContent='Could not save that ('+((e&&e.code)||e)+').'; });
      });
      r.appendChild(x);
    }
    return r;
  }

  if(!open.length && !done.length){
    host.appendChild(el('div','amy-note','Nothing on the list yet. Add the first thing above.'));
    return;
  }
  if(open.length){
    host.appendChild(el('div','amy-sec','To do · '+open.length));
    open.forEach(function(i){ host.appendChild(row(i)); });
  }
  if(done.length){
    host.appendChild(el('div','amy-sec','Done · '+done.length));
    done.forEach(function(i){ host.appendChild(row(i)); });
  }
  host.appendChild(el('div','amy-note',
    'Sam sees this on his morning dashboard and crosses things off there.'));
}

(function(){
  var inp=$('#amyIn'), btn=$('#amyAdd');
  if(!inp||!btn) return;
  function add(){
    var v=inp.value;
    if(!String(v||'').trim()) return;
    inp.value='';
    homeAdd(v).then(paintAmy).catch(function(e){
      $('#amyErr').textContent='Could not save that ('+((e&&e.code)||e)+'). '+
        'It is not on the list; try again.';
    });
    paintAmy();
  }
  btn.addEventListener('click',add);
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') add(); });
})();

/* ── Sam's side: the Home card ─────────────────────────────────────────────
   Synthetic like QCARD and RCARD: not in CARDS, so cardMissing() can never call it a
   card the 4am run failed to write — the feeder is not allowed anywhere near it. */
var HCARD={k:'_home',label:'House list',glyph:'⌂',ac:'var(--lime)'};
BUILD._home=function(b){
  if(HOME_ERR){
    b.appendChild(el('div','empty','Could not reach the house list ('+esc(HOME_ERR)+
      '). This is a read failure, not an empty list.'));
    return;
  }
  var open=homeOpen(), done=(HOME.items||[]).filter(function(i){return i&&i.done;});
  // Opening the card is what marks Amy's items as seen. That is the whole contract of
  // the badge: it counts what he has not looked at, so looking at it must clear it.
  var seen=state.homeSeen||[];
  var newly=homeFresh().map(function(i){return i.id;});
  if(newly.length){
    state.homeSeen=seen.concat(newly);
    saveState();
    /* Repaint the pill in the same breath. Persisting the seen-ids without this left
       the badge reading "6 new" on a card he was looking at, which is the badge lying
       about the one thing it exists to say. */
    paintHomePill();
  }
  if(!open.length && !done.length){
    b.appendChild(el('div','empty','Nothing on the house list.'));
    return;
  }
  function mkRow(it){
    var row=el('label','row');
    var ck=el('input');ck.type='checkbox';ck.className='ck';
    ck.checked=!!it.done;
    ck.addEventListener('change',function(){
      it.done=ck.checked;
      it.done_at=ck.checked?new Date().toISOString():null;
      if(ck.checked) hit(row);
      saveHome().catch(function(){});
      var pts=ck.checked ? checkHomeCleared() : 0;
      if(pts>0){
        saveState();
        /* saveLedger before the modal, for the third time in this file and the same
           reason: rank() reads xpTotal(), which sums rows saveLedger writes, and
           saveState only calls it behind a 600ms debounce. */
        saveLedger(); paintReactor(); checkPromotion();
        showHabitJackpot('House list cleared', pts,
          'Everything Amy put on the list, done. '+
          (pts<W.home ? 'A '+pts+'-item list pays '+pts+'. '
                      : 'A full list pays '+W.home+'. ')+
          'When she adds something new it counts again.');
      }
      paintHomePill(); paintNote();
    });
    row.appendChild(ck);
    var t=el('span','r-txt',esc(it.text));
    row.appendChild(t);
    return row;
  }
  if(open.length){
    var g1=el('div','grp');g1.style.setProperty('--ac','var(--lime)');
    g1.appendChild(el('div','g-name','Open · '+open.length));
    var gb=el('div','g-body');
    open.forEach(function(i){ gb.appendChild(mkRow(i)); });
    g1.appendChild(gb); b.appendChild(g1);
  }
  if(done.length){
    var g2=el('div','grp');
    g2.appendChild(el('div','g-name','Crossed off · '+done.length));
    var gb2=el('div','g-body');
    done.forEach(function(i){ gb2.appendChild(mkRow(i)); });
    g2.appendChild(gb2); b.appendChild(g2);
  }
  /* What clearing is worth RIGHT NOW, not in the abstract. All-or-nothing scoring is
     invisible without a line like this — the same lesson intake taught — and here it has
     to name the live number, because a two-item list is worth 2 and a five-item list is
     worth 3, so a fixed "+3" would be wrong half the time. */
  var note=el('p','note');
  function paintNote(){
    var pay=Math.min(homePayable().length, W.home);
    var left=homeOpen().length;
    var room=Math.max(0, W.homeCap-(state.homeXp||0));
    note.textContent = !left
      ? 'List clear. When Amy adds something new it counts again.'
      : room<=0
        ? 'Amy adds to this list from her own sign-in. Crossing off is what she sees.'
        : 'Clear the whole list for +'+Math.min(pay,room)+'. '+
          left+' still open. When Amy adds something new it counts again.';
  }
  paintNote();
  b.appendChild(note);
};

function paintHomePill(){
  var pill=$('#hpill'), txt=$('#htxt');
  if(!pill||!txt) return;
  var open=homeOpen(), fresh=homeFresh();
  // Hidden entirely when there is nothing, rather than showing a zero. A row that always
  // reads "0 from Amy" is furniture, and furniture stops being read.
  if(!open.length && !fresh.length && !HOME_ERR){ pill.classList.add('hide'); return; }
  pill.classList.remove('hide');
  pill.classList.toggle('fresh',fresh.length>0);
  txt.innerHTML = HOME_ERR ? 'House list unavailable'
    : (fresh.length ? '<b>'+fresh.length+'</b> new on the house list'
                    : '<b>'+open.length+'</b> on the house list');
}
$('#hpill').addEventListener('click',function(){ openDetail(HCARD,$('#hpill')); });

/* ── the work queue ────────────────────────────────────────────────────────────
   The lifecycle, settled with Sam 2026-08-06, and the whole design:

     1. Engage on a punch-list item adds it here as `queued`.
     2. Engage on the queue copies every queued item as ONE prompt and flips
        them to `in_progress`.
     3. He fires that prompt in a desktop session; the session does the work and
        crosses the items off in cross-project-todos.md.
     4. The 4am run drops `in_progress` items whose todo line now reads `[x]`,
        and returns the rest to `queued` with `stall_count` bumped.
     5. He can remove anything at any point, in either state.

   Step 5 is not a convenience. There is deliberately no state an item can reach
   that traps it, because the previous design had one: `needs_sam` items sat here
   with no drain, no removal and a button offering to send them to a runner that
   had been retired, under an alert explaining that nothing would ever action
   them. A card that spends its top third narrating why it does not work should
   be fixed instead of narrated. All of that apparatus is gone. */
var QCARD={k:'_queue',label:'Work queue',glyph:'⇄',ac:'var(--amber)'};
BUILD._queue=function(b){
  var open=qOpen(), sent=qSent();

  if(!queue.length){
    b.appendChild(el('div','empty','Nothing queued. Tap + on a punch-list item or an '+
      'inbox row to send it here.'));
    return;
  }

  function ago(iso){
    if(!iso) return '';
    var m=Math.round((Date.now()-new Date(iso).getTime())/60000);
    if(m<60) return m+'m ago';
    if(m<1440) return Math.round(m/60)+'h ago';
    return Math.round(m/1440)+'d ago';
  }
  var KIND={capture:'Captured thought',task:'Task',reply:'Draft a reply'};

  function row(i){
    var card=el('div','mail');
    card.style.setProperty('--ac', i.status==='in_progress' ? 'var(--cyan)' : 'var(--amber)');
    var stall=+i.stall_count||0;
    var head = i.kind==='reply' ? 'Reply to '+esc(i.sender||'') : esc(KIND[i.kind]||i.kind);
    var meta = esc(KIND[i.kind]||i.kind)+' · '+esc(ago(i.created_at))+
      (i.for_date&&i.for_date!==DATE?' · for '+esc(i.for_date):'')+
      (stall?' · sent back '+stall+'×':'');
    card.innerHTML='<div class="m-body"><div class="m-cat mono">'+meta+'</div>'+
      '<div class="m-from">'+head+'</div>'+
      '<div class="m-sum">'+esc(i.text||i.subject||'')+'</div>'+
      (i.note?'<div class="m-sum" style="color:var(--ink-mute)">'+esc(i.note)+'</div>':'')+'</div>';
    /* Removal is on EVERY item in both states, which is the point. */
    var x=el('button','mini','✕');
    x.title='Remove from the queue';
    x.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation();
      x.disabled=true; x.textContent='…';
      queueDismiss([i.id],function(err){
        if(err){ x.disabled=false; x.textContent='✕';
          x.title='Could not remove: '+((err&&err.code)||err); return; }
        openDetail(QCARD,$('#qpill'));
      });
    });
    var acts=el('div','acts'); acts.appendChild(x); card.appendChild(acts);
    return card;
  }

  [['Queued',open],['In progress',sent]].forEach(function(grp){
    if(!grp[1].length) return;
    b.appendChild(el('div','news-h mono',grp[0]+' · '+grp[1].length));
    grp[1].forEach(function(i){ b.appendChild(row(i)); });
  });

  var copy=el('button','nbtn', open.length
    ? 'Engage · copy '+open.length+' item'+(open.length===1?'':'s')+' as a prompt'
    : 'Nothing queued to send');
  copy.style.margin='10px 0 0';
  if(!open.length) copy.disabled=true;
  copy.addEventListener('click',function(){
    if(!open.length) return;
    var text=queuePrompt(open);
    /* Copy FIRST, flip SECOND, and only on success. The clipboard is the
       delivery mechanism here, which is fine because Sam is deliberately
       carrying this to a desktop session. But a flip to in_progress on a copy
       that silently failed would mark work as sent that he never received, and
       the 4am run would then quietly return it as stalled a day later. So a
       failed copy changes nothing and says so. */
    copy.disabled=true; copy.textContent='…';
    copyText(text).then(function(){
      queueSetStatus(open.map(function(i){return i.id;}),'in_progress',
        'Copied as a prompt '+new Date().toISOString().slice(0,16).replace('T',' ')+'.',
        function(err){
          if(err){
            showText(text,'Copied, but the queue did not update ('+((err&&err.code)||'error')+')');
            return;
          }
          showText(text,'✓ Copied · paste into a Starfleet session');
        });
    }).catch(function(){
      showText(text,'COPY FAILED · nothing was flipped · copy it by hand below');
    });
  });
  b.appendChild(copy);
};

/* The dispatch prompt. `text` carries the FULL item, never the display lead —
   see the toggleMark call in the punch renderer for why. A session receiving
   this has to act on the whole thing, and a 52-character summary is not enough
   to fire on. */
function queuePrompt(items){
  return 'Engage. '+items.length+' item'+(items.length===1?'':'s')+
    ' off the Bridge work queue:\n\n'+
    items.map(function(i){
      return '- ['+(i.kind||'task')+'] '+(i.project?'['+i.project+'] ':'')+
        (i.kind==='reply'
          ? 'reply to '+i.sender+' re: "'+i.subject+'" — '+(i.body||i.text||'')
          : (i.text||''))+
        (i.body&&i.kind!=='reply'?'\n  '+i.body:'');
    }).join('\n\n')+
    '\n\nWork these in a Starfleet session. Open the owning project\'s handoff and the '+
    'directly relevant files before starting. For replies, draft in Sam\'s voice, run the '+
    'Spock chain, and show me the draft before saving it to Gmail. Never send.\n\n'+
    'When an item is actually finished, cross it off in Starfleet/cross-project-todos.md '+
    '(flip "[ ]" to "[x]", append " (done YYYY-MM-DD)" with the real Pacific date) and then '+
    'run:\n\n    python3 "Codename: Riker/bridge/push_closed.py"\n\n'+
    'The 4am run reads those cross-offs and clears these items from the queue. Anything '+
    'still open at 4am comes back to me as queued, so tell me plainly what you did not '+
    'finish and why rather than leaving me to infer it.';
}

/* ── weather sheet ─────────────────────────────────────── */
BUILD.weather=function(b){
  /* AIR QUALITY LEADS, AND IT IS BUILT BEFORE THE FORECAST'S EARLY RETURN.
     Deliberate: on a smoke day the AQI is the most actionable thing on this card,
     and if the forecast fetch has failed the early return below would take the
     smoke warning off screen with it. Two independent readings, two independent
     renders. Sam finding out the air is unhealthy must not depend on Open-Meteo's
     forecast endpoint being up.

     Silent below 50. See AQ_BANDS — good air renders nothing, because a row that
     is present every day is a row that has stopped being read by the morning it
     matters. A FAILED read is not silent, because "no reading" and "clean air"
     are different facts and this is the card where confusing them costs most. */
  if(AQ.state==='fail'){
    b.appendChild(el('div','aqi dim','<span class="n">—</span>'+
      '<span class="b">Air quality unavailable. This is a failed reading, not clean air.'+
      '<em>'+esc(AQ.err||'unknown error')+'</em></span>'));
  } else if(AQ.state==='ok' && AQ.aqi!=null){
    var bd=aqBand(AQ.aqi);
    if(bd.show){
      var advice = AQ.aqi>=151 ? 'Everyone should limit time outdoors.'
                 : AQ.aqi>=101 ? 'Keep the kids in, and the windows shut.'
                 : 'Fine for most people. Worth knowing if you are outside for long.';
      var hr=AQ.at ? new Date(AQ.at) : null;
      b.appendChild(el('div','aqi '+bd.cls,
        '<span class="n">'+AQ.aqi+'</span>'+
        '<span class="b">Air quality is <b>'+esc(bd.label)+'</b>. '+esc(advice)+
        '<em>US AQI'+(hr?' · reading for '+((hr.getHours()%12)||12)+(hr.getHours()<12?'am':'pm'):'')+
        '</em></span>'));
    }
  }

  if(WX.state!=='ok'){
    b.appendChild(el('div','empty', WX.state==='load'
      ? 'Fetching the forecast.'
      : 'Could not reach Open-Meteo. This is a network failure on this device, '+
        'not a quiet weather day.<br><br>'+esc(WX.err||'unknown error')));
    var again=el('button','nbtn','Try again');
    again.style.margin='0 auto';again.style.display='block';
    again.addEventListener('click',function(){
      loadAir();   // retried alongside, un-chained, so a bad AQ cannot fail the retry
      loadWeather().then(function(){openDetail(cardByKey('weather'));});
    });
    b.appendChild(again);
    return;
  }
  var c=WX.data.current, hr=WX.data.hourly||{}, dl=WX.data.daily||{};

  var s=el('div','stats two');
  [['Now',Math.round(c.temperature_2m)+'°'],
   ['Feels like',Math.round(c.apparent_temperature)+'°'],
   ['Humidity',Math.round(c.relative_humidity_2m)+'%'],
   ['Wind',Math.round(c.wind_speed_10m)+' mph']].forEach(function(x){
    s.appendChild(el('div','stat','<div class="k mono">'+x[0]+'</div><div class="v">'+x[1]+'</div>'));
  });
  b.appendChild(s);

  // Next twelve hours, starting from the current hour rather than from midnight.
  var times=hr.time||[], now=laNow(), from=0;
  for(var i=0;i<times.length;i++){ if(new Date(times[i])>=now){from=Math.max(0,i-1);break;} }
  if(times.length){
    b.appendChild(el('div','news-h mono','Next twelve hours'));
    var strip=el('div','wx-hrs');
    for(var j=from;j<Math.min(from+12,times.length);j++){
      var t=new Date(times[j]), h=t.getHours(), h12=(h%12)||12;
      var p=(hr.precipitation_probability||[])[j];
      strip.appendChild(el('div','wx-hr',
        '<div class="h mono">'+h12+(h<12?'a':'p')+'</div>'+
        '<div class="i">'+wxIcon((hr.weather_code||[])[j],(hr.is_day||[])[j])+'</div>'+
        '<div class="t">'+Math.round((hr.temperature_2m||[])[j])+'°</div>'+
        '<div class="p">'+(p>=15?p+'%':'')+'</div>'));
    }
    b.appendChild(strip);
  }

  if((dl.time||[]).length){
    b.appendChild(el('div','news-h mono','Seven days'));
    var box=el('div','grp'), gb=el('div','g-body');
    gb.style.borderTop='none';gb.style.paddingTop='4px';
    dl.time.forEach(function(day,i){
      var d0=new Date(day+'T12:00:00');
      var name=(i===0)?'Today':d0.toLocaleDateString('en-US',{weekday:'short'});
      var pp=(dl.precipitation_probability_max||[])[i];
      gb.appendChild(el('div','wx-day',
        '<span class="d mono">'+esc(name)+'</span>'+
        '<span class="i">'+wxIcon((dl.weather_code||[])[i])+'</span>'+
        '<span class="c">'+esc(wxLabel((dl.weather_code||[])[i]))+'</span>'+
        '<span class="p">'+(pp>=15?pp+'%':'')+'</span>'+
        '<span class="r">'+Math.round((dl.temperature_2m_max||[])[i])+'°'+
          ' <s>'+Math.round((dl.temperature_2m_min||[])[i])+'°</s></span>'));
    });
    box.appendChild(gb);b.appendChild(box);
  }
  b.appendChild(el('p','note','Open-Meteo, downtown Seattle, fetched when you opened this page. '+
    'Not part of the 4am brief, so it is current rather than six hours old.'));
};

/* ── queues ────────────────────────────────────────────── */
function toggleMark(entry,btn){
  var i=-1;
  for(var j=0;j<state.marked.length;j++){if(state.marked[j].id===entry.id){i=j;break;}}
  if(i>=0){state.marked.splice(i,1);btn.classList.remove('on');btn.textContent='+';}
  else{state.marked.push(entry);btn.classList.add('on');btn.textContent='✓';}
  saveState();
}
function dock(){
  // One button. `marked` is the only thing the dock reports on now; check-offs
  // no longer have a dispatch of their own to offer.
  var eN=state.marked.length;
  var xb=$('#sessBtn');
  if(xb){xb.classList.toggle('on',eN>0);$('#sessN').textContent=eN;}
}

function copyText(text){
  return new Promise(function(res,rej){
    function fb(){
      var ta=document.createElement('textarea');ta.value=text;
      ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';ta.style.opacity='0';
      ta.setAttribute('readonly','');document.body.appendChild(ta);
      var sel=document.getSelection(),prev=sel.rangeCount?sel.getRangeAt(0):null;
      ta.focus();ta.select();ta.setSelectionRange(0,text.length);
      var ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
      document.body.removeChild(ta);
      if(prev){sel.removeAllRanges();sel.addRange(prev);}
      ok?res():rej(new Error('copy failed'));
    }
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(res).catch(fb);
    else fb();
  });
}
function openModal(text){
  $('#modalText').textContent=text;$('#modal').classList.add('on');
  document.body.style.overflow='hidden';
  copyText(text).then(flash).catch(function(){$('#mHead').textContent='Tap copy below';});
}
/* Show text WITHOUT attempting a copy, so a caller that has already run copyText
   itself can report the true outcome. openModal always tries to copy and reports
   its own result, which would overwrite an honest failure message with a
   success one on the second attempt. The Copy again button in the modal is still
   there either way, so a failed copy is recoverable by hand. */
function showText(text,head){
  $('#modalText').textContent=text;$('#modal').classList.add('on');
  document.body.style.overflow='hidden';
  $('#mHead').textContent=head||'Copied · paste into chat';
}
function flash(){var h=$('#mHead');h.classList.add('ok');h.textContent='✓ COPIED — PASTE INTO CHAT';
  setTimeout(function(){h.classList.remove('ok');h.textContent='Copied · paste into chat';},1800);}
function closeModal(){$('#modal').classList.remove('on');document.body.style.overflow='';}
$('#mCopy').addEventListener('click',function(){copyText($('#modalText').textContent).then(flash).catch(function(){});});
$('#mClose').addEventListener('click',closeModal);
$('#modal').addEventListener('click',function(e){if(e.target===$('#modal'))closeModal();});

/* The Sync done handler stood here until 2026-08-06. Do not rebuild it.

   It read every ticked item that had not been dispatched, wrapped them in a
   [BRIDGE-DONE] instruction, and pushed one `reconcile` item into the queue.
   Three things were wrong with it and only one was a bug.

   The bug: routine steps have ids like `routine-2026-08-06-3` and no todo line
   anywhere to reconcile against, so they were filtered out of `lines` while
   still counting toward `unsyncedDone()`. Five ticked routine steps therefore
   lit the button, produced zero lines, and fell into the branch that copied
   "Only routine steps are left unsynced" to the clipboard as though that were a
   prompt. The button then never cleared, because nothing was ever dispatched to
   mark them synced. Routine is a daily habit block scored all-or-nothing; it is
   not pending work and must never be counted as unsynced anything.

   The design fault, which is why this is a deletion and not a repair: a
   crossed-off item and an engaged item want exactly the same thing, a prompt
   Sam fires in a desktop session. They belong in one place. Cross-offs now
   reach cross-project-todos.md through push_closed.py on the session side,
   which is the direction that actually works, and the queue owns dispatch. */

function engagePrompt(marked){
  var todos=marked.filter(function(m){return (m.kind||'todo')==='todo';});
  var reps=marked.filter(function(m){return m.kind==='reply';});
  var secs=[];
  if(todos.length)secs.push('Tasks:\n'+todos.map(function(m){
    return '- '+(m.project?'['+m.project+'] ':'')+m.text;}).join('\n'));
  if(reps.length)secs.push('Drafts to write:\n'+reps.map(function(m){
    return '- To '+m.sender+' re: "'+m.subject+'" — '+(m.body||'no preview');}).join('\n'));
  if(!secs.length)return '';
  return "Engage. Here's what I'm working on today:\n\n"+secs.join('\n\n')+
    "\n\nLet's determine which are highest priority and pull up necessary context. For tasks, open the "+
    "relevant project handoffs and any directly-relevant files. For drafts, generate the reply in Sam's voice "+
    "(warm but efficient, no em dashes, no bullet lists in prose), run through the voice-checker chain, and "+
    "show me the draft before saving as a Gmail draft. Tell me what to tackle first and the state of each item.";
}

/* SESSION — the one dock verb, and step 1 of the queue lifecycle.

   These used to be written `needs_sam`, which put them in the only bucket the
   copy button did not read: the queue showed five items and the button said
   "Nothing queued." `needs_sam` existed to stop an hourly runner re-litigating a
   deferral every hour, and that runner has been retired, so the status it
   existed for describes nothing. They are `queued` now, which is what they
   always were. */
$('#sessBtn').addEventListener('click',function(){
  var marked=state.marked.slice();
  if(!marked.length)return;
  var items=marked.map(function(m){
    return {kind:(m.kind==='reply'?'reply':'task'), text:m.text||'', project:m.project||'',
            sender:m.sender||'', subject:m.subject||'', body:m.body||'',
            status:'queued', note:''};
  });
  queueAdd(items,function(err,stamped){
    if(err){
      openModal('COULD NOT REACH THE QUEUE ('+((err&&err.code)||'unknown')+
        ').\nThe text below is copied instead — paste it into a chat.\n\n'+engagePrompt(marked));
      $('#mHead').textContent='Queue unreachable · copied instead';
      return;
    }
    openModal('Queued '+stamped.length+' item'+(stamped.length===1?'':'s')+'.\n\n'+
      stamped.map(function(i){return '- '+(i.kind==='reply'?'reply to '+i.sender:i.text);}).join('\n')+
      '\n\nThey are on the work queue. Open it and tap Engage to copy everything queued as '+
      'one prompt for a Starfleet session. The text above is already on your clipboard if '+
      'you want to start with just these.');
    $('#mHead').textContent='Queued';
    state.marked=[];
    document.querySelectorAll('.mini.on').forEach(function(b){b.classList.remove('on');b.textContent='+';});
    saveState();
  });
});

/* ── capture ───────────────────────────────────────────────────────────── */
function capture(){
  var inp=$('#capIn'),btn=$('#capBtn');
  var t=(inp.value||'').trim();
  if(!t)return;
  btn.disabled=true;
  queueAdd([{kind:'capture',text:t}],function(err){
    btn.disabled=false;
    if(err){ btn.textContent='Failed'; setTimeout(function(){btn.textContent='Add';},2200); return; }
    inp.value='';
    btn.textContent='✓ Added';btn.classList.add('cap-ok');
    setTimeout(function(){btn.textContent='Add';btn.classList.remove('cap-ok');},1600);
  });
}
$('#qpill').addEventListener('click',function(){ openDetail(QCARD,$('#qpill')); });
/* capture() is unbound since 2026-09-03; the markup is gone. Kept for queueAdd's contract. */

})();
