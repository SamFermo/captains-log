          gb2.appendChild(el('div','ev','<div class="ev-t mono">'+esc(l.label)+'</div>'+
            '<div class="ev-b"><div class="ev-n">'+esc(l.value)+'</div></div>'));
        });
        g2.appendChild(gb2);host.appendChild(g2);
      }
      return;
    }
    var days=(range==='week'?sec.week:sec.month)||[];
    var any=false;
    days.forEach(function(d){
      var list=(d.items||[]).filter(keep);
      if(!list.length)return;
      any=true;
      var grp=el('div','daygrp');
      grp.appendChild(el('div','dayhead mono'+(d.is_today?' today':''),esc(d.label)));
      list.forEach(function(e){grp.appendChild(evRow(e));});
      host.appendChild(grp);
    });
    if(!any) host.appendChild(el('div','empty',
      range==='week'?'Nothing scheduled in the next seven days.':'Nothing scheduled this month.'));
  }
  paint();
};

/* ── news signal maths ─────────────────────────────────────
   One tap is one vote. Voting again on the same story first UNDOES the previous vote, so
   every tap is reversible and no score can be inflated by tapping the same item twice. */
function topicScore(t){ return prefs.topic_scores[t]||0; }
function storyState(sv){
  // Returns 'muted' | 'boosted' | '' for a story, from its own vote and its topics.
  if((prefs.id_votes[sv.id]||0)<0) return 'muted';
  var tops=sv.topics||[];
  for(var i=0;i<tops.length;i++) if(topicScore(tops[i])<=MUTE_AT) return 'muted';
  if((prefs.id_votes[sv.id]||0)>0) return 'boosted';
  for(var j=0;j<tops.length;j++) if(topicScore(tops[j])>=BOOST_AT) return 'boosted';
  return '';
}
function applyVote(sv,dir){
  var prev=prefs.id_votes[sv.id]||0;
  var next=(prev===dir)?0:dir;          // tapping the active side clears it
  var delta=next-prev;
  (sv.topics||[]).forEach(function(t){
    var v=(prefs.topic_scores[t]||0)+delta;
    if(v===0) delete prefs.topic_scores[t]; else prefs.topic_scores[t]=v;
  });
  if(next===0) delete prefs.id_votes[sv.id]; else prefs.id_votes[sv.id]=next;
  savePrefs();
  return next;
}
/* Say what a tap did. v1's whole problem was that the consequence was invisible: Sam could
   not see that one thumb had muted two subjects forever. */
function voteNote(sv,next){
  if(!next) return 'Cleared.';
  var parts=(sv.topics||[]).map(function(t){
    var v=topicScore(t);
    if(v<=MUTE_AT) return esc(t)+' muted';
    if(v>=BOOST_AT) return esc(t)+' boosted';
    return esc(t)+' '+(v>0?'+':'')+v;
  });
  var need=next<0?(MUTE_AT+1):(BOOST_AT-1);
  var tail=parts.length?parts.join(' · '):'';
  return (next<0?'Less. ':'More. ')+tail+
    (next<0?'  (a topic mutes at '+MUTE_AT+')':'  (a topic boosts at +'+BOOST_AT+')');
}

/* ── news ──────────────────────────────────────────────── */
BUILD.news=function(b,sec){
  var bk=sec.buckets||[];
  if(!bk.length){b.appendChild(el('div','empty','Nothing verified worth your time today.'));return;}
  b.appendChild(el('p','note','Thumbs shape tomorrow. Up widens that subject, down mutes the topic.'));
  bk.forEach(function(k){
    var all=k.items||[];
    var visible=all.filter(function(s){return storyState(s)!=='muted';});
    var hidden=all.length-visible.length;
    // Boosted stories rise inside their bucket; order is otherwise untouched.
    visible.sort(function(a,b){
      return (storyState(b)==='boosted'?1:0)-(storyState(a)==='boosted'?1:0);
    });
    if(!visible.length && !hidden) return;
    var wrap=el('div','news-b');
    wrap.appendChild(el('div','news-h mono',esc(k.label)));
    if(hidden){
      // A bucket emptied by mutes must not look like a quiet news day.
      var hn=el('div','news-hid', hidden+' item'+(hidden===1?'':'s')+' hidden by your mutes');
      var sh=el('button','nbtn','Show');
      sh.addEventListener('click',function(){
        visible=all; hidden=0;
        openDetail(CARDS.filter(function(c){return c.k==='news';})[0]);
      });
      hn.appendChild(sh); wrap.appendChild(hn);
    }
    visible.forEach(function(s){
      var card=el('div','story');
      var h=el('a','h',esc(s.headline));
      if(s.url){h.href=s.url;h.target='_blank';h.rel='noopener noreferrer';}
      card.appendChild(h);
      if(s.note) card.appendChild(el('div','n',esc(s.note)));
      if(s.why)  card.appendChild(el('div','why','Why it lands on you: '+esc(s.why)));
      if(s.inference) card.appendChild(el('div','inf','Inference, not reporting: '+esc(s.inference)));
      var foot=el('div','foot');
      foot.appendChild(el('div','s mono',esc((s.source||'')+(s.published?' · '+s.published:''))));
      var na=el('div','nact');
      var up=el('button','nbtn up','More');
      var dn=el('button','nbtn down','Less');
      var say=el('div','vnote');
      var v0=prefs.id_votes[s.id]||0;
      up.setAttribute('aria-pressed',v0>0?'true':'false');
      dn.setAttribute('aria-pressed',v0<0?'true':'false');
      if(storyState(s)==='boosted')card.classList.add('boosted');
      function vote(dir){
        var next=applyVote(s,dir);
        up.setAttribute('aria-pressed',next>0?'true':'false');
        dn.setAttribute('aria-pressed',next<0?'true':'false');
        card.classList.toggle('muted',storyState(s)==='muted');
        card.classList.toggle('boosted',storyState(s)==='boosted');
        say.textContent=voteNote(s,next);
      }
      up.addEventListener('click',function(){vote(1);});
      dn.addEventListener('click',function(){vote(-1);});
      na.appendChild(up);na.appendChild(dn);foot.appendChild(na);
      card.appendChild(say);
      card.appendChild(foot);wrap.appendChild(card);
    });
    b.appendChild(wrap);
  });
  var scored=Object.keys(prefs.topic_scores).sort(function(a,b){
    return prefs.topic_scores[a]-prefs.topic_scores[b];});
  if(scored.length){
    var m=el('p','note','Your signals: ');
    scored.forEach(function(t){
      var v=prefs.topic_scores[t];
      var cls='tscore'+(v<=MUTE_AT?' off':v>=BOOST_AT?' on':'');
      var chip=el('button',cls,esc(t)+' '+(v>0?'+':'')+v);
      chip.title='Tap to reset this topic to 0';
      chip.addEventListener('click',function(){
        delete prefs.topic_scores[t];savePrefs();
        openDetail(CARDS.filter(function(c){return c.k==='news';})[0]);
      });
      m.appendChild(chip);
    });
    var clear=el('button','nbtn','Reset all');
    clear.style.marginLeft='8px';
    clear.addEventListener('click',function(){
      prefs.topic_scores={};prefs.id_votes={};savePrefs();
      openDetail(CARDS.filter(function(c){return c.k==='news';})[0]);
    });
    m.appendChild(clear);b.appendChild(m);
  }
};

/* ══ SERVICE ═══════════════════════════════════════════════════════════════
   The panel shows the highlights the feeder wrote. The sheet reads the nightly
   `revel/{service-date}` docs directly and builds Last night / Week / Month.

   Those docs are the same ones the staff portal renders, they are readable by
   Sam's signed-in account, and they carry far more than the four stats the
   payload copies across. Reading them here means the Bridge stops being a
   pointer to the portal for anything beyond a headline.

   REVEL DOC IDS ARE SERVICE DATES, NOT GENERATION DATES. A report generated on
   the morning of 7/30 covers 7/29 service and is stored at revel/2026-07-29.
   Walking back from today and taking the first doc that exists is therefore the
   correct way to find "last night", and is why there is no doc for today. */
var REVEL={loaded:false,loading:null,days:[]};
var REVEL_WINDOW=35;

function loadRevel(){
  if(REVEL.loaded) return Promise.resolve(REVEL);
  if(REVEL.loading) return REVEL.loading;
  var keys=[], d=new Date(DATE+'T12:00:00');
  for(var i=0;i<REVEL_WINDOW;i++){ keys.push(dayKey(d)); d.setDate(d.getDate()-1); }
  REVEL.loading=Promise.all(keys.map(function(k){
    return db.collection('revel').doc(k).get()
      .then(function(s){ return s.exists?Object.assign({_date:k},s.data()):null; })
      .catch(function(e){ return {_date:k,_err:(e&&e.code)||String(e)}; });
  })).then(function(res){
    var errs=res.filter(function(x){return x&&x._err;});
    REVEL.days=res.filter(function(x){return x&&!x._err;});   // newest first
    REVEL.err = errs.length ? (errs[0]._err+' ('+errs.length+' of '+REVEL_WINDOW+' reads)') : null;
    REVEL.loaded=true;
    return REVEL;
  });
  return REVEL.loading;
}

function money(n){
  if(n==null||!isFinite(n)) return '—';
  return '$'+Math.round(n).toLocaleString('en-US');
}
function money2(n){
  if(n==null||!isFinite(n)) return '—';
  return '$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function pct(n){ return (n==null||!isFinite(n))?'—':n.toFixed(1)+'%'; }
function sum(rows,fn){ return rows.reduce(function(a,r){var v=fn(r);return a+(isFinite(v)?v:0);},0); }
function shortDate(k){
  var d=new Date(k+'T12:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'});
}

BUILD.service=function(b,sec){
  var mode='night';
  var seg=el('div','seg');
  [['night','Last night'],['week','Week'],['month','Month']].forEach(function(o,i){
    var bt=el('button','',o[1]);bt.setAttribute('role','tab');
    bt.setAttribute('aria-selected',i===0?'true':'false');
    bt.addEventListener('click',function(){
      mode=o[0];
      seg.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected','false');});
      bt.setAttribute('aria-selected','true');paint();
    });
    seg.appendChild(bt);
  });
  b.appendChild(seg);
  var host=el('div');b.appendChild(host);
  host.appendChild(el('div','empty','Reading the nightly numbers…'));

  loadRevel().then(paint).catch(function(e){
    host.innerHTML='';
    host.appendChild(el('div','rc-fails','<h4>Could not read the nightly numbers</h4><div>'+
      esc((e&&e.code)||String(e))+'</div><div>This is a read failure, not a quiet week.</div>'));
  });

  function paint(){
    host.innerHTML='';
    // A read that partially failed must say so rather than quietly showing a
    // shorter week than the one that exists.
    if(REVEL.err) host.appendChild(el('div','rc-fails',
      '<h4>Partial read</h4><div>'+esc(REVEL.err)+'</div>'+
      '<div>Anything below is built from the nights that did load.</div>'));
    if(!REVEL.days.length){
      host.appendChild(el('div','empty','No nightly numbers found in the last '+REVEL_WINDOW+' days.'));
      return;
    }
    if(mode==='night') paintNight(host,REVEL.days[0]);
    else paintRange(host, mode==='week'?REVEL.days.slice(0,7):REVEL.days.slice(0,31),
                   mode==='week'?'Last seven nights with service':'Last 31 days');
    // The feeder's own flags stay visible on every tab; they are today's issues,
    // not last night's numbers.
    (sec.flags||[]).forEach(function(f){
      host.appendChild(el('div','mail','<div class="m-body"><div class="m-from">'+esc(f.title)+
        '</div><div class="m-sum">'+esc(f.detail)+'</div></div>'));
    });
    if(sec.portal_url){
      var a=el('a','linkout');a.href=sec.portal_url;a.target='_blank';a.rel='noopener noreferrer';
      a.style.setProperty('--ac','var(--mint)');
      a.innerHTML='<span>'+esc(sec.portal_label||'Open the staff portal')+'</span><span class="go">→</span>';
      host.appendChild(a);
    }
  }

  function statGrid(pairs,cls){
    var s=el('div','stats'+(cls?' '+cls:''));
    pairs.forEach(function(p){
      s.appendChild(el('div','stat','<div class="k mono">'+esc(p[0])+'</div>'+
        '<div class="v">'+esc(p[1])+'</div>'+
        (p[2]?'<div class="d '+esc(p[3]||'flat')+'">'+esc(p[2])+'</div>':'')));
    });
    return s;
  }

  function paintNight(h,d){
    var lab=d.labor||{};
    // Effective service-charge rate is DERIVED from the actual fee line, never
    // product x 0.23. The charge applies to eligible items only, so the effective
    // rate runs 21.5-22.5% and computing it from the headline rate overstates it.
    var eff = d.product ? (d.service_fees/d.product*100) : null;
    h.appendChild(el('div','news-h mono',esc(d.weekday||'')+' · '+esc(shortDate(d._date))));
    h.appendChild(statGrid([
      ['Product',money2(d.product)],
      ['Covers',String(d.covers==null?'—':d.covers),
        d.wow&&d.wow.covers?((d.wow.covers.d>0?'+':'')+d.wow.covers.d+' vs last wk'):'',
        d.wow&&d.wow.covers?(d.wow.covers.d>0?'up':d.wow.covers.d<0?'down':'flat'):''],
      ['Avg check',money2(d.avg_check),
        d.wow&&d.wow.avg_check?((d.wow.avg_check.d>0?'+':'')+money2(d.wow.avg_check.d)):'',
        d.wow&&d.wow.avg_check?(d.wow.avg_check.d>0?'up':'down'):''],
      ['Per guest',money2(d.avg_per_guest)],
      ['Transactions',String(d.transactions==null?'—':d.transactions)],
      ['Service charge',money2(d.service_fees)]
    ],'two'));

    // Service charge band. 23% is the headline rate; the EFFECTIVE rate on product
    // is the number that means anything, and it is verified to sit at 21.5-22.5%.
    // Outside that band is a real signal, so it is called out rather than shown flat.
    if(eff!=null){
      var inBand=(eff>=21.5&&eff<=22.5);
      h.appendChild(el('div','mail','<div class="m-body">'+
        '<div class="m-cat mono">Service charge</div>'+
        '<div class="m-from">'+pct(eff)+' effective'+
        (inBand?'':'<span class="state reply">outside 21.5–22.5%</span>')+'</div>'+
        '<div class="m-sum">'+money2(d.service_fees)+' on '+money2(d.product)+
        ' of product. The headline rate is 23% and applies to eligible items only, '+
        'so the effective rate is always lower. This is read off the fee line, not calculated.</div></div>'));
    }

    if(lab.hours!=null||lab.clocked_wages!=null){
      h.appendChild(el('div','news-h mono','Labor'));
      h.appendChild(statGrid([
        ['Clocked wages',money2(lab.clocked_wages)],
        ['Hours',lab.hours==null?'—':lab.hours.toFixed(2)],
        ['Sales / labor hr',money2(lab.sales_per_labor_hour)],
        ['Wages % product',pct(lab.pct_clocked_proxy),
          d.wow&&d.wow.labor_pts?((d.wow.labor_pts.d>0?'+':'')+d.wow.labor_pts.d+' pts'):'',
          d.wow&&d.wow.labor_pts?(d.wow.labor_pts.d<0?'up':'down'):'']
      ],'two'));
      h.appendChild(el('p','note','"Wages % product" is clocked wages over product, which is a '+
        'proxy. It is NOT the 30–35% labor target from the weekly digest: that target is total '+
        'labor cost including taxes and benefits, so comparing the two would flatter the number. '+
        'The trailing averages on the Week and Month tabs are the fair comparison.'));
    }

    [['food','Food'],['drinks','Drinks']].forEach(function(g){
      var sec2=d[g[0]]; if(!sec2||!(sec2.top||[]).length) return;
      h.appendChild(el('div','news-h mono','Top '+g[1].toLowerCase()));
      var box=el('div','grp'), gb=el('div','g-body');
      gb.style.borderTop='none';gb.style.paddingTop='4px';
      sec2.top.slice(0,6).forEach(function(it){
        gb.appendChild(el('div','ev','<div class="ev-t mono">'+esc(String(it.qty))+'×</div>'+
          '<div class="ev-b"><div class="ev-n">'+esc(it.name)+'</div></div>'+
          '<div class="ev-t mono" style="text-align:right;min-width:56px">'+money(it.rev)+'</div>'));
      });
      box.appendChild(gb);h.appendChild(box);
      /* These are arrays of OBJECTS, not strings. `anomalies` is {name, note} and
         `not_moving` is {name, qty}. Joining them directly printed a row of
         [object Object], which is the kind of thing that only shows up when you
         run the real document through instead of a fixture you wrote yourself. */
      if((sec2.anomalies||[]).length)
        h.appendChild(el('p','note',g[1]+' anomalies: '+esc(sec2.anomalies.map(function(a){
          return typeof a==='string'?a:((a.name||'')+(a.note?' ('+a.note+')':''));
        }).join(' · '))));
      if((sec2.not_moving||[]).length)
        h.appendChild(el('p','note','Not moving: '+esc(sec2.not_moving.map(function(a){
          return typeof a==='string'?a:((a.name||'')+(a.qty!=null?' ×'+a.qty:''));
        }).join(' · '))));
      if(g[0]==='drinks'&&sec2.wine&&(sec2.wine.bottles!=null||sec2.wine.glasses!=null))
        h.appendChild(el('p','note','Wine: '+(sec2.wine.bottles||0)+' bottles, '+
          (sec2.wine.glasses||0)+' by the glass.'));
    });

    if(d.notes&&(d.notes.peak||d.notes.tail)){
      h.appendChild(el('div','news-h mono','Shape of the night'));
      if(d.notes.peak) h.appendChild(el('div','mail','<div class="m-body"><div class="m-cat mono">Peak</div>'+
        '<div class="m-sum">'+esc(String(d.notes.peak))+'</div></div>'));
      if(d.notes.tail) h.appendChild(el('div','mail','<div class="m-body"><div class="m-cat mono">Tail</div>'+
        '<div class="m-sum">'+esc(String(d.notes.tail))+'</div></div>'));
    }

    if((d.crew||[]).length){
      h.appendChild(el('div','news-h mono','On the floor'));
      var cb=el('div','grp'), cg=el('div','g-body');
      cg.style.borderTop='none';cg.style.paddingTop='4px';
      d.crew.forEach(function(c){
        cg.appendChild(el('div','ev','<div class="ev-t mono">'+esc(c.role||'')+'</div>'+
          '<div class="ev-b"><div class="ev-n">'+esc(c.name||'')+'</div></div>'+
          '<div class="ev-t mono" style="text-align:right;min-width:48px">'+
          (c.h==null?'':esc(c.h+'h'))+'</div>'));
      });
      cb.appendChild(cg);h.appendChild(cb);
    }

    var disc=(d.discounts||0)+(d.comps||0);
    if(disc||d.voids||d.refunds_value){
      h.appendChild(el('div','news-h mono','Leakage'));
      h.appendChild(statGrid([
        ['Discounts',money2(d.discounts)],
        ['Comps',money2(d.comps)],
        ['Voids',String(d.voids==null?'—':d.voids)],
        ['Refunds',money2(d.refunds_value)]
      ],'two'));
    }
  }

  function paintRange(h,rows,label){
    if(!rows.length){ h.appendChild(el('div','empty','No nights in this range.')); return; }
    var prod=sum(rows,function(r){return r.product;});
    var cov=sum(rows,function(r){return r.covers;});
    var txn=sum(rows,function(r){return r.transactions;});
    var fees=sum(rows,function(r){return r.service_fees;});
    var wage=sum(rows,function(r){return (r.labor||{}).clocked_wages;});
    var hrs=sum(rows,function(r){return (r.labor||{}).hours;});
    h.appendChild(el('div','news-h mono',label+' · '+rows.length+' night'+(rows.length===1?'':'s')));
    h.appendChild(statGrid([
      ['Product',money(prod)],
      ['Covers',cov.toLocaleString('en-US')],
      ['Avg check',txn?money2(prod/txn):'—'],
      ['Per guest',cov?money2(prod/cov):'—'],
      ['Wages % product',prod?pct(wage/prod*100):'—'],
      ['Sales / labor hr',hrs?money2(prod/hrs):'—']
    ],'two'));
    h.appendChild(el('p','note','Averages are weighted across the range, not an average of '+
      'nightly averages. Service charge over the range: '+money2(fees)+
      (prod?', '+pct(fees/prod*100)+' effective':'')+'.'));

    /* A pooled effective rate is only comparable to the 21.5–22.5% band when every
       night in the range is ordinary service. One night carrying a large block of
       revenue the charge does not apply to drags the pooled figure well below the
       band and makes it look like the charge is under-collecting. Rather than
       quietly print a number that invites the wrong conclusion, name the nights
       that are pulling it. */
    var odd=rows.filter(function(r){
      return r.product && r.service_fees!=null && (r.service_fees/r.product*100) < 18;
    });
    if(odd.length) h.appendChild(el('p','note',
      'That pooled rate is dragged down by '+odd.map(function(r){
        return shortDate(r._date)+' ('+pct(r.service_fees/r.product*100)+' on '+money(r.product)+')';
      }).join(', ')+'. A night well below the band is carrying revenue the service charge does '+
      'not apply to, so compare single nights rather than reading the pooled rate as a trend.'));

    var best=rows.slice().sort(function(a,b){return (b.product||0)-(a.product||0);})[0];
    var worst=rows.slice().sort(function(a,b){return (a.product||0)-(b.product||0);})[0];
    if(best&&worst&&best!==worst)
      h.appendChild(el('p','note','Best night '+shortDate(best._date)+' at '+money(best.product)+
        '. Slowest '+shortDate(worst._date)+' at '+money(worst.product)+'.'));

    var box=el('div','grp'), gb=el('div','g-body');
    gb.style.borderTop='none';gb.style.paddingTop='4px';
    rows.forEach(function(r){
      var lp=(r.labor||{}).pct_clocked_proxy;
      gb.appendChild(el('div','ev',
        '<div class="ev-t mono" style="min-width:74px">'+esc(shortDate(r._date))+'</div>'+
        '<div class="ev-b"><div class="ev-n">'+money(r.product)+
          (r.covers==null?'':'<span class="ev-w" style="display:inline;margin-left:8px">· '+
            r.covers+' covers</span>')+'</div></div>'+
        '<div class="ev-t mono" style="text-align:right;min-width:46px">'+
        (lp==null?'':pct(lp))+'</div>'));
    });
    box.appendChild(gb);h.appendChild(box);
  }
};

/* ── routine ───────────────────────────────────────────── */
/* The water row. A counter, not a checkbox, which is why it is built by the page
   rather than coming through as a payload step: every `routine.steps` entry is a
   boolean and "4 of 8" is not.

   Minus as well as plus, because a mis-tap on a phone at 6am is guaranteed and a
   counter you cannot correct is a counter you stop trusting. */
/* A routine step, in either shape.

   Legacy: a plain string, one habit, one tick, no detail.
   New:    {label, detail:[...]} — still ONE habit and ONE tick, with the movements
           behind an expander rather than as five separate boxes.

   Deliberately NOT pattern-matched out of the prose. Grouping "Ankle circles" and
   "Hip circles" by reading the text would rot the first time the wording changed,
   and it would be guessing at structure the feeder can simply state. */
function stepShape(st){
  if(st && typeof st==='object')
    return {label:String(st.label||''), detail:(st.detail||[]).map(String)};
  return {label:String(st==null?'':st), detail:[]};
}

function intakeRow(){
  var wrap=el('div','wtr');
  function paint(){
    var c=state.water||0, pips='';
    for(var i=0;i<WATER_TARGET;i++) pips+='<i class="'+(i<c?'on':'')+'"></i>';
    // What is still outstanding, named. See .wtr-note — an all-or-nothing track
    // that does not say what it is waiting for is a track that reads as broken.
    var miss=[];
    if(c<WATER_TARGET) miss.push((WATER_TARGET-c)+' cup'+(WATER_TARGET-c===1?'':'s'));
    if(!state.cider) miss.push('fire cider');
    if(!state.vits)  miss.push('multivitamin');
    var note = miss.length
      ? '<span>Needs all three · '+esc(miss.join(', '))+' to go</span>'
      : '<span>Complete · +'+W.intake+'</span>';
    wrap.innerHTML=
      '<div class="wtr-top"><span class="wtr-k mono">Intake</span>'+
      '<span class="wtr-v">'+c+'<small>/'+WATER_TARGET+' cups · '+
        (c*WATER_OZ)+' of '+(WATER_TARGET*WATER_OZ)+'oz</small></span></div>'+
      '<div class="wtr-pips">'+pips+'</div>'+
      '<div class="wtr-act"><button data-d="-1" aria-label="One cup fewer">−</button>'+
      '<button data-d="1" aria-label="One more cup">+ Cup</button></div>'+
      '<div class="wtr-sup">'+
        '<button data-t="cider" class="'+(state.cider?'on':'')+'" aria-pressed="'+(state.cider?'true':'false')+'">'+
          '<span class="dot"></span>Fire cider</button>'+
        '<button data-t="vits" class="'+(state.vits?'on':'')+'" aria-pressed="'+(state.vits?'true':'false')+'">'+
          '<span class="dot"></span>Multivitamin</button>'+
      '</div>'+
      '<div class="wtr-note'+(miss.length?'':' done')+'">'+note+'</div>';
    wrap.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click',function(e){
        // .row is a <label> and this whole card can sit inside one, so BOTH are
        // required or tapping a supplement ticks an unrelated item off.
        e.preventDefault();e.stopPropagation();
        var was=intakeXp();
        var t=btn.getAttribute('data-t');
        if(t){ state[t]=!state[t]; }
        else {
          var d=+btn.getAttribute('data-d');
          // Clamped at both ends. Above the target nothing more is recorded, which
          // matches the scoring: there is no credit for an eleventh cup.
          state.water=Math.max(0,Math.min(WATER_TARGET,(state.water||0)+d));
        }
        /* Fires on the TRANSITION into complete, not on being complete. `was` is what
           makes topping water past the target, or re-tapping a supplement that is
           already on, unable to replay the payout. The persisted flag then stops it
           replaying after an untap-and-retap, or after a reload. */
        var fire = !was && intakeXp() && !state.intakeJp;
        if(fire) state.intakeJp=true;     // set BEFORE saveState, so it gets persisted
        paint(); saveState();
        if(fire){
          /* saveLedger first, because the modal prints rank(), rank() reads xpTotal(),
             and xpTotal() sums ledger.days — which saveLedger is what folds today's row
             into. saveState only calls it behind a 600ms debounce, so without this flush
             the jackpot would announce the PRE-intake total. Exactly the ordering bug the
             strip had on 2026-08-04, in a new place. */
          saveLedger(); paintReactor(); checkPromotion();
          showIntakeJackpot();
        }
      });
    });
  }
  paint();
  return wrap;
}

BUILD.routine=function(b,sec){
  b.appendChild(intakeRow());
  if((sec.stats||[]).length){
    var s=el('div','stats');
    sec.stats.forEach(function(x){s.appendChild(el('div','stat',
      '<div class="k mono">'+esc(x.label)+'</div><div class="v">'+esc(x.value)+'</div>'));});
    b.appendChild(s);
  }
  if((sec.steps||[]).length){
    /* ONE SECTION, every item its own checkbox, scored as a block. Sam's call
       2026-08-05, and it replaced a collapsible <details> group titled "Mobility,
       5 min" — a title the page was inventing, which was wrong the moment the
       payload carried anything that was not mobility.
       Built to read as intake's sibling: same .wtr shell, same header shape, same
       .wtr-note carrying what is still outstanding. All-or-nothing scoring is
       invisible without that line, exactly as it was for intake. */
    var det=el('div','wtr rtn');
    var head=el('div','wtr-top');
    head.innerHTML='<span class="wtr-k mono">Routine</span><span class="wtr-v">'+
      routineDone()+'<small>/'+sec.steps.length+' done</small></span>';
    det.appendChild(head);
    var note=el('div','wtr-note');
    /* Repaints in place rather than rebuilding the block. A rebuild would collapse
       any expander the reader had open, and on a five-step routine that is most of
       what is on screen. */
    function refresh(){
      var n=routineDone(), total=sec.steps.length, left=total-n;
      head.querySelector('.wtr-v').innerHTML=n+'<small>/'+total+' done</small>';
      note.className='wtr-note'+(left?'':' done');
      note.innerHTML=left
        ? '<span>Needs all '+total+' · '+left+' to go</span>'
        : '<span>Complete · +'+W.routine+'</span>';
    }
    var gb=el('div','g-body');
    sec.steps.forEach(function(raw,i){
      var st=stepShape(raw);
      var id=routineId(i);
      var row=el('label','row');
      var ck=el('input');ck.type='checkbox';ck.className='ck';ck.setAttribute('data-id',id);
      if(state.done.indexOf(id)>=0)ck.checked=true;
      ck.addEventListener('change',function(){
        var was=routineXp();
        if(ck.checked){if(state.done.indexOf(id)<0)state.done.push(id);hit(row);}
        else state.done=state.done.filter(function(x){return x!==id;});
        /* Transition into complete, not the state of being complete — the same
           contract as intake, so re-ticking the last box cannot replay the payout,
           and the persisted flag stops a reload replaying it either. */
        var fire = !was && routineXp() && !state.routineJp;
        if(fire) state.routineJp=true;   // set BEFORE saveState so it persists
        refresh(); saveState();
        if(fire){
          /* saveLedger first: the modal prints rank(), which reads xpTotal(), which
             sums the rows saveLedger writes — and saveState only calls it behind a
             600ms debounce. Without the flush the payout announces the old total. */
          saveLedger(); paintReactor(); checkPromotion();
          showRoutineJackpot();
        }
      });
      row.appendChild(ck);
      row.appendChild(el('span','r-txt',esc(st.label)));
      if(st.detail.length){
        /* Same expander contract as the punch list, and the same two guards: .row is
           a <label>, so without preventDefault AND stopPropagation, opening the
           movements would tick the habit off. */
        var more=el('div','r-more');
        more.innerHTML=st.detail.map(function(d){return '<div>'+esc(d)+'</div>';}).join('');
        more.style.display='none';
        var acts=el('div','acts');
        var mb=el('button','mini more','⋯');
        mb.setAttribute('aria-expanded','false');
        mb.setAttribute('aria-label','Show the movements');
        mb.addEventListener('click',function(e){
          e.preventDefault();e.stopPropagation();
          var open=more.style.display!=='none';
          more.style.display=open?'none':'block';
          mb.classList.toggle('on',!open);
          mb.setAttribute('aria-expanded',String(!open));
        });
        acts.appendChild(mb); row.appendChild(acts); row.appendChild(more);
      }
      gb.appendChild(row);
    });
    det.appendChild(gb);
    refresh();
    det.appendChild(note);
    b.appendChild(det);
  }
  if(sec.note)b.appendChild(el('p','note',esc(sec.note)));
};

/* ── the service record ─────────────────────────────────────────────────────
   Everything the ledger knows, which until now was only three numbers on a strip.
   Synthetic like QCARD: it is not in CARDS, draws from bridge_state rather than
   the daily payload, and therefore can never read as a "missing" card. */
var RCARD={k:'_rank',label:'Service record',glyph:'▲',ac:'var(--amber)'};
BUILD._rank=function(b){
  var r=rank(), sd=streakDays(), st=standing(), m=ledgerMap();

  var head=el('div');
  head.innerHTML='<div class="rk-hero"><span class="rk-name">'+esc(r.name)+'</span>'+
    '<span class="rk-ab mono">'+esc(r.ab)+'</span></div>'+
    '<div class="rk-sub">'+r.xp+' point'+(r.xp===1?'':'s')+' logged'+
      (sd?' · '+sd+' day streak':' · no streak')+
      (st.word?' · '+esc(st.word)+' pace':' · '+esc(st.note))+'</div>';
  b.appendChild(head);

  var prog=el('div');
  prog.innerHTML = r.next
    ? '<div class="rk-bar"><i style="width:'+Math.max(2,Math.min(100,Math.round(r.span*100)))+'%"></i></div>'+
      '<div class="rk-sub"><b style="color:var(--ink)">'+r.toNext+'</b> to '+esc(r.next.name)+
      ', at '+r.next.at+' points</div>'
    : '<div class="rk-bar"><i style="width:100%"></i></div>'+
      '<div class="rk-sub">Top of the ladder.</div>';
  b.appendChild(prog);

  // ── the week ──────────────────────────────────────────────────────────
  var wk=[], peak=1;
  for(var i=6;i>=0;i--){
    var dd=new Date(DATE+'T12:00:00'); dd.setDate(dd.getDate()-i);
    var e=m[dayKey(dd)];
    var _k=dayKey(dd), _sx=sessionXpOn(_k);
    // A day with session credit but no row is still a day that scored. Without the
    // second clause it renders as "never opened" while its points sit in the total.
    var xp=e?((typeof e.xp==='number'?e.xp:(e.closed||0))+_sx):(_sx||null);
    if(xp!=null && xp>peak) peak=xp;
    wk.push({dd:dd,xp:xp,rest:!!(e&&e.rest)});
  }
  var wkTotal=wk.reduce(function(n,x){return n+(x.xp||0);},0);
  var wkSec=el('details','grp'); wkSec.open=true;
  wkSec.innerHTML='<summary><span class="g-name"><span class="g-dot"></span>Last 7 days</span>'+
    '<span class="g-meta"><span class="g-count mono">'+wkTotal+' pts</span>'+
    '<span class="g-car">▸</span></span></summary>';
  var wkBody=el('div','g-body');
  var bars='<div class="rk-week">';
  wk.forEach(function(x){
    var h=x.xp==null?6:Math.max(6,Math.round((x.xp/peak)*100));
    var cls=x.xp==null?'none':(x.rest?'rest':'');
    bars+='<div><b>'+(x.xp==null?'·':x.xp)+'</b>'+
          '<i class="'+cls+'" style="height:'+h+'%"></i>'+
          '<span>'+x.dd.toLocaleDateString('en-US',{weekday:'narrow'})+'</span></div>';
  });
  bars+='</div><div class="rk-sub">Cyan is a rest day. A faint stub is a day the '+
        'Bridge was never opened.</div>';
  wkBody.innerHTML=bars;
  wkSec.appendChild(wkBody); b.appendChild(wkSec);

  // ── the month ─────────────────────────────────────────────────────────
  var mk=DATE.slice(0,7);
  var md=(ledger.days||[]).filter(function(x){return x&&String(x.d).indexOf(mk)===0;});
  function _rowXp(x){ return (typeof x.xp==='number'?x.xp:(x.closed||0))+sessionXpOn(x.d); }
  var mxp=md.reduce(function(n,x){return n+_rowXp(x);},0);
  var mbest=md.reduce(function(n,x){var v=_rowXp(x);return v>n?v:n;},0);
  var mSec=el('details','grp'); mSec.open=true;
  mSec.innerHTML='<summary><span class="g-name"><span class="g-dot"></span>'+
    esc(new Date(DATE+'T12:00:00').toLocaleDateString('en-US',{month:'long'}))+
    '</span><span class="g-meta"><span class="g-count mono">'+mxp+' pts</span>'+
    '<span class="g-car">▸</span></span></summary>';
  var mBody=el('div','g-body');
  mBody.innerHTML='<div class="stats"><div class="stat"><div class="k">Points</div>'+
    '<div class="v">'+mxp+'</div></div>'+
    '<div class="stat"><div class="k">Days logged</div><div class="v">'+md.length+'</div></div>'+
    '<div class="stat"><div class="k">Best day</div><div class="v">'+mbest+'</div></div></div>';
  mSec.appendChild(mBody); b.appendChild(mSec);

  // ── what sessions closed ──────────────────────────────────────────────
  /* Deliberately HERE and not on the punch card. The punch card's entire job is what
     is still open; a list of finished items inside it is the card contradicting itself,
     which is exactly what made 2026-08-04 confusing — sixteen done things sitting in a
     list of things to do. Finished work belongs in the record, next to the points it
     earned. Read-only on purpose: session credit is automatic, so a checkbox here would
     be a second scoring path for one piece of work, and two paths drift. */
  var ckeys=Object.keys(CLOSED).sort().reverse().filter(function(k){
    return (CLOSED[k].items||[]).length; });
  if(ckeys.length){
    var cTotal=0;
    ckeys.forEach(function(k){ cTotal+=(CLOSED[k].items||[]).length; });
    var cSec=el('details','grp'); cSec.open=false;
    cSec.innerHTML='<summary><span class="g-name"><span class="g-dot"></span>Closed for you</span>'+
      '<span class="g-meta"><span class="g-count mono">'+cTotal+'</span>'+
      '<span class="g-car">▸</span></span></summary>';
    var cb2=el('div','g-body'), crows='';
    ckeys.forEach(function(k){
      var doc=CLOSED[k], net=(typeof doc.net==='number')?doc.net:
        ((doc.open_before||0)-(doc.open_after||0));
      crows+='<div class="rk-sub" style="margin:9px 0 4px;color:var(--ink)"><b>'+esc(k)+'</b> · '+
        (doc.items||[]).length+' closed · backlog '+(net>0?'down '+net:net===0?'flat':'up '+(-net))+
        ' · '+sessionXpOn(k)+' pt'+(sessionXpOn(k)===1?'':'s')+'</div>';
      (doc.items||[]).forEach(function(it){
        crows+='<div class="row" style="padding-left:2px"><span class="r-txt">'+
          '<span class="pill done">done</span>'+esc(it.text)+'</span></div>';
      });
    });
    cb2.innerHTML=crows; cSec.appendChild(cb2); b.appendChild(cSec);
  }

  // ── the whole ladder ──────────────────────────────────────────────────
  var lad=el('details','grp'); lad.open=false;
  lad.innerHTML='<summary><span class="g-name"><span class="g-dot"></span>The ladder</span>'+
    '<span class="g-meta"><span class="g-count mono">'+(r.i+1)+' of '+RANKS.length+'</span>'+
    '<span class="g-car">▸</span></span></summary>';
  var lb=el('div','g-body'), rows='';
  RANKS.forEach(function(x,i){
    var cls=i<r.i?'done':i===r.i?'now':'';
    rows+='<div class="rk-rung '+cls+'"><span class="pip"></span>'+
      '<span class="n">'+esc(x.name)+'</span>'+
      '<span class="x mono">'+(x.at===0?'start':x.at)+'</span></div>';
  });
  lb.innerHTML=rows; lad.appendChild(lb); b.appendChild(lad);
};

/* ── the work queue, reviewable ─────────────────────────────────────────────
   The queue was write-only from the phone: Sam could put things into it and see
   a count, but had no way to see WHAT was in it, which makes "3 queued" a number
   he has to trust rather than read. */
/* ══ THE HOUSE LIST ════════════════════════════════════════════════════════
   Amy's to-dos for Sam, and the first thing on the Bridge that another person writes.

   ONE doc, home_list/items, holding an array. Not a doc per item: this is a short list
   edited by two people who live together, so the read is one round trip and the whole
   list renders instantly. The trade-off is real and worth naming — two simultaneous
   edits are last-write-wins — but items carry stable ids, so the losing edit is
   recoverable by eye rather than silently merged wrong.

   It is NOT in bridge/, which the 4am feeder rewrites wholesale every morning and would
   erase her list daily. It is NOT in bridge_state/, which is Sam-only in both directions
   by design and is the one collection no other writer may touch.

   The seen-markers live on Sam's side in bridge_state, not here. Whether he has read an
   item is his business, it should not be in a document she can see, and keeping it out
   means her doc stays a clean shared list rather than a read-receipt log. */
var HOME={items:[]}, HOME_ERR=null;

function homeDoc(){ return db.collection('home_list').doc('items'); }
function homeId(){
  // Date.now is fine here: this is an id, not a scheduling decision, and a collision
  // needs two items created in the same millisecond by the same person.
  return 'h'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
}
function saveHome(){
  return homeDoc().set({items:HOME.items,
    updated_at:new Date().toISOString(),
    updated_by:(user&&user.email)||''},{merge:true});
}
function homeAdd(text){
  text=String(text||'').trim();
  if(!text) return Promise.resolve();
  HOME.items.push({id:homeId(),text:text,by:(user&&user.email)||'',
                   added_at:new Date().toISOString(),done:false});
  return saveHome();
}
function homeOpen(){ return (HOME.items||[]).filter(function(i){return i&&!i.done;}); }
/* Items Amy added that Sam has not opened the card on yet. `by` is compared against
   BRIDGE_ALLOWED rather than against her address, for the same reason her address is not
   in the client at all: the page can tell "not Sam" without ever being told who is. */
function homeFresh(){
  var seen=state.homeSeen||[];
  return (HOME.items||[]).filter(function(i){
    return i && !i.done && seen.indexOf(i.id)<0 &&
           window.BRIDGE_ALLOWED.indexOf(String(i.by||'').toLowerCase())<0;
  });
}

/* ── Amy's view ────────────────────────────────────────────────────────────
   Reached by loadHomeOnly(), which is the ONLY thing a non-Sam household account runs.
   It requests home_list and nothing else, so his brief is never even asked for. */
function loadHomeOnly(){
  $('#app').classList.add('hide');
  $('#amy').classList.remove('hide');
  $('#amySub').textContent='Signed in as '+((user&&user.email)||'');
  return homeDoc().get().then(function(s){
    HOME={items:(s.exists?(s.data().items||[]):[])};
    HOME_ERR=null; paintAmy();
  }).catch(function(e){
    var code=(e&&e.code)||'';
    HOME_ERR=code||String(e);
    /* permission-denied and "the network fell over" are different facts and must not
       look the same, which is the property this whole file is built around. One means
       this account is not on the household list; the other means try again. */
    $('#amyBody').innerHTML='';
    $('#amyErr').textContent = code==='permission-denied'
      ? 'This account does not have access to the house list. Ask Sam to add '+
        ((user&&user.email)||'this address')+'.'
      : 'Could not load the list ('+HOME_ERR+'). This is a connection problem, not a '+
        'permissions one. Pull down to retry.';
  });
}

function paintAmy(){
  var host=$('#amyBody'); if(!host) return;
  $('#amyErr').textContent='';
  host.innerHTML='';
  var open=HOME.items.filter(function(i){return i&&!i.done;});
  var done=HOME.items.filter(function(i){return i&&i.done;});

  function row(it){
    var r=el('div','amy-row'+(it.done?' done':''));
    r.appendChild(el('span','amy-tick'));
    var t=el('div','t',esc(it.text));
    if(it.done) t.appendChild(el('div','who','crossed off'));
    r.appendChild(t);
    // Only the person who added an item can remove it. Sam crosses things OFF; taking
    // an item off the list entirely is the author's call, not the doer's.
    if(!it.done && String(it.by||'').toLowerCase()===String((user&&user.email)||'').toLowerCase()){
      var x=el('button','amy-x','×');
      x.setAttribute('aria-label','Remove');
      x.addEventListener('click',function(){
        HOME.items=HOME.items.filter(function(y){return y.id!==it.id;});
        paintAmy(); saveHome().catch(function(e){
          $('#amyErr').textContent='Could not save that ('+((e&&e.code)||e)+').'; });
      });
      r.appendChild(x);
    }
    return r;
  }

  if(!open.length && !done.length){
    host.appendChild(el('div','amy-note','Nothing on the list yet. Add the first thing above.'));
    return;
  }
  if(open.length){
    host.appendChild(el('div','amy-sec','To do · '+open.length));
    open.forEach(function(i){ host.appendChild(row(i)); });
  }
  if(done.length){
    host.appendChild(el('div','amy-sec','Done · '+done.length));
    done.forEach(function(i){ host.appendChild(row(i)); });
  }
  host.appendChild(el('div','amy-note',
    'Sam sees this on his morning dashboard and crosses things off there.'));
}

(function(){
  var inp=$('#amyIn'), btn=$('#amyAdd');
  if(!inp||!btn) return;
  function add(){
    var v=inp.value;
    if(!String(v||'').trim()) return;
    inp.value='';
    homeAdd(v).then(paintAmy).catch(function(e){
      $('#amyErr').textContent='Could not save that ('+((e&&e.code)||e)+'). '+
        'It is not on the list; try again.';
    });
    paintAmy();
  }
  btn.addEventListener('click',add);
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') add(); });
})();

/* ── Sam's side: the Home card ─────────────────────────────────────────────
   Synthetic like QCARD and RCARD: not in CARDS, so cardMissing() can never call it a
   card the 4am run failed to write — the feeder is not allowed anywhere near it. */
var HCARD={k:'_home',label:'House list',glyph:'⌂',ac:'var(--lime)'};
BUILD._home=function(b){
  if(HOME_ERR){
    b.appendChild(el('div','empty','Could not reach the house list ('+esc(HOME_ERR)+
      '). This is a read failure, not an empty list.'));
    return;
  }
  var open=homeOpen(), done=(HOME.items||[]).filter(function(i){return i&&i.done;});
  // Opening the card is what marks Amy's items as seen. That is the whole contract of
  // the badge: it counts what he has not looked at, so looking at it must clear it.
  var seen=state.homeSeen||[];
  var newly=homeFresh().map(function(i){return i.id;});
  if(newly.length){
    state.homeSeen=seen.concat(newly);
    saveState();
    /* Repaint the pill in the same breath. Persisting the seen-ids without this left
       the badge reading "6 new" on a card he was looking at, which is the badge lying
       about the one thing it exists to say. */
    paintHomePill();
  }
  if(!open.length && !done.length){
    b.appendChild(el('div','empty','Nothing on the house list.'));
    return;
  }
  function mkRow(it){
    var row=el('label','row');
    var ck=el('input');ck.type='checkbox';ck.className='ck';
    ck.checked=!!it.done;
    ck.addEventListener('change',function(){
      it.done=ck.checked;
      it.done_at=ck.checked?new Date().toISOString():null;
      if(ck.checked) hit(row);
      saveHome().catch(function(){});
      paintHomePill();
    });
    row.appendChild(ck);
    var t=el('span','r-txt',esc(it.text));
    row.appendChild(t);
    return row;
  }
  if(open.length){
    var g1=el('div','grp');g1.style.setProperty('--ac','var(--lime)');
    g1.appendChild(el('div','g-name','Open · '+open.length));
    var gb=el('div','g-body');
    open.forEach(function(i){ gb.appendChild(mkRow(i)); });
    g1.appendChild(gb); b.appendChild(g1);
  }
  if(done.length){
    var g2=el('div','grp');
    g2.appendChild(el('div','g-name','Crossed off · '+done.length));
    var gb2=el('div','g-body');
    done.forEach(function(i){ gb2.appendChild(mkRow(i)); });
    g2.appendChild(gb2); b.appendChild(g2);
  }
  b.appendChild(el('p','note','Amy adds to this list from her own sign-in. '+
    'Crossing something off here is what she sees.'));
};

function paintHomePill(){
  var pill=$('#hpill'), txt=$('#htxt');
  if(!pill||!txt) return;
  var open=homeOpen(), fresh=homeFresh();
  // Hidden entirely when there is nothing, rather than showing a zero. A row that always
  // reads "0 from Amy" is furniture, and furniture stops being read.
  if(!open.length && !fresh.length && !HOME_ERR){ pill.classList.add('hide'); return; }
  pill.classList.remove('hide');
  pill.classList.toggle('fresh',fresh.length>0);
  txt.innerHTML = HOME_ERR ? 'House list unavailable'
    : (fresh.length ? '<b>'+fresh.length+'</b> new on the house list'
                    : '<b>'+open.length+'</b> on the house list');
}
$('#hpill').addEventListener('click',function(){ openDetail(HCARD,$('#hpill')); });

var QCARD={k:'_queue',label:'Work queue',glyph:'⇄',ac:'var(--amber)'};
BUILD._queue=function(b){
  var open=queue.filter(function(i){return i.status==='queued';});
  var done=queue.filter(function(i){return i.status==='done';});
  var waiting=queue.filter(function(i){return i.status==='needs_sam';});

  // State of the world first, honestly, because the number on the pill means
  // something different depending on whether anything is draining it.
  var note=el('div','rc-fails');
  note.innerHTML='<h4>'+(done.length?'How this drains':'Nothing is draining this yet')+'</h4>'+
    (waiting.length ? '<div><b>Waiting on you</b> means the runner looked at it and stopped at a '+
      'decision only you can make. Those are off the drain loop on purpose, so they are not '+
      're-attempted every hour. Read the note, then either handle it in a session or send it '+
      'back to the runner.</div>' : '')+
    '<div>The 4am captain\'s log drains this once a day: captured thoughts get filed into '+
    'cross-project-todos.md and cross-offs get flipped, so the punch list you read in the '+
    'morning is already current. There is no hourly runner and that is deliberate.</div>'+
    '<div>Anything that needs you at a keyboard belongs in a desktop session, not here. '+
    'This phone is for reading the day, ticking things off, and catching a thought before '+
    'it evaporates.</div>';
  b.appendChild(note);

  if(!queue.length){ b.appendChild(el('div','empty','Queue is empty.')); return; }

  function ago(iso){
    if(!iso) return '';
    var m=Math.round((Date.now()-new Date(iso).getTime())/60000);
    if(m<60) return m+'m ago';
    if(m<1440) return Math.round(m/60)+'h ago';
    return Math.round(m/1440)+'d ago';
  }
  var KIND={capture:'Captured thought',task:'Task',reply:'Draft a reply',reconcile:'Cross-offs'};

  [['Waiting on you',waiting],['Queued',open],['Done',done]].forEach(function(grp){
    if(!grp[1].length) return;
    b.appendChild(el('div','news-h mono',grp[0]+' · '+grp[1].length));
    grp[1].slice().reverse().forEach(function(i){
      var card=el('div','mail');
      card.style.setProperty('--ac',
        i.status==='done' ? 'var(--mint)'
        : i.status==='needs_sam' ? 'var(--mag)'
        : 'var(--amber)');
      var head = i.kind==='reply' ? 'Reply to '+esc(i.sender||'') : esc(KIND[i.kind]||i.kind);
      card.innerHTML='<div class="m-body"><div class="m-cat mono">'+esc(KIND[i.kind]||i.kind)+
        ' · '+esc(ago(i.created_at))+(i.for_date&&i.for_date!==DATE?' · for '+esc(i.for_date):'')+'</div>'+
        '<div class="m-from">'+head+'</div>'+
        '<div class="m-sum">'+esc(i.subject||i.text||'')+'</div>'+
        (i.note?'<div class="m-sum" style="color:var(--mint)">'+esc(i.note)+'</div>':'')+'</div>';
      if(i.status==='needs_sam'){
        // Overrule the triage. The runner decided this needs Sam; sometimes it is wrong,
        // or the blocker has cleared, and he should not need a laptop to say so.
        var back=el('button','nbtn','Send to the runner anyway');
        back.style.marginTop='8px';
        back.addEventListener('click',function(e){
          e.stopPropagation(); back.disabled=true; back.textContent='…';
          queueSetStatus([i.id],'queued','Re-queued from the phone; triage overruled.',function(err){
            if(err){ back.disabled=false; back.textContent='Could not re-queue ('+((err&&err.code)||'error')+')'; return; }
            openDetail(QCARD,$('#qpill'));
          });
        });
        card.appendChild(back);
      }
      if(i.status==='done'){
        var x=el('button','mini','✕');
        x.title='Acknowledge and remove from the queue';
        x.addEventListener('click',function(e){
          e.stopPropagation(); x.disabled=true; x.textContent='…';
          queueDismiss([i.id],function(err){
            if(err){ x.disabled=false; x.textContent='✕'; x.title='Could not clear: '+((err&&err.code)||err); return; }
            openDetail(QCARD,$('#qpill'));
          });
        });
        var acts=el('div','acts'); acts.appendChild(x); card.appendChild(acts);
      }
      b.appendChild(card);
    });
  });

  if(done.length){
    var ackAll=el('button','nbtn','Acknowledge and clear '+done.length+' done');
    ackAll.style.margin='4px 0 10px';
    ackAll.addEventListener('click',function(){
      ackAll.disabled=true; ackAll.textContent='Clearing…';
      queueDismiss(done.map(function(i){return i.id;}),function(err){
        if(err){ ackAll.disabled=false;
          ackAll.textContent='Could not clear ('+((err&&err.code)||'error')+')'; return; }
        openDetail(QCARD,$('#qpill'));
      });
    });
    b.appendChild(ackAll);
  }

  // The dispatch text, so a queued item can still be driven by hand from the phone.
  var copy=el('button','nbtn','Copy the queued items as a prompt');
  copy.style.margin='6px 0 0';
  copy.addEventListener('click',function(){
    if(!open.length){openModal('Nothing queued.');return;}
    openModal('Drain the Bridge work queue. '+open.length+' item'+(open.length===1?'':'s')+
      ' waiting:\n\n'+open.map(function(i){
        return '- ['+(i.kind||'task')+'] '+(i.kind==='reply'
          ? 'reply to '+i.sender+' re: "'+i.subject+'" — '+(i.body||i.text||'')
          : (i.text||''))+(i.body&&i.kind!=='reply'?'\n'+i.body:'');
      }).join('\n\n')+
      '\n\nFollow Codename: Riker/bridge/QUEUE-RUNNER.md. Mark each item done in '+
      'bridge_state/_queue when it is actually done, and leave anything that failed queued '+
      'with a note.');
    $('#mHead').textContent='Copied · paste into a Starfleet session';
  });
  b.appendChild(copy);
};

/* ── weather sheet ─────────────────────────────────────── */
BUILD.weather=function(b){
  if(WX.state!=='ok'){
    b.appendChild(el('div','empty', WX.state==='load'
      ? 'Fetching the forecast.'
      : 'Could not reach Open-Meteo. This is a network failure on this device, '+
        'not a quiet weather day.<br><br>'+esc(WX.err||'unknown error')));
    var again=el('button','nbtn','Try again');
    again.style.margin='0 auto';again.style.display='block';
    again.addEventListener('click',function(){
      loadWeather().then(function(){openDetail(cardByKey('weather'));});
    });
    b.appendChild(again);
    return;
  }
  var c=WX.data.current, hr=WX.data.hourly||{}, dl=WX.data.daily||{};

  var s=el('div','stats two');
  [['Now',Math.round(c.temperature_2m)+'°'],
   ['Feels like',Math.round(c.apparent_temperature)+'°'],
   ['Humidity',Math.round(c.relative_humidity_2m)+'%'],
   ['Wind',Math.round(c.wind_speed_10m)+' mph']].forEach(function(x){
    s.appendChild(el('div','stat','<div class="k mono">'+x[0]+'</div><div class="v">'+x[1]+'</div>'));
  });
  b.appendChild(s);

  // Next twelve hours, starting from the current hour rather than from midnight.
  var times=hr.time||[], now=laNow(), from=0;
  for(var i=0;i<times.length;i++){ if(new Date(times[i])>=now){from=Math.max(0,i-1);break;} }
  if(times.length){
    b.appendChild(el('div','news-h mono','Next twelve hours'));
    var strip=el('div','wx-hrs');
    for(var j=from;j<Math.min(from+12,times.length);j++){
      var t=new Date(times[j]), h=t.getHours(), h12=(h%12)||12;
      var p=(hr.precipitation_probability||[])[j];
      strip.appendChild(el('div','wx-hr',
        '<div class="h mono">'+h12+(h<12?'a':'p')+'</div>'+
        '<div class="i">'+wxIcon((hr.weather_code||[])[j],(hr.is_day||[])[j])+'</div>'+
        '<div class="t">'+Math.round((hr.temperature_2m||[])[j])+'°</div>'+
        '<div class="p">'+(p>=15?p+'%':'')+'</div>'));
    }
    b.appendChild(strip);
  }

  if((dl.time||[]).length){
    b.appendChild(el('div','news-h mono','Seven days'));
    var box=el('div','grp'), gb=el('div','g-body');
    gb.style.borderTop='none';gb.style.paddingTop='4px';
    dl.time.forEach(function(day,i){
      var d0=new Date(day+'T12:00:00');
      var name=(i===0)?'Today':d0.toLocaleDateString('en-US',{weekday:'short'});
      var pp=(dl.precipitation_probability_max||[])[i];
      gb.appendChild(el('div','wx-day',
        '<span class="d mono">'+esc(name)+'</span>'+
        '<span class="i">'+wxIcon((dl.weather_code||[])[i])+'</span>'+
        '<span class="c">'+esc(wxLabel((dl.weather_code||[])[i]))+'</span>'+
        '<span class="p">'+(pp>=15?pp+'%':'')+'</span>'+
        '<span class="r">'+Math.round((dl.temperature_2m_max||[])[i])+'°'+
          ' <s>'+Math.round((dl.temperature_2m_min||[])[i])+'°</s></span>'));
    });
    box.appendChild(gb);b.appendChild(box);
  }
  b.appendChild(el('p','note','Open-Meteo, downtown Seattle, fetched when you opened this page. '+
    'Not part of the 4am brief, so it is current rather than six hours old.'));
};

/* ── queues ────────────────────────────────────────────── */
function toggleMark(entry,btn){
  var i=-1;
  for(var j=0;j<state.marked.length;j++){if(state.marked[j].id===entry.id){i=j;break;}}
  if(i>=0){state.marked.splice(i,1);btn.classList.remove('on');btn.textContent='+';}
  else{state.marked.push(entry);btn.classList.add('on');btn.textContent='✓';}
  saveState();
}
function unsyncedDone(){
  return state.done.filter(function(id){ return state.synced.indexOf(id)<0; });
}
function dock(){
  // Only offer to sync what has not already been sent. Counting all of `done`
  // meant the button never went away after a successful dispatch.
  var sN=unsyncedDone().length,eN=state.marked.length;
  var sb=$('#syncBtn'),xb=$('#sessBtn');
  sb.classList.toggle('on',sN>0);$('#syncN').textContent=sN;
  if(xb){xb.classList.toggle('on',eN>0);$('#sessN').textContent=eN;}
}

function copyText(text){
  return new Promise(function(res,rej){
    function fb(){
      var ta=document.createElement('textarea');ta.value=text;
      ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';ta.style.opacity='0';
      ta.setAttribute('readonly','');document.body.appendChild(ta);
      var sel=document.getSelection(),prev=sel.rangeCount?sel.getRangeAt(0):null;
      ta.focus();ta.select();ta.setSelectionRange(0,text.length);
      var ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
      document.body.removeChild(ta);
      if(prev){sel.removeAllRanges();sel.addRange(prev);}
      ok?res():rej(new Error('copy failed'));
    }
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(res).catch(fb);
    else fb();
  });
}
function openModal(text){
  $('#modalText').textContent=text;$('#modal').classList.add('on');
  document.body.style.overflow='hidden';
  copyText(text).then(flash).catch(function(){$('#mHead').textContent='Tap copy below';});
}
function flash(){var h=$('#mHead');h.classList.add('ok');h.textContent='✓ COPIED — PASTE INTO CHAT';
  setTimeout(function(){h.classList.remove('ok');h.textContent='Copied · paste into chat';},1800);}
function closeModal(){$('#modal').classList.remove('on');document.body.style.overflow='';}
$('#mCopy').addEventListener('click',function(){copyText($('#modalText').textContent).then(flash).catch(function(){});});
$('#mClose').addEventListener('click',closeModal);
$('#modal').addEventListener('click',function(e){if(e.target===$('#modal'))closeModal();});

$('#syncBtn').addEventListener('click',function(){
  var byId={};allPunchItems().forEach(function(i){byId[i.id]=i;});
  var groupOf={};
  if(DATA&&DATA.punch)(DATA.punch.groups||[]).forEach(function(gr){
    (gr.items||[]).forEach(function(i){groupOf[i.id]=gr.project;});});
  var lines=[], sending=[];
  unsyncedDone().forEach(function(id){
    if(id.indexOf('routine-')===0)return;
    var it=byId[id];
    sending.push(id);
    lines.push('- '+(groupOf[id]?'['+groupOf[id]+'] ':'')+(it?it.text:id));
  });
  if(!lines.length){
    openModal(unsyncedDone().length
      ? 'Only routine steps are left unsynced. Nothing to reconcile in cross-project-todos.md.'
      : 'Everything ticked today has already been sent for reconciliation.');
    $('#mHead').textContent='Nothing to sync';
    return;
  }
  var body='[BRIDGE-DONE '+DATE+']\n'+
    'Mark these complete in Starfleet/cross-project-todos.md (flip "[ ]" to "[x]" and append " (done '+DATE+')"):\n\n'+
    lines.join('\n')+
    '\n\nFor each item, find the matching active line (begins "- [ ] [ProjectTag] " and contains the text), '+
    'flip the box, and append the done date. Surgical edit only. Do not rebuild the brief.\n'+
    'Ack with the count marked done, and name anything you could not find a match for.';

  // One reconcile item, not one per todo. The runner needs the whole set in one pass so it
  // can report what it could not match, and so a partial run does not leave half the ticks
  // reconciled and half not.
  queueAdd([{kind:'reconcile',text:lines.length+' item'+(lines.length===1?'':'s')+' crossed off on the Bridge',body:body}],
  function(err){
    if(err){
      openModal('COULD NOT REACH THE QUEUE ('+((err&&err.code)||'unknown')+
        ').\nThe text below is copied instead — paste it into a chat.\n\n'+body);
      $('#mHead').textContent='Queue unreachable · copied instead';
      return;
    }
    // Record the dispatch. Without this the same ticks are offered again forever.
    sending.forEach(function(id){ if(state.synced.indexOf(id)<0) state.synced.push(id); });
    saveState();
    refreshCounts();
    openModal('Queued '+lines.length+' cross-off'+(lines.length===1?'':'s')+' for reconciliation.\n\n'+
      lines.join('\n')+
      '\n\nThis is queued, not done. A Starfleet session will flip these in cross-project-todos.md '+
      'and report anything it could not match. Your ticks stay ticked here either way.');
    $('#mHead').textContent='Dispatched';
  });
});

function engagePrompt(marked){
  var todos=marked.filter(function(m){return (m.kind||'todo')==='todo';});
  var reps=marked.filter(function(m){return m.kind==='reply';});
  var secs=[];
  if(todos.length)secs.push('Tasks:\n'+todos.map(function(m){
    return '- '+(m.project?'['+m.project+'] ':'')+m.text;}).join('\n'));
  if(reps.length)secs.push('Drafts to write:\n'+reps.map(function(m){
    return '- To '+m.sender+' re: "'+m.subject+'" — '+(m.body||'no preview');}).join('\n'));
  if(!secs.length)return '';
  return "Engage. Here's what I'm working on today:\n\n"+secs.join('\n\n')+
    "\n\nLet's determine which are highest priority and pull up necessary context. For tasks, open the "+
    "relevant project handoffs and any directly-relevant files. For drafts, generate the reply in Sam's voice "+
    "(warm but efficient, no em dashes, no bullet lists in prose), run through the voice-checker chain, and "+
    "show me the draft before saving as a Gmail draft. Tell me what to tackle first and the state of each item.";
}

/* SESSION — the default verb for anything off the punch list.
   These never enter the drain loop. An unattended runner cannot ratify an approach, sit a
   design interview, or decide whether to delete a branch, and every hour it spends
   rediscovering that costs tokens and reads to Sam as the thing being stuck. */
$('#sessBtn').addEventListener('click',function(){
  var marked=state.marked.slice();
  if(!marked.length)return;
  var items=marked.map(function(m){
    return {kind:(m.kind==='reply'?'reply':'task'), text:m.text||'', project:m.project||'',
            sender:m.sender||'', subject:m.subject||'', body:m.body||'',
            status:'needs_sam', note:'Flagged for a working session from the phone.'};
  });
  queueAdd(items,function(err,stamped){
    if(err){
      openModal('COULD NOT REACH THE QUEUE ('+((err&&err.code)||'unknown')+
        ').\nThe text below is copied instead — paste it into a chat.\n\n'+engagePrompt(marked));
      $('#mHead').textContent='Queue unreachable · copied instead';
      return;
    }
    openModal('Flagged '+stamped.length+' item'+(stamped.length===1?'':'s')+' for a session.\n\n'+
      stamped.map(function(i){return '- '+(i.kind==='reply'?'reply to '+i.sender:i.text);}).join('\n')+
      '\n\nThese will NOT be attempted by the hourly runner. They are waiting on you, and '+
      'they are on the agenda next time you open a Starfleet session. The text is on your '+
      'clipboard if you want to start that now.');
    $('#mHead').textContent='On the agenda';
    state.marked=[];
    document.querySelectorAll('.mini.on').forEach(function(b){b.classList.remove('on');b.textContent='+';});
    saveState();
  });
});

/* ── capture ───────────────────────────────────────────────────────────── */
function capture(){
  var inp=$('#capIn'),btn=$('#capBtn');
  var t=(inp.value||'').trim();
  if(!t)return;
  btn.disabled=true;
  queueAdd([{kind:'capture',text:t}],function(err){
    btn.disabled=false;
    if(err){ btn.textContent='Failed'; setTimeout(function(){btn.textContent='Add';},2200); return; }
    inp.value='';
    btn.textContent='✓ Added';btn.classList.add('cap-ok');
    setTimeout(function(){btn.textContent='Add';btn.classList.remove('cap-ok');},1600);
  });
}
$('#qpill').addEventListener('click',function(){ openDetail(QCARD,$('#qpill')); });
$('#capBtn').addEventListener('click',capture);
$('#capIn').addEventListener('keydown',function(e){if(e.key==='Enter')capture();});

})();
</script>
