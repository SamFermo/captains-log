/* ── weather ───────────────────────────────────────────────────────────────
   Open-Meteo. No API key, no account, CORS-open, so this is a plain fetch from
   the page and NOT a payload key — which also means it is live at the moment Sam
   looks at it rather than whatever the 4am run saw.
   The coordinates are downtown Seattle, deliberately NOT the house. This file is
   in a public repo; a neighbourhood-precise coordinate is a personal detail, and
   the forecast is identical either way.
   A failed fetch says so. It never shows a blank card or a stale temperature that
   looks current. */
var WX={state:'load',data:null,err:null};
var WX_LAT=47.6062, WX_LON=-122.3321;
// is_day is requested on BOTH current and hourly. Without it a clear night rendered
// a full sun at 1am, every hour, all the way through the strip: the temperature was
// right and the glyph was quietly lying about what was out the window.
var WX_URL='https://api.open-meteo.com/v1/forecast?latitude='+WX_LAT+'&longitude='+WX_LON+
  '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day'+
  '&hourly=temperature_2m,weather_code,precipitation_probability,is_day'+
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'+
  '&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch'+
  '&timezone=America%2FLos_Angeles&forecast_days=7';

/* ── AIR QUALITY ───────────────────────────────────────────────────────────────
   Added 2026-08-06. Sam: "it doesn't have any alerts about AQI which is very
   prevalent right now in Seattle." Same free service, no key, same coordinates,
   a DIFFERENT endpoint — air quality is not a field on the forecast call.

   A SEPARATE STATE AND A SEPARATE FETCH, on purpose. Two properties fall out of
   that and both are the point:

   1. An air-quality outage cannot take the forecast down with it. Chained onto the
      weather promise, one 500 from the AQ endpoint would blank the temperature, the
      twelve-hour strip and the week — the card Sam actually opens every morning —
      for a reading that is absent most days anyway.
   2. A missing reading can never render as good air. AQ.state stays 'fail' and the
      card says the reading is unavailable. Defaulting a missing AQI to 0 would draw
      a clean green band over a smoke day, which is the worst possible failure for
      the one number here that is about his kids' lungs.

   Shown only when it matters. Below 50 is the EPA "good" band and would be a line of
   noise on every clear day, so nothing renders. 50 to 100 is "moderate" and appears
   as information. Above 100 is unhealthy for sensitive groups, which in this house
   means a four-year-old and a one-year-old, and it reads as an alert.

   The band is named in words as well as the number, because "112" means nothing at
   6am half awake and "unhealthy for sensitive groups" means exactly one thing. */
var AQ={state:'load',aqi:null,at:null,err:null};
var AQ_URL='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+WX_LAT+
  '&longitude='+WX_LON+'&hourly=us_aqi&timezone=America%2FLos_Angeles&forecast_days=2';

// The EPA bands, and the threshold at which each is worth a word. `show` is false for
// good air: the card renders nothing at all below 50 rather than a reassuring green
// row, because a row that is always there stops being read by the time it matters.
var AQ_BANDS=[
  {at:301,label:'hazardous',                        cls:'bad',  show:true},
  {at:201,label:'very unhealthy',                   cls:'bad',  show:true},
  {at:151,label:'unhealthy',                        cls:'bad',  show:true},
  {at:101,label:'unhealthy for sensitive groups',   cls:'bad',  show:true},
  {at:51, label:'moderate',                         cls:'warn', show:true},
  {at:0,  label:'good',                             cls:'ok',   show:false}
];
function aqBand(n){
  for(var i=0;i<AQ_BANDS.length;i++) if(n>=AQ_BANDS[i].at) return AQ_BANDS[i];
  return AQ_BANDS[AQ_BANDS.length-1];
}

function loadAir(){
  if(!window.fetch){ AQ={state:'fail',aqi:null,err:'this browser has no fetch'};
                     return Promise.resolve(); }
  AQ.state='load';
  return fetch(AQ_URL,{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    var h=(j&&j.hourly)||{}, t=h.time||[], v=h.us_aqi||[];
    if(!t.length) throw new Error('response carried no hourly air quality');
    /* The reading for the CURRENT hour, walking back to the last non-null. The series
       runs two days ahead and the tail is forecast, so taking the last element would
       report tomorrow evening as now. A run of trailing nulls at the current hour is
       normal early in the day and is not a failure. */
    var now=laNow(), idx=-1;
    for(var i=0;i<t.length;i++){ if(new Date(t[i])<=now) idx=i; else break; }
    while(idx>=0 && (v[idx]==null || !isFinite(+v[idx]))) idx--;
    if(idx<0) throw new Error('no air-quality reading for any hour up to now');
    AQ={state:'ok',aqi:Math.round(+v[idx]),at:t[idx],err:null};
  }).catch(function(e){
    // Explicitly NOT a zero. See the header: a missing reading must never draw clean air.
    AQ={state:'fail',aqi:null,at:null,err:(e&&e.message)||String(e)};
  }).then(function(){
    paintTiles();
    if(OPEN_K==='weather' && $('#detail').classList.contains('on')) paintDetail(cardByKey('weather'));
  });
}

/* Inline SVG rather than ☀ / ☁ / ⛈. iOS renders those code points as full-colour
   emoji, which would drop four saturated cartoons into a duotone page and be the
   only thing on screen not obeying the palette. These inherit currentColor. */
var WXI={
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>',
  part:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3.2"/><path d="M8.5 1.8v1.6M2.3 8h1.6M4.1 3.6l1.1 1.1M12.8 3.6l-1.1 1.1"/><path d="M17 20.5H8.6A3.6 3.6 0 018.3 13.3 5 5 0 0117.7 14a3.3 3.3 0 01-.7 6.5z"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H7.4A4.4 4.4 0 017 10.2 6 6 0 0118.4 11.6a3.7 3.7 0 01-.9 7.4z"/></svg>',
  rain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.3 15.5H7.4A4.2 4.2 0 017 7.1 5.8 5.8 0 0118.1 8.4a3.6 3.6 0 01-.8 7.1z"/><path d="M8.6 18.4l-.9 2.4M12.4 18.4l-.9 2.4M16.2 18.4l-.9 2.4"/></svg>',
  snow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>',
  storm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.3 14.6H7.4A4.2 4.2 0 017 6.2 5.8 5.8 0 0118.1 7.5a3.6 3.6 0 01-.8 7.1z"/><path d="M12.8 16.6l-2.6 3.6h3.3l-1.6 2.6"/></svg>',
  fog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h18M5 12h14M3 16h18M7 20h10"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 019.4 3.5a8.6 8.6 0 1011.1 11.1z"/></svg>',
  partm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 9.1A5.4 5.4 0 016.3 2.2a5.4 5.4 0 106.9 6.9z"/><path d="M17 20.5H8.6A3.6 3.6 0 018.3 13.3 5 5 0 0117.7 14a3.3 3.3 0 01-.7 6.5z"/></svg>'
};
/* Only the CLEAR and PARTLY-CLOUDY codes have a night form. Overcast, rain, snow,
   fog and storms look the same after dark, and inventing a distinct night glyph
   for each would be five more shapes carrying no extra information. */
function wxCode(c,day){
  var night=(day===0||day===false);
  if(c===0) return [night?'moon':'sun','Clear'];
  if(c===1) return [night?'moon':'sun','Mostly clear'];
  if(c===2) return [night?'partm':'part','Partly cloudy'];
  if(c===3) return ['cloud','Overcast'];
  if(c===45||c===48) return ['fog','Fog'];
  if(c>=51&&c<=57) return ['rain','Drizzle'];
  if(c>=61&&c<=65) return ['rain','Rain'];
  if(c===66||c===67) return ['rain','Freezing rain'];
  if(c>=71&&c<=77) return ['snow','Snow'];
  if(c>=80&&c<=82) return ['rain','Showers'];
  if(c===85||c===86) return ['snow','Snow showers'];
  if(c>=95) return ['storm','Thunderstorms'];
  return ['cloud','—'];
}
// day defaults to 1: the seven-day rows describe a whole day, so they always take
// the daytime glyph.
function wxIcon(c,day){ return WXI[wxCode(c,day===undefined?1:day)[0]]; }
function wxLabel(c){ return wxCode(c,1)[1]; }
function loadWeather(){
  if(!window.fetch){ WX={state:'fail',err:'this browser has no fetch'}; return Promise.resolve(); }
  WX.state='load';
  return fetch(WX_URL,{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    if(!j||!j.current) throw new Error('response had no current conditions');
    WX={state:'ok',data:j,err:null};
  }).catch(function(e){
    WX={state:'fail',data:null,err:(e&&e.message)||String(e)};
  }).then(function(){
    paintTiles();
    // Weather is fetched by the page, not the feeder, so it can land after the
    // sheet is already open on it. Repaint the open card in place when it does.
    if(OPEN_K==='weather' && $('#detail').classList.contains('on')) paintDetail(cardByKey('weather'));
  });
}

/* The bar only appears when the content on screen is not today's. After 05:30 it
   escalates from amber to red, because a missing brief at 1am is the normal shape
   of the night and a missing brief at 6am means the run did not happen. */
function renderStaleBar(){
  var bar=$('#stalebar');
  if(!bar) return;
  if(!STALE || !DATA){ bar.classList.add('hide'); return; }
  var n=laNow(), late=(n.getHours()*60+n.getMinutes())>=330;
  bar.classList.remove('hide');
  bar.classList.toggle('late',late);
  var day=STALE.weekday||STALE.label||STALE.date;
  bar.innerHTML='<span>Showing <b>'+esc(day)+"</b>'s brief. Today's "+
    (late ? 'has still not posted, so the 4am run may have failed.'
          : "hasn't posted yet; the 4am run writes it.")+'</span>';
  var b=el('button','','Refresh');
  b.addEventListener('click',function(e){e.stopPropagation();load();});
  bar.appendChild(b);
}

function render(){
  var d=DATA;
  var status=$('#heroStatus');
  renderStaleBar();
  if(!d){
    $('#chips').innerHTML='';
    status.classList.remove('hide');
    if(LOAD_ERR){
      // Could not read. Say that, and say why. Do not imply the brief is missing.
      $('#heroTitle').innerHTML='Could not <span class="grad">reach the data</span>';
      $('#heroSub').textContent="This is a read failure on this device, not a missing brief. "+
        "The 4am run may well have posted normally.";
      var box=$('#recap');box.classList.remove('hide');box.classList.add('fail');box.open=true;
      $('#rcTitle').innerHTML='<b>Firestore read failed</b>';
      var rb=$('#rcBody');rb.innerHTML='';
      rb.appendChild(el('div','rc-fails','<h4>Error</h4><div>'+
        esc((LOAD_ERR.code||'unknown')+' — '+LOAD_ERR.message)+'</div>'));
      var again=el('button','nbtn','Try again');
      again.style.margin='12px 0 0';
      again.addEventListener('click',function(){retries=0;LOAD_ERR=null;load();});
      rb.appendChild(again);
      $('#panelHost').innerHTML='';
    } else {
      // Reaching here now means BOTH that today has no brief AND that the
      // lookback found nothing to fall back on, which is a much rarer state than
      // it used to be. If the lookback errored rather than came up empty, say so.
      $('#heroTitle').innerHTML='Nothing <span class="grad">posted yet</span>';
      $('#heroSub').textContent = LOOKBACK_ERR
        ? "Today's brief hasn't been written, and the check for an earlier one failed ("+
          LOOKBACK_ERR+"). This is not necessarily an empty day."
        : "Today's brief hasn't been written to the Bridge, and there is nothing in the "+
          "last "+LOOKBACK_DAYS+" days to fall back on. The 4am run posts it; hit refresh after that.";
      $('#recap').classList.add('hide');
      $('#panelHost').innerHTML='<div class="empty">No brief for '+esc(DATE)+' yet.</div>';
    }
    // The ring still draws: the clock is real, and weather does not come from
    // Firestore, so blanking the whole thing on a bad read would throw away two
    // things that are working.
    buildMosaic();paintReactor();dock();return;
  }
  status.classList.add('hide');
  // #ebDate only. #ebMark is the arrival's morph target and its text is fixed.
  $('#ebDate').textContent=' · '+(d.date_label||DATE);
  var ch=$('#chips');ch.innerHTML='';
  (d.chips||[]).forEach(function(c){ch.appendChild(el('span','chip mono '+(c.tone||''),esc(c.label)));});

  renderRecap(d.recap);
  buildMosaic();
  paintReactor();
  /* #panelHost survives the panel's removal and is NOT dead markup. Three paths
     write their message into it and it is the only slot they have: the render-error
     reporter in finish(), the read-failure branch, and the no-brief-and-no-fallback
     branch. Clearing it here is what removes the loading skeleton on a good morning.
     Deleting the element would silence the one reporter whose entire job is to
     explain why the page is empty. */
  $('#panelHost').innerHTML='';
  dock();
  maybeOpenOrders();
}

/* ══ THE MOSAIC ════════════════════════════════════════════════════════════
   Placement is explicit rather than auto-flowed, because which card lands in
   which cell is a design decision, not a fallout of array order:

   • Punch List takes the full-width bar. It is the longest title, it is the one
     card that earns a progress bar on its face, and it is what the morning is
     actually about.
   • The four cells flanking the clock are 76px wide. That is a hard ceiling of
     one short title plus one value, so the four short-titled cards go there.
   • Calendar and News take the bottom pair, where 154px gives their values
     ("1:00p", a story count) room alongside a caption.
   • Magenta occupies the top bar and the left column, cyan the right column and
     the bottom row, so the duotone reads as a position on the block and not only
     as a hue. */
/* The flanking tiles run to columns 3 and 6 rather than stopping short of the
   dial, so they are WIDER than the hole and the circle cuts into them. That is
   what removes the dead corners: the tiles reach the middle and the mask, not the
   grid, decides where they stop. */
var SLOT={
  punch:    {col:'1 / 9', row:'1',     cls:'bar c'},
  /* 1/5 and 5/9, so the four flanking tiles MEET at the centre line the way
     Calendar and News already did. At 1/4 and 6/9 they stopped 72px short of the
     circle at the top and bottom of their rows, where the bite has narrowed to
     ~38px either side of centre, leaving an uncovered wedge of raw background
     between the tile edge and the ring. Measured after the change: 20px of
     overlap at the worst corner on all four.
     The dial does NOT move. fitDial derives the radius from the ROWS, so column
     spans are not an input to it, and the 3px street between each new pair falls
     entirely inside the circle and is masked away. */
  inbox:    {col:'1 / 5', row:'2',     cls:'sq'},
  service:  {col:'1 / 5', row:'3',     cls:'sq'},
  weather:  {col:'5 / 9', row:'2',     cls:'sq r'},
  routine:  {col:'5 / 9', row:'3',     cls:'sq r'},
  calendar: {col:'1 / 5', row:'4',     cls:'wide'},
  /* News held this shape until 2026-08-06 and Boothby restored it the same day,
     verbatim from the comment the news removal left behind rather than a new
     one, so the grid came back exactly as it was: 164x46px at the bottom right,
     measured on the six-tile build before this landed. */
  boothby:  {col:'5 / 9', row:'4',     cls:'wide r'}
};
/* 2026-09-03: three cards on the landing, in reading order. punch, inbox and
   calendar are still in CARDS because Orders of the Day and the Ops Review draw
   on their payload sections and BUILD functions; weather is gone entirely. */
var ORDER=['routine','boothby','service'];

var SEL='punch';                       // which tile the panel is showing
function cardByKey(k){
  for(var i=0;i<CARDS.length;i++) if(CARDS[i].k===k) return CARDS[i];
  return null;
}
/* A card is MISSING when the payload carries no section for it.
   TWO kinds of card can never be missing, and both exclusions are load-bearing:

   • `live` cards fetch their own data from the page. Weather is the only one, and
     it carries its own failure state rather than borrowing this one.

   • SYNTHETIC cards, which are not in CARDS at all because they are not part of
     the mosaic and do not come from `bridge/{date}`. QCARD is the only one today:
     the work queue reads `bridge_state/_queue`, which the 4am feeder is
     contractually FORBIDDEN from writing. Without this clause, opening the queue
     pill rendered "the 4am run did not post a work queue card", which is both
     false and impossible to act on, because that run is never going to post one.
     Testing membership in CARDS rather than listing keys means any future card
     that draws from bridge_state is right by default instead of wrong until
     someone remembers to add it here. */
function cardMissing(c){
  if(!c || c.live) return false;
  if(CARDS.indexOf(c)<0) return false;
  return !(DATA && DATA[c.k]);
}

/* Why it is missing, in the RUN'S OWN WORDS, when the run said so.
   The recap already carries a failing line per broken step, so that is the honest
   source for this text rather than anything the page infers. Matching is a
   case-insensitive substring of the card's key or label against the failing
   lines' labels: "inbox" finds "Work inbox triaged", "calendar" finds "Calendar
   lookahead". Ambiguity is treated as no answer — if the match is not unique the
   placeholder says only that the card was not written, because a confidently
   wrong reason at 6am is worse than no reason at all.
   Returns '' whenever the run reported no matching failure, which is also the
   right answer for a payload that simply predates a card. */
function missReason(c){
  var rc=(DATA&&DATA.recap)||{};
  var lines=(rc.lines||[]).filter(function(l){ return l&&l.state==='fail'; });
  var needles=[c.k,String(c.label||'').toLowerCase()];
  var hit=lines.filter(function(l){
    var lab=String(l.label||'').toLowerCase();
    for(var i=0;i<needles.length;i++){
      if(needles[i] && lab.indexOf(needles[i])>=0) return true;
    }
    return false;
  });
  if(hit.length!==1) return '';
  return String(hit[0].value||hit[0].label||'');
}

/* ══ THE ARRIVAL ═══════════════════════════════════════════════════════════
   Sam, 2026-08-06: "a fade in similar to Remy's fade in, The Bridge as the hero
   shrinking into its location in the top left. The date and clock arriving and
   the cards popping into place quickly after in clockwise."

   THE MECHANISM IS REMY'S, read out of Codename: Neelix/outputs/mobile.html
   rather than reinvented: measure the destination, measure the hero, translate
   and scale the hero onto the destination, and force a reflow between adding the
   transition class and writing the transform. That last one is not superstition.
   Without it Safari treats the transform write as an initial state and skips the
   transition, which is what made Remy's shrink pop instead of animate, and the
   comment recording that is still in Remy's source.

   Two deliberate departures.

   THE TIMING IS NOT REMY'S. Remy runs 2.5s end to end: fade 550ms, hold to
   1150ms, morph 950ms, header at 2030ms, overlay clear at 2120ms, content at
   2350ms. That is right for an app opened a few times a week and wrong for one
   read half awake at 6am every single morning, where a two-second title card is
   hated by the third day. Sam's call: the same choreography at ~880ms.

   SCALE COMES FROM WIDTH, not height. Remy anchors on height and therefore has
   to keep both line-heights in step to stay honest. Both strings here are the
   same text in the same family with the same tracking and the same transform, so
   width scales linearly with font-size and no assumption about line boxes is
   needed at all.

   Nothing here can get in Sam's way. The overlay is pointer-events:none for its
   whole life, so a press at 200ms lands on the tile underneath rather than on
   the animation, and the first pointerdown anywhere ends the sequence early. The
   watchdog is the other half of that promise: if the morph never runs for any
   reason, the overlay clears itself rather than sitting over the page. */
var ARR_TILES=380, ARR_STEP=30;   // tile lead-in and per-tile stagger, ms
var arrived=false;
function runArrival(){
  if(arrived) return;
  arrived=true;
  var ov=$('#arrive'), word=$('#arrWord'), mark=$('#ebMark'), dt=$('#ebDate');
  var face=document.querySelector('.rx-face');

  /* Full functionality, no motion. Everything is simply present, and .morph is
     never added, so there is no transform to be mid-flight either. */
  /* Full functionality, no motion, and the transitions are KILLED rather than
     merely not used. Found on the served build 2026-08-06: adding .in on a
     hidden tab left #ebMark at computed opacity 0 for as long as the tab stayed
     hidden, so the wordmark was simply absent. The rules were correct and the
     class was applied; the 0.2s opacity transition it relies on had been STARTED
     against a frozen animation clock and never advanced off its start value.

     Every caller of land() is a no-animation path by definition: reduced motion,
     a hidden tab, a tap to skip, or the watchdog. So none of them wants a
     transition, and the two that fire mid-flight want an instant snap to the end
     state anyway. Setting them to none is the fix and it is also the honest
     reading of the rule for this page: reduced motion gets the finished state,
     not a slower route to it. */
  function land(){
    [mark,dt,face].forEach(function(e){ if(e) e.style.transition='none'; });
    if(mark) mark.classList.add('in');
    if(dt) dt.classList.add('in');
    if(face) face.classList.remove('arr');
    if(ov){ ov.classList.add('gone'); ov.classList.add('off'); }
  }
  /* document.hidden is in this guard because of a real failure, found while
     measuring this: a backgrounded tab throttles the animation clock and
     requestAnimationFrame does not fire AT ALL, so the double-rAF below never
     runs, the morph never starts, and the overlay sits opaque over the whole app
     until the watchdog trips. Skipping outright is also the correct behaviour on
     its own terms — an entrance nobody was looking at does not need replaying
     when the tab comes forward. The watchdog stays as the backstop for the other
     ways this can stall. */
  if(RM || document.hidden || !ov || !word || !mark){ land(); return; }

  if(face) face.classList.add('arr');
  var timers=[], done=false;
  function skip(){
    if(done) return; done=true;
    timers.forEach(clearTimeout);
    document.removeEventListener('pointerdown',skip,true);
    land();
  }
  function at(ms,fn){ timers.push(setTimeout(function(){ if(!done) fn(); },ms)); }
  // Capture phase, so the skip registers even if something else stops the event.
  document.addEventListener('pointerdown',skip,true);

  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    if(done) return;
    var hr=mark.getBoundingClientRect(), wr=word.getBoundingClientRect();
    // A zero-width measurement means the header is not laid out yet, which is a
    // state this must not animate through: it would fling the word to 0,0. Bail
    // to the end state instead. Same class of guard as the mosaic.clientWidth
    // check in fitDial.
    if(!hr.width || !wr.width){ skip(); return; }
    var scale=hr.width/wr.width;
    var tx=(hr.left+hr.width/2)-(wr.left+wr.width/2);
    var ty=(hr.top+hr.height/2)-(wr.top+wr.height/2);

    word.classList.add('in');                       // 0-220ms, fade up centred
    at(250,function(){                              // 250-630ms, the morph
      word.classList.add('morph');
      void word.offsetHeight;                       // see the Safari note above
      word.style.transform='translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) scale('+
                            scale.toFixed(4)+')';
    });
    // The real eyebrow appears exactly where the morph lands, one frame before
    // the overlay starts to go, so there is never a gap with neither on screen.
    at(620,function(){ mark.classList.add('in'); });
    at(650,function(){                              // date and clock arrive
      if(dt) dt.classList.add('in');
      if(face) face.classList.remove('arr');
      ov.classList.add('gone');
    });
    at(850,function(){ ov.classList.add('off'); done=true;
                       document.removeEventListener('pointerdown',skip,true); });
  }); });

  // Watchdog. Two rAFs plus five timers is five ways for this to not finish, and
  // the failure mode is an opaque panel over the whole app. 2.5s, well past the
  // 880ms the sequence actually takes.
  setTimeout(skip,2500);
}

function buildMosaic(){
  /* Name kept so the five call sites and the breakpoint listener still work. Since
     2026-09-03 this builds the LANDING: three card rows, the intake block and the
     Orders pill. No grid, no dial, no measured geometry. */
  var host=$('#cards'); if(!host) return;
  host.innerHTML='';
  ORDER.forEach(function(k){
    var c=cardByKey(k); if(!c) return;
    var b=el('button','crow'+(cardMissing(c)?' miss':''));
    b.setAttribute('data-k',k);
    b.setAttribute('aria-label',c.label);
    b.style.setProperty('--ac',c.ac);
    b.addEventListener('click',function(){ SEL=k; openDetail(c,b); });
    host.appendChild(b);
  });
  paintTiles();
  var ik=$('#intake'); if(ik){ ik.innerHTML=''; ik.appendChild(intakeRow()); }
  paintOrdersPill();
  paintPackPill();
  runArrival();          // no-op after the first time
}

/* ── the bite ──────────────────────────────────────────────────────────────
   Measured, not hardcoded. The radius is derived from the two rows the flanking
   tiles occupy, so the circle is exactly as tall as that band plus the 3px street
   and, because those rows are taller than the middle gap is wide, it necessarily
   overflows sideways into the tiles. That overflow IS the effect: the tiles get
   a curved inner edge instead of a straight one.

   Radius from the ROWS rather than the columns on purpose. Sized off the columns
   it would fit the gap exactly, touch nothing, and leave the four dead corners
   back where they started.

   Masks are set inline per tile because each one needs the circle expressed in
   its own coordinate space, and the tiles are laid out by the grid, so their
   positions are not known until after layout. */
function fitDial(){
  /* Retired 2026-09-03 with the dial. The body below is kept as the record of the
     most fragile code the file ever carried; nothing calls past this line. */
  var m=$('#mosaic'), dial=$('#dial');
  if(!m||!dial) return;
  var tiles=[].slice.call(m.querySelectorAll('.tile'));
  /* The sparse early-return that used to sit here is gone with the sparse layout.
     Both reference tiles are now guaranteed to exist on every render, missing
     payload or not, which is precisely what makes the geometry unconditional. */
  var top=m.querySelector('.tile[data-k="inbox"]'), bot=m.querySelector('.tile[data-k="service"]');
  if(!top||!bot||!m.clientWidth) return;
  /* offsetTop/offsetLeft, NOT getBoundingClientRect. The tiles boot in on a
     scale(.86) keyframe, and a client rect reports the animated size: measured
     mid-flight the radius came out 73px instead of 78 and every per-tile offset
     was wrong, so the bite silently landed in the wrong place and the dial just
     sat on top of the tiles covering their values. Offset values are layout
     positions and ignore transforms entirely.
     The mosaic is position:relative, so it is the offsetParent for every tile
     and these are already in mosaic-local coordinates. */
  var R=((bot.offsetTop+bot.offsetHeight-top.offsetTop)/2)+3;
  var cx=m.clientWidth/2, cy=m.clientHeight/2;
  dial.style.width=dial.style.height=(R*2)+'px';
  // The clock is sized off the dial, so it grows with the block instead of sitting
  // as 22px type in the middle of a 435px circle on a desktop.
  dial.style.setProperty('--clock-size',(R*0.295).toFixed(1)+'px');
  dial.style.setProperty('--clock-sub',Math.max(8.5,R*0.108).toFixed(1)+'px');
  tiles.forEach(function(t){
    var x=(cx-t.offsetLeft).toFixed(1), y=(cy-t.offsetTop).toFixed(1);
    /* How much of this tile the circle does NOT cover.
       On a phone the tiles hold a title and a number, both hard against the outer
       edge, so the bite never reaches them. On desktop they hold stat rows that
       run label-left / value-right across the full width, and the values landed
       underneath the dial. Clamping the body to the clean strip fixes it.
       Worst case is the tile edge nearest the circle's centre line, so dy is the
       smallest vertical distance from that line to any part of the tile (zero if
       the tile straddles it). */
    var top=t.offsetTop, bot=t.offsetTop+t.offsetHeight;
    var dy = (cy>=top&&cy<=bot) ? 0 : Math.min(Math.abs(cy-top),Math.abs(cy-bot));
    var halfW = dy<R ? Math.sqrt(R*R-dy*dy) : 0;
    var left=t.offsetLeft, right=t.offsetLeft+t.offsetWidth;
    var clean = t.classList.contains('r') ? (right-(cx+halfW)) : ((cx-halfW)-left);
    // Minus the tile's own padding, and never negative.
    t.style.setProperty('--clean', Math.max(0,clean-34).toFixed(0)+'px');
    // Half a pixel of feather, or the cut edge crawls with jaggies on a retina screen.
    t.style.setProperty('--bite',
      'radial-gradient(circle '+R.toFixed(1)+'px at '+x+'px '+y+'px,'+
      'transparent 99.3%,#000 100%)');
  });

  /* ── the ring order, measured ────────────────────────────────────────────
     The tiles land clockwise from twelve o'clock, and which tile is where is a
     fact about the grid, so it is read off the grid rather than written down.

     The spin-up for this session said CARDS is already in clockwise ring order
     and the stagger index is therefore the array index. It is NOT, and the file
     is the authority: SLOT puts inbox and service in columns 1/5, which is the
     LEFT of the dial, and weather and routine in 5/9, which is the right. So
     CARDS runs counter-clockwise down the left side, and weather and routine are
     transposed even for that. ORDER, which is what the old stagger actually
     used, is a third sequence again. True clockwise from twelve is punch,
     weather, routine, news, calendar, service, inbox.

     Rather than add a fourth hardcoded list to go stale the next time a card is
     re-slotted, the angle comes from where the grid put each tile. atan2(x,-y)
     is zero at twelve and grows clockwise, which is the ordering wanted, and it
     uses the same offset coordinates as everything else in this function for the
     same reason: getBoundingClientRect reads the entrance transforms.

     Delays are written ONCE per build, not on every fitDial. Rewriting
     animation-delay on a finished animation restarts it in some engines, so a
     resize would re-run the whole entrance while Sam was reading. */
  if(ringPending){
    ringPending=false;
    var ang=function(t){
      var a=Math.atan2(t.offsetLeft+t.offsetWidth/2-cx, -(t.offsetTop+t.offsetHeight/2-cy));
      return a<0?a+2*Math.PI:a;
    };
    /* The lead-in only applies to the FIRST build, which is the one the arrival
       choreographs. A refresh or a breakpoint crossing rebuilds the mosaic too,
       and holding those tiles blank for 380ms would be a stutter with no hero
       in front of it to justify the wait. */
    var lead = arrived ? 40 : ARR_TILES;
    tiles.slice().sort(function(a,b){return ang(a)-ang(b);}).forEach(function(t,i){
      t.style.animationDelay=(RM?0:lead+i*ARR_STEP)+'ms';
    });
  }
}
/* Set by buildMosaic, consumed by the block above. */
var ringPending=false;
var fitTimer=null;
window.addEventListener('resize',function(){
  clearTimeout(fitTimer); fitTimer=setTimeout(fitDial,120);
});

/* The value on each tile. Where a card has an urgent count it also gets a badge,
   which is the only red in the block. */
function tileValue(c){
  var sec=(DATA&&DATA[c.k])||null;
  if(c.k==='weather'){
    if(WX.state==='ok') return {v:Math.round(WX.data.current.temperature_2m)+'°'};
    return {v:WX.state==='fail'?'—':'··', dim:true};
  }
  /* Boothby draws from bridge_data, not the payload, so it is handled ABOVE the
     `!sec` guard for the same reason weather is. Falling through would print the
     dim em-dash of a card the 4am run forgot, which is a different fact. */
  if(c.k==='boothby'){
    if(!boothbyCourse()) return {v:'—',dim:true};
    var prep=boothbyPrepared();
    if(prep.length) return {v:String(prep.length), badge:prep.length};
    var sc=(BOOTHBY.scorecard)||{};
    return {v:(sc.passed||0)+'/'+((BOOTHBY.course.units_total)||'?')};
  }
  if(!sec) return {v:'—',dim:true};
  if(c.k==='punch'){
    var feat=allPunchItems().filter(function(i){return i.featured!==false;});
    return {v:String(feat.filter(function(i){return state.done.indexOf(i.id)<0;}).length),
            badge:sec.flag||null};
  }
  if(c.k==='inbox')    return {v:String(inboxLive(sec).length), badge:inboxFlag(sec)||null};
  if(c.k==='routine'){
    var st=sec.steps||[], done=0;
    st.forEach(function(s,i){ if(state.done.indexOf('routine-'+DATE+'-'+i)>=0) done++; });
    return {v:st.length?(done+'/'+st.length):String(sec.stat||'—')};
  }
  if(c.k==='calendar') return {v:String(sec.stat||'—')};
  return {v:String(sec.stat==null?'—':sec.stat)};
}
/* ── the count on an icon face ─────────────────────────────────────────────
   A badge means "this many things want you", and it is deliberately not on every
   card. Sam's rule, 2026-08-06: a count on a card that only informs is noise,
   and the badge must not reintroduce the wants-you / informs-you confusion the
   duotone exists to prevent.

     punch     open items on today's short list
     inbox     the run's own flag, which is the count that needs a reply, not the
               count of mail — "5 in the inbox" is not a demand, "3 owed" is
     calendar  events still ahead today, and nothing when the day is clear. This
               is a cyan card, so it gets a count only when something is
               genuinely due, which is the stated carve-out.
     service   NONE. It wants attention but it has no count: its number is a
               dollar figure, and putting $11,288 in a 15px circle, or inventing
               a count it does not have, are both worse than no badge.
     news, weather, routine   none. Routine's arc already carries its state.

   Returns null for "no badge", never 0. A zero badge is a red dot that says
   nothing needs doing, which is the opposite of what a badge is for. */
function tileBadge(c){
  /* Boothby, above the `!sec` guard because its data is not in the payload.
     SAM'S CALL, 2026-08-06: a count ONLY when a segment is prepared and unsat.
     The card informs him the rest of the time, and a study card carrying a
     permanent "unit 1 of 6" badge would break the wants-you / informs-you rule
     the whole two-hue palette rests on. This is the same carve-out Calendar has
     and it is narrow for the same reason.
     A BUILT-BUT-UNSAT ASSESSMENT COUNTS TOO. It is literally a prepared, unsat
     thing waiting on him, and it is the only one that moves rank, so leaving it
     out would hide the item that matters most on the one morning it exists. */
  if(c.k==='boothby'){
    var p=boothbyPrepared().length;
    return p>0?String(p):null;
  }
  var sec=(DATA&&DATA[c.k])||null;
  if(!sec) return null;
  if(c.k==='punch'){
    var feat=allPunchItems().filter(function(i){return i.featured!==false;});
    var open=feat.filter(function(i){return state.done.indexOf(i.id)<0;}).length;
    return open>0?String(open):null;
  }
  if(c.k==='inbox'){ var f=inboxFlag(sec); return f>0?String(f):null; }
  if(c.k==='calendar'){
    /* Ahead, not merely scheduled. An event at 9am is not something the card
       wants from Sam at 6pm, and counting it would leave the badge lit all
       evening — which is exactly the noise the informs-you carve-out is meant to
       prevent. The field is `time` and it is a display string, "1:00p" or
       "all day" (see build_calendar in payload_example.py), so this parses
       rather than trusting an ordering.
       "all day" is NOT counted: it is context for the day, not a thing due at a
       moment, and counting it would pin the badge on for the whole day. Anything
       else that will not parse IS counted, because dropping a real appointment
       is the worse of the two errors. */
    var now=laNow(), mins=now.getHours()*60+now.getMinutes(), n=0;
    (sec.today||[]).forEach(function(e){
      var t=String((e&&e.time)||'');
      if(/all\s*day/i.test(t)) return;
      var m=/(\d{1,2}):(\d{2})\s*([ap])/i.exec(t);
      if(!m){ n++; return; }
      var h=parseInt(m[1],10)%12; if(/p/i.test(m[3])) h+=12;
      if(h*60+parseInt(m[2],10) >= mins) n++;
    });
    return n>0?String(n):null;
  }
  return null;
}

/* A short caption under each value. Deliberately NOT the payload's own `unit`
   string: those are written for a full-width card ("net last night · +8.1% vs
   last Wed") and would be nothing but an ellipsis at 60px of usable tile width.
   Returns HTML, so the service delta can keep its up/down colour. */
function tileUnit(c){
  var sec=(DATA&&DATA[c.k])||{};
  if(c.k==='punch'){
    var feat=allPunchItems().filter(function(i){return i.featured!==false;});
    var closed=feat.filter(function(i){return state.done.indexOf(i.id)>=0;}).length;
    return closed+' of '+feat.length+' closed · '+allPunchItems().length+' open';
  }
  if(c.k==='calendar') return (sec.today||[]).length===1 ? esc(String((sec.today||[])[0].title||''))
                                                         : (sec.today||[]).length+' today';
  if(c.k==='inbox'){ var owed=inboxFlag(sec); return owed ? owed+' owed' : 'clear'; }
  if(c.k==='service'){
    var s0=(sec.stats||[])[0];
    return (s0&&s0.delta) ? '<span class="'+esc(s0.dir||'flat')+'">'+esc(s0.delta)+'</span>' : '';
  }
  if(c.k==='weather') return WX.state==='ok' ? esc(wxLabel(WX.data.current.weather_code))
                     : WX.state==='fail' ? 'unavailable' : '';
  if(c.k==='routine'){ var sd=streakDays(); return sd? sd+'d streak' : 'no streak'; }
  if(c.k==='boothby'){
    if(!boothbyCourse()) return BOOTHBY_ERR ? 'could not reach' : 'no course';
    if(boothbyPrepared().length) return 'ready to sit';
    return state.study ? 'studied today' : 'units passed';
  }
  return '';
}
/* The placeholder's long form, shared by the phone panel and the sheet so the two
   can never drift apart in what they claim. Deliberately NOT put on the tile, even
   on desktop where tiles carry their own detail: the four flanking tiles are
   clamped to the ~163px the dial leaves clear, and a sentence does not live there.
   A missing card has one sentence of detail, and it is one tap away in the sheet. */
function missBlock(c){
  var why=missReason(c);
  var name=String(c.label).toLowerCase();
  // "a inbox card" shipped once. Inbox is the only vowel-initial label today, but
  // the test is on the string rather than on that fact, so a card added later
  // cannot reintroduce it.
  var art=/^[aeiou]/.test(name)?'an':'a';
  return '<div class="miss-note"><div class="h mono">Not written today</div>'+
    '<div class="w">The 4am run did not post '+art+' '+esc(name)+
    ' card, so there is nothing here to show. This is a gap in the brief, '+
    'not an empty day.</div>'+
    (why?'<div class="r">'+esc(why)+'</div>':'')+'</div>';
}

function paintTiles(){
  /* Card rows since 2026-09-03: icon, name, one-line caption, value, chevron. The
     value, badge and caption builders below are unchanged, so what a row says is
     exactly what the old tile said. A missing card keeps its row and says so. */
  document.querySelectorAll('.crow').forEach(function(b){
    var k=b.getAttribute('data-k'), c=cardByKey(k);
    if(!c) return;
    if(cardMissing(c)){
      b.innerHTML='<span class="cr-ic">'+iconSvg(c)+'</span><span class="cr-main">'+
        '<span class="cr-k mono">'+esc(c.label)+'</span>'+
        '<span class="cr-u">not in today&rsquo;s brief</span></span>'+
        '<span class="cr-v dim">--</span><span class="cr-go mono">›</span>';
      return;
    }
    var tv=tileValue(c), bg=tileBadge(c), u=tileUnit(c);
    b.innerHTML='<span class="cr-ic">'+iconSvg(c)+'</span><span class="cr-main">'+
      '<span class="cr-k mono">'+esc(c.label)+(bg?'<span class="t-b">'+esc(bg)+'</span>':'')+'</span>'+
      (u?'<span class="cr-u">'+u+'</span>':'')+'</span>'+
      '<span class="cr-v'+(tv.dim?' dim':'')+(String(tv.v).length>6?' sm':'')+'">'+esc(tv.v)+'</span>'+
      '<span class="cr-go mono">›</span>';
  });
}

/* The card body, minus the header. One builder so a tile on desktop and the panel
   on a phone can never drift apart in what they show. */
function faceBody(c){
  var sec=(DATA&&DATA[c.k])||{};
  if(cardMissing(c)) return missBlock(c);
  var f=(c.k==='weather') ? weatherFace()
                          : (FACE[c.k]?FACE[c.k](sec):{stat:sec.stat,unit:sec.unit});
  if(f.raw) return f.raw;
  var s=(f.stat==null?'—':String(f.stat));
  var cls=s.length>34?'c-stat tease':s.length>6?'c-stat sm':'c-stat';
  return '<div class="'+cls+'">'+esc(s)+'</div>'+
         '<div class="c-unit">'+esc(f.unit||'')+'</div>'+(f.extra||'');
}

/* ══ THE PANEL — REMOVED 2026-08-04 ════════════════════════════════════════
   paintPanel() drew the selected tile's detail into #panelHost as a read-only
   preview, and a second tap on it opened this sheet. Sam retired the whole step:
   the preview was a thing to read on the way to the thing he actually wanted, and
   desktop had already been skipping it since the detail lives on the card there.
   A tile now opens the sheet directly and the pill row plus the swipe handle
   moving between cards.
   #panelHost itself is deliberately still in the DOM. See the note at its clear
   in render(): three failure reporters have no other slot to write into.
   The FACE builders below are NOT dead with it. They still feed faceBody(), which
   is what draws the detail onto each tile in the desktop layout. */

/* ── card faces ────────────────────────────────────────────────────────────
   Row budgets are set for a full-width panel. They were 3 when these were half
   tiles in a grid; there is room for 5 now, and the point of the single-panel
   layout is that the one card you are looking at can afford to say more. */
var FACE={};
FACE.punch=function(){
  var all=allPunchItems();
  var feat=all.filter(function(i){return i.featured!==false;});
  var open=feat.filter(function(i){return state.done.indexOf(i.id)<0;});
  var closed=feat.length-open.length;
  var N=Math.min(Math.max(feat.length,1),28), on=Math.round(feat.length?closed/feat.length*N:0), segs='';
  for(var i=0;i<N;i++) segs+='<i class="'+(i<on?'on':'')+'"></i>';
  var rows=open.slice(0,5).map(function(i){
    return '<div class="f-row"><span class="pip '+esc(i.prio||'low')+'"></span>'+
      '<span class="t">'+esc(i.text)+'</span>'+
      (i.when?'<span class="m mono">'+esc(i.when)+'</span>':'')+'</div>';
  }).join('')||'<div class="f-row"><span class="t">Short list is clear.</span></div>';
  return {stat:open.length,
    unit:closed+' of '+feat.length+' closed today · '+all.length+' open in total',
    extra:'<div class="f-seg">'+segs+'</div><div class="f-rows">'+rows+'</div>'};
};
FACE.inbox=function(sec){
  var rows=(sec.items||[]).slice(0,5).map(function(m){
    var p=m.stateCls==='reply'?'high':m.stateCls==='await'?'med':'';
    return '<div class="f-row"><span class="pip '+p+'"></span><span class="t">'+esc(m.sender||'')+'</span>'+
      (m.state?'<span class="m '+(m.stateCls==='reply'?'mag':'cyan')+'">'+esc(m.state)+'</span>':'')+'</div>';
  }).join('');
  return {stat:sec.stat,unit:sec.unit,extra:rows?'<div class="f-rows">'+rows+'</div>':''};
};
FACE.service=function(sec){
  var mini=(sec.stats||[]).slice(0,4).map(function(x){
    return '<div><span class="k">'+esc(x.label)+'</span><span class="v">'+esc(x.value)+
      (x.delta?'<span class="'+esc(x.dir||'flat')+'">'+esc(x.delta)+'</span>':'')+'</span></div>';
  }).join('');
  return {stat:sec.stat,unit:sec.unit,extra:mini?'<div class="f-mini">'+mini+'</div>':''};
};
FACE.routine=function(sec){
  // Counts HABITS, not movements. With the payload sending three shaped steps this
  // reads "2 / 3" rather than "6 / 7", which is the honest denominator.
  var steps=sec.steps||[], done=0, segs='';
  steps.forEach(function(s,i){
    var on=state.done.indexOf('routine-'+DATE+'-'+i)>=0;
    if(on)done++; segs+='<i class="'+(on?'on':'')+'"></i>';
  });
  // Water leads the mini list rather than being buried under the payload's own
  // stats: it is the one number on this card that changes all day, and the card
  // is the only place it is visible without opening the sheet.
  // Reads "6/8 +cv" so the two supplements are visible without opening the sheet.
  // They are half the all-or-nothing condition; a water figure alone would imply
  // the track is nearly earned when a missed tap means it is worth nothing.
  var sup=(state.cider?'c':'')+(state.vits?'v':'');
  var mini='<div><span class="k">Intake</span><span class="v">'+
    (state.water||0)+'/'+WATER_TARGET+(sup?' <span>+'+sup+'</span>':'')+'</span></div>'+
    (sec.stats||[]).slice(0,2).map(function(x){
      return '<div><span class="k">'+esc(x.label)+'</span><span class="v">'+esc(x.value)+'</span></div>';
    }).join('');
  var sd=streakDays();
  return {stat:steps.length?(done+' / '+steps.length):sec.stat,
    unit:(steps.length?'chain steps done today':(sec.unit||''))+
         ' · '+(sd?sd+'-day streak':'no streak running'),
    extra:(steps.length?'<div class="f-seg">'+segs+'</div>':'')+
          (mini?'<div class="f-mini">'+mini+'</div>':'')};
};
FACE.calendar=function(sec){
  return {stat:sec.stat,unit:sec.unit,extra:calMini(sec)};
};

/* Five weeks starting the Sunday of this week, which is exactly the span the
   `month` payload covers ("month ahead", not "this calendar month"). A true
   calendar-month grid would spend its first rows on days already gone and would
   cut off the back half of the look-ahead at the 31st. */
function calMini(sec){
  var by={};
  (sec.month||sec.week||[]).forEach(function(day){
    var w=false,f=false;
    (day.items||[]).forEach(function(e){ if(e.scope==='family')f=true; else w=true; });
    if(day.date) by[day.date]={w:w,f:f};
  });
  var t=new Date(DATE+'T12:00:00');
  var start=new Date(t); start.setDate(start.getDate()-start.getDay());
  var cells='', mos=[];
  for(var i=0;i<35;i++){
    var d=new Date(start); d.setDate(start.getDate()+i);
    var k=dayKey(d), hit=by[k], isT=(k===DATE), past=(k<DATE);
    var mo=d.toLocaleDateString('en-US',{month:'short'}).toUpperCase();
    if(mos.indexOf(mo)<0) mos.push(mo);
    var dot=hit?'<b class="'+(hit.w&&hit.f?'both':hit.f?'fam':'')+'"></b>':'';
    cells+='<div class="cal-d'+(isT?' today':past?'':' in')+'">'+d.getDate()+dot+'</div>';
  }
  return '<div class="cal-mini"><div class="cal-mos mono">'+mos.join(' / ')+'</div>'+
    '<div class="cal-dow"><span>S</span><span>M</span><span>T</span><span>W</span>'+
    '<span>T</span><span>F</span><span>S</span></div>'+
    '<div class="cal-grid">'+cells+'</div>'+
    '<div class="cal-key"><span><i style="background:var(--cyan)"></i>Work</span>'+
    '<span><i style="background:var(--mag)"></i>Family</span>'+
    '<span><i style="background:var(--violet)"></i>Both</span></div></div>';
}

/* Returns pre-built markup rather than {stat,unit,extra}, because the weather face
   leads with an icon beside the temperature instead of with a headline number. */
/* The AQI chip that rides on the weather tile's face.

   Sam's word for what was missing was "alerts", and an alert he has to open a card to
   see is not one. The weather tile is the one card exempt from the mobile glyph face —
   it keeps its real face on a phone — so the face is the only place on the mosaic this
   can live without inventing a second badge rule. `tileBadge()` was the other candidate
   and is wrong for it: a badge is a 15px circle sized for a single-digit count and a
   three-digit AQI would clip in it, which is exactly the silent-overflow failure row 4
   already cost this file once.

   Returns empty string below 50, on a failed read at the face level, and while loading.
   Only "the air is bad" earns space here; "the air is fine" and "I do not know" both go
   in the sheet, where there is room to say which. */
function aqChip(){
  if(AQ.state!=='ok' || AQ.aqi==null) return '';
  var bd=aqBand(AQ.aqi);
  if(!bd.show) return '';
  return '<div class="aqi '+bd.cls+'" style="margin:8px 0 0;padding:6px 9px">'+
    '<span class="n" style="font-size:14px">'+AQ.aqi+'</span>'+
    '<span class="b" style="font-size:11px">Air '+esc(bd.label)+'</span></div>';
}

function weatherFace(){
  if(WX.state==='load')
    return {raw:'<div class="c-stat sm">Reading…</div><div class="c-unit">Seattle forecast</div>'};
  if(WX.state==='fail')
    // A failed fetch and a calm day are different facts. Never show a plausible
    // temperature that is actually nothing.
    // The AQ chip rides along even here, because the two fetches are independent and
    // a dead forecast endpoint says nothing about whether the air is full of smoke.
    return {raw:'<div class="c-stat sm">Unavailable</div>'+
      '<div class="c-unit">The forecast did not load</div>'+
      '<div class="wx-fail">'+esc(WX.err||'unknown error')+'</div>'+aqChip()};
  var c=WX.data.current, dl=WX.data.daily||{};
  var hi=(dl.temperature_2m_max||[])[0], lo=(dl.temperature_2m_min||[])[0];
  var mini=[['Feels like',Math.round(c.apparent_temperature)+'°'],
            ['Humidity',Math.round(c.relative_humidity_2m)+'%'],
            ['Wind',Math.round(c.wind_speed_10m)+' mph']]
    .map(function(x){return '<div><span class="k">'+x[0]+'</span><span class="v">'+x[1]+'</span></div>';}).join('');
  // The panel is full width, so the next five days fit on the face rather than
  // only inside the sheet.
  var days='';
  (dl.time||[]).slice(0,5).forEach(function(day,i){
    var nm=i===0?'Today':new Date(day+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    var pp=(dl.precipitation_probability_max||[])[i];
    days+='<div class="wx-day"><span class="d mono">'+esc(nm)+'</span>'+
      '<span class="i">'+wxIcon((dl.weather_code||[])[i])+'</span>'+
      '<span class="c">'+esc(wxLabel((dl.weather_code||[])[i]))+'</span>'+
      '<span class="p">'+(pp>=15?pp+'%':'')+'</span>'+
      '<span class="r">'+Math.round((dl.temperature_2m_max||[])[i])+'° <s>'+
      Math.round((dl.temperature_2m_min||[])[i])+'°</s></span></div>';
  });
  return {raw:'<div class="wx-top"><span class="wx-ic">'+wxIcon(c.weather_code,c.is_day)+'</span>'+
    '<div><div class="wx-t">'+Math.round(c.temperature_2m)+'<sup>°</sup></div>'+
    '<div class="wx-cond">'+esc(wxLabel(c.weather_code))+'</div></div></div>'+
    '<div class="c-unit">Seattle'+(hi!=null?' · '+Math.round(hi)+'° / '+Math.round(lo)+'°':'')+'</div>'+
    aqChip()+
    '<div class="f-mini">'+mini+'</div>'+days};
}

function allPunchItems(){
  var out=[];
  if(DATA&&DATA.punch) (DATA.punch.groups||[]).forEach(function(gr){
    (gr.items||[]).forEach(function(i){out.push(i);});});
  return out;
}
/* Repaint everything a check-off can move: the tile values, the XP arc and the
   strip. The panel repaint that used to sit here went with the panel itself.
   NOT repainting the open sheet is deliberate: this runs on close, and rebuilding
   a sheet that is sliding away throws out any expander the reader had opened. */
function refreshCounts(){
  paintTiles();
  paintReactor();
  paintHomePill();
}

var BUILD={};
/* Continuity: the sheet rises from where the tapped card actually is, carrying
   that card's glyph and accent into its header, so it reads as the same object
   opening rather than a second screen sliding over the first.
   It translates only. An earlier pass scaled the panel up from the card's exact
   rect, which is the textbook shared-element move and looked wrong here: the
   card is wider than it is tall, so the non-uniform scale squashed every line of
   text in the sheet for the length of the transition. */
/* Which card the sheet is currently showing. Needed because the sheet is now the
   only reading surface and it can be moved between cards without closing, so
   "what is open" is no longer answerable from the tile that was tapped. */
var OPEN_K=null;

/* Everything that renders a card INTO the open sheet. Split out of openDetail so
   opening (which animates up from the tapped tile) and switching (which slides
   sideways in place) share one body builder and cannot drift apart. */
function paintDetail(c){
  var sec=(DATA&&DATA[c.k])||{};
  $('#dKick').innerHTML='<span class="d-glyph">'+c.glyph+'</span>'+esc(c.label);
  $('#dTitle').textContent=sec.headline||c.label;
  var d=$('#detail');
  d.style.setProperty('--ac',c.ac);
  var body=$('#dBody');body.innerHTML='';body.style.setProperty('--ac',c.ac);
  /* Reset the scroll on every card change. Without it, switching from a long
     card to a short one lands mid-way down a card whose top you have not read. */
  body.scrollTop=0; d.scrollTop=0;
  /* A missing card must never reach its BUILD function. Every one of them renders
     an empty list from an absent section, and _fallback says "Nothing here today"
     — which is the single sentence this page is not allowed to say about data it
     never received. Same distinction the hero draws between a read failure and an
     empty day, applied one level down. */
  if(cardMissing(c)) body.innerHTML=missBlock(c);
  else (BUILD[c.k]||BUILD._fallback)(body,sec,c);
  OPEN_K=c.k;
  buildPills();
}

/* The pill row. ORDER only, deliberately: the synthetic cards (_rank, _queue,
   _home) are reached from their own affordances and putting them here would make
   the row scroll on a 375px screen for two destinations Sam visits rarely. When
   one of THOSE is open the row hides entirely rather than showing seven pills
   with none of them active, which would read as a broken selection. */
function buildPills(){
  var host=$('#dPills'); if(!host) return;
  var i=ORDER.indexOf(OPEN_K);
  host.classList.toggle('hide',i<0);
  host.innerHTML='';
  if(i<0) return;
  ORDER.forEach(function(k){
    var c=cardByKey(k); if(!c) return;
    var b=el('button','dp'+(k===OPEN_K?' on':''),esc(c.label));
    b.style.setProperty('--ac',c.ac);
    b.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      switchCard(k);
    });
    host.appendChild(b);
  });
  // Keep the active pill on screen. Seven labels overflow 375px, so without this
  // the pill for the card you are reading can sit off the right edge.
  var on=host.querySelector('.dp.on');
  if(on&&on.scrollIntoView) try{
    on.scrollIntoView({block:'nearest',inline:'center',behavior:RM?'auto':'smooth'});
  }catch(e){ on.scrollIntoView(false); }
}

/* Move the open sheet to another card. Direction is derived from ORDER rather
   than passed in, so a pill tap and a swipe animate the same way for the same
   move and cannot disagree. */
function switchCard(k){
  if(!k||k===OPEN_K) return;
  var c=cardByKey(k); if(!c) return;
  var from=ORDER.indexOf(OPEN_K), to=ORDER.indexOf(k);
  var body=$('#dBody');
  body.classList.remove('sl','sr');
  paintDetail(c);
  if(!RM && from>=0 && to>=0){
    void body.offsetHeight;                  // flush, or the class swap is coalesced
    body.classList.add(to>from?'sl':'sr');
  }
}

function openDetail(c,srcEl){
  var d=$('#detail');
  paintDetail(c);
  if(!RM && srcEl && srcEl.getBoundingClientRect){
    var top=Math.max(0,srcEl.getBoundingClientRect().top);
    d.style.transition='none';
    d.style.transform='translate3d(0,'+top+'px,0)';
    d.style.opacity='0';
    void d.offsetHeight;                     // flush, or the browser coalesces both frames
    d.style.transition='';
    d.style.opacity='';
  }
  d.classList.add('on');
  d.style.transform='';
  document.body.style.overflow='hidden';
}

/* Swipe between cards. Touch only — a trackpad produces wheel events, not
   touches, and the pills already cover the desktop case.
   The axis is decided ONCE per gesture and then locked. Deciding per-move lets a
   diagonal drag flip between scrolling and paging mid-gesture, and preventDefault
   is only called after the gesture has been claimed as horizontal, so vertical
   scrolling inside a long card is untouched. */
(function(){
  var body=$('#dBody'); if(!body) return;
  var x0=0,y0=0,t0=0,live=false,axis=0;
  body.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){live=false;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();live=true;axis=0;
  },{passive:true});
  body.addEventListener('touchmove',function(e){
    if(!live||e.touches.length!==1) return;
    var dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(!axis){
      if(Math.abs(dx)<8&&Math.abs(dy)<8) return;
      // 1.4 rather than 1.0: a thumb swiping horizontally on a phone drifts
      // vertically, and an even test paged the card on gestures that were
      // plainly meant as scrolls.
      axis=Math.abs(dx)>Math.abs(dy)*1.4?1:-1;
    }
    if(axis===1) e.preventDefault();
  },{passive:false});
  body.addEventListener('touchend',function(e){
    if(!live) return; live=false;
    if(axis!==1) return;
    var dx=e.changedTouches[0].clientX-x0, dt=Date.now()-t0;
    if(Math.abs(dx)<45||dt>700) return;      // too small or too slow to be a page
    var i=ORDER.indexOf(OPEN_K); if(i<0) return;
    var j=i+(dx<0?1:-1);
    if(j<0||j>=ORDER.length) return;         // no wrap: the ends are the ends
    switchCard(ORDER[j]);
  },{passive:true});
})();
function closeDetail(){
  var d=$('#detail');
  if(OPEN_K==='_orders' && state.ordersSeen!==DATE){ state.ordersSeen=DATE; saveState(); }
  d.classList.remove('on');
  d.style.transform='';d.style.transition='';d.style.opacity='';
  // Cleared so the swipe handler cannot page a sheet nobody is looking at.
  OPEN_K=null;
  document.body.style.overflow='';refreshCounts();
}
$('#back').addEventListener('click',closeDetail);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else closeDetail();}});
BUILD._fallback=function(b){b.appendChild(el('div','empty','Nothing here today.'));};

/* ══ ORDERS OF THE DAY ═══════════════════════════════════════════════════════
   Sam, 2026-09-02: "the first thing I want it to do every single day is start with
   a landing page of the day's events ... calendar events for the day and any key
   emails that are awaiting response ... Lucy's school schedule fully reflected."
   Named by him from three options. Opens itself once per Bridge day, then parks as
   the pill at the top of the landing so it can be pulled up again later.

   Synthetic like _rank and _queue: not in CARDS, so cardMissing() never fires on
   it, and it draws on THREE payload sections at once — calendar.today, inbox, and
   the new top-level `school` array the 4am run ships from school_day.py. Each
   section carries its own absent state, so a morning where the calendar fetch
   failed still shows Lucy's day and the inbox, and says which part is missing. */
var OCARD={k:'_orders',label:'Orders of the Day',glyph:'☰',ac:'var(--amber)'};
var ordersAuto=false;
function schoolToday(){ var a=(DATA&&DATA.school); return (a&&a.length)?a[0]:null; }
function ordersCounts(){
  var cal=(DATA&&DATA.calendar)||null, ib=(DATA&&DATA.inbox)||null;
  return {events: cal?(cal.today||[]).length:null, owed: ib?inboxFlag(ib):null};
}
function paintOrdersPill(){
  var p=$('#ordPill'), t=$('#ordTxt'); if(!p||!t) return;
  if(!DATA){ p.classList.add('hide'); return; }
  p.classList.remove('hide');
  var n=ordersCounts(), sd=schoolToday(), bits=[];
  bits.push(n.events===null?'calendar not posted':(n.events+' today'));
  if(n.owed) bits.push(n.owed+' owed a reply');
  if(sd){
    if(!sd.school) bits.push('Lucy: no school');
    else bits.push('Lucy '+(sd.dropoff?sd.dropoff.time:'')+' / '+(sd.pickup?sd.pickup.time:''));
  }
  t.innerHTML='<b>Orders of the Day</b><span>'+esc(bits.join(' · '))+'</span>';
}
function odSection(b,title,acc){
  var h=el('div','od-h mono',esc(title)); if(acc) h.style.setProperty('--ac',acc);
  b.appendChild(h);
}
BUILD._orders=function(b){
  var cal=(DATA&&DATA.calendar)||null, ib=(DATA&&DATA.inbox)||null;
  var sch=(DATA&&DATA.school)||null, today=schoolToday(), tmr=(sch&&sch[1])||null;

  /* Lucy first: it is the part of the morning that has a clock on it. */
  odSection(b,'Lucy · St. Catherine','var(--cyan)');
  if(!today){
    b.appendChild(el('div','od-miss','The school block is not in today\'s brief. school_day.py did not run or failed; the rules file is unchanged.'));
  } else {
    var box=el('div','od-school');
    if(!today.school){
      box.innerHTML='<div class="od-big">'+esc(today.lines[0]||'No school')+'</div>';
    } else {
      box.innerHTML='<div class="od-times">'+
        '<div><span class="k mono">Drop-off</span><b>'+esc(today.dropoff.time)+'</b><span class="w">'+esc(today.dropoff.who)+'</span></div>'+
        '<div><span class="k mono">Pick-up</span><b>'+esc(today.pickup.time)+'</b><span class="w">'+esc(today.pickup.who)+
          (today.pickup.why?'<em>'+esc(today.pickup.why)+'</em>':'')+'</span></div></div>'+
        today.lines.slice(2).map(function(l){return '<div class="od-line">'+esc(l)+'</div>';}).join('');
    }
    (today.flags||[]).forEach(function(f){ box.appendChild(el('div','od-flag',esc(f))); });
    if(tmr){
      var tl = !tmr.school ? (tmr.lines[0]||'No school')
             : 'Drop-off '+tmr.dropoff.time+' '+tmr.dropoff.who+' · pick-up '+tmr.pickup.time+' '+tmr.pickup.who+(tmr.pickup.why?' ('+tmr.pickup.why+')':'');
      box.appendChild(el('div','od-tmr','<span class="mono">Tomorrow</span> '+esc(tl)));
    }

  odSection(b,'Today','var(--amber)');

      (missReason(cardByKey('calendar'))?' '+esc(missReason(cardByKey('calendar'))):'')));

      b.appendChild(lg);

$('#ordPill').addEventListener('click',function(){ if(DATA) openDetail(OCARD,$('#ordPill')); });
/* Once per Bridge day, after the first successful paint. The flag is persisted on
   the daily state doc by closeDetail, so a reload mid-morning does not replay it. */
function maybeOpenOrders(){

}

/* ══ THE PACK LIST ═══════════════════════════════════════════════════════════
   Sam, 2026-09-04: "I want this pack list to be a checkable list of items that
   gets generated onto the bridge for me to review when I get to the restaurant."
   And: "a bridge card that is only visible on farm dinner weeks." No XP, his call.

   WHERE THE DATA COMES FROM. `bridge_data/packlist`, written by
   `Codename: Chakotay/Farm Dinners/checkin-app/push_packlist.py`, which reads the
   "Pack from SF" section straight out of the weekend's dated prep-list .md. One
   source: the list built with Sam in the prep session IS the list on the Bridge.

     bridge_data/packlist = {
       weekends: { "2026-09-05": { label, source, show_from, show_to,
                                   items: [{id, text, flag}] } },
       updated_at }

   VISIBILITY. The pill shows iff some weekend's [show_from, show_to] covers DATE.
   show_from is the pack day (the Friday), show_to the last dinner. Outside that
   window the pill is hidden and nothing on the page mentions it — absence is the
   gate, exactly as the Worf tick treats an unscheduled day.

   THREE STATES, like every bridge_data read: read failed (pill shows, says so —
   on a farm week a silent blank is the one thing this must not do, but the page
   cannot know it is a farm week without the doc, so a failed read shows the pill
   with the error and the sheet explains); reached and no weekend covers today
   (hidden); reached and covered (the list).

   TICKS live in bridge_state/{date}.pack as item ids, device-owned, expiring at
   the 4am boundary. Deliberately NO XP: twenty items at a point each would move
   rank for loading a van, which BRIDGE.md rules out. */
var PACK=null, PACK_ERR=null;
var PCARD={k:'_pack',label:'Pack List',glyph:'▤',ac:'var(--amber)'};
function packToday(){
  var w=(PACK&&PACK.weekends)||null; if(!w) return null;
  var keys=Object.keys(w).sort(), hit=null;
  keys.forEach(function(k){ var e=w[k]; if(e&&e.show_from&&e.show_to&&e.show_from<=DATE&&DATE<=e.show_to) hit=e; });
  return hit;
}
function packCounts(e){
  var items=(e&&e.items)||[], done=state.pack||[];
  return {n:items.length, k:items.filter(function(i){return done.indexOf(i.id)>=0;}).length};
}
function paintPackPill(){
  var p=$('#packPill'), t=$('#packTxt'); if(!p||!t) return;
  if(PACK_ERR){ p.classList.remove('hide');
    t.innerHTML='<b>Pack List</b><span>could not read bridge_data/packlist</span>'; return; }
  var e=packToday();
  if(!e){ p.classList.add('hide'); return; }
  p.classList.remove('hide');
  var c=packCounts(e);
  t.innerHTML='<b>Pack List</b><span>'+esc(e.label||'')+' · '+(c.k===c.n&&c.n?'packed, '+c.n+' of '+c.n:c.k+' of '+c.n+' packed')+'</span>';
}
BUILD._pack=function(b){
  if(PACK_ERR){
    b.appendChild(el('div','od-miss','bridge_data/packlist could not be read ('+esc(PACK_ERR)+'). If this is a farm week, the list is in Series Artifacts under the dated prep-list file.'));
    return;
  }
  var e=packToday();

/* ── punch list: prioritised vs everything ─────────────── */
BUILD.punch=function(b,sec){
  var mode='featured';
  /* There was a `showSynced` filter here that hid items already dispatched for
     reconciliation. It went with Sync on 2026-08-06. Nothing writes `synced` any
     more, so the filter could only ever hide items from before that date, and a
     ticked item staying visible is the correct behaviour regardless: a tick has
     to be undoable, and an item that vanishes the instant you touch it cannot be
     unticked. */
  var seg=el('div','seg');
  [['featured','Priority'],['all','Everything']].forEach(function(o,i){
    var bt=el('button','',o[1]);bt.setAttribute('role','tab');
    bt.setAttribute('aria-selected',i===0?'true':'false');
    bt.addEventListener('click',function(){
      mode=o[0];
      seg.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected','false');});
      bt.setAttribute('aria-selected','true');paint();
    });
    seg.appendChild(bt);
  });
  b.appendChild(seg);
  var host=el('div');b.appendChild(host);

  function paint(){
    host.innerHTML='';
    var groups=(sec.groups||[]).map(function(gr){
      var items=(gr.items||[]).filter(function(i){
        if(mode!=='all'&&i.featured===false) return false;
        return true;
      });
      return {gr:gr,items:items};
    }).filter(function(x){return x.items.length;});
    if(!groups.length){
      host.appendChild(el('div','empty','No open items. Enjoy it.'));
      return;
    }
    var shown=0;
    groups.forEach(function(x){
      shown+=x.items.length;
      var det=el('details','grp');det.style.setProperty('--ac',x.gr.accent||'var(--magenta)');
      if(mode==='featured'&&x.gr.open!==false)det.open=true;
      var openN=x.items.filter(function(i){return state.done.indexOf(i.id)<0;}).length;
      var sum=el('summary','','<span class="g-name"><span class="g-dot"></span>'+esc(x.gr.project)+'</span>'+
        '<span class="g-meta"><span class="g-count mono">'+openN+' open</span><span class="g-car">▸</span></span>');
      det.appendChild(sum);
      var gb=el('div','g-body');
      x.items.forEach(function(it){
        var row=el('label','row');
        var ck=el('input');ck.type='checkbox';ck.className='ck';ck.setAttribute('data-id',it.id);
        if(state.done.indexOf(it.id)>=0)ck.checked=true;
        var txt=el('span','r-txt',
          (it.prio?'<span class="pill '+esc(it.prio)+'">'+esc(it.prio)+'</span>':'')+
          esc(it.text)+(it.when?'<span class="when mono">'+esc(it.when)+'</span>':''));
        var acts=el('div','acts');
        /* The full item, behind a toggle. it.full is present only when it says
           something the lead does not, so a short item gets no needless control.
           preventDefault AND stopPropagation are both load-bearing: .row is a
           <label>, so without them expanding an item would tick it off, which is
           the exact thing Sam asked not to have to do to read one. */
        var more=null;
        if(it.full && it.full!==it.text){
          more=el('div','r-more',esc(it.full));
          more.style.display='none';
          var mb=el('button','mini more','⋯');
          mb.setAttribute('aria-expanded','false');
          mb.setAttribute('aria-label','Show the full item');
          mb.addEventListener('click',function(e){
            e.preventDefault();e.stopPropagation();
            var open=more.style.display!=='none';
            more.style.display=open?'none':'block';
            mb.classList.toggle('on',!open);
            mb.setAttribute('aria-expanded',String(!open));
          });
          acts.appendChild(mb);
        }
        acts.appendChild(calBtn(it.text,'From the Bridge punch list · '+(it.project||x.gr.project||''),''));
        var mk=el('button','mini','+');
        if(state.marked.some(function(m){return m.id===it.id;})){mk.classList.add('on');mk.textContent='✓';}
        mk.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
          /* The FULL item goes into the queue, not the display lead. The two have
             opposite audiences: the lead exists so Sam can read the row at 6am,
             and the queue entry is read by a session that has to act on it, where
             a summary is not enough to fire on. Since `text` became a lead this
             is the difference between dispatching "Bridge: emit gcal_dates" and
             dispatching the paragraph that says which rows, why, and what was
             deliberately ruled out. */
          toggleMark({id:it.id,kind:'todo',text:(it.full||it.text),
                      project:x.gr.project,date:it.when},mk);});
        acts.appendChild(mk);
        ck.addEventListener('change',function(){
          if(ck.checked){
            if(state.done.indexOf(it.id)<0)state.done.push(it.id);
            state.marked=state.marked.filter(function(m){return m.id!==it.id;});
            mk.classList.remove('on');mk.textContent='+';
            hit(row);
          } else state.done=state.done.filter(function(y){return y!==it.id;});
          sum.querySelector('.g-count').textContent=
            x.items.filter(function(i){return state.done.indexOf(i.id)<0;}).length+' open';
          saveState();
        });
        row.appendChild(ck);row.appendChild(txt);row.appendChild(acts);
        if(more) row.appendChild(more);
        gb.appendChild(row);
      });
      det.appendChild(gb);host.appendChild(det);
    });
    host.appendChild(el('p','note', mode==='featured'
      ? shown+' shown. Switch to Everything for the full '+allPunchItems().length+'.'
      : 'Everything open: '+shown+' items across '+groups.length+' projects.'));
  }
  paint();
};

/* ── inbox ───────────────────────────────────────────────────────────────────
   Two faults Sam named on 2026-08-06, both fixed here.

   Rows carried no detail. The cause was NOT thinness at the source: the 4am run
   was writing the decision line into `body`, and this renderer reads `summary`,
   so the field was arriving and being dropped on the floor. The feeder now
   validates that (see inbox_problems in feed_bridge.py) and ships `from`,
   `snippet` and `gmail_id` alongside it. This renderer reads them.

   And there was no way to clear a row he had already answered. Dismiss is now
   per-row and lasts the DAY only, because it writes to bridge_state/{date}. A
   thread still unanswered tomorrow comes back tomorrow, so a mistap costs him
   nothing and no real correspondence can be permanently buried by one. Sam's
   call: not permanent.

   Every field below degrades to nothing when absent. A payload that predates
   spin-up 1 renders exactly as it did before rather than sprouting empty quote
   blocks or the string "undefined". */
BUILD.inbox=function(b,sec){
  var items=inboxLive(sec);
  var gone=(sec.items||[]).length-items.length;
  if(!items.length){
    b.appendChild(el('div','empty', gone
      ? 'Nothing left in the inbox today. Dismissed rows come back tomorrow if the thread is still open.'
      : 'Inbox is clear.'));
    return;
  }
  items.forEach(function(m){
    var card=el('div','mail');card.style.setProperty('--ac',m.accent||'var(--cyan)');
    var st=m.state?'<span class="state '+esc(m.stateCls||'note')+'">'+esc(m.state)+'</span>':'';
    /* `from` is the address; `sender` is the display name. Show the address on
       the category line only when it adds something the name does not, so a
       feeder that sends the same string for both does not render it twice. */
    var addr=String(m.from||'').trim();
    var cat=esc(m.cat||'');
    if(addr && addr!==String(m.sender||'').trim()) cat+=(cat?' · ':'')+esc(addr);
    var subj=String(m.subject||'').trim();
    var snip=String(m.snippet||'').trim();
    card.innerHTML='<div class="m-body"><div class="m-cat mono">'+cat+'</div>'+
      '<div class="m-from">'+esc(m.sender||'')+st+'</div>'+
      (subj?'<div class="m-subj">'+esc(subj)+'</div>':'')+
      '<div class="m-sum">'+esc(m.summary||'')+'</div>'+
      (snip?'<div class="m-snip">'+esc(snip)+'</div>':'')+'</div>';
    var acts=el('div','acts');
    /* m.gcal_dates when the feeder supplies one. The grease-trap row is the case
       that exposed this: the email says "confirmed 08/03, 8am to 12pm" but that
       date lives ONLY inside the human-readable summary string, so the button had
       nothing structured to build an event from and fell back to a one-hour block
       at the next round hour. That fallback is correct for a genuinely undated
       row and wrong here, and the fix belongs in the feeder — the app cannot
       invent a date it was never given, and guessing one out of prose would put
       a confidently wrong appointment in the calendar. */
    acts.appendChild(calBtn(m.subject||('Re: '+(m.sender||'')),
      'From the Bridge inbox.\n\nFrom: '+(m.sender||'')+'\nSubject: '+(m.subject||'')+'\n\n'+(m.summary||''),
      '', m.gcal_dates||''));
    acts.appendChild(gmailBtn(m));
    if(m.replyable!==false){
      var id=inboxId(m);
      var mk=el('button','mini','+');
      mk.title='Queue a drafted reply for a session to write in your voice';
      if(state.marked.some(function(x){return x.id===id;})){mk.classList.add('on');mk.textContent='✓';}
      /* preventDefault AND stopPropagation on every control in this card. It has
         bitten twice: these sit inside rows that are or have been <label>s, and a
         label forwards a click to its control, so a bare handler ticks the item
         off as a side effect of pressing a button next to it. */
      mk.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
        toggleMark({id:id,kind:'reply',sender:m.sender,subject:m.subject,
                    body:m.summary||m.snippet||''},mk);});
      acts.appendChild(mk);
    }
    var dz=el('button','mini','✕');
    dz.title='Answered or handled. Hides this row for today only; it returns tomorrow '+
             'if the thread is still open.';
    dz.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation();
      var id=inboxId(m);
      if(state.dismissed.indexOf(id)<0) state.dismissed.push(id);
      // Drop it from the marked set too, or a dismissed row keeps a phantom
      // reply queued against something he has said he is finished with.
      state.marked=state.marked.filter(function(x){return x.id!==id;});
      saveState(); refreshCounts();
      openDetail(cardByKey('inbox'));
    });
    acts.appendChild(dz);
    card.appendChild(acts);b.appendChild(card);
  });
};
/* One id derivation, used by the mark, the dismiss and the filter. The fallback
   detaches whenever the feeder rewrites either half, which is why `id` is
   validated at the source; it is here so a payload without one still works
   rather than dismissing every row at once under a shared empty key. */
function inboxId(m){ return m.id||((m.sender||'')+'|'+(m.subject||'')); }
/* Rows not dismissed today. The sheet, the tile number and the badge all read
   this, so dismissing a row makes the mosaic stop demanding attention for it
   immediately rather than at the next 4am run. */
function inboxLive(sec){
  return (sec.items||[]).filter(function(m){ return state.dismissed.indexOf(inboxId(m))<0; });
}
/* The run's own owed-a-reply count, less anything Sam has dismissed today. Derived
   from the feeder's number rather than recounted, because `flag` encodes a triage
   judgement the page cannot reproduce from the item list. Clamped at zero: on a
   payload where flag is already lower than the replyable count, the subtraction
   can otherwise go negative and render "-1 owed". */
function inboxFlag(sec){
  var f=parseInt(sec&&sec.flag,10);
  if(!isFinite(f)) return null;
  var d=(sec.items||[]).filter(function(m){
    return m.replyable!==false && state.dismissed.indexOf(inboxId(m))>=0;
  }).length;
  return Math.max(0,f-d);
}

/* The news card was removed on 2026-08-06. Deleted with it: BUILD.news,
   FACE.news, topicScore, storyState, applyVote, voteNote, savePrefs and the
   bridge_state/_prefs read that fed them.

   It was a curation engine — per-topic vote scores, mute and boost thresholds,
   a reversible one-tap ballot — and Sam did not want a news feed on the surface
   he reads before coffee. The slot goes to a Boothby study card in spin-up 4.

   `_prefs` is deliberately NOT deleted from Firestore. It is Sam-only, it costs
   nothing to leave, and removing user state to tidy up is how you find out
   something else was reading it. NEWS-CURATION.md and read_prefs.js carry
   retirement headers rather than being deleted, for the same reason. */


/* ══ SERVICE ═══════════════════════════════════════════════════════════════
   The panel shows the highlights the feeder wrote. The sheet reads the nightly
   `revel/{service-date}` docs directly and builds Last night / Week / Month.

   Those docs are the same ones the staff portal renders, they are readable by
   Sam's signed-in account, and they carry far more than the four stats the
   payload copies across. Reading them here means the Bridge stops being a
   pointer to the portal for anything beyond a headline.

   REVEL DOC IDS ARE SERVICE DATES, NOT GENERATION DATES. A report generated on
   the morning of 7/30 covers 7/29 service and is stored at revel/2026-07-29.
   Walking back from today and taking the first doc that exists is therefore the
