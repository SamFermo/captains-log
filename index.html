<script>
(function(){
'use strict';

/* Accent carries MEANING, not identity.
     magenta = this wants something from you
     cyan    = this is here to inform you
   Six different hues told Sam nothing he could not already read off the glyph and the
   label, and made every tile shout at the same volume. Two hues let the grid say, at a
   glance and before any reading happens, which half of the morning is work. */
/* Array order IS ring order, clockwise from twelve o'clock. `live` marks a card
   with no payload section: weather is fetched by the page, so it must not be
   dropped from the ring just because the 4am run does not write it. */
var CARDS = [
  {k:'punch',    label:'Punch List', glyph:'✓', ac:'var(--mag)'},
  {k:'inbox',    label:'Inbox',      glyph:'✉', ac:'var(--mag)'},
  {k:'service',  label:'Service',    glyph:'▲', ac:'var(--mag)'},
  {k:'calendar', label:'Calendar',   glyph:'◷', ac:'var(--cyan)'},
  {k:'news',     label:'News',       glyph:'◈', ac:'var(--cyan)'},
  {k:'weather',  label:'Weather',    glyph:'◇', ac:'var(--cyan)', live:true},
  {k:'routine',  label:'Routine',    glyph:'◐', ac:'var(--cyan)'}
];

var $=function(s){return document.querySelector(s);};
var el=function(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});};
/* Physical acknowledgement that a tick landed. Removed after it plays so the
   class can be re-added on the next one. */
function hit(node){
  if(!node)return;
  node.classList.remove('hit');void node.offsetWidth;node.classList.add('hit');
  setTimeout(function(){node.classList.remove('hit');},400);
}

var db=null,user=null,DATA=null,DATE=null;
/* `synced` is the gap that made three separate things look broken at once.
   `done` means "Sam ticked this today". It does NOT mean "this has been handed
   off", and the app was treating the two as the same fact. So after a successful
   Sync the dock still offered to sync the same four items, and the punch sheet
   still listed them as live work. A tick and a dispatch are different events and
   now have different state. */
/* intakeJp: has the intake jackpot already played today. Persisted, not in-memory —
   see showIntakeJackpot() for why this one needs a guard when the session payout does not. */
var state={done:[],marked:[],ro:[],synced:[],water:0,cider:false,vits:false,
           intakeJp:false,routineJp:false,homeSeen:[]};
/* 96oz, as eight 12oz cups. Sized on 2026-08-04 against the US National Academies
   figure of 3.7L total water a day for men: that number INCLUDES water from food
   (roughly a fifth of it) and from every other drink, coffee included, so plain
   water lands near 96oz rather than the full 125. The familiar "eight glasses"
   is 64oz and has no strong evidence behind it, which would have made it a soft
   target for someone on his feet through a hot service. */
var WATER_TARGET=8, WATER_OZ=12;

/* ══ THE WEIGHTS ═══════════════════════════════════════════════════════════
   Phase 2, set 2026-08-04. This is the REVERSIBLE layer and that is the whole
   reason it was written second. RANKS ratchets: a threshold can never be revised
   without either stranding Sam at a rank he no longer qualifies for or demoting
   him. These numbers carry no such debt and can be retuned any morning without
   touching a single earned rank. So the ladder fixed the time horizon first and
   these were fitted to it afterwards.

   Fitted BLIND, and that is worth writing down rather than discovering later.
   The only history in the ledger is 7/30, 7/31 and 8/2, which were Sam building
   this system: he was adding punch items faster than he closed them and nothing
   scored but task completion. Those rows predict nothing about a finished board,
   so there is no empirical base under these numbers at all. The calibration is
   the first real fortnight. If standing() reads above ~9/day across it, they are
   running hot and they come down. Nothing about that strands a rank.

   Sized so a normal day lands near the ~8/day the ladder assumes. Ceiling is
   higher, deliberately: a perfect day should feel like a perfect day.

   NO FRACTIONS ANYWHERE. An earlier cut priced fire cider and the multivitamin at
   0.5 each, which puts a non-integer into xpTotal() and therefore into both the
   rank comparison and the number printed on the strip. The strip would read 15.5,
   and rounding for display would recreate exactly the three-different-numbers bug
   that paintReactor already had to be moved to fix. Doubling every threshold to
   absorb halves is not available either, because thresholds ratchet. Integers. */
var W={
  punch:1,    punchCap:5,     // a closed punch item, capped per day
  routine:3,                  // the WHOLE routine block, all or nothing. See routineXp().
  sessionCap:3,               // work a SESSION closed, credited automatically. See creditClosed().
  intake:3,                   // water + fire cider + multivitamin, all or nothing
  study:2,    // Boothby daily study tick — NO SURFACE YET, see below
  win:3       // derived work win     — NO SURFACE YET, rule unwritten
};
/* study and win are confirmed numbers with no source to read them from. They live
   here rather than in a note so the decision survives until the sources exist:
   Boothby's transcript and a rule for what counts as a work win in the nightly
   Revel report. dayXp() deliberately does NOT sum them — a scoring path with no
   way to fire is a path nobody can test. Wire them when the source lands. */

/* THE ROUTINE IS ALL-OR-NOTHING TOO, from 2026-08-05, and it pays a flat 3 for the
   whole block rather than 1 a step. Sam's call, and the same shape he chose for
   intake: every movement gets its own checkbox because ticking them one at a time
   is the satisfying part, but the block only scores when every one is ticked.

   This replaces `routineCap`, which existed because the page could not trust the
   feeder's step COUNT — five neck-roll checkboxes were jointly worth five closed
   punch items, and the captain's log rewrites this payload every morning, so any
   run could move the ladder by changing the length of a list. A flat block value
   subsumes that entirely: 5 steps or 2, the routine is worth 3 and only when
   finished. The count can now change freely without touching the economy.

   It also closes a hole the cap left open. With `routineCap:3` against a 5-step
   payload, ticking any 3 of 5 scored full marks and the last two were free. */

/* ALL THREE OR NOTHING. Sam's call, 2026-08-04, and it is stricter than the
   0/1/2 water tier it replaces: 96oz AND the fire cider AND the multivitamin, or
   this track pays nothing at all. Same ceiling as before, materially harder to
   reach, which pulls the daily AVERAGE down even though the maximum is unmoved.

   The known failure mode, recorded so it is recognised if it shows up rather than
   rediscovered: at 6pm on five cups with the cider missed, the day is already
   lost and nothing rewards finishing the water. Partial credit is what keeps the
   back half of a day live. If Sam finds himself stopping at five, the fix is a
   half tier going back in, and it costs nothing because these retune freely. */
function intakeXp(){
  return ((state.water||0)>=WATER_TARGET && state.cider && state.vits) ? W.intake : 0;
}

/* One place that answers "what are today's routine steps", so the scorer, the block
   and the quest board cannot disagree about the list they are counting. */
function routineSteps(){ return (DATA&&DATA.routine&&DATA.routine.steps)||[]; }
function routineId(i){ return 'routine-'+DATE+'-'+i; }
function routineDone(){
  var st=routineSteps(), n=0;
  for(var i=0;i<st.length;i++) if(state.done.indexOf(routineId(i))>=0) n++;
  return n;
}
/* Zero unless EVERY step is ticked. The `st.length &&` guard matters: without it a
   day whose payload carries no routine at all would read 0===0 and pay 3 for
   nothing, which is the same class of bug as a failed read rendering as an empty
   day — asserting completion of something that was never there. */
function routineXp(){
  var st=routineSteps();
  return (st.length && routineDone()===st.length) ? W.routine : 0;
}
var queue=[];
/* The XP ledger: bridge_state/_streak, {days:[{d,closed,offered,open}]}.
   Today's bridge_state/{date}.done was the only history that existed, which is why
   nothing could ever say "four days running" — there was no yesterday to read.
   WRITTEN ONLY BY THIS DEVICE. The 4am feeder must never touch it, for the same
   reason it must never touch bridge_state/{date}: a rebuild that owned this doc
   would rewrite Sam's own record of what he did. It needs no rules change —
   `match /bridge_state/{day}` already covers any doc id, exactly like _prefs and
   _queue — and it is Sam-only in both directions, which is right, because it is a
   log of his mornings.
   It advances only when the page is opened. That is deliberate: the streak measures
   showing up, and it breaks honestly on a day he doesn't. */
var ledger={days:[]};
/* Everything the 60-row window has already dropped, kept as a number plus the date
   it is banked THROUGH. The watermark is the idempotence guard — see the trim in
   saveLedger(). Both persist in _streak alongside the rows. */
var XP_BANKED=0, XP_BANKED_THROUGH='';
var PREV_RANK=null, promoShown=false;
/* ── SESSION CREDIT ────────────────────────────────────────────────────────
   Work a session closed on Sam's behalf, credited automatically.

   The problem it solves, in his words on 2026-08-04: "it's weird to have all of
   these items done now, but in the bridge they are all still there and I don't get
   any of the gratification of doing them in the moment." Before this, closing an
   item removed it from the payload and it was worth nothing at all — the more work
   got done for him, the less his ledger showed.

   CLOSED holds bridge_closed/{date} docs, written by push_closed.py at the moment
   Close the Loop fires. PAID_IDS is the bank of item ids already credited, which is
   what makes a refresh worth nothing: paying out session work rather than Sam's own
   ticks means reloading cannot manufacture anything to pay for, and the bank means a
   second read of the same doc pays a second time never.

   SESSION_XP is date -> points, kept separate from the ledger rows so a past day can
   be credited without rewriting a row Sam already earned. */
var CLOSED={}, PAID_IDS=[], SESSION_XP={}, jackpotShown=false;
var CLOSED_LOOKBACK=4;
function closedKeys(){
  var out=[], d=new Date(DATE+'T12:00:00');
  for(var i=0;i<CLOSED_LOOKBACK;i++){ out.push(dayKey(d)); d.setDate(d.getDate()-1); }
  return out;
}
/* Capped on read as well as on write. The cap is the one number here Sam may want to
   retune, and a stored value from before a change must never out-rank the current rule. */
function sessionXpOn(d){ return Math.min(SESSION_XP[d]||0, W.sessionCap); }
/* News signals are WEIGHTED, not binary.
   v1 was one-tap-kills: `Less` pushed every one of a story's topics straight into
   mute_topics, so a single irritated tap on an item tagged ["labor","seattle restaurants"]
   silently and permanently killed both subjects, with nothing on screen to show it had
   happened or any way to walk it back. That is a lot of consequence for a thumb.
   Now each tap is one vote. A topic has to earn its mute. */
var MUTE_AT = -2;    // topic score at or below this is suppressed
var BOOST_AT = 2;    // at or above this, ranked up and searched wider
var prefs={topic_scores:{},id_votes:{}};
var saveTimer=null, prefTimer=null;

/* THE BRIDGE'S DAY RUNS 4am TO 4am, not midnight to midnight. Sam's call 2026-08-05,
   and the reason is simply that he is often up past midnight: at 12:12am the counter
   reset and the water he had drunk that evening became unreachable, because the day it
   belonged to had already ended.

   ONE call site, `DATE=todayKey()` in load(), and everything keys off DATE — the brief,
   the state doc, the routine ids, the ledger rows, the streak. So the boundary is
   defined once, here, and the whole app moves together. Shifting only the intake counter
   was considered and rejected: two definitions of "today" in one file drift.

   It also closes two things that were already wrong.

   The midnight-to-4am blank. There is no bridge/{date} until the 4am run writes one, so
   the page had nothing to show every night from midnight and leaned on the stale
   fallback to look sane. It now asks for the day it is actually still in, and that
   brief exists. The fallback stays for a genuinely failed run, which is what it was for.

   Positional routine ids. Those are `routine-{DATE}-{i}` rather than content-derived
   like punch ids, so ticking a mobility step at 1am wrote an id against TOMORROW's date
   while the screen was still showing yesterday's steps. When the real brief landed at
   4:24 with a different list, index 0 could be a different habit.

   Residual window, known and accepted: the run has been observed landing at 04:24 and
   04:30, so between 4:00 and roughly 4:30 the day has turned but the brief has not been
   written. The stale bar covers it and says so. 5am would close the gap and stop
   matching the name.

   NOT absolute-time arithmetic. Subtracting four hours from the instant is wrong on the
   spring-forward day, when 4am is only three absolute hours after midnight, and it would
   report the previous day for the whole 4am hour. Read the LA wall clock, then shift the
   CALENDAR. Noon is used to build the Date because noon never lands near a transition. */
var DAY_START_HOUR = 4;
function todayKey(){
  var p={};
  new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date()).forEach(function(x){ p[x.type]=x.value; });
  var d=new Date(p.year+'-'+p.month+'-'+p.day+'T12:00:00');
  // % 24 because some engines render midnight as "24" under an h23 request.
  if((+p.hour % 24) < DAY_START_HOUR) d.setDate(d.getDate()-1);
  return dayKey(d);
}

/* NAMED app, deliberately, and it must stay named.
   The staff portal is served from this same origin (samfermo.github.io/sf-portal/) and
   initialises the DEFAULT Firebase app with this same apiKey, then calls
   signInAnonymously() on it unconditionally at load. Firebase persists a session under
   `firebase:authUser:<apiKey>:<appName>` in IndexedDB, scoped to the ORIGIN — so while both
   pages used '[DEFAULT]' they were sharing one storage slot, and every visit to the portal
   overwrote Sam's Google session with the portal's anonymous user. The next Bridge open
   restored an anonymous user, `u.email` was null, and onAuthStateChanged dropped straight to
   the sign-in gate. That is the whole reason the Bridge asked for a login every morning
   despite LOCAL persistence being set correctly the entire time.
   Naming this app moves the Bridge to `...:bridge`, which nothing else on the origin writes,
   and keeps it immune if some future page also grabs '[DEFAULT]'. Anything reading Firestore
   from this page in the console or over Chrome MCP must use firebase.app('bridge'), because
   there is no DEFAULT app here any more. */
var bridgeApp=firebase.initializeApp(window.FIREBASE_CONFIG,'bridge');
var auth=bridgeApp.auth();
db=bridgeApp.firestore();
// LOCAL persistence keeps the session in IndexedDB across reloads and app restarts, so a
// recognised device never re-prompts. Set before any sign-in call so the very first session
// is stored too.
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(e){
  var g=$('#gateErr'); if(g) g.textContent='Could not enable persistent login: '+(e&&e.message||e);
});

var provider=new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});

$('#signin').addEventListener('click',function(){
  $('#gateErr').textContent='';
  auth.signInWithPopup(provider).catch(function(err){
    var c=err&&err.code||'';
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'||c==='auth/cancelled-popup-request'){
      auth.signInWithRedirect(provider).catch(showAuthErr);
    } else showAuthErr(err);
  });
});
function showAuthErr(err){
  var c=err&&err.code||'', m='Sign-in failed. '+(err&&err.message||'');
  if(c==='auth/unauthorized-domain') m='Domain not authorized in Firebase Auth. Add samfermo.github.io under Authentication → Settings → Authorized domains.';
  if(c==='auth/operation-not-allowed') m='Google sign-in is not enabled. Firebase console → Authentication → Sign-in method.';
  $('#gateErr').textContent=m;
}
auth.getRedirectResult().catch(showAuthErr);

auth.onAuthStateChanged(function(u){
  if(!u||!u.email){showGate();return;}
  /* ROUTE, don't reject. This used to sign out any account not in BRIDGE_ALLOWED before
     a single read happened, which is why Amy could not reach anything: there was nowhere
     for her to land.

     Her address is deliberately NOT added to BRIDGE_ALLOWED. That list holds Sam's two
     addresses, which are already public, and this repo is public — putting a family
     member's personal address in it would ship it to GitHub. Identity for the house list
     is derived from the Firestore rules instead: try the read, and let the rules decide.
     A stranger who signs in gets permission-denied on both and lands on a no-access
     state, having loaded nothing. */
  if(window.BRIDGE_ALLOWED.indexOf((u.email||'').toLowerCase())<0){
    user=u; $('#gate').classList.remove('on');
    if(bootedFor===u.uid) return;
    bootedFor=u.uid;
    u.getIdToken().then(loadHomeOnly).catch(loadHomeOnly);
    return;
  }
  user=u;$('#gate').classList.remove('on');$('#app').classList.remove('hide');
  // Wait for a real ID token before the first read. onAuthStateChanged resolves as soon as
  // the user object exists, which is EARLIER than the Firestore SDK having a token to send —
  // so reading immediately raced and came back permission-denied on a perfectly valid
  // session. Awaiting the token fixes the cause; the retry below is only a backstop now.
  // onAuthStateChanged also fires more than once (restored session, then token refresh), so
  // this is single-flighted per uid to stop a second pass stomping a good first one.
  if(bootedFor===u.uid) return;
  bootedFor=u.uid;
  u.getIdToken().then(function(){ load(); }).catch(function(){ load(); });
});
var bootedFor=null;
function showGate(){$('#gate').classList.add('on');$('#app').classList.add('hide');}

/* A read that FAILS and a day that has NO BRIEF are completely different facts, and the
   first version of this rendered both as "Nothing posted yet". That is the exact silent
   failure this app exists to prevent: it would have had Sam believing the 4am run died on a
   morning it ran perfectly.

   Two things are handled here:
   • The race. onAuthStateChanged fires before the Firestore SDK has the auth token, so the
     very first read can come back permission-denied on a correctly-configured account.
     Retry a few times with backoff before believing it.
   • The lie. If the read ultimately fails, say so, with the error code, and offer a retry.
     Never claim there is no brief. And never wipe data already on screen because a refresh
     failed — stale-but-labelled beats blank-and-wrong. */
var loadAttempt=0;
function load(){
  DATE=todayKey();
  var btn=$('#refresh');btn.classList.add('spin');
  loadWeather();          // independent of Firestore, so it is not chained to it
  loadAttempt++;
  var mine=loadAttempt;
  /* Each bridge_closed read swallows its own failure. Without that, a day before the
     Firestore rule for this collection is published would reject the whole Promise.all
     and take the entire Bridge down with it — a new feature must never be able to break
     the brief. A missing doc and a forbidden one both simply mean "nothing to credit". */
  var _ck=closedKeys();
  return Promise.all([
    db.collection('bridge').doc(DATE).get(),
    db.collection('bridge_state').doc(DATE).get(),
    db.collection('bridge_state').doc('_prefs').get(),
    db.collection('bridge_state').doc('_queue').get(),
    db.collection('bridge_state').doc('_streak').get(),
    /* Swallows its own failure, exactly like the bridge_closed reads below and for the
       same reason: a household list that is missing, or a rule not yet published, must
       never be able to take the morning brief down with it. HOME_ERR carries the reason
       so the card can say "could not reach" rather than "nothing here". */
    db.collection('home_list').doc('items').get().catch(function(e){ return {__err:e}; })
  ].concat(_ck.map(function(k){
    return db.collection('bridge_closed').doc(k).get().catch(function(){ return null; });

  }))).then(function(r){
    // A superseded pass must not repaint, but it must not silently drop the data either —
    // returning early here without assigning DATA is what left the page with a rendered
    // hero and an empty grid.
    if(mine!==loadAttempt && DATA) return;
    var s=r[1].exists?r[1].data():{};
    state.done=s.done||[];state.marked=s.marked||[];state.ro=s.ro||[];
    state.synced=s.synced||[];state.water=s.water||0;
    state.cider=!!s.cider;state.vits=!!s.vits;
    state.intakeJp=!!s.intake_jp;state.routineJp=!!s.routine_jp;
    state.homeSeen=s.home_seen||[];
    var p=r[2].exists?r[2].data():{};
    prefs.topic_scores=p.topic_scores||{};
    prefs.id_votes=p.id_votes||{};
    // One-time lift from the v1 binary shape so existing taps are not thrown away. A v1
    // mute was a deliberate signal even if the mechanism was too blunt, so it lands at the
    // threshold rather than past it — one more tap re-mutes, one More tap rescues it.
    if(!p.topic_scores && (p.mute_topics||p.boost_topics)){
      (p.mute_topics||[]).forEach(function(t){prefs.topic_scores[t]=MUTE_AT;});
      (p.boost_topics||[]).forEach(function(t){prefs.topic_scores[t]=BOOST_AT;});
      (p.mute_ids||[]).forEach(function(i){prefs.id_votes[i]=-1;});
      (p.boost_ids||[]).forEach(function(i){prefs.id_votes[i]=1;});
    }
    queue=(r[3].exists?r[3].data():{}).items||[];
    var _led=(r[4].exists?r[4].data():{})||{};
    ledger={days:_led.days||[]};
    // Captured BEFORE saveLedger runs, so a promotion earned by today's own
    // check-offs is still detectable after the row for today has been written.
    PREV_RANK=_led.rank_key||null;
    // Captured here for the same reason as PREV_RANK: saveLedger() runs before the
    // check and would otherwise overwrite the baseline being compared against.
    PAID_IDS=_led.paid_ids||[];
    SESSION_XP=_led.session_xp||{};
    XP_BANKED=+(_led.xp_banked||0)||0;
    XP_BANKED_THROUGH=_led.xp_banked_through||'';
    /* home_list sits at index 5, so the bridge_closed window starts at 6. If another
       read is ever inserted above, this offset moves with it — that coupling is the
       cost of one Promise.all, and getting it wrong silently loads the wrong docs
       rather than erroring. */
    var _home=r[5];
    if(_home && _home.__err){
      HOME_ERR=(_home.__err.code)||String(_home.__err); HOME={items:[]};
    } else {
      HOME_ERR=null;
      HOME={items:(_home&&_home.exists?(_home.data().items||[]):[])};
    }
    CLOSED={};
    _ck.forEach(function(k,i){
      var snap=r[6+i];
      if(snap && snap.exists) CLOSED[k]=snap.data();
    });
    renderQueue();
    paintHomePill();
    LOAD_ERR=null;

    /* Today's brief exists → render it. It does not → look back for the most
       recent one rather than blanking the page. Between midnight and the 4am run
       there is NEVER a document for today, so the old behaviour turned the Bridge
       off for four hours every night, and turned it off entirely on any morning
       the run failed. Stale-but-labelled beats blank-and-wrong; that is already
       the rule this file follows for a failed refresh, and a brief that has not
       been written yet is the same situation arriving from the other direction. */
    if(r[0].exists){
      DATA=r[0].data(); SRC_DATE=DATE; STALE=null;
      return finish();
    }
    return lookBack().then(function(found){
      DATA  = found ? found.data : null;
      SRC_DATE = found ? found.date : null;
      STALE = found ? {date:found.date,
                       weekday:found.data.weekday||'',
                       label:found.data.date_label||found.date} : null;
      return finish();
    });

    // render() is called INSIDE its own try so that a rendering bug is reported as a
    // rendering bug. Previously any exception in here fell through to the read-failure
    // catch below, and a plain ReferenceError in renderRecap was shown to Sam as
    // "could not refresh" — sending him to look at Firestore for a typo in this file.
    function finish(){
    try{ render(); }
    catch(err){
      RENDER_ERR=err;
      // #panelHost, not the old #grid. This handler is the one path whose entire
      // job is to report a failure, so a stale selector here means a render bug
      // throws a SECOND time inside its own reporter and Sam sees a blank page
      // with no explanation at all.
      var ph=$('#panelHost');
      if(ph) ph.innerHTML='<div class="empty">'+
        'This page failed to draw itself. The data loaded fine.<br><br>'+
        esc((err&&err.message)||String(err))+'</div>';
      var box=$('#recap');box.classList.remove('hide');box.classList.add('fail');box.open=true;
      $('#rcTitle').innerHTML='<b>Display error</b> · the data is fine, the page is not';
    }
    // AFTER render, so a rendering bug cannot stop the day being recorded, and
    // guarded on DATA so a failed read never writes a row claiming Sam showed up
    // to a brief that was never there.
    //
    // paintReactor runs AGAIN between the two, and it is not redundant. render()
    // paints the strip from the ledger as it was READ, then saveLedger rewrites
    // today's row from the live quest set. Without the repaint the strip shows a
    // total that no longer matches what was just persisted, and checkPromotion
    // then judges against a third number Sam never saw. All three have to agree.
    if(DATA){ saveLedger(); paintReactor(); checkPromotion(); checkJackpot(); }
    btn.classList.remove('spin');
    }
  }).catch(function(e){
    var code=(e&&e.code)||'';
    var transient=(code==='permission-denied'||code==='unavailable'||code==='unauthenticated');
    if(transient && retries<3){
      retries++;
      return new Promise(function(res){setTimeout(res,400*retries);}).then(load);
    }
    retries=0;
    btn.classList.remove('spin');
    if(DATA){ // keep what is on screen, but say it is stale
      LOAD_ERR={code:code,message:(e&&e.message)||String(e),stale:true};
      renderLoadError();
      return;
    }
    LOAD_ERR={code:code,message:(e&&e.message)||String(e),stale:false};
    render();
  });
}
var retries=0, LOAD_ERR=null, RENDER_ERR=null;
/* SRC_DATE is the date of the brief being DISPLAYED. DATE stays today, always.
   That separation is the whole point: check-offs, the streak ledger and queue
   items are "what Sam did today" and must key to today even when the content on
   screen came from yesterday. Tick something off the stale brief at 1am and it is
   still ticked when the 4am run replaces the content, because the ids are
   content-derived and the state doc never moved. */
var SRC_DATE=null, STALE=null, LOOKBACK_ERR=null;
var LOOKBACK_DAYS=4;

function lookBack(){
  LOOKBACK_ERR=null;
  var days=[], d=new Date(DATE+'T12:00:00');
  for(var i=0;i<LOOKBACK_DAYS;i++){ d.setDate(d.getDate()-1); days.push(dayKey(d)); }
  return Promise.all(days.map(function(k){
    return db.collection('bridge').doc(k).get().then(function(s){
      return s.exists?{date:k,data:s.data()}:null;
    });
  })).then(function(res){
    for(var i=0;i<res.length;i++) if(res[i]) return res[i];   // days[] is newest first
    return null;
  }).catch(function(e){
    /* Loud, not silent. If the lookback itself failed we must not let the page
       imply there was simply nothing to find — that is the same lie as rendering
       a failed read as an empty day, which is the bug this whole file is built
       around avoiding. The reason gets printed in the empty-state message. */
    LOOKBACK_ERR=(e&&e.code)||(e&&e.message)||String(e);
    return null;
  });
}

function renderLoadError(){
  var box=$('#recap');
  box.classList.remove('hide');box.classList.add('fail');box.open=true;
  $('#rcTitle').innerHTML='<b>Could not refresh</b> · showing the last good copy';
  var b=$('#rcBody');b.innerHTML='';
  b.appendChild(el('div','rc-fails','<h4>Read failed</h4><div>'+
    esc((LOAD_ERR.code||'unknown')+' — '+LOAD_ERR.message)+
    '</div><div>What you see below is the last copy that loaded, not necessarily current.</div>'));
}
$('#refresh').addEventListener('click',load);

function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(!user)return;
    db.collection('bridge_state').doc(DATE).set({
      done:state.done,marked:state.marked,ro:state.ro,synced:state.synced,
      water:state.water,cider:!!state.cider,vits:!!state.vits,
      intake_jp:!!state.intakeJp,routine_jp:!!state.routineJp,
      home_seen:state.homeSeen||[],
      updated_at:new Date().toISOString(),by:user.email},{merge:true}).catch(function(){});
    /* saveLedger, THEN repaint, THEN judge the promotion — the same order the load
       path uses, and for the same reason. saveLedger is what folds today's row into
       ledger.days, and rank() reads that. The synchronous paintReactor at the bottom
       of this function runs BEFORE this timeout fires, so it necessarily paints the
       rank total from a ledger that does not yet contain today. Without this line the
       strip keeps showing the pre-tick total until some unrelated event repaints it.
       Measured 2026-08-04: completing the intake block persisted xp:3 correctly while
       the strip sat on 12/50 indefinitely, and only corrected on closing the sheet.
       The bug predates the weights; the 3-point intake jump is what made it visible,
       next to a row that says "Complete · +3". */
    saveLedger(); paintReactor(); checkPromotion();
  },600);
  dock();
  // Live, while the sheet is still open over the top: the node value and the XP
  // arc move as he ticks, so closing the sheet confirms what he already saw. This
  // pass is still worth making: the arc comes from questSet(), which is current
  // immediately, so it tracks the tick with no delay. Only the ledger-derived rank
  // total lags, and the repaint above is what settles it.
  paintTiles();
  paintReactor();
}

/* ── the ledger ────────────────────────────────────────────────────────────
   Today's quest board is the FEATURED punch items plus the routine steps, and
   nothing else. Scoring against all 243 open items would print a 2% completion
   bar every morning before coffee, which is a participation medal running in
   reverse: a number that can never move is not feedback, it is weather. The
   featured set is already the list Sam is actually trying to clear, it is
   already computed in build_punch.py, and it resets daily, so it can genuinely
   reach full. The 243 gets its own honest readout as a backlog with a
   direction, because a backlog has a trend, not a percentage. */
/* TWO different questions, which used to be one and were both answered wrong.

   `offered` / `done` is the day's QUEST BOARD: the featured short list plus the
   routine steps. It is the denominator of the XP arc, and it has to stay the
   short list — counting all 278 open items would render five closes as a 2% arc.

   `closed` is what Sam ACTUALLY ticked, featured or not. Closing something from
   the "Everything" tab is the same work as closing it from "Priority", and
   scoring only the featured subset is exactly why the ledger recorded 1 on
   2026-07-31 when the state doc for that day holds 5, and 2 on 2026-08-02 when
   the state doc holds 6. XP counts `closed`. The arc counts `done`. */
/* punch and routine are counted SEPARATELY as well as together, because they are
   capped separately (see W). `closed` stays as their sum so the ledger rows written
   before the weights shipped keep meaning what they meant. */
function questSet(){
  var board=[], all=[], pDone=0, rDone=0;
  allPunchItems().forEach(function(i){
    all.push(i.id);
    if(i.featured!==false) board.push(i.id);
    if(state.done.indexOf(i.id)>=0) pDone++;
  });
  var st=(DATA&&DATA.routine&&DATA.routine.steps)||[];
  for(var i=0;i<st.length;i++){
    var rid='routine-'+DATE+'-'+i;
    board.push(rid); all.push(rid);
    if(state.done.indexOf(rid)>=0) rDone++;
  }
  var done=0;
  board.forEach(function(id){ if(state.done.indexOf(id)>=0) done++; });
  return {ids:board,total:board.length,done:done,
          closed:pDone+rDone,punch:pDone,routine:rDone};
}

/* Today's score. The ONE place a day's XP is computed, so the ledger, the strip
   and the promotion check can never be reading three different numbers. */
function dayXp(){
  var q=questSet();
  /* Tick-derived ONLY. Session credit is deliberately not added here: this value is
     what saveLedger writes into the day row, and xpTotal() adds session points on top
     of every row. Folding them in here too would count the same work twice, and the
     strip, the ladder and the weekly bars would each disagree by a different amount. */
  return Math.min(q.punch,W.punchCap)*W.punch
       + routineXp()
       + intakeXp();
}

/* Does the brief say today is a day off? The payload already knows: rest days
   carry it on a chip and in the routine card's caption ("mobility · rest day",
   "OFF DAY"). Read rather than inferred, so the streak can stop treating a
   deliberate rest exactly like a day the Bridge was ignored. */
function isRestDay(){
  if(!DATA) return false;
  var hay=((DATA.chips||[]).map(function(c){return c&&c.label||'';}).join(' ')+' '+
           ((DATA.routine&&DATA.routine.unit)||'')).toLowerCase();
  return /\brest day\b|\boff day\b/.test(hay);
}
/* Called on every successful load AND after every state change. The load call is
   the whole point of `opened`: the streak measures showing up, so a day Sam reads
   the brief and ticks nothing still has to leave a mark. Before this it had one
   call site inside saveState(), which is why 2026-08-01 and 2026-08-03 have no
   row at all despite briefs existing for both. */
function saveLedger(){
  if(!user||!DATE||!DATA) return;          // never write a day we could not read
  var q=questSet();
  var days=(ledger.days||[]).filter(function(d){return d && d.d!==DATE;});
  days.push({d:DATE,opened:true,rest:isRestDay(),
             closed:q.closed,offered:q.total,done:q.done,
             water:state.water,cider:!!state.cider,vits:!!state.vits,
             open:allPunchItems().length,xp:dayXp()});
  days.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});
  /* ══ THE 60-DAY CLIFF ══════════════════════════════════════════════════
     This trim used to just throw the oldest row away, and xpTotal() summed exactly
     what survived. The consequence was not a wobble, it was the end of the
     commission being cumulative: past 60 rows you drop as much as you earn, so the
     total FLATTENS PERMANENTLY at roughly sixty times the daily rate. Reproduced
     2026-08-05 against this code at a steady 5/day — day 60 read 307, day 61 read
     300, and day 62 read 300, and it never moves again. That ceiling clears Petty
     Officer and Chief Petty Officer and then never reaches Ensign at 450. Not
     slowly. Never. And because the trim WRITES the shortened array back to
     _streak, the rows were being destroyed in Firestore, not merely hidden.

     Worse, SESSION_XP is not trimmed, so it kept compounding while Sam's own ticks
     asymptoted to a constant. Left alone, the only thing moving his rank in the
     long run would have been work a session did for him, which inverts the design.

     The fix banks what is dropped instead of discarding it. XP_BANKED_THROUGH is a
     watermark, and it is what makes this idempotent: saveLedger runs on every load
     and after every tick, so without it a row could be banked twice and inflate the
     total in the other direction. Only rows strictly newer than the watermark are
     ever added, and the watermark only moves forward.

     Session credit needs no banking. A day that leaves `days` is still in
     SESSION_XP, and xpTotal()'s second loop picks it up there, so it is counted
     exactly once either way. */
  if(days.length>60){
    var drop=days.slice(0, days.length-60);
    days=days.slice(days.length-60);
    drop.forEach(function(x){
      if(!x||!x.d) return;
      if(XP_BANKED_THROUGH && x.d<=XP_BANKED_THROUGH) return;   // already banked
      XP_BANKED += (typeof x.xp==='number') ? x.xp : (x.closed||0);
      if(x.d>XP_BANKED_THROUGH) XP_BANKED_THROUGH=x.d;
    });
  }
  ledger.days=days;
  db.collection('bridge_state').doc('_streak').set({
    days:days,rank_key:rank().key,
    xp_banked:XP_BANKED, xp_banked_through:XP_BANKED_THROUGH,
    updated_at:new Date().toISOString(),by:user.email},{merge:true}).catch(function(){});
}
function dayKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function ledgerMap(){
  var m={}; (ledger.days||[]).forEach(function(x){ if(x&&x.d) m[x.d]=x; }); return m;
}
/* Consecutive days ending today, counted backwards, where at least one quest closed.
   Today only counts once something has actually been ticked, so an unopened morning
   does not read as a break at 6:01am. A day with no ledger entry at all IS a break —
   that is the honest reading, because nothing was closed on it. */
/* SHOWING UP, not output. Any recorded day counts: opened, marked as rest, or
   with something closed. Sam's call on 2026-08-04, and the reason is that a
   streak which punishes a rest day is a streak you resent and then abandon.

   The honest limit, worth knowing: a rest day Sam never OPENS leaves no row, and
   a missing row is still a break, because nothing on the device can know a day
   was a rest day if the page was never loaded that day. If that bites, the fix
   is a grace day rather than guessing backwards. */
function streakDays(){
  var m=ledgerMap(), n=0, d=new Date(DATE+'T12:00:00');
  if(!m[DATE]) d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){
    var e=m[dayKey(d)];
    if(e && (e.opened || e.rest || (e.closed||0)>0)){n++;d.setDate(d.getDate()-1);}
    else break;
  }
  return n;
}
/* ══ THE COMMISSION ════════════════════════════════════════════════════════
   Rank was an S-through-E grade computed from the last fourteen days, and it fell
   when the pace fell. The old comment defended that: a level which only ratchets
   up is a participation trophy. That argument is right, and this replaces it
   rather than ignoring it.

   A COMMISSION ratchets. You are not busted down to Ensign for a slow fortnight,
   in Starfleet or here. It is earned against CUMULATIVE xp, so it can only ever
   move forward, and it is a permanent record of what has actually been done.

   The pace question the old grade was answering does not disappear, it moves:
   `standing()` below reads the last fourteen days and is free to fall, which is
   how it works in the fleet too. Rank is permanent, fitness reports are not.

   THE THRESHOLDS ARE SET BEFORE THE WEIGHTS, AND THAT ORDER IS DELIBERATE.
   Because a commission ratchets, a threshold is the one number that cannot be
   revised later without either stranding Sam at a rank he no longer qualifies for
   or demoting him, and both are unacceptable. Weights are the opposite: they can
   be retuned any morning without touching a single earned rank. So the ladder
   fixes the TIME HORIZON now and the weights get fitted to it afterwards.

   Sized against a phase-2 rate of ~8 points a day (water, reading, learning, the
   routine, a derived work win, plus three or four punch closes, allowing for
   missed days). That puts Petty Officer inside a week, Ensign at two months,
   Lieutenant at a year, Captain at five and a half years, and Admiral at
   thirteen. Sam's requirement was that Admiral take years, possibly decades, and
   that it must not be reachable by spamming glasses of water. The gaps grow
   geometrically for exactly that reason: the early rungs are close enough
   together that the first promotion lands while the habit is still forming, and
   the late ones are far enough apart that no volume of trivial ticks shortcuts
   them.

   Until phase 2 lands, only punch closes score, so the real rate is nearer four a
   day and every rung takes roughly twice as long as the figures above. That is
   the correct behaviour, not a miscalibration: the ladder is sized for the
   finished system, and the pace catches up when the tracks come online. */
var RANKS=[
  {k:'crewman', ab:'CRM',  name:'Crewman',              at:0},
  {k:'po',      ab:'PO',   name:'Petty Officer',        at:50},
  {k:'cpo',     ab:'CPO',  name:'Chief Petty Officer',  at:150},
  {k:'ensign',  ab:'ENS',  name:'Ensign',               at:450},
  {k:'ltjg',    ab:'LTJG', name:'Lieutenant JG',        at:1200},
  {k:'lt',      ab:'LT',   name:'Lieutenant',           at:2800},
  {k:'lcdr',    ab:'LCDR', name:'Lieutenant Commander', at:5600},
  {k:'cdr',     ab:'CDR',  name:'Commander',            at:10000},
  {k:'capt',    ab:'CAPT', name:'Captain',              at:16000},
  {k:'como',    ab:'COMO', name:'Commodore',            at:22500},
  {k:'radm',    ab:'RADM', name:'Rear Admiral',         at:29500},
  {k:'adm',     ab:'ADM',  name:'Admiral',              at:38000}
];
/* `xp` falls back to `closed` so rows written before this shipped still count,
   and so a backfilled row needs only the one field. */
function xpTotal(){
  /* Two sources, one number. Ledger rows carry what Sam ticked; SESSION_XP carries what
     sessions closed for him. They are summed here rather than merged into the rows so a
     day can be credited long after its row was written, and so a row never has to be
     rewritten — rewriting rows is how a ledger starts disagreeing with itself. Days that
     have session credit but no row at all (he never opened the Bridge that day) still
     count: the work happened. */
  /* Starts from XP_BANKED, which is everything the 60-row window has already dropped.
     Without it this sum is a 60-day rolling window wearing a cumulative total's
     clothes, and the ladder becomes unreachable. See the trim in saveLedger().
     Rows at or before the watermark are skipped defensively: they should already be
     out of `days`, but a backfill that reintroduced one would otherwise count twice. */
  var t=XP_BANKED, seen={};
  (ledger.days||[]).forEach(function(x){
    if(!x||!x.d) return;
    seen[x.d]=1;
    if(!(XP_BANKED_THROUGH && x.d<=XP_BANKED_THROUGH))
      t += (typeof x.xp==='number') ? x.xp : (x.closed||0);
    t += sessionXpOn(x.d);
  });
  for(var d in SESSION_XP) if(!seen[d]) t += sessionXpOn(d);
  return t;
}

function rank(){
  var xp=xpTotal(), i=0;
  for(var j=0;j<RANKS.length;j++) if(xp>=RANKS[j].at) i=j;
  var cur=RANKS[i], next=RANKS[i+1]||null;
  return {i:i,key:cur.k,ab:cur.ab,name:cur.name,xp:xp,next:next,
          toNext: next ? next.at-xp : 0,
          span: next ? (xp-cur.at)/(next.at-cur.at) : 1};
}
/* The pace reading the old grade used to carry, kept separate so it can fall
   without touching the commission. Needs three recorded days before it says
   anything: two points is not a trend, and the old rank claimed one from two. */
/* MUST agree with xpTotal() about what a day is worth, and for two weeks it did not.
   This summed only the tick xp on a row and ignored session credit entirely, while
   xpTotal() adds it — so the rank climbed at one rate and the pace reading described a
   slower one. That is a cosmetic annoyance most of the time and a real problem once,
   because this function IS the instrument for the weights calibration: reading it low
   would have said the economy was running at target when it was running hot, and the
   whole reason thresholds were fixed before weights is that only the weights can be
   walked back.

   The denominator was wrong too. `seen++` counted ledger rows, but a day can earn
   session credit with no row at all when Sam never opened the page, and xpTotal() counts
   those. Counting distinct DATES fixes both halves.

   The words are pinned to the ladder rather than to taste: the ladder assumes ~8/day, so
   `steady` starts there and the others are set around it. If the weights change, these
   move with them — they describe the economy, they do not define it. */
function standing(){
  var cut=new Date(DATE+'T12:00:00'); cut.setDate(cut.getDate()-13);
  var ck=dayKey(cut), tot=0, seen={};
  (ledger.days||[]).forEach(function(x){
    if(x&&x.d>=ck&&x.d<=DATE){
      tot+=(typeof x.xp==='number'?x.xp:(x.closed||0))+sessionXpOn(x.d);
      seen[x.d]=1;
    }
  });
  for(var d in SESSION_XP){
    if(d>=ck && d<=DATE && !seen[d]){ tot+=sessionXpOn(d); seen[d]=1; }
  }
  var n=Object.keys(seen).length;
  if(n<3) return {word:null,note:n+' day'+(n===1?'':'s')+' logged'};
  var per=tot/n;
  return {word: per>=11?'excellent' : per>=8?'steady' : per>=4?'light' : 'slipping',
          per:per, note:tot+' in '+n+'d'};
}
/* Backlog direction over the last 7 days. Needs two data points; says so when it
   has one, rather than drawing a flat arrow that looks like a real reading. */
function backlogTrend(){
  var now=allPunchItems().length;
  var cut=new Date(DATE+'T12:00:00'); cut.setDate(cut.getDate()-7);
  var ck=dayKey(cut), oldest=null;
  (ledger.days||[]).forEach(function(x){
    if(x&&x.d>=ck&&x.d<DATE&&typeof x.open==='number'&&(!oldest||x.d<oldest.d)) oldest=x;
  });
  if(!oldest) return {n:now,delta:null};
  return {n:now,delta:now-oldest.open,since:oldest.d};
}
/* ── the work queue ───────────────────────────────────────────────────────────────────
   Sam taps something on his phone; a scheduled task on the Mac drains this hourly during
   waking hours, does the work with full Starfleet access, and writes results back here.

   Why bridge_state and not a bridge_queue collection: `match /bridge_state/{day}` already
   covers any doc id in this collection, so `_queue` needs no rules change, exactly like
   `_prefs`. It is also Sam-only read AND write, which matters: queue items quote real
   people, real appointments and real money, and none of that can sit in a collection
   anything anonymous is allowed to read.

   The runner reads this through Chrome on the signed-in page, the same mechanism the
   captain's log already uses to read Firestore `claims` in Step 6b. No service account, no
   private key on disk.

   arrayUnion, not read-modify-write: two taps in quick succession on a phone with a slow
   connection would otherwise race and the second would erase the first. */
function qid(){
  return 'q-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
}
function queueAdd(items,then){
  if(!user||!items.length)return;
  var stamped=items.map(function(it){
    return {
      id:it.id||qid(), kind:it.kind||'task', text:it.text||'',
      project:it.project||'', sender:it.sender||'', subject:it.subject||'', body:it.body||'',
      status:it.status||'queued', note:it.note||'',
      created_at:new Date().toISOString(), for_date:DATE, source:'bridge'
    };
  });
  var FV=firebase.firestore.FieldValue;
  db.collection('bridge_state').doc('_queue').set({
    items:FV.arrayUnion.apply(null,stamped),
    updated_at:new Date().toISOString(), by:user.email
  },{merge:true}).then(function(){
    queue=queue.concat(stamped);
    renderQueue();
    if(then)then(null,stamped);
  }).catch(function(e){
    // A dispatch that failed must not look like one that worked. Fall back to the clipboard
    // so the work is not simply lost.
    if(then)then(e);
  });
}
/* Drop items from the queue for good. The runner trims done items after 7 days
   on its own, but a completed item Sam has read is clutter from the moment he has
   read it, and "acknowledged" is his call, not a timer's.
   Read-modify-write the whole array: arrayRemove cannot match on a field, and the
   objects carry timestamps that make exact-value matching fragile. */
function queueDismiss(ids,then){
  if(!user||!ids.length){ if(then)then(null); return; }
  var keep=queue.filter(function(i){ return ids.indexOf(i.id)<0; });
  db.collection('bridge_state').doc('_queue').set({
    items:keep, updated_at:new Date().toISOString(), by:user.email
  },{merge:true}).then(function(){
    queue=keep; renderQueue(); if(then)then(null);
  }).catch(function(e){ if(then)then(e); });
}
/* Move an item between buckets from the phone. The runner owns the queued -> done and
   queued -> needs_sam transitions; this is the other direction, so Sam can overrule a
   triage call without opening a laptop. */
function queueSetStatus(ids,status,note,then){
  if(!user||!ids.length){ if(then)then(null); return; }
  var next=queue.map(function(i){
    return ids.indexOf(i.id)<0 ? i
      : Object.assign({},i,{status:status, note:note!=null?note:(i.note||'')});
  });
  db.collection('bridge_state').doc('_queue').set({
    items:next, updated_at:new Date().toISOString(), by:user.email
  },{merge:true}).then(function(){
    queue=next; renderQueue(); if(then)then(null);
  }).catch(function(e){ if(then)then(e); });
}

function renderQueue(){
  var pill=$('#qpill'),txt=$('#qtxt');
  if(!pill)return;
  var open=queue.filter(function(i){return i.status==='queued';});
  var done=queue.filter(function(i){return i.status==='done';});
  var waiting=queue.filter(function(i){return i.status==='needs_sam';});
  if(!queue.length){pill.classList.add('hide');return;}
  pill.classList.remove('hide');
  pill.classList.toggle('done',open.length===0);
  var bits=[];
  // Waiting first. It is the bucket that actually needs him, and burying it behind a
  // "queued" count is what made five decisions look like a stalled machine.
  if(waiting.length)bits.push('<b>'+waiting.length+'</b> waiting on you');
  if(open.length)bits.push('<b>'+open.length+'</b> queued');
  if(done.length)bits.push('<b>'+done.length+'</b> done');
  /* This used to read "the Mac picks these up on the hour". It does not. The
     hourly runner is a written spec (QUEUE-RUNNER.md) with no scheduled task
     behind it — `list_scheduled_tasks` returns nothing — so every item ever
     queued is still sitting at status:queued, and the pill was calmly reporting
     that handled work was on its way. That is precisely the silent-failure class
     this app exists to refuse, and it was the app itself doing it.
     Now it states the count and offers a review. The sheet says what actually
     happens next. */
  txt.innerHTML=bits.join(' · ')+' · tap to review';
}

function savePrefs(){
  clearTimeout(prefTimer);
  prefTimer=setTimeout(function(){
    if(!user)return;
    // The derived arrays are written alongside the scores so anything still reading the v1
    // shape keeps working. topic_scores is the source of truth; the arrays are a projection
    // of it and must never be edited directly.
    var mt=[],bt=[];
    Object.keys(prefs.topic_scores).forEach(function(t){
      var v=prefs.topic_scores[t];
      if(v<=MUTE_AT)mt.push(t); else if(v>=BOOST_AT)bt.push(t);
    });
    var mi=[],bi=[];
    Object.keys(prefs.id_votes).forEach(function(i){
      if(prefs.id_votes[i]<0)mi.push(i); else if(prefs.id_votes[i]>0)bi.push(i);
    });
    db.collection('bridge_state').doc('_prefs').set({
      topic_scores:prefs.topic_scores, id_votes:prefs.id_votes,
      mute_topics:mt, boost_topics:bt, mute_ids:mi, boost_ids:bi,
      thresholds:{mute_at:MUTE_AT,boost_at:BOOST_AT},
      updated_at:new Date().toISOString()},{merge:true}).catch(function(){});
  },700);
}

/* ── Google Calendar prefilled-event URL ──────────────────────────────
   No API scopes, no tokens: this opens Google Calendar's own create-event screen with the
   fields filled in. Sam confirms and saves inside Google, so the app never needs write
   access to his calendar — the least-privilege way to get "add this to my calendar". */
function gcalUrl(title,details,location,startDate){
  var p=[];
  p.push('action=TEMPLATE');
  p.push('text='+encodeURIComponent(title||''));
  if(details)  p.push('details='+encodeURIComponent(details));
  if(location) p.push('location='+encodeURIComponent(location));
  if(startDate) p.push('dates='+startDate);
  return 'https://calendar.google.com/calendar/render?'+p.join('&');
}
/* An hour block starting at the next round hour, local time.
   Used for things that have no date of their own. */
function nextHourBlock(){
  var d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
  d.setMinutes(0,0,0); d.setHours(d.getHours()+1);
  function f(x){
    return x.getFullYear()+
      String(x.getMonth()+1).padStart(2,'0')+
      String(x.getDate()).padStart(2,'0')+'T'+
      String(x.getHours()).padStart(2,'0')+'0000';
  }
  var e=new Date(d.getTime()+3600000);
  return f(d)+'/'+f(e);
}

/* Two different promises, so two different buttons.
   A calendar event HAS a date and the button adds that event on that date. A punch item or
   an inbox row has no date and never did; the old button passed no `dates` at all, so Google
   opened a blank form on today carrying the right title, which reads exactly like a broken
   date lookup. It was not reading the wrong date, it was reading no date.
   Undated things now get a real one-hour block at the next round hour, which lands as
   something draggable instead of an empty form, and says so in the label. */
function calBtn(title,details,location,startDate){
  var dated=!!startDate;
  var a=el('a','mini cal'+(dated?'':' block'),dated?'▤':'⊕');
  a.href=gcalUrl(title,details,location,dated?startDate:nextHourBlock());
  a.target='_blank';a.rel='noopener noreferrer';
  a.title=dated?'Add to Google Calendar'
               :'Block an hour for this, starting at the next hour. Drag it where you want.';
  a.addEventListener('click',function(e){e.stopPropagation();});
  return a;
}

/* Open the actual message in Gmail, so the two ways to answer an email sit side
   by side: "+" queues a reply for the Mac to draft in Sam's voice, this opens the
   thread for him to write it himself.
   authuser=<address> rather than /u/0. The account index depends on the order the
   accounts were signed in and differs between his devices, so a hardcoded index
   opens the right search in the wrong mailbox. Uses the message id when the feeder
   supplies one and falls back to a search that will match the thread. */
var GMAIL_ACCOUNT='sam@sanfermoseattle.com';
function gmailBtn(m){
  var base='https://mail.google.com/mail/u/?authuser='+encodeURIComponent(GMAIL_ACCOUNT);
  var href = m.gmail_id
    ? base+'#all/'+encodeURIComponent(m.gmail_id)
    : base+'#search/'+encodeURIComponent(
        (m.subject?'subject:("'+m.subject.replace(/^(RE|Re|FWD|Fwd):\s*/,'')+'") ':'')+
        (m.sender?'from:('+m.sender+')':'')).replace(/%20/g,'+');
  var a=el('a','mini','✉');
  a.href=href; a.target='_blank'; a.rel='noopener noreferrer';
  a.title='Open this email in Gmail and reply yourself';
  a.addEventListener('click',function(e){e.stopPropagation();});
  return a;
}

/* ── recap ─────────────────────────────────────────────── */
function renderRecap(rc){
  var box=$('#recap');
  if(!rc){box.classList.add('hide');return;}
  box.classList.remove('hide');
  var needs=(rc.failures||[]).length;
  var hard=(rc.lines||[]).filter(function(l){return l.state==='fail';}).length;
  var warns=(rc.lines||[]).filter(function(l){return l.state==='warn';}).length;
  box.classList.toggle('fail',hard>0);
  box.classList.toggle('warn',hard===0&&(warns>0||needs>0));
  // Severity in the header has to match severity in the lines. Calling two warnings
  // "2 failures" cries wolf, and a header that overstates gets ignored as fast as one
  // that understates. "Failure" is reserved for a line that actually failed.
  var head = hard>0
      ? '<b>'+hard+' failure'+(hard>1?'s':'')+'</b> in the '+esc(rc.ran_at||'overnight')+' run'
      : needs>0
      ? '<b>Ran clean</b>, '+needs+' thing'+(needs>1?'s need':' needs')+' you · '+esc(rc.ran_at||'')
      : warns>0
      ? '<b>Ran clean</b>, '+warns+' to note · '+esc(rc.ran_at||'')
      : '<b>Ran clean</b> · '+esc(rc.ran_at||'');
  // When the content is a fallback, the recap belongs to THAT day's run, not to a
  // run this morning. Unlabelled, "Ran clean · 04:12 PDT" read at 1am looks like a
  // 4am job that has not happened yet reporting success.
  if(STALE) head += ' · from '+esc(STALE.weekday||STALE.label||STALE.date);
  $('#rcTitle').innerHTML=head;
  // Anything wanting attention opens the panel by itself. A problem Sam has to tap to
  // discover is a problem the brief effectively hid. Not on a stale brief though:
  // he already saw yesterday's failures yesterday, and re-opening them every night
  // after midnight is noise, which is how a useful alert becomes one that gets ignored.
  box.open = !STALE && (hard>0||needs>0);
  var b=$('#rcBody');b.innerHTML='';
  if(rc.summary) b.appendChild(el('p','note',esc(rc.summary)));
  (rc.lines||[]).forEach(function(l){
    var cls=l.state==='fail'?'rc-fail':l.state==='warn'?'rc-warn':l.state==='skip'?'rc-skip':'rc-ok';
    var mk=l.state==='fail'?'✗':l.state==='warn'?'!':l.state==='skip'?'—':'✓';
    b.appendChild(el('div','rc-line','<span class="rc-mark '+cls+'">'+mk+'</span>'+
      '<span class="rc-k">'+esc(l.label)+'</span>'+
      (l.value?'<span class="rc-v mono">'+esc(l.value)+'</span>':'')));
  });
  if(needs){
    var f=el('div','rc-fails','<h4>Needs you</h4>');
    (rc.failures||[]).forEach(function(x){f.appendChild(el('div','',esc(x)));});
    b.appendChild(f);
  }
}

/* ── the reactor ───────────────────────────────────────────────────────────
   Clock in the centre, quest board on the outer arc, day progress on the inner.
   The clock is the only continuously-running thing on the page and it repaints
   ONCE A MINUTE, not once a second: a sweeping second hand is decoration that
   breathes, and the brief for this page is that nothing idle should. */
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
/* Live, not read once. Resizing across the breakpoint has to rebuild the tiles,
   because desktop and mobile put genuinely different content in them. */
var DESKQ=window.matchMedia?window.matchMedia('(min-width:860px)'):null;
var DESKTOP=!!(DESKQ&&DESKQ.matches);
if(DESKQ){
  var onBP=function(e){ DESKTOP=e.matches; if(DATA){buildMosaic();} };
  if(DESKQ.addEventListener) DESKQ.addEventListener('change',onBP);
  else if(DESKQ.addListener) DESKQ.addListener(onBP);
}
// Must match the radii in the SVG markup and the geometry note in the CSS.
// Must match the radii in the dial SVG and the geometry note in the CSS.
var R_QUEST=68, R_DAY=57;
var C_Q=2*Math.PI*R_QUEST, C_D=2*Math.PI*R_DAY, C_SEC=2*Math.PI*53;
var lastClock='';

function laNow(){
  return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
}
var lastSec=-1;
function tickClock(){
  var d=laNow();
  var h=d.getHours(), m=d.getMinutes(), sec=d.getSeconds();

  /* The hand moves every second; the text only when the minute changes. Those are
     two different cadences and the early return below used to gate BOTH, which is
     why the dial never registered a second passing — the ring was there, nothing
     was ever moving on it.
     Rotating a group by 6deg per second, rather than restyling the dotted track,
     keeps this to one attribute write a second with no layout and no repaint of
     anything but the hand. */
  if(sec!==lastSec){
    lastSec=sec;
    var g=$('#rxSec');
    if(g) g.setAttribute('transform','rotate('+(sec*6)+' 77 77)');
    var arc=$('#rxSecArc');
    if(arc){
      var len=(sec/60)*C_SEC;
      arc.setAttribute('stroke-dasharray',len.toFixed(3)+' '+(C_SEC-len).toFixed(3));
    }
  }

  var h12=(h%12)||12, mm=String(m).padStart(2,'0');
  var key=h12+':'+mm+(h<12?'a':'p');
  if(key===lastClock) return;                 // no DOM write when nothing changed
  lastClock=key;
  paintSky(h);
  $('#rxTime').innerHTML=h12+':'+mm+'<small>'+(h<12?'AM':'PM')+'</small>';
  $('#rxDow').textContent=d.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase();
  $('#rxDate').textContent=d.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase()+
    ' · '+d.getFullYear();
  // Waking window, 05:00 to 23:00. Outside it the arc reads full or empty, which is
  // honest: at 2am there is no day left to be partway through.
  var mins=h*60+m, f=Math.max(0,Math.min(1,(mins-300)/(1380-300)));
  var arc=$('#rxDay'); if(arc) arc.style.strokeDashoffset=String(C_D*(1-f));
}
/* Numbers arrive by counting up rather than snapping. This is not only garnish:
   a value that visibly climbs from zero distinguishes "loaded" from "still loading"
   without a spinner, and it is the honest tell that the read finished. */
function countUp(node,to){
  var n=parseInt(to,10);
  if(RM||!isFinite(n)||n>999){node.textContent=to;return;}
  var from=0, t0=null, dur=520+Math.min(n,60)*6;
  function step(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur);
    var e=1-Math.pow(1-p,3);
    node.textContent=String(Math.round(from+(n-from)*e));
    if(p<1)requestAnimationFrame(step); else node.textContent=String(n);
  }
  node.textContent='0';
  requestAnimationFrame(step);
}
/* The page is read at 6am, and a fixed golden-hour palette is wrong for the one
   moment it actually gets looked at. The phase drives CSS variables only, so every
   rule downstream follows without a per-phase duplicate anywhere.
   Boundaries are deliberately not on the hour Sam reads: dawn holds from 04:00 to
   08:00 so the whole morning routine sits in one register rather than changing
   underneath him mid-brief. Written only when the phase actually changes, which is
   four DOM writes a day. */
var lastSky=null;
function skyPhase(h){
  if(h<4)  return 'night';
  if(h<8)  return 'dawn';
  if(h<16) return 'day';
  if(h<20) return 'dusk';
  return 'night';
}
function paintSky(h){
  var p=skyPhase(h);
  if(p===lastSky) return;
  lastSky=p;
  document.documentElement.setAttribute('data-sky',p);
}
// Set before the first paint so the page never flashes the default palette.
paintSky(laNow().getHours());

/* A promotion is an EVENT, not a number that quietly changes overnight. It is
   the entire payoff of a levelling system, and a rank that silently ticks from
   ENS to LTJG between two glances is worth nothing.

   Announced once, on the morning it happens, then acknowledged and gone. The
   comparison is against the rank as it stood when this load began, so a promotion
   earned by today's own check-offs still fires. On the very first run after this
   shipped there is no stored rank, so it records where Sam already stands rather
   than congratulating him on a promotion he did not just earn. */
function checkPromotion(){
  var bar=$('#promobar');
  if(!bar||!user||!DATA||promoShown) return;
  var now=rank();
  if(!PREV_RANK){ PREV_RANK=now.key; return; }
  var wasIdx=-1;
  for(var i=0;i<RANKS.length;i++) if(RANKS[i].k===PREV_RANK) wasIdx=i;
  if(wasIdx<0 || now.i<=wasIdx){ PREV_RANK=now.key; return; }
  promoShown=true; PREV_RANK=now.key;
  bar.classList.remove('hide');
  bar.innerHTML='<span class="pip"></span><span>Promoted to <b>'+esc(now.name)+'</b>. '+
    now.xp+' logged'+(now.next?', '+now.toNext+' to '+esc(now.next.name):', top of the ladder')+
    '.</span>';
  var b=el('button','','Acknowledge');
  b.addEventListener('click',function(e){e.stopPropagation();bar.classList.add('hide');});
  bar.appendChild(b);
}

/* ══ THE JACKPOT ═══════════════════════════════════════════════════════════
   Sam's ask, 2026-08-04: when a session finishes a batch of work, the next open
   should pay out. A slot machine, not a chore.

   It pays for SESSION-closed work, and that choice is what makes it safe to fire on
   any open rather than once a day. An earlier cut paid out Sam's own ticks, which
   meant refreshing right after ticking farmed it, and the only defence was a
   once-per-day guard that also blocked the same-day payout he actually wanted.
   Paying for work a session pushed removes the exploit at the root: reloading cannot
   manufacture a close. PAID_IDS then guarantees each item is paid exactly once. */
function checkJackpot(){
  if(!user||!DATA||jackpotShown) return;
  var res=creditClosed();
  if(!res.any) return;              // nothing new to credit
  jackpotShown=true;
  /* SILENT WHEN IT PAYS NOTHING. Sam's call, 2026-08-04. Once a day's tier is spent,
     further closes still need crediting (so they are never offered twice) but they are
     worth zero — and a full-screen panel announcing zero is a letdown wearing a
     jackpot's clothes, which is the opposite of what this was built for. The items are
     still banked and still appear under "Closed for you" in the service record, so
     nothing is hidden; it just does not interrupt to say nothing happened.
     A modal means a payout. */
  if(res.award<=0) return;
  paintReactor(); checkPromotion();   // a big push can promote him
  showJackpot(res);
}

/* THE SCORING RULE IS SAM'S, and it is better than counting closes.

     closed nothing           -> 0
     closed, backlog flat/up  -> 1
     closed, backlog down 1-2 -> 2
     closed, backlog down 3+  -> 3

   Scoring the BACKLOG DELTA rather than the number of items closed is what makes this
   unfarmable, and it needs no anti-gaming rule because the metric is the anti-gaming
   rule: writing six todos and closing them raises the total by six and lowers it by
   six, so it pays the floor. His words: "there is no reason to reward equally for
   minor tasks that I could just tell you to create and then close."

   `Math.min(items.length, ...)` is the refinement on top: never pay more points than
   items actually closed, or closing one item on a day the backlog happened to drop by
   one would pay two.

   Each date is scored on its own doc, and credit lands on the DATE THE WORK HAPPENED,
   not the date he opened the app. A Monday push read on Wednesday still scores Monday. */
function creditClosed(){
  var paidSet={}; (PAID_IDS||[]).forEach(function(i){ paidSet[i]=1; });
  var byDate=[], award=0, any=false, dirty=false;
  Object.keys(CLOSED).sort().forEach(function(d){
    var doc=CLOSED[d]||{};
    var items=(doc.items||[]).filter(function(it){ return it&&it.id&&!paidSet[it.id]; });
    if(!items.length) return;
    any=true;
    var net=(typeof doc.net==='number') ? doc.net
          : ((doc.open_before||0)-(doc.open_after||0));
    var tier = net>=3 ? 3 : net>=1 ? 2 : 1;
    /* The tier caps the DAY, not the payout. Subtracting what the day has already
       earned is load-bearing: two sessions closing things on the same day each get a
       push, and without this the second one would pay the floor a second time — a day
       whose backlog went UP could quietly pay 2 or 3 by being pushed in instalments,
       which is precisely the loophole the backlog rule exists to shut. */
    var earned = SESSION_XP[d]||0;
    var room   = Math.max(0, W.sessionCap-earned);
    var pts    = Math.min(items.length, Math.max(0, tier-earned), room);
    if(pts){ SESSION_XP[d]=(SESSION_XP[d]||0)+pts; award+=pts; dirty=true; }
    byDate.push({date:d, items:items, net:net, pts:pts, tier:tier,
                 capped:(pts<Math.min(items.length,tier))});
    items.forEach(function(it){ paidSet[it.id]=1; });
  });
  if(any){
    /* Trim the bank to ids still visible in the lookback window. Left ungoverned this
       array grows forever inside a doc that is read on every single load. Anything that
       ages out can never be re-offered anyway, because its doc is no longer read. */
    var live={};
    Object.keys(CLOSED).forEach(function(d){
      (CLOSED[d].items||[]).forEach(function(it){ if(it&&it.id) live[it.id]=1; });
    });
    PAID_IDS=Object.keys(paidSet).filter(function(i){ return live[i]; });
    dirty=true;
  }
  if(dirty){
    db.collection('bridge_state').doc('_streak')
      .set({paid_ids:PAID_IDS, session_xp:SESSION_XP},{merge:true}).catch(function(){});
  }
  return {award:award, byDate:byDate, any:any};
}

/* The reels, shared by both payouts. Extracted 2026-08-05 when the intake jackpot
   landed: the digit strip, the 66px pitch and the 0.13s stagger live in one place so a
   second payout cannot drift away from the first.

   RM is honoured here, which the inline version did not do. The strip moves on a CSS
   TRANSITION, and the reduced-motion block in this file only kills `animation`, so a
   1.2s spin still played for a reader who had asked for no motion. Under RM the digit
   is placed rather than spun. */
function jpReels(award){
  var reels=el('div','jp-reels');
  reels.appendChild(el('span','jp-plus','+'));
  var strips=[];
  String(award).split('').forEach(function(dg){
    var reel=el('div','jp-reel'), strip=el('div','jp-strip');
    for(var n=0;n<=9;n++) strip.appendChild(el('b','',String(n)));
    reel.appendChild(strip); reels.appendChild(reel);
    strips.push({strip:strip,d:parseInt(dg,10)});
  });
  function land(x,i,animate){
    if(animate) x.strip.style.transitionDelay=(i*0.13)+'s';
    else x.strip.style.transition='none';
    x.strip.style.transform='translateY(-'+(x.d*66)+'px)';
  }
  if(RM){ strips.forEach(function(x,i){ land(x,i,false); }); }
  /* Next frame, not this one. Setting the transform while the node is still being
     built gives the browser no start value to animate from, and the reel just snaps. */
  else requestAnimationFrame(function(){
    strips.forEach(function(x,i){ land(x,i,true); });
  });
  return reels;
}

/* THE INTAKE PAYOUT. Same slot machine as the session jackpot, deliberately: these are
   the two things on the board that pay 3 in one go, and giving the second one its own
   visual language would make one reward look like two systems.

   IT AWARDS NOTHING. intakeXp() already folded the 3 into dayXp() the instant the third
   component landed. This announces it. Adding points here would double-count.

   Unlike the session jackpot it NEEDS a once-per-day guard, and the asymmetry is the
   whole reason the session design could go without one: a session close cannot be
   manufactured by reloading, whereas intake can be re-manufactured all afternoon by
   untapping the multivitamin and tapping it again. The guard is persisted in
   bridge_state/{date}, not held in memory, or a reload on an already-complete day would
   replay it every single time. */
function showHabitJackpot(kicker, award, why){
  var r=rank(), wrap=el('div','jp'), card=el('div','jp-card'), head=el('div','jp-head');
  head.appendChild(el('div','jp-kicker',kicker));
  head.appendChild(jpReels(award));
  head.appendChild(el('div','jp-sub', why+' <b>'+r.xp+'</b> logged, '+esc(r.name)+
    (r.next?' &middot; <b>'+r.toNext+'</b> to '+esc(r.next.name):' &middot; top of the ladder')+'.'));
  var btn=el('button','jp-btn','Collect');
  function close(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }
  btn.addEventListener('click',close);
  wrap.addEventListener('click',function(e){ if(e.target===wrap) close(); });
  /* No .jp-scroll: these payouts have no list to show. The card is a flex column whose
     head and button are both flex:0 0 auto, so it sizes to content and the max-height
     bound still applies. */
  card.appendChild(head); card.appendChild(btn);
  wrap.appendChild(card);
  document.body.appendChild(wrap);
}
function showIntakeJackpot(){
  showHabitJackpot('Intake complete', W.intake,
    '<b>'+(WATER_TARGET*WATER_OZ)+'oz</b>, fire cider and the multivitamin. All three, '+
    'which is the only way this one pays.');
}
function showRoutineJackpot(){
  var n=routineSteps().length;
  showHabitJackpot('Routine complete', W.routine,
    'All <b>'+n+'</b> ticked, start to finish. Part of it is worth nothing; '+
    'the whole of it is worth '+W.routine+'.');
}

function showJackpot(res){
  var r=rank(), wrap=el('div','jp'), card=el('div','jp-card');
  var head=el('div','jp-head'), scroll=el('div','jp-scroll');
  var total=0; res.byDate.forEach(function(g){ total+=g.items.length; });

  head.appendChild(el('div','jp-kicker','Closed while you were away'));
  head.appendChild(jpReels(res.award));

  /* showJackpot is only ever reached with award > 0 now, so there is no zero variant
     to carry. Per-DATE totals can still be 0 inside a multi-day payout — that case is
     real and is rendered below with the reason beside it. */
  head.appendChild(el('div','jp-sub',
    '<b>'+total+'</b> item'+(total===1?'':'s')+' closed for you. <b>'+r.xp+'</b> logged, '+
    esc(r.name)+
    (r.next?' &middot; <b>'+r.toNext+'</b> to '+esc(r.next.name):' &middot; top of the ladder')+'.'));

  /* WHAT it paid for, and WHY that is the number. Sam could not tick these off himself
     because he did not know what had been done -- the list is the feature, the number is
     the garnish. But the score line and the reasoning stay VISIBLE while the list itself
     collapses: 22 rows expanded is what made the first payout unreadable, and a payout
     that opens by burying its own explanation has the priorities backwards. */
  res.byDate.slice().reverse().forEach(function(g){
    var box=el('div','jp-wait');
    var why = g.net>=3 ? 'backlog down '+g.net
            : g.net>=1 ? 'backlog down '+g.net+', so 2 is the ceiling'
            : (g.net===0 ? 'backlog flat — as many opened as closed, so this pays the floor'
                         : 'backlog UP '+(-g.net)+' — more was opened than closed, so this pays the floor');
    box.innerHTML='<div style="color:var(--ink);font-weight:700;margin-bottom:5px">'+
      esc(g.date)+' &middot; '+g.items.length+' closed &middot; +'+g.pts+
      (g.capped?' (daily cap)':'')+'</div>'+
      '<div style="color:var(--ink-mute)">'+esc(why)+'</div>';
    var det=el('details','jp-det');
    det.appendChild(el('summary','', 'Show the '+g.items.length+' item'+(g.items.length===1?'':'s')));
    det.appendChild(el('div','jp-items', g.items.map(function(it){
      return '<div style="margin:4px 0">· '+esc(it.text)+'</div>'; }).join('')));
    box.appendChild(det);
    scroll.appendChild(box);
  });

  var btn=el('button','jp-btn','Collect');
  function close(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }
  btn.addEventListener('click',close);
  wrap.addEventListener('click',function(e){ if(e.target===wrap) close(); });
  card.appendChild(head); card.appendChild(scroll); card.appendChild(btn);
  wrap.appendChild(card);
  document.body.appendChild(wrap);
}

function paintReactor(){
  var host=$('#rxStats'); if(!host) return;
  var arc=$('#rxQuest');
  /* A failed read is not a day with nothing on it. Printing "0 of 0" and a backlog
     of 0 here would be the dial quietly asserting a fact it does not have, which is
     the exact failure this app was built to refuse. Unknown reads as unknown. */
  if(!DATA && LOAD_ERR){
    if(arc) arc.style.strokeDashoffset=String(C_Q);
    host.className='rx-strip unknown';
    host.textContent='Rank, streak and backlog are unknown while the read is failing.';
    return;
  }
  host.className='rx-strip';
  var q=questSet();
  if(arc) arc.style.strokeDashoffset=String(C_Q*(1-(q.total?q.done/q.total:0)));
  var rk=rank(), sd=streakDays();
  function cell(k,v){ return '<div class="rx-cell"><span class="rx-k">'+k+'</span>'+v+'</div>'; }
  // Abbreviation, because "Lieutenant Commander" does not fit a third of a
  // 311px strip. The full name is in the promotion bar and the progress figure
  // is what makes the abbreviation legible to someone who does not know the
  // ladder by heart.
  var out=cell('Rank','<span class="rx-v">'+esc(rk.ab)+
               (rk.next?'<small>'+rk.xp+'/'+rk.next.at+'</small>':'<small>max</small>')+
               '</span>')+
          cell('Streak','<span class="rx-v'+(sd?'':' dim')+'">'+
               (sd?sd+'<small>d</small>':'none')+'</span>');
  // Backlog comes from the punch list, so on a day with no brief it is not zero,
  // it is unknown. "0 open, down 251 this week" would be a fabrication.
  if(!DATA){
    out+=cell('Backlog','<span class="rx-v dim">no brief</span>');
  } else {
    var bl=backlogTrend();
    var trend = bl.delta===null ? ''
      : bl.delta===0 ? '<small>flat</small>'
      : ' <em class="'+(bl.delta>0?'dn':'')+'">'+(bl.delta>0?'+':'')+bl.delta+'</em>';
    out+=cell('Backlog','<span class="rx-v">'+bl.n+trend+'</span>');
  }
  out+='<span class="rx-go mono">›</span>';
  host.innerHTML=out;
}
/* Bound once, not per paint: paintReactor rewrites innerHTML on every tick and

$('#rxStats').addEventListener('click',function(){

});
// Both arcs start fully retracted so the first paint is a sweep from zero, not a

(function(){
  var a=$('#rxQuest'),b=$('#rxDay');
