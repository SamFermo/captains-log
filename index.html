.skel{border-radius:var(--r-l);min-height:190px;border:1px solid var(--line);background:var(--s0);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.75}}

/* ══ THE SLAB ══════════════════════════════════════════════════════════════
   Reference 2's grammar: the frame IS the design, not a border on a div. Same
   two-layer trick as .card — outer element is the 1px lit edge, .slab-in is the
   dark interior, identical polygon on both so the stroke follows the cut.
   Corner plates go on the two SQUARE corners (top-right, bottom-left), because
   the chamfer already owns the other two. One accent each, so the slab states
   the duotone before a single word is read. */
/* `contain` is load-bearing, for the same reason it is on #mesh. clip-path clips
   what is PAINTED but not what counts toward layout, and ::after below sweeps to
   translate3d(370%) of a 38%-wide box — 628px of document inside a 375px phone.
   The page could then be panned sideways into empty space, but only during the
   last ~5 seconds of each 19-second cycle, which is why it read as random and
   as "it happens when I switch cards". It was never the card switch, it was the
   shimmer timer. Measured: 628 against a predicted 629. */
.slab{position:relative;padding:1px;margin-bottom:2px;contain:layout paint;
  border-radius:10px;
  background:linear-gradient(148deg,rgba(212,103,79,.55),rgba(163,118,143,.30) 46%,rgba(125,156,196,.48));
  /* Weight on the surface rather than light on the edge. Only possible now that
     clip-path is gone: it used to discard any outer shadow entirely. */
  box-shadow:0 18px 44px -26px rgba(0,0,0,.9)}
/* z-index:1 is load-bearing. .slab::after is the edge shimmer and, as a pseudo,
   paints last among same-level siblings — without this the sweep runs across the
   greeting text instead of along the 1px rim. */
/* 20px of bottom padding, not 13: the bottom-left corner plate reaches 26px in
   from the slab edge and was landing on top of the last row of chips. */
.slab-in{position:relative;z-index:1;padding:15px 15px 20px;
  border-radius:10px;
  background:linear-gradient(166deg,rgba(30,22,17,.975),rgba(14,11,9,.99))}
/* HUD brackets, softened. They still do real work holding the two corners the
   chamfer used to own, but at a hairline in one warm tone rather than two 2px
   accent rules shouting the duotone before a word has been read. */
.cp{position:absolute;width:15px;height:15px;z-index:3;pointer-events:none}
.cp-tr{top:8px;right:8px;border-top:1px solid rgba(224,165,63,.5);
  border-right:1px solid rgba(224,165,63,.5);border-top-right-radius:8px}
.cp-bl{bottom:8px;left:8px;border-bottom:1px solid rgba(163,118,143,.5);
  border-left:1px solid rgba(163,118,143,.5);border-bottom-left-radius:8px}
/* Edge shimmer. Ambient life at the FRAME, never over the text. Transform-only,
   28s, low contrast: designed to survive the 200th viewing. */
/* The edge shimmer was the slab pretending to be a screen. Gone with the rest of
   the ambient motion; the `contain` note above still applies to nothing now, but
   the containment itself is kept because it is also what stops the mesh blobs
   extending the scrollable width. */
.slab::after{display:none}
@keyframes sweep{0%,72%{transform:translate3d(-110%,0,0)}100%{transform:translate3d(370%,0,0)}}

/* ══ THE REACTOR ═══════════════════════════════════════════════════════════
   Reference 1's central dial, doing real work. Three readings in one object:
     outer arc  = today's quest board, closed vs offered
     inner arc  = how far through the waking day it is (05:00 → 23:00)
     centre     = live clock, weekday, date
   The dial is the only thing on the page that moves on its own, and it moves
   once a minute. */
/* ══ THE MOSAIC ════════════════════════════════════════════════════════════
   Tiles packed around the clock with thin streets between them, rather than
   nodes orbiting in open space. Eight columns and four rows on an 8fr grid, so
   the whole block scales with the slab:

     ┌───────────── PUNCH ─────────────┐        row 1   70fr
     │ INBOX  │                │ WEATH │        row 2   74fr
     │ SERVIC │     CLOCK      │ ROUTI │        row 3   74fr
     └ CALENDAR ────┴──── NEWS ────────┘        row 4   70fr

   Gap is 3px. Any wider and it stops reading as a cut channel and starts reading
   as cards floating on a background.

   The clock cell is 4 of 8 columns. That is the whole geometry argument: at 311px
   of slab width, a dial big enough to be the centrepiece leaves about 76px either
   side, and 76px is what the flanking tiles get. It is enough for a title at 9px
   plus a value, and not enough for anything more, which is why those four are the
   short-titled cards and Punch List sits in the full-width bar. */
.mosaic{position:relative;display:grid;gap:3px;margin:4px 0 8px;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:70fr 74fr 74fr 70fr;
  aspect-ratio:311/297}
/* THE SPARSE FALLBACK IS GONE. DO NOT BRING IT BACK.
   It used to swap the whole block to an auto-fit flow the moment ONE card was
   absent from the payload: explicit placement dropped, dial pushed in-flow at
   190px, ring hidden, every bite mask stripped. On 2026-08-02 Gmail and Calendar
   both errored at 4am, the feed wrote four cards instead of six, and the entire
   design collapsed — for a two-connector blip that should have cost two tiles.
   The layout is no longer a function of whether an upstream API was up. Every
   card in ORDER always gets its slot; a card with no payload section renders as
   a placeholder in place (see .tile.miss) and the geometry never moves. */

/* ── the dial, now an overlay ──────────────────────────────────────────────
   The clock no longer occupies a grid cell. It is absolutely centred over the
   block and is LARGER than the hole the grid leaves for it, and each surrounding
   tile is masked with a matching circle so the tiles curve around it. The old
   version parked a circle inside a rectangular cell, which left four dead corners
   in the middle of the block — bricked out, in Sam's words.

   Geometry is measured in JS rather than hardcoded, because the radius has to be
   derived from where the grid actually put the flanking tiles. */
.dial{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:center}
/* The shared cut edge. Every tile's mask ends exactly here, and masking removes
   the tile's own 1px accent stroke along the curve, so without this ring the
   tiles would end in a raw unlit edge. Violet because it borders magenta tiles on
   one side and cyan on the other, and violet is the blend the palette already
   uses for exactly that. */
/* The inset glow HUGS the edge. At 26px of blur it reached inward to roughly
   radius 47 and washed straight over the ticker rings at 45 and 54, which was
   the other half of why the inner one could not be seen. */
.dial-ring{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 2px rgba(163,118,143,.7),0 0 26px -6px rgba(163,118,143,.55),
             inset 0 0 10px -7px rgba(163,118,143,.5)}
.tile{-webkit-mask-image:var(--bite,none);mask-image:var(--bite,none)}

/* ── the placeholder tile ──────────────────────────────────────────────────
   A card the 4am run could not write. It keeps its slot, its shape and its bite,
   so the block is geometrically identical to a good morning; only the CONTENT
   changes. The accent drops out of the edge and the interior glow goes, because
   the duotone encodes "this wants you" / "this informs you" and an absent card
   does neither. Amber, matching the stale-brief bar, which is the other place
   this page says "the data is not what it should be". */
.tile.miss{background:rgba(224,165,63,.28)}
.tile.miss::after{box-shadow:inset 0 0 13px -5px rgba(224,165,63,.5)}
/* .tile.on is declared LATER in this file at equal specificity, so without these
   two the selected placeholder would take the card's own accent as a background
   and stop reading as absent the moment Sam tapped it. Three classes beats two. */
.tile.miss.on{background:rgba(224,165,63,.5);box-shadow:0 0 22px -8px rgba(224,165,63,.55)}
.tile.miss.on::before{background:linear-gradient(160deg,rgba(26,19,8,.97),rgba(7,7,14,.99))}
.tile.miss .t-k{color:var(--ink-faint)}
.tile.miss .t-g{color:rgba(224,165,63,.75)}
/* The dash is the VALUE slot, so it sits at the value's weight and reads as
   "no number", not as a hyphen someone left in. */
.t-miss{font-size:17px;font-weight:800;line-height:1;color:var(--amber);opacity:.8}
.t-missu{font-size:9px;line-height:1.3;margin-top:2px;color:var(--amber);opacity:.85;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Static bloom behind the dial. The GLOW is a separate, unanimated layer on
   purpose: a drop-shadow filter on the arc itself would be re-rasterised for
   every frame of the sweep-in, which is exactly the thing that drops frames. */
/* THE REACTOR GLOW — an ANNULUS locked to the outer ring, not a blob behind the
   whole clock.

   The first version was a filled radial bloom the size of the dial, and Sam read
   it as sitting down and to the right. Measured, it was dead centre: the offset
   was perceptual, because the magenta punch bar directly above it washes out the
   top half of a violet halo while the cyan tiles below let it read clean. The
   answer was not to nudge it, it was to stop glowing the whole disc. Now only the
   boundary ring breathes, which is what was wanted and which has no half to lose.

   Violet, because that is the ring's colour and the blend the palette uses where
   magenta tiles meet cyan ones, so the clock glows as itself.

   Opacity ONLY. Scaling this would smear the ring off its own boundary, and
   animating a box-shadow or a filter would re-rasterise a blurred surface every
   frame and drop the page off 60fps. The blur is baked once; the compositor just
   fades it.

   The one deliberate exception to "nothing idle should breathe" on this page. Sam
   asked for it. Kept slow at 6s and shallow at 45-100%, because the thing it has
   to survive is the 200th morning.

   `closest-side` matters: the default farthest-corner would put 100% at the box
   DIAGONAL, and the stop positions below are calculated against the half-width. */
.dial-glow{position:absolute;left:50%;top:50%;width:168%;height:168%;z-index:-1;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle closest-side,
    transparent 0 50%,
    rgba(163,118,143,.18) 55.5%,
    rgba(163,118,143,.62) 59.5%,
    rgba(224,165,63,.26) 63%,
    rgba(163,118,143,.13) 68%,
    transparent 80%);
  filter:blur(7px);
  animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
/* Square, centred, bounded by whichever of the cell's dimensions is smaller, so
   the circle can never be squashed into an ellipse by a row-height change. */
.dial-in{position:relative;height:100%;aspect-ratio:1;max-width:100%}
.rx-svg{position:absolute;inset:0;width:100%;height:100%}
.rx-svg circle{fill:none;stroke-linecap:round}
/* Second, finer ticker just inside the day arc. Sits at r 52, between the day
   arc at 57 and the coarse ring at 47, so the three rings read as a stack at
   three different pitches rather than one thick band. Static: it is texture,
   and texture that moves is the thing that gets irritating by the 200th look. */
/* SIXTY marks, one per second, not a decorative pitch. r 53 gives a circumference
   of 333.0088, so each second is 5.55015 units and the pattern is 1.6 on / 3.95015
   off. That exact division matters: twelve o'clock falls on segment 45 of 60, so
   the hand below lands dead on a mark every single second instead of drifting
   between them. */
/* TWELVE hour ticks, not sixty second marks. Sixty dots is a technical readout
   and it was the busiest texture on the page; twelve is a sundial, which is the
   older and calmer instrument and the right reference for this theme.
   Moved out to r 74.5, between the XP arc (which occupies 64-72) and the ring at
   77, so it reads as a bezel rather than as clutter around the clock.
   The arithmetic has to be exact or the ticks drift off the hours: circumference
   at r 74.5 is 468.0973, twelve marks is a pitch of 39.0081, and twelve o'clock
   sits at one quarter of the circle = 117.024 = exactly three pitches. So a tick
   lands on 12, 3, 6 and 9 rather than between them. */
.rx-tick2{stroke:rgba(224,165,63,.32);stroke-width:3;stroke-dasharray:2.8 36.2081;stroke-linecap:butt}
/* The seconds track needs something to fill OVER now that the sixty dots are
   gone. One continuous hairline, dimmer than the sweep that crosses it. */
.rx-secbase{stroke:rgba(255,226,193,.09);stroke-width:2.5}
/* The hand. A filled dot on a group that gets rotated 6 degrees per second — one
   attribute write a second, no layout, no repaint of anything else. */
/* THE SECONDS SWEEP.
   A lone dot orbiting the 60-mark track was invisible: it sat at the same radius
   and very nearly the same size as the sixty static marks it was travelling over,
   so it read as one more dot in a ring rather than as anything moving. A second
   decorative ring inside it made that worse by adding clutter with no information
   in it, so that ring is gone.
   Now the track FILLS. A solid cyan arc grows from twelve o'clock, one sixtieth
   of the circle per second, over the dim marks — the lit part is unmistakable
   against the unlit part ahead of it, and the head dot marks the leading edge. */
.rx-secarc{stroke:var(--cyan);stroke-width:2.5;stroke-linecap:butt;opacity:.9}
.rx-sec{fill:var(--cyan)}
.rx-sec-glow{fill:var(--cyan);opacity:.3}
/* This shipped last round at .1 alpha with half-pixel dashes, which is to say it
   shipped invisible. Present in the DOM is not the same as present on screen. */
.rx-trk{stroke:rgba(255,226,193,.11);stroke-width:8}
.rx-arc{stroke:url(#gQuest);stroke-width:8;transition:stroke-dashoffset 1.15s var(--ease)}
.rx-trk2{stroke:rgba(255,226,193,.045);stroke-width:2.5}
.rx-arc2{stroke:var(--cyan);stroke-width:2.5;opacity:.5;transition:stroke-dashoffset .95s var(--ease)}
/* The clock sits in a box sized to the inner arc, so it can never grow into the ring. */
/* 68%, up from 60%: monospaced digits are wider than the proportional ones they
   replaced, and the time has to clear the inner tick ring at r 47. */
.rx-face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:74%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rx-dow{font-family:var(--font-disp);font-size:var(--clock-sub,8.5px);letter-spacing:.26em;color:var(--ink-mute);line-height:1.7;white-space:nowrap}
/* Optima is drawn from Roman inscriptional capitals, which is the lettering on
   the buildings this theme is named after, and it ships on every Mac and iPhone
   so there is no font request on a cold 6am open and no swap a beat later.
   VERIFIED it honours tabular-nums: 10:00, 11:11, 12:47 and 88:88 all measure
   60.37px, so the clock holds position instead of jittering every second. That
   was the one thing that would have disqualified it. */
.rx-time{font-family:var(--font-clock);font-size:var(--clock-size,22px);font-weight:400;letter-spacing:.02em;
  line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.rx-time small{font-size:calc(var(--clock-size,22px) * .41);font-weight:700;letter-spacing:.04em;margin-left:3px;color:var(--ink-mute)}
/* ink-mute, not ink-faint. This is the date, so it is information, and the rule
   for this page is that micro-type used as texture must not be made of words. */
.rx-date{font-family:var(--font-disp);font-size:var(--clock-sub,9px);letter-spacing:.20em;color:var(--ink-mute);line-height:1.9;white-space:nowrap}

/* ── the tiles ─────────────────────────────────────────────────────────────
   Same two-layer chamfer as the panel: the element is the 1px lit edge, ::before
   is the dark interior inset by 1px, identical polygon on both. The chamfer is
   7px rather than 13 because at 3px gaps a deep cut turns the street corners into
   visible diamond holes. */
.tile{position:relative;padding:7px 8px;border:0;cursor:pointer;overflow:hidden;
  font:inherit;color:inherit;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;
  /* NO chamfer on these, unlike every other surface in the file. The cut is
     top-left and bottom-right on every element, which is fine in a grid but
     breaks the moment the tiles are arranged as mirrored pairs around the dial:
     Inbox's bottom-right cut lands on its INNER edge while Weather's lands on
     its OUTER edge, so the two sides met the circle differently and the reactor
     read lopsided. Square tiles make the circular bite the only shaping, and the
     ring becomes symmetrical. The chamfer stays everywhere else — the slab, the
     panel, the chips, the dock — so the language is intact. */
  /* 5px. Enough to take the machined feel off the outer corners, small enough
     that the curve never competes with the circular bite on the inner side. */
  border-radius:5px;
  background:color-mix(in srgb,var(--ac) 62%,rgba(255,238,214,.10));
  transition:transform .16s var(--ease),filter .2s var(--ease),background .2s var(--ease)}
/* 2px, not 1px, and the accent mix is up from 30% to 68%, so the edge reads as a
   lit stroke rather than a hairline. */
.tile::before{content:"";position:absolute;inset:2px;z-index:0;border-radius:4px;
  background:linear-gradient(160deg,rgba(33,24,19,.97),rgba(15,12,10,.99))}
/* The glow has to be an INSET shadow on an inner layer. An outer box-shadow would
   be thrown away: clip-path clips the shadow along with everything else, which is
   the same reason the edge is drawn as two stacked layers in the first place. */
.tile::after{content:"";position:absolute;inset:2px;z-index:0;pointer-events:none;
  border-radius:4px;box-shadow:inset 0 0 12px -5px var(--ac)}
.tile>*{position:relative;z-index:1}
.tile:active{transform:scale(.955)}
.tile:hover{filter:brightness(1.12)}
.tile.on{background:var(--ac);box-shadow:0 0 22px -6px var(--ac)}
.tile.on::before{background:linear-gradient(160deg,
  color-mix(in srgb,var(--ac) 14%,rgba(26,19,15,.97)),rgba(15,12,10,.99))}
.t-head{display:flex;align-items:center;gap:5px;min-width:0}
.t-g{font-size:10.5px;line-height:1;flex:none;color:var(--ac)}
/* 9px, against 10.5px for the panel's own label. The flanking tiles are 76px wide
   and a title has to fit on one line inside them; this is the size that does it
   for the longest of the four, and these are seven words Sam reads every morning
   rather than decorative micro-type. */
.t-k{font-family:var(--font-disp);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile.on .t-k{color:var(--ink-soft)}
.t-v{font-size:17px;font-weight:800;letter-spacing:-.025em;line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-v.sm{font-size:13px} .t-v.xs{font-size:11px;letter-spacing:0}
.t-u{font-size:9px;color:var(--ink-faint);line-height:1.3;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* margin-left:6px, not auto. Pushed to the far edge the badge read as a separate
   element floating in the corner instead of a count attached to the word it
   counts. */
.t-b{flex:none;min-width:15px;height:15px;padding:0 4px;margin-left:6px;border-radius:50%;
  font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  background:var(--red);color:#1a0d08;box-shadow:0 0 10px -1px var(--red)}
/* The full-width bar puts its number and its caption on one line, because 70px of
   height will not take a stacked headline plus a caption plus the progress bar. */
.tile.bar .t-foot{display:flex;align-items:baseline;gap:8px;min-width:0}
.tile.bar .t-v{font-size:24px}
.tile.bar .t-u{margin-top:0;flex:1}
/* The two right-hand tiles put their content on the OUTER edge. The bite eats
   their inner side, which is exactly where left-aligned content sits, so the
   weather temperature and the routine count were being masked away entirely. */
.tile.r{align-items:flex-end;text-align:right}
.tile.r .t-head{flex-direction:row-reverse}
.tile.r .t-b{margin-left:0;margin-right:6px}
/* Punch runs down the centre so the block reads symmetrically: centre bar, then
   left / right pairs, then left / right again. */
.tile.c{align-items:center;text-align:center}
.tile.c .t-head{justify-content:center}
.tile.c .t-b{margin-left:6px}
.tile.c .t-foot{justify-content:center}
.tile.c .f-seg{width:100%}
.tile .f-seg{margin-top:5px}
.tile .f-seg i{height:3px}

/* ── rank / streak / backlog, one slim line ────────────────────────────────
   These used to be four stacked rows beside the dial. With the dial centred there
   is no beside, and they are context rather than the headline, so they get a strip. */
/* Tappable. The three numbers here are a summary of a much longer record, and
   until now that record existed only in Firestore where Sam could not see it. */
/* .rx-strip and its .rx-cell / .rx-k / .rx-v children are GONE, replaced by the
   home view below. They were the three-numbers-in-a-row layout and nothing paints
   them any more: paintReactor sets the host's class to rx-home on every path,
   including the read-failure one. The host element, its id and its click target
   are unchanged, so the service record sheet still opens from the same place. */
/* The affordance. Without it the strip is three numbers that happen to be
   clickable, which nobody discovers. */
.rx-go{flex:none;font-size:11px;color:var(--ink-faint);margin-left:2px}
.rx-home.unknown .rx-go{display:none}

/* ══ THE HOME VIEW ═════════════════════════════════════════════════════════
   The slim Rank / Streak / Backlog line was three numbers in a row and it made
   the levelling system look like a footnote under the dial. This is the same
   host element (#rxStats, same click target, same sheet) carrying a real badge.

   THE COLLAR. Sam's call, 2026-08-06: rank bars for the three enlisted rungs and
   pips from Ensign up. That is correct to protocol, and it is also why the
   commission to Ensign reads as a change in KIND rather than as one more pip,
   which is worth earning. Flag rank sets its pips on a filled plate, the same
   trick a third time, so the ladder has three visibly different registers rather
   than twelve variations on a dot.

   The mapping is in rankCollar(). Hollow pips at Lieutenant JG and Lieutenant
   Commander are protocol and they are also the only thing that distinguishes
   those two rungs from the ones below them at a glance.

   NOTHING HERE BREATHES. The one animation is the promotion flash, which fires
   at most once per rung per lifetime, from checkPromotion, never from a paint. */
/* Every number in this block is a measured trim, not taste. The first cut came
   in at 86px against the 40px strip it replaced, which ate 46 of the 54px the
   shorter mosaic had just bought and left the fold almost exactly where it
   started. Padding, gaps and the two caption line-heights give 20px back for no
   loss of content: rh-cap sets line-height:1 because at 9px a 1.5 line box is
   4.5px of air above and below a caption that sits next to a 5px bar. */

/* ── GROWN, 2026-08-06 ──────────────────────────────────────────────────────
   Sam: "I was envisioning the badge itself bigger, so that the whole card takes
   up more space, exactly enough so that when house list and work queue are
   visible run clean is pushed right to the bottom of the iphone screen."

   Not taste, arithmetic, and MEASURED rather than computed. At a true 390x844
   with both pills shown, the run recap's bottom edge sat at 697 against a dock
   top of 822 — 125px of dead space under the fold. This block grew from 69px to
   179px, which puts the recap's bottom at 807 and leaves a 15px gap to the dock.
   Every one of those figures was read out of the live page in the iframe harness,
   including after the change.

   NOTE FOR WHOEVER READS SPIN-UP 6: its acceptance test said "between 765 and
   781px, against a dock top of 781." Those numbers came from spin-up 2 and the
   dock has moved since; it now starts at 822. Hitting 765-781 literally would
   have left a 40-plus pixel hole between the recap and the dock, which is the
   opposite of what Sam asked for. The INTENT — recap flush to the bottom of the
   phone — is what was implemented. Re-measure before trusting either number.

   THE SPACE WAS NOT BOUGHT FROM THE MOSAIC. Spin-up 2 tuned those row heights and
   fitDial's geometry depends on them. Verified after this change: mosaic still
   326x257, dial still 165, --clean series unchanged.

   NOTHING HERE BREATHES, still. The one animation remains the promotion flash. */
.rx-home{cursor:pointer;margin:0 0 10px;padding:17px 15px 18px;
  border:1px solid var(--line);background:rgba(255,238,214,.022);border-radius:5px;
  display:flex;flex-direction:column;gap:13px}
.rx-home.unknown{display:block;color:var(--ink-faint);font-size:11.5px;line-height:1.45}
.rh-top{display:flex;align-items:center;gap:14px;min-width:0}
.rh-name{font-family:var(--font-disp);font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh-x{flex:none;font-size:10.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums;
  letter-spacing:.02em;white-space:nowrap}
.rh-line{display:flex;align-items:center;gap:9px;min-width:0}
.rh-cap{flex:none;font-size:11px;line-height:1;letter-spacing:.06em;color:var(--ink-faint);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.rh-cap b{color:var(--ink-soft);font-weight:700}
.rh-cap em{font-style:normal;color:var(--cyan)}
.rh-cap em.dn{color:var(--amber)}
/* The XP arc to the next rung. Same gradient as the service record's bar, because
   it is the same reading at a different length. */
.rh-bar{flex:1;min-width:0;height:9px;border-radius:5px;background:rgba(255,238,214,.08);
  overflow:hidden}
.rh-bar i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--mag),var(--violet) 55%,var(--amber))}
/* TODAY, AS MARKS AGAINST THE CEILING. Sam's call, 2026-08-06: a bare `7` says
   nothing without knowing the ceiling is 20. The ceiling is DERIVED from W in
   dayCeiling(), not written here, because W retunes any morning and a hardcoded
   20 would quietly start lying the first time it does. */
.rh-marks{flex:1;min-width:0;display:flex;gap:2px}
.rh-marks i{flex:1;height:9px;border-radius:2px;background:rgba(255,238,214,.085)}
.rh-marks i.on{background:var(--amber);box-shadow:0 0 8px -3px var(--amber)}
/* THE INSIGNIA, six times its old linear size — 13x17 to 49x94 at one bar. This
   is the "badge itself bigger" Sam asked for and it is the reason the block is
   the hero of the home view rather than a footnote under the dial.
   Checked at every register, not only at Crewman: three bars, one solid pip, a
   hollow-and-solid pair, and the filled flag plate all read cleanly at this size
   in a screenshot at a true 390px. The plate is content-width, so the enlisted
   rungs are narrow and flag rank is wide, which is correct. */
.rh-col{flex:none;display:flex;align-items:center;gap:10px;height:94px;padding:0 18px;
  border-radius:14px;background:rgba(0,0,0,.42);box-shadow:inset 0 0 0 1px rgba(255,226,193,.13)}
.rh-col i{display:block;flex:none;background:var(--amber)}
.rh-col i.bar{width:13px;height:64px;border-radius:4px;opacity:.9}
.rh-col i.pip{width:32px;height:32px;border-radius:50%}
.rh-col i.pip.hollow{background:transparent;box-shadow:inset 0 0 0 7px var(--amber)}
.rh-col.flag{background:color-mix(in srgb,var(--amber) 20%,rgba(0,0,0,.5));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--amber) 55%,transparent)}
/* ONE FLASH, EVER. Added by checkPromotion at the moment a rung is crossed, which
   is guarded by promoShown and by the rank_key persisted in the ledger, so this
   cannot fire on a reload. transform and opacity only. */
@keyframes pipFlash{0%{opacity:.2;transform:scale(.55)}
                    45%{opacity:1;transform:scale(1.55)}
                    100%{opacity:1;transform:none}}
.rh-col i.flash{animation:pipFlash .62s var(--ease)}

/* ══ THE SERVICE RECORD ════════════════════════════════════════════════════ */
.rk-hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rk-name{font-family:var(--font-disp);font-size:25px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.rk-ab{font-size:11.5px;letter-spacing:.18em;color:var(--amber)}
.rk-sub{font-size:12.5px;color:var(--ink-mute);line-height:1.5;margin-top:5px}
.rk-bar{height:8px;background:rgba(255,238,214,.08);border-radius:4px;overflow:hidden;margin:13px 0 7px}
.rk-bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--mag),var(--violet) 55%,var(--amber))}
/* One column per day, height proportional to that day's points. A day with no
   row is drawn as an empty stub rather than omitted, because a gap in the record
   is itself information: it is a day the Bridge was never opened. */
.rk-week{display:flex;gap:5px;align-items:flex-end;height:76px;margin:12px 0 2px}
.rk-week>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.rk-week i{display:block;width:100%;min-height:3px;border-radius:3px 3px 0 0;background:var(--amber);opacity:.85}
.rk-week i.rest{background:var(--cyan);opacity:.6}
.rk-week i.none{background:rgba(255,238,214,.10)}
.rk-week b{font-size:10px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.rk-week span{font-size:9px;color:var(--ink-faint);letter-spacing:.04em}
.rk-rung{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:12.5px;
  border-bottom:1px solid rgba(255,238,214,.045);color:var(--ink-mute)}
.rk-rung:last-child{border-bottom:none}
.rk-rung .n{flex:1;min-width:0}
.rk-rung .x{flex:none;font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.rk-rung .pip{flex:none;width:7px;height:7px;border-radius:50%;background:rgba(255,238,214,.12)}
.rk-rung.done{color:var(--ink-faint)}
.rk-rung.done .pip{background:var(--amber);opacity:.5}
.rk-rung.now{color:var(--ink)}
.rk-rung.now .n{font-weight:700}
.rk-rung.now .pip{background:var(--amber);box-shadow:0 0 9px var(--amber)}

/* ── stale-brief bar ───────────────────────────────────────────────────────
   Between midnight and the 4am run there is no document for today, and the app
   used to answer that with a full-page "Nothing posted yet". That is technically
   true and practically useless: it blanks the Bridge for four hours every single
   night. It now falls back to the most recent brief it can find and says so.
   The bar is amber, not red, because a missing brief at 1am is normal. It turns
   red on its own after 05:30, when the run is genuinely late — same information,
   escalating only when it should. */
.stalebar{display:flex;align-items:center;gap:10px;margin:11px 0 0;padding:9px 12px;
  font-size:11.5px;line-height:1.4;color:var(--amber);
  border:1px solid rgba(224,165,63,.45);background:rgba(224,165,63,.07);
  border-radius:5px}
.stalebar.late{color:var(--red);border-color:rgba(192,74,58,.5);background:rgba(192,74,58,.08)}
/* The promotion notice. Same slot and same weight as the stale bar, because both
   are "something about today that you would want to know before reading on", and
   deliberately NOT a modal: this should feel like a citation posted on the board,
   not an interruption demanding dismissal before the brief can be read. */
.promobar{display:flex;align-items:center;gap:11px;margin:11px 0 0;padding:11px 13px;
  font-size:12.5px;line-height:1.45;color:var(--amber);border-radius:7px;
  border:1px solid color-mix(in srgb,var(--amber) 50%,transparent);
  background:color-mix(in srgb,var(--amber) 10%,transparent)}
.promobar span{flex:1;min-width:0}
.promobar b{color:var(--ink);font-weight:700}
.promobar .pip{flex:none;width:9px;height:9px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 18%,transparent)}
.promobar button{flex:none;border:1px solid currentColor;background:transparent;color:inherit;
  cursor:pointer;font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;border-radius:6px}
.promobar button:active{transform:scale(.94)}

/* ══ THE JACKPOT ═══════════════════════════════════════════════════════════
   Sam's ask, 2026-08-04, in his words: a slot-machine payout for points banked
   since the last time he opened this.

   This one IS a modal, and that is the opposite of the promobar's rule three
   comments up. The distinction is what the thing is FOR. The promotion notice is
   information you would want before reading the brief, so it sits in the flow and
   waits. A payout is not information — it is the payoff, and a payoff you can
   scroll past without noticing is not a payoff. It fires at most once a day, so it
   costs one tap on exactly one open, which is a price a reward can afford and a
   notice cannot.

   Every number in here is real. Nothing is inflated, rounded up or invented for
   the sake of a bigger reel, because a dopamine loop built on a number that does
   not tie out is one he stops believing after the first time he checks it. */
.jp{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(0,0,0,.60);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.jp.hide{display:none}
.jp-card{width:100%;max-width:330px;border-radius:var(--r-m);padding:26px 22px 20px;text-align:center;
  border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--amber) 13%,var(--bg)) 0%,var(--bg) 60%);
  box-shadow:0 22px 60px rgba(0,0,0,.55);animation:jpIn .42s cubic-bezier(.2,1.3,.4,1);
  /* SHIPPED WITHOUT A HEIGHT BOUND on 2026-08-04 and it was unusable on the first real
     payout: 22 items made the card taller than the phone, so it overflowed past both
     edges, nothing scrolled, and the Collect button was pushed off-screen — a modal with
     no reachable way out. The three rules that fix it and must stay together:
       1. the card can never exceed the viewport  (dvh, because mobile browser chrome
          makes 100vh taller than what you can actually see)
       2. only the MIDDLE scrolls
       3. the dismiss button is outside that scroller, so it is always reachable
     A modal must always be closable from whatever is on screen. */
  display:flex;flex-direction:column;
  max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}
.jp-head{flex:0 0 auto}
/* min-height:0 is load-bearing. A flex child defaults to min-height:auto, which refuses
   to shrink below its content — so overflow-y never engages and the card grows instead. */
.jp-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin-top:12px;overscroll-behavior:contain}
@keyframes jpIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
.jp-kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--amber)}
.jp-reels{display:flex;justify-content:center;align-items:center;gap:5px;margin:15px 0 2px}
.jp-plus{font-size:34px;line-height:66px;font-weight:800;color:var(--amber)}
/* overflow:hidden is the whole illusion — the strip is a full 0-9 column and the
   window shows one cell of it. */
.jp-reel{width:42px;height:66px;overflow:hidden;border-radius:9px;
  border:1px solid color-mix(in srgb,var(--amber) 32%,transparent);background:rgba(0,0,0,.30)}
.jp-strip{display:flex;flex-direction:column;transition:transform 1.2s cubic-bezier(.15,.85,.2,1)}
.jp-strip b{display:block;height:66px;line-height:66px;font-size:36px;font-weight:800;
  color:var(--ink);font-variant-numeric:tabular-nums}
.jp-sub{font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin:12px 2px 0}
.jp-sub b{color:var(--ink);font-weight:700}
.jp-wait{margin-top:13px;padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.45;
  text-align:left;color:var(--mint);
  border:1px solid color-mix(in srgb,var(--mint) 38%,transparent);
  background:color-mix(in srgb,var(--mint) 9%,transparent)}
.jp-wait b{color:var(--ink);font-weight:700}
.jp-det{margin-top:8px;text-align:left}
.jp-det>summary{cursor:pointer;list-style:none;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:700;color:var(--mint);padding:5px 0}
.jp-det>summary::-webkit-details-marker{display:none}
.jp-det>summary::after{content:' ▸';display:inline-block;transition:transform .15s}
.jp-det[open]>summary::after{transform:rotate(90deg)}
.jp-items{max-height:min(38vh,300px);overflow-y:auto;overscroll-behavior:contain;
  margin-top:4px;padding-right:4px}
.jp-btn{flex:0 0 auto;margin-top:17px;width:100%;border:0;border-radius:9px;padding:12px;cursor:pointer;
  font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  color:#2a1e08;background:var(--amber)}
.jp-btn:active{transform:scale(.97)}
/* Same courtesy the rest of the file extends: the reel is decoration, the number
   is the point, so with motion reduced the digits are simply there. */
@media (prefers-reduced-motion:reduce){
  .jp-card{animation:none}
  .jp-strip{transition:none}
}
.stalebar b{color:var(--ink);font-weight:700}
.stalebar span{flex:1;min-width:0}
.stalebar button{flex:none;border:1px solid currentColor;background:transparent;color:inherit;
  cursor:pointer;font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;
  border-radius:4px}
.stalebar button:active{transform:scale(.94)}

/* ══ CARD FACES ════════════════════════════════════════════════════════════
   Reference 1's cards all carry a second tier under the headline number: stat
   rows, bars, a grid. A tile that only holds a number and a sentence makes Sam
   open a sheet to learn anything, which is four taps before 6am. */
.f-rows{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.f-row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-soft);line-height:1.35}
.f-row .pip{width:5px;height:5px;flex:none;border-radius:50%;background:var(--ink-faint)}
.f-row .pip.urgent{background:var(--red);box-shadow:0 0 7px var(--red)}
.f-row .pip.high{background:var(--mag);box-shadow:0 0 7px var(--mag)}
.f-row .pip.med{background:var(--cyan);box-shadow:0 0 7px var(--cyan)}
.f-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-row .m{flex:none;color:var(--ink-faint);font-size:10px;letter-spacing:.02em}
.f-row .m.mag{color:var(--mag)} .f-row .m.cyan{color:var(--cyan)}
.f-seg{display:flex;gap:2px;margin-top:10px}
.f-seg i{flex:1;height:4px;background:rgba(255,238,214,.085)}
.f-seg i.on{background:var(--ac);box-shadow:0 0 9px -2px var(--ac)}
/* Label left, value right, one per line. Reference 1's SYSTEM tile does exactly
   this (TEMP 62°C / CLOCK 4.2GHz / VOLTAGE 1.25V) and it is the only layout that
   survives "$12,221 +8.1%" inside a half-width tile on a 375px phone. A two-column
   version overflowed on the first real number it was given. */
.f-mini{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.f-mini div{display:flex;align-items:baseline;gap:8px;min-width:0}
.f-mini .k{flex:1;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-mini .v{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.f-mini .v span{font-size:9.5px;font-weight:600;margin-left:4px}

/* mini month, on the card face. Reference 1's calendar tile, with our data. */
.cal-mini{margin-top:10px}
.cal-mos{font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:6px}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-dow span{font-size:7.5px;letter-spacing:.04em;color:var(--ink-faint);text-align:center;padding-bottom:3px}
.cal-d{position:relative;height:18px;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.cal-d.in{color:var(--ink-soft)}
.cal-d.today{color:#0d1016;font-weight:800;background:var(--cyan);
  border-radius:4px}
.cal-d b{position:absolute;bottom:1px;left:50%;width:3px;height:3px;border-radius:50%;
  margin-left:-1.5px;background:var(--cyan)}
.cal-d b.fam{background:var(--mag)} .cal-d b.both{background:var(--violet)}
.cal-d.today b{display:none}
.cal-key{display:flex;gap:11px;margin-top:8px;font-size:9px;color:var(--ink-mute);letter-spacing:.05em}
.cal-key i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* weather */
.wx-top{display:flex;align-items:center;gap:10px;margin-top:8px}
.wx-ic{width:34px;height:34px;flex:none;color:var(--cyan)}
.wx-ic svg{width:100%;height:100%;display:block}
.wx-t{font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.wx-t sup{font-size:15px;font-weight:700;vertical-align:super;letter-spacing:0}
.wx-cond{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.3}
.wx-day{display:flex;align-items:center;gap:11px;padding:9px 2px;
  border-bottom:1px solid rgba(255,238,214,.045)}
.wx-day:last-child{border-bottom:none}
.wx-day .d{font-size:11.5px;color:var(--ink-soft);width:52px;flex:none;letter-spacing:.04em}
.wx-day .i{width:20px;height:20px;flex:none;color:var(--cyan)}
.wx-day .i svg{width:100%;height:100%;display:block}
.wx-day .c{flex:1;font-size:12px;color:var(--ink-mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx-day .p{font-size:11px;color:var(--cyan);width:38px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.wx-day .r{font-size:12.5px;width:74px;text-align:right;flex:none;font-variant-numeric:tabular-nums;color:var(--ink)}
.wx-day .r s{text-decoration:none;color:var(--ink-faint)}
/* ── AIR QUALITY ───────────────────────────────────────────────────────────
   One row, and only when there is something to say. Glow on the EDGE and the
   interior left dark, per the house rule: a filled amber panel behind body text
   at 6am on an OLED washes the words it is trying to make urgent.
   Nothing here breathes. `.bad` does not pulse — the number is the alarm, and an
   animation on a card Sam opens every morning is wallpaper inside a week. */
.aqi{display:flex;align-items:baseline;gap:9px;margin:0 0 11px;padding:9px 11px;
  border:1px solid var(--line);border-left-width:3px;border-radius:5px;
  background:rgba(255,238,214,.022)}
.aqi .n{font-family:var(--font-disp);font-size:19px;font-weight:700;line-height:1;
  flex:none;font-variant-numeric:tabular-nums;color:var(--ink)}
.aqi .b{flex:1;min-width:0;font-size:12px;line-height:1.35;color:var(--ink-soft)}
.aqi .b em{font-style:normal;display:block;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
.aqi.warn{border-left-color:var(--amber);box-shadow:0 0 14px -8px var(--amber)}
.aqi.warn .n{color:var(--amber)}
.aqi.bad{border-left-color:var(--mag);box-shadow:0 0 16px -7px var(--mag)}
.aqi.bad .n{color:var(--mag)}
.aqi.dim{border-left-color:var(--line)}
.aqi.dim .n{font-size:13px;color:var(--ink-faint)}
.wx-hrs{display:flex;gap:5px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.wx-hrs::-webkit-scrollbar{display:none}
.wx-hr{flex:none;width:52px;text-align:center;padding:9px 0;border:1px solid var(--line);
  border-radius:4px}
.wx-hr .h{font-size:9.5px;color:var(--ink-mute);letter-spacing:.05em}
.wx-hr .i{width:17px;height:17px;margin:5px auto;color:var(--cyan)}
.wx-hr .i svg{width:100%;height:100%;display:block}
.wx-hr .t{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.wx-hr .p{font-size:9px;color:var(--cyan);margin-top:2px;min-height:12px}
.wx-fail{font-size:11px;color:var(--amber);margin-top:9px;line-height:1.4}

/* ── water ─────────────────────────────────────────────────────────────── */
.wtr{border:1px solid var(--line);background:var(--s0);border-radius:7px;
  padding:13px 14px;margin-bottom:12px}
.wtr-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wtr-k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute)}
.wtr-v{font-size:19px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.wtr-v small{font-size:11px;font-weight:600;color:var(--ink-mute);margin-left:6px;letter-spacing:0}
.wtr-pips{display:flex;gap:4px;margin:11px 0 12px}
.wtr-pips i{flex:1;height:7px;border-radius:3px;background:rgba(255,238,214,.10)}
.wtr-pips i.on{background:var(--cyan);box-shadow:0 0 9px -3px var(--cyan)}
.wtr-act{display:flex;gap:8px}
.wtr-act button{border:1px solid var(--line-2);background:transparent;color:var(--ink-soft);
  cursor:pointer;font:inherit;font-size:13px;font-weight:700;padding:9px 0;border-radius:7px}
.wtr-act button[data-d="-1"]{flex:none;width:52px}
/* The supplement pair. Two taps, ONE habit, exactly the way the five mobility
   movements wear a single checkbox — the shape Sam already accepted for the
   routine, reused here rather than inventing a second idea for the same problem. */
.wtr-sup{display:flex;gap:8px;margin-top:8px}
.wtr-sup button{flex:1;border:1px solid var(--line-2);background:transparent;
  color:var(--ink-soft);cursor:pointer;font:inherit;font-size:13px;font-weight:700;
  padding:9px 0;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:7px}
.wtr-sup button .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.wtr-sup button.on{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.wtr-sup button.on .dot{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px -2px var(--cyan)}
.wtr-sup button:active{transform:scale(.96)}
/* All-or-nothing is INVISIBLE without this line. The track pays 3 or it pays 0,
   and a counter that silently decides the day is already lost is the failure mode
   this design was warned about. Naming what is still outstanding keeps the back
   half of the day live. */
.wtr-note{margin-top:9px;font-size:11px;letter-spacing:.02em;color:var(--ink-faint);
  display:flex;align-items:center;gap:6px}
.wtr-note.done{color:var(--cyan)}
/* The routine block borrows intake's shell so the two read as one system. The rows
   keep the punch list's .row/.ck styling, so only the seams need setting: strip the
   group's old padding and let the rows sit flush inside the card. */
.rtn .g-body{margin-top:10px}
.rtn .row{padding-left:0;padding-right:0}
.rtn .row:last-of-type{border-bottom:0;padding-bottom:2px}
.wtr-act button[data-d="1"]{flex:1;color:var(--cyan);
  border-color:color-mix(in srgb,var(--cyan) 45%,transparent);
  background:color-mix(in srgb,var(--cyan) 10%,transparent)}
/* ── the Training block's meters entry, added 2026-08-25 with the rowing rework ──
   16px font is NOT a style choice: any smaller and iOS Safari zooms on focus and
   never zooms back, which is a standing hard constraint of this file. tabular-nums
   so 3115 and 4608 occupy the same width and the field does not breathe as he types. */
.wkt .mtr-line{display:flex;align-items:center;gap:9px;margin-top:8px}
.wkt .mtr-line .lbl{font-size:11px;letter-spacing:.06em;color:var(--ink-mute);flex:none}
.wkt input.mtr{width:90px;font:inherit;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--ink);background:var(--s0);
  border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;text-align:right}
.wkt input.mtr:focus{outline:none;border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.wkt .mtr-line .unit{font-size:11px;color:var(--ink-faint)}
/* The week and all-time readings. Facts, not controls, so they sit in the note's
   register: quiet ink, one line each, no glow. The all-time figure is the long
   game made visible, which is the whole reason Sam asked for it. */
.wkt .wk-sum{margin-top:9px;font-size:11px;letter-spacing:.02em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.wkt .wk-sum b{color:var(--ink-soft);font-weight:700}
.wtr-act button:active{transform:scale(.96)}

/* ══ MOTION ════════════════════════════════════════════════════════════════
   fill-mode is `backwards`, NOT `both`. With `both` the animation's end state
   keeps overriding the element's own rules after it finishes, which silently
   kills .card:active — the press would stop registering the moment the boot
   animation ended. `backwards` covers the stagger delay and then gets out of
   the way. */
@keyframes cardIn{from{opacity:0;transform:translate3d(0,15px,0) scale(.986)}
                  to{opacity:1;transform:none}}
.panel{animation:cardIn .44s var(--ease) backwards}
@keyframes slabIn{from{opacity:0;transform:translate3d(0,-9px,0)}to{opacity:1;transform:none}}
.slab{animation:slabIn .5s var(--ease) backwards}
/* The tiles fall into place around the dial, on a stagger set in JS.
   .32s rather than .4s, and the stagger is now the measured CLOCKWISE ring index
   rather than DOM order: seven tiles 30ms apart at .32s each is 500ms of landing,
   which is what fits inside the arrival budget. See the ring sort in fitDial. */
@keyframes tileIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.tile{animation:tileIn .32s var(--ease) backwards}

/* ══ THE ARRIVAL ═══════════════════════════════════════════════════════════
   The wordmark starts large and centred and settles into its top-left position,
   the date and clock arrive, then the tiles land clockwise from twelve.

   The overlay is pointer-events:none for its entire life. That is the rule that
   keeps this from ever being in the way: a press at 200ms lands on the tile
   underneath, not on the animation, so nothing about the arrival can delay Sam
   acting. The first pointerdown anywhere also ends the sequence immediately.

   Background is var(--bg) and NOT transparent, because the thing it is hiding is
   the loading skeleton and a half-built mosaic. It is removed from the flow
   entirely once gone, so it cannot eat a tap after it is invisible.

   Timing lives in runArrival(). Everything here is transform and opacity. */
#arrive{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  pointer-events:none;background:var(--bg);transition:opacity .18s linear}
/* Shown only while the app is, and scoped by a sibling selector rather than by a
   JS toggle so it cannot be left up over the sign-in gate or over Amy's view.
   z-index 50 clears the dock at 30 and the sheet at 20; the jackpot at 60 stays
   above it, which is the right order on the rare morning both want the screen. */
#app:not(.hide)~#arrive:not(.off){display:flex}
#arrive.gone{opacity:0}
/* Same family, same tracking, same transform as #ebMark, so width scales linearly
   with font-size and the morph needs no assumption about line boxes. */
.arr-word{font-family:var(--font-disp);font-size:clamp(26px,8.5vw,38px);font-weight:400;
  letter-spacing:.30em;line-height:1;text-transform:uppercase;color:var(--amber);
  opacity:0;transform-origin:center center;will-change:transform,opacity}
.arr-word.in{opacity:1;transition:opacity .22s var(--ease)}
.arr-word.morph{transition:transform .38s cubic-bezier(.55,0,.2,1),opacity .22s var(--ease)}
/* The clock face arrives with the date rather than with the shell. The dial's
   rings and glow are already up behind the overlay; this is only the type. */
.rx-face{transition:opacity .22s var(--ease)}
.rx-face.arr{opacity:0}
/* Landing feedback on a check-off. Opacity only, one shot. */
.row{position:relative}
.row::after{content:"";position:absolute;inset:-1px;background:var(--mint);opacity:0;pointer-events:none}
.row.hit::after{animation:hitf .36s var(--ease)}
@keyframes hitf{0%{opacity:.16}100%{opacity:0}}
/* Urgency is the ONLY thing allowed to pulse, and only while it is urgent. */
@keyframes urg{0%,100%{opacity:1}50%{opacity:.45}}
.c-flag.urgent{animation:urg 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .panel,.tile,.p-body,.slab,.c-flag.urgent,.row.hit::after,.dial-glow{animation:none}
  .slab::after{animation:none;opacity:0}
  .rx-arc,.rx-arc2{transition:none}
  /* Full functionality, no motion. runArrival() takes the reduced-motion branch
     and never adds .morph, so the overlay is gone and the eyebrow, clock and
     tiles are simply present on the first paint. These kill the transitions in
     case any of them is mid-flight when the setting changes. */
  .rh-col i.flash{animation:none}
  #arrive{transition:none}
  .arr-word,.arr-word.in,.arr-word.morph{transition:none}
  #ebMark,#ebDate,.rx-face{transition:none}
  /* The sheet appears instead of rising. Press feedback on .card:active stays —
     that is a direct response to a touch, not ambient motion, and removing it
     would make the tiles feel broken rather than calm. */
  #detail{transition:none}
}
/* ══ MOBILE: THE ICON MOSAIC ═══════════════════════════════════════════════
   Sam, 2026-08-06: "for mobile, I would like to switch the displays to just
   symbols, nothing I'm currently shown on any of them is useful apart from the
   weather." And: "make the glyphs larger so that the cards don't shrink or hold
   a bunch of dead space."

   So below 860px a tile face is an icon, the card's name, and a count when the
   card wants something. Weather is the named exception and keeps its face.

   THE HEIGHT IS THE POINT, not the tidiness. Measured on the live page at a true
   390x844 before this change: the run recap's bottom edge sat at 659px with the
   house-list pill hidden and would sit at ~716px with it shown, against a fixed
   dock that owns the last 64px. Sam wants both pills and the recap visible at
   scroll zero, and shrinking the block is what pays for it.

   ROWS 1 AND 4 CARRY THE WHOLE CUT. That is what keeps the dial at full size,
   and it is Sam's call over the alternative of taking ~20px more out of the
   middle rows at the cost of 3.5px of clock. fitDial derives R from rows 2 and 3
   only, so the punch bar and the calendar/news pair can be any height they like
   without touching the centre. 44fr:74fr:74fr:44fr against 311/245 holds the
   middle rows at their measured 77.7px and drops the bars from 73px to 46px.

   The circle stays exactly tangent to the bars, before and after. The distance
   from the dial centre to a bar's inner edge is (row2+row3)/2 + 4.5, and R is
   the same expression, so the bite can never reach into a bar no matter how
   short it gets. Verified against the measured values either side of the change.

   THE HARD WIDTH BUDGET IS 46px, not the tile's 162px. The four flanking tiles
   are 162px wide but the dial eats most of that, and --clean (measured per tile
   in fitDial, worst case at the tile edge nearest the circle's centre line) came
   back 46, 46, 47, 47. So a "large glyph" on those four means 38px hard against
   the OUTER edge, and the name under it, and nothing else. The bars have the
   full width and only 46px of height, so they run horizontally instead. */
@media(max-width:859.98px){
  .mosaic{aspect-ratio:311/245;grid-template-rows:44fr 74fr 74fr 44fr}

  /* The face. Clamped to --clean on the four flanking tiles, unclamped on the
     bars, which the circle does not reach. */
  .tile.glyph{padding:5px 7px;justify-content:center}
  .tile.sq.glyph{align-items:flex-start}
  .tile.sq.r.glyph{align-items:flex-end}
  .t-face{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
  .tile.sq .t-face{max-width:var(--clean,100%)}
  /* The bars run icon-then-name on one line: 46px of height will not take a
     stacked pair, and a 26px icon centred in a 326px bar with the name beside it
     is the same object turned on its side, not a different idea. */
  .tile.bar .t-face,.tile.wide .t-face{flex-direction:row;align-items:center;gap:8px}
  .tile.wide.r .t-face{flex-direction:row-reverse}
  .t-ic{display:block;width:38px;height:38px;color:var(--ac)}
  .tile.bar .t-ic,.tile.wide .t-ic{width:25px;height:25px}
  .t-ic svg{display:block;width:100%;height:100%}
  /* The name is not optional. A glyph on its own is a guessing game on the third
     card you have never tapped, and this page is read half awake. Neutral ink,
     per the rule that accent carries state and labels do not. */
  .t-nm{font-family:var(--font-disp);font-size:8.5px;letter-spacing:.13em;line-height:1;
    text-transform:uppercase;color:var(--ink-mute);
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile.on .t-nm{color:var(--ink-soft)}
  /* THE COUNT, and only where a count means something. Sam chose this over a
     plain state dot precisely because a dot cannot tell six from one. It sits in
     the tile's OUTER top corner, which is the corner the bite never reaches. */
  .tile.sq.glyph>.t-b{position:absolute;top:5px;z-index:2;margin:0}
  .tile.sq.glyph:not(.r)>.t-b{left:6px}
  .tile.sq.glyph.r>.t-b{right:6px}
  .tile.bar.glyph>.t-b,.tile.wide.glyph>.t-b{position:absolute;top:5px;right:7px;z-index:2;margin:0}
  .tile.wide.glyph.r>.t-b{right:auto;left:7px}
  /* Weather keeps its face and therefore keeps the old value type. It is the one
     tile whose content is useful without tapping, which is Sam's own reason. */

  /* ── a placeholder in the shortened bars ─────────────────────────────────
     A missing card keeps its normal face, not a glyph, because an icon and a
     name on an absent card look exactly like a present one. But the stacked
     placeholder (label, then dash, then caption) needs 58px and rows 1 and 4 are
     46px now, so it overflowed by 11px and `overflow:hidden` ate the difference
     silently. Measured, on all three of punch, calendar and news; the four
     flanking tiles are untouched at 78px and were never at risk.

     This is not a rare state. With `news` off `CARD_KEYS` after the feeder
     spin-up, the news tile is an amber placeholder on EVERY run, so a clipped
     placeholder in row 4 would have been the normal morning.

     Laid on one line it fits in 31px, and it matches the horizontal language the
     bars now use anyway. The caption is dropped rather than shrunk: a missing
     card's full sentence is one tap away in the sheet, which is already the
     documented rule for it (see missBlock). The amber, the dash and the label
     all survive, so the tile still reads as absent rather than as empty. */
  .tile.bar.miss,.tile.wide.miss{flex-direction:row;align-items:center;gap:9px}
  .tile.bar.miss{justify-content:center}
  .tile.wide.miss{justify-content:flex-start}
  .tile.wide.r.miss{flex-direction:row-reverse;justify-content:flex-start}
  .tile.bar.miss .t-missu,.tile.wide.miss .t-missu{display:none}
}

/* ══ DESKTOP ═══════════════════════════════════════════════════════════════
   On a phone the tiles are a summary and the panel below carries the detail. On
   a desktop the same layout scales to ~908px wide and the tiles become 330x216
   boxes holding a word and a number, which is most of a screen of nothing.

   So above 860px the panel goes away entirely and each tile carries its own
   detail: the same FACE builders the panel uses, rendered in place. The shapes,
   the placement, the bite and the accents are all untouched — only what is
   INSIDE each tile changes. One tap opens the full sheet, because with the
   detail already on the card there is nothing left for a first tap to reveal. */
@media(min-width:860px){
  #panelHost{display:none}
  /* Taller rows than the phone ratio. The detail needs the height, and growing the
     block is cheaper than shrinking the type. Measured: at 876px wide this gives
     224px rows for the bars and 236px for the flanking tiles, which is what the
     content below actually fits in. */
  .mosaic{aspect-ratio:311/330}
  .tile{padding:15px 17px;justify-content:flex-start}
  .t-head{gap:8px;margin-bottom:2px}
  .t-g{font-size:14px}
  .t-k{font-size:11px;letter-spacing:.15em}
  .t-b{min-width:19px;height:19px;font-size:10.5px}
  .tile .t-v{font-size:34px}
  .tile .t-v.sm{font-size:26px} .tile .t-v.xs{font-size:20px}
  .tile .t-u{font-size:12px;margin-top:4px}
  /* The placeholder scales with everything else. Left at the phone's 17px/9px it
     sat in the top-left tenth of a 327x237 tile and read as an empty box rather
     than as a card reporting something. */
  .tile .t-miss{font-size:34px}
  .tile .t-missu{font-size:12px;margin-top:4px}
  /* the panel's own body styles, now inside a tile */
  .t-full{width:100%;min-width:0}
  .t-full .c-stat{font-size:38px}
  .t-full .c-stat.sm{font-size:22px}
  .t-full .c-stat.tease{font-size:17px;-webkit-line-clamp:2}
  .t-full .c-unit{font-size:12.5px;margin-top:6px}
  .t-full .f-rows{margin-top:12px;gap:7px}
  .t-full .f-row{font-size:13px}
  .t-full .f-row .m{font-size:11.5px}
  .t-full .f-mini{margin-top:12px;gap:7px}
  .t-full .f-mini .k{font-size:10px}
  .t-full .f-mini .v{font-size:15px}
  .t-full .f-seg{margin-top:12px}
  .t-full .f-seg i{height:5px}
  .t-full .cal-mini{margin-top:10px}
  .t-full .cal-d{height:26px;font-size:12px}
  .t-full .cal-dow span{font-size:10px}
  .t-full .cal-mos{font-size:10px}
  .t-full .cal-key{font-size:11px}
  .t-full .wx-t{font-size:44px}
  .t-full .wx-ic{width:46px;height:46px}
  .t-full .wx-cond{font-size:13px}
  .t-full .wx-day{padding:6px 2px}
  .t-full .wx-day .d{font-size:12px;width:56px}
  /* Right-hand tiles keep their content on the outer edge, away from the bite. */
  .tile.r .t-full{text-align:right}
  .tile.r .t-full .f-row{flex-direction:row-reverse}
  .tile.r .t-full .f-mini div{flex-direction:row-reverse}
  .tile.r .t-full .wx-top{flex-direction:row-reverse}
  .tile.c .t-full{text-align:center}
  /* NOT centred once the rows go into two columns — centring each cell's contents
     inside its own column made the five items sit at five different left edges. */
  .tile.c .t-full .f-rows{align-items:stretch;text-align:left}
  /* The flanking tiles are clamped to the strip the dial does not cover. --clean
     is measured per tile in fitDial. */
  .tile.sq .t-full{max-width:var(--clean,100%)}
  .tile.sq.r .t-full{margin-left:auto}

  /* ── making the detail fit its tile ──────────────────────────────────────
     Six of the seven overflowed on the first pass and were being silently
     clipped by overflow:hidden. Each of these is a measured fix, not a guess. */

  /* Punch: the full-width bar has 876px to work with, so five items go in two
     columns instead of one and the tile stops needing 257px of height. */
  /* minmax(0,1fr), for the third time in this file. Plain 1fr is minmax(auto,1fr),
     so a long punch item's min-content width blows its column out and the two
     columns stop being two columns. */
  .tile.bar .t-full .f-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px}
  .tile.bar .t-full .f-row{justify-content:flex-start}

  /* Calendar: the month grid beside the next event rather than beneath it. */
  .tile[data-k="calendar"] .t-full{display:grid;grid-template-columns:auto 1fr;
    gap:0 20px;align-items:start}
  .tile[data-k="calendar"] .t-full .c-stat{grid-column:1}
  .tile[data-k="calendar"] .t-full .c-unit{grid-column:1}
  .tile[data-k="calendar"] .t-full .cal-mini{grid-column:2;grid-row:1/4;margin-top:2px;min-width:0}
  .tile[data-k="calendar"] .t-full .cal-d{height:22px;font-size:11.5px}
  .tile[data-k="calendar"] .t-full .cal-key{display:none}

  /* Weather: a placard, not a forecast. The seven-day list stays in the sheet,
     where there is room for it. */
  .t-full .wx-day{display:none}

  /* Inbox: four rows is what the height takes. The matching news rule went with
     the card on 2026-08-06. */
  .tile[data-k="inbox"] .t-full .f-row:nth-child(n+5){display:none}

  /* ── fitting the 163px clean strip ───────────────────────────────────────
     The four flanking tiles are 327px wide but the dial is 482px across, so only
     163px of each is actually clear of it. That is the hard budget, and content
     written for a full-width card does not fit it:
       a 15-character sender name truncated to 9 at 77px
       the "Avg check" label truncated at 45px
       Service ran 249px tall inside a 237px tile
     Rather than shrink the dial to buy width back, the tiles show less. Each of
     these is dropped from the TILE only and is still in the sheet. */

  /* Inbox: the state chip goes, the name gets the width. The pip already carries
     the same signal — magenta means it wants a reply. */
  .tile[data-k="inbox"] .t-full .f-row .m{display:none}

  /* Service: three stats, no deltas. Label plus value then fits on one line and
     the tile stops overflowing its height. */
  .tile.sq .t-full .f-mini div:nth-child(n+4){display:none}
  .tile.sq .t-full .f-mini .v span{display:none}
  /* Routine is exempt from the line above, and only Routine. That rule was written
     for Service, whose deltas ("+8.1% vs last Wed") genuinely blew the clean budget.
     The intake marker is two characters and the reason it has to survive is the
     all-or-nothing scoring: "5/8" on its own reads as nearly-earned when a missed
     supplement means the track is worth zero. Measured before exempting, at 880px
     and at a wide viewport: value scrollWidth 44 against clientWidth 44, no
     horizontal overflow, and identical tile scrollHeight with the span shown and
     hidden, so it buys no height either.
     Separate and pre-existing: this tile overflows its cell by 17px at 880px with
     or without the marker. Not introduced here. */
  .tile[data-k="routine"] .t-full .f-mini .v span{display:inline}
}
.hide{display:none !important}
</style>
</head>
<body>

<div id="mesh"><i></i><i></i><i></i></div>
<div id="scan"></div>

<div id="gate">
  <div class="gate-in">
    <div class="gate-mark">San Fermo</div>
    <h1 class="gate-title">The <span class="grad">Bridge</span></h1>
    <p class="gate-sub">Your daily check-in. Sign in once, this device stays signed in.</p>
    <button class="btn-goog" id="signin">

      Sign in with Google
