  .panel,.tile,.p-body,.slab,.c-flag.urgent,.row.hit::after,.dial-glow{animation:none}
  .slab::after{animation:none;opacity:0}
  .rx-arc,.rx-arc2{transition:none}
  /* The sheet appears instead of rising. Press feedback on .card:active stays —
     that is a direct response to a touch, not ambient motion, and removing it
     would make the tiles feel broken rather than calm. */
  #detail{transition:none}
}
/* ══ DESKTOP ═══════════════════════════════════════════════════════════════
   On a phone the tiles are a summary and the panel below carries the detail. On
   a desktop the same layout scales to ~908px wide and the tiles become 330x216
   boxes holding a word and a number, which is most of a screen of nothing.

   So above 860px the panel goes away entirely and each tile carries its own
   detail: the same FACE builders the panel uses, rendered in place. The shapes,
   the placement, the bite and the accents are all untouched — only what is
   INSIDE each tile changes. One tap opens the full sheet, because with the
   detail already on the card there is nothing left for a first tap to reveal. */
@media(min-width:860px){
  #panelHost{display:none}
  /* Taller rows than the phone ratio. The detail needs the height, and growing the
     block is cheaper than shrinking the type. Measured: at 876px wide this gives
     224px rows for the bars and 236px for the flanking tiles, which is what the
     content below actually fits in. */
  .mosaic{aspect-ratio:311/330}
  .tile{padding:15px 17px;justify-content:flex-start}
  .t-head{gap:8px;margin-bottom:2px}
  .t-g{font-size:14px}
  .t-k{font-size:11px;letter-spacing:.15em}
  .t-b{min-width:19px;height:19px;font-size:10.5px}
  .tile .t-v{font-size:34px}
  .tile .t-v.sm{font-size:26px} .tile .t-v.xs{font-size:20px}
  .tile .t-u{font-size:12px;margin-top:4px}
  /* The placeholder scales with everything else. Left at the phone's 17px/9px it
     sat in the top-left tenth of a 327x237 tile and read as an empty box rather
     than as a card reporting something. */
  .tile .t-miss{font-size:34px}
  .tile .t-missu{font-size:12px;margin-top:4px}
  /* the panel's own body styles, now inside a tile */
  .t-full{width:100%;min-width:0}
  .t-full .c-stat{font-size:38px}
  .t-full .c-stat.sm{font-size:22px}
  .t-full .c-stat.tease{font-size:17px;-webkit-line-clamp:2}
  .t-full .c-unit{font-size:12.5px;margin-top:6px}
  .t-full .f-rows{margin-top:12px;gap:7px}
  .t-full .f-row{font-size:13px}
  .t-full .f-row .m{font-size:11.5px}
  .t-full .f-mini{margin-top:12px;gap:7px}
  .t-full .f-mini .k{font-size:10px}
  .t-full .f-mini .v{font-size:15px}
  .t-full .f-seg{margin-top:12px}
  .t-full .f-seg i{height:5px}
  .t-full .cal-mini{margin-top:10px}
  .t-full .cal-d{height:26px;font-size:12px}
  .t-full .cal-dow span{font-size:10px}
  .t-full .cal-mos{font-size:10px}
  .t-full .cal-key{font-size:11px}
  .t-full .wx-t{font-size:44px}
  .t-full .wx-ic{width:46px;height:46px}
  .t-full .wx-cond{font-size:13px}
  .t-full .wx-day{padding:6px 2px}
  .t-full .wx-day .d{font-size:12px;width:56px}
  /* Right-hand tiles keep their content on the outer edge, away from the bite. */
  .tile.r .t-full{text-align:right}
  .tile.r .t-full .f-row{flex-direction:row-reverse}
  .tile.r .t-full .f-mini div{flex-direction:row-reverse}
  .tile.r .t-full .wx-top{flex-direction:row-reverse}
  .tile.c .t-full{text-align:center}
  /* NOT centred once the rows go into two columns — centring each cell's contents
     inside its own column made the five items sit at five different left edges. */
  .tile.c .t-full .f-rows{align-items:stretch;text-align:left}
  /* The flanking tiles are clamped to the strip the dial does not cover. --clean
     is measured per tile in fitDial. */
  .tile.sq .t-full{max-width:var(--clean,100%)}
  .tile.sq.r .t-full{margin-left:auto}

  /* ── making the detail fit its tile ──────────────────────────────────────
     Six of the seven overflowed on the first pass and were being silently
     clipped by overflow:hidden. Each of these is a measured fix, not a guess. */

  /* Punch: the full-width bar has 876px to work with, so five items go in two
     columns instead of one and the tile stops needing 257px of height. */
  /* minmax(0,1fr), for the third time in this file. Plain 1fr is minmax(auto,1fr),
     so a long punch item's min-content width blows its column out and the two
     columns stop being two columns. */
  .tile.bar .t-full .f-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px}
  .tile.bar .t-full .f-row{justify-content:flex-start}

  /* Calendar: the month grid beside the next event rather than beneath it. */
  .tile[data-k="calendar"] .t-full{display:grid;grid-template-columns:auto 1fr;
    gap:0 20px;align-items:start}
  .tile[data-k="calendar"] .t-full .c-stat{grid-column:1}
  .tile[data-k="calendar"] .t-full .c-unit{grid-column:1}
  .tile[data-k="calendar"] .t-full .cal-mini{grid-column:2;grid-row:1/4;margin-top:2px;min-width:0}
  .tile[data-k="calendar"] .t-full .cal-d{height:22px;font-size:11.5px}
  .tile[data-k="calendar"] .t-full .cal-key{display:none}

  /* Weather: a placard, not a forecast. The seven-day list stays in the sheet,
     where there is room for it. */
  .t-full .wx-day{display:none}

  /* Inbox and News: four rows is what the height takes. */
  .tile[data-k="inbox"] .t-full .f-row:nth-child(n+5){display:none}
  .tile[data-k="news"] .t-full .f-row:nth-child(n+5){display:none}

  /* ── fitting the 163px clean strip ───────────────────────────────────────
     The four flanking tiles are 327px wide but the dial is 482px across, so only
     163px of each is actually clear of it. That is the hard budget, and content
     written for a full-width card does not fit it:
       a 15-character sender name truncated to 9 at 77px
       the "Avg check" label truncated at 45px
       Service ran 249px tall inside a 237px tile
     Rather than shrink the dial to buy width back, the tiles show less. Each of
     these is dropped from the TILE only and is still in the sheet. */

  /* Inbox: the state chip goes, the name gets the width. The pip already carries
     the same signal — magenta means it wants a reply. */
  .tile[data-k="inbox"] .t-full .f-row .m{display:none}

  /* Service: three stats, no deltas. Label plus value then fits on one line and
     the tile stops overflowing its height. */
  .tile.sq .t-full .f-mini div:nth-child(n+4){display:none}
  .tile.sq .t-full .f-mini .v span{display:none}
  /* Routine is exempt from the line above, and only Routine. That rule was written
     for Service, whose deltas ("+8.1% vs last Wed") genuinely blew the clean budget.
     The intake marker is two characters and the reason it has to survive is the
     all-or-nothing scoring: "5/8" on its own reads as nearly-earned when a missed
     supplement means the track is worth zero. Measured before exempting, at 880px
     and at a wide viewport: value scrollWidth 44 against clientWidth 44, no
     horizontal overflow, and identical tile scrollHeight with the span shown and
     hidden, so it buys no height either.
     Separate and pre-existing: this tile overflows its cell by 17px at 880px with
     or without the marker. Not introduced here. */
  .tile[data-k="routine"] .t-full .f-mini .v span{display:inline}
}
.hide{display:none !important}
</style>
</head>

        <div id="heroStatus" class="hide">

    <div id="panelHost"><div class="skel"></div></div>

    <!-- Run recap sits BELOW the cards: it is a receipt for the overnight job, not the
