   correct way to find "last night", and is why there is no doc for today. */
var REVEL={loaded:false,loading:null,days:[]};
var REVEL_WINDOW=35;
/* The scorecard's benchmarks, read in load() from bridge_data/targets and
   published by the captain's log. TARGETS null with TARGETS_ERR null means the
   doc simply is not there yet; TARGETS_ERR set means the read was refused or
   failed. The card renders those two differently and neither one as a zero. */
var TARGETS=null, TARGETS_ERR=null;

function loadRevel(){
  if(REVEL.loaded) return Promise.resolve(REVEL);
  if(REVEL.loading) return REVEL.loading;
  var keys=[], d=new Date(DATE+'T12:00:00');
  for(var i=0;i<REVEL_WINDOW;i++){ keys.push(dayKey(d)); d.setDate(d.getDate()-1); }
  REVEL.loading=Promise.all(keys.map(function(k){
    return db.collection('revel').doc(k).get()
      .then(function(s){ return s.exists?Object.assign({_date:k},s.data()):null; })
      .catch(function(e){ return {_date:k,_err:(e&&e.code)||String(e)}; });
  })).then(function(res){
    var errs=res.filter(function(x){return x&&x._err;});
    REVEL.days=res.filter(function(x){return x&&!x._err;});   // newest first
    REVEL.err = errs.length ? (errs[0]._err+' ('+errs.length+' of '+REVEL_WINDOW+' reads)') : null;
    REVEL.loaded=true;
    return REVEL;
  });
  return REVEL.loading;
}

function money(n){
  if(n==null||!isFinite(n)) return '—';
  return '$'+Math.round(n).toLocaleString('en-US');
}
function money2(n){
  if(n==null||!isFinite(n)) return '—';
  return '$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function pct(n){ return (n==null||!isFinite(n))?'—':n.toFixed(1)+'%'; }
function sum(rows,fn){ return rows.reduce(function(a,r){var v=fn(r);return a+(isFinite(v)?v:0);},0); }
function shortDate(k){
  var d=new Date(k+'T12:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'});
}

/* ══ THE SERVICE SCORECARD ═══════════════════════════════════════════════════
   Rewritten 2026-08-06. Sam's call, 2026-08-05: "the bridge should focus mainly
   on whether I'm trending towards hitting benchmarks to earn points,
   daily/weekly/monthly, and the true recap can stay as built within the portal.
   No need to mirror it."

   So the card stopped being a metrics panel. Every row is now a target, where he
   stands against it, and what it pays.

   WHAT CAME OFF, so nobody restores it by accident: the night/week/month tab
   strip, raw product totals, transactions, average check, per-guest, the top
   food and drink lists with their anomalies and not-moving rows, the wine
   bottles/glasses split, shape of the night, on the floor, leakage, best and
   slowest night, and the pooled effective service-charge band. Every one of
   those lives in the portal's Recap tab, and mirroring it here is precisely
   what he asked to stop.

   THE SCORECARD SHOWS PACE, NOT PAYOUT. Nothing in this function writes to
   bridge_state or awards anything, and `W.win` is still deliberately unwired.
   These rows say whether he is tracking toward the points; the points arrive
   through the ledger like everything else. Read XP-AND-CLOSEOUT.md before
   changing that, because a card that both reports and pays is the design that
   was already rejected once.

   MONTHLY LABOR IS DELIBERATELY ABSENT. It was in the first spec and Sam
   dropped it 2026-08-06: a labor row weekly AND monthly pays twice for one
   behaviour, and the weekly horizon is the one he can still act on.

   THREE INPUTS, AND EVERY FAILURE MODE IS DRAWN DIFFERENTLY. Targets can be
   present, absent, or unreachable. Revel can load, partly load, or fail. NOI has
   no source at all and is expected to be unknown. None of those is ever rendered
   as a row at zero, because a missing input that looks like a missed target is
   the same lie as an empty day that looks like a failed read. */

/* ISO-8601 week, because that is the basis the targets doc states ("same ISO
   week, previous year"). A Sunday-start week would compare this Monday's service
   against last year's Sunday and be quietly off by one night all year.
   Thursday-anchored, which is the whole trick: an ISO week belongs to whichever
   year its Thursday falls in, so the 4 Jan reference always sits in week 1. */
function isoWeekOf(k){
  var d=new Date(k+'T12:00:00');
  d.setDate(d.getDate()-((d.getDay()+6)%7)+3);          // Thursday of this week
  var t=new Date(d.getFullYear(),0,4);                  // 4 Jan is always week 1
  t.setDate(t.getDate()-((t.getDay()+6)%7)+3);          // that week's Thursday
  return {week:1+Math.round((d-t)/604800000), year:d.getFullYear()};
}
function weekBounds(k){
  var a=new Date(k+'T12:00:00');
  a.setDate(a.getDate()-((a.getDay()+6)%7));            // Monday
  var b=new Date(a); b.setDate(b.getDate()+6);          // Sunday
  return {start:dayKey(a), end:dayKey(b)};
}
/* Compact money for the headline pair, because "$28,483 / $71,570" beside a
   label is most of a 390px row. The exact figures go in the caption underneath,
   so nothing is lost — the glance gets the shape and the read gets the number. */
function moneyK(n){
  if(n==null||!isFinite(n)) return '—';
  if(Math.abs(n)>=1000) return '$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return '$'+Math.round(n);
}
/* COVERS COME FROM THE NIGHTLY MANAGER LOG, NEVER REVEL'S GUEST COUNT. Sam's
   standing rule: Revel lumps parties and counts to-go guests. The targets doc
   records that its own record came from the log (`record_source`), so scoring a
   Revel actual against a log record would be comparing two different things and
   would flatter or punish him at random.
   `log_covers` is on every night in the current window; `covers_log` is the same
   number under an older key and is absent on some nights, so it is the fallback
   rather than the primary. When NEITHER exists we fall back to Revel and SAY SO
   in the caption, rather than silently swapping the basis. */
function logCovers(d){
  if(!d) return null;
  if(d.log_covers!=null && isFinite(+d.log_covers)) return {n:+d.log_covers, log:true};
  if(d.covers_log!=null && isFinite(+d.covers_log)) return {n:+d.covers_log, log:true};
  if(d.covers!=null     && isFinite(+d.covers))     return {n:+d.covers,     log:false};
  return null;
}

/* One scorecard row. `pct` null draws the dashed unknown track instead of an
   empty fill — that is the NOI case and it must not read as a target missed by
   everything. `met` is the only thing in the block that turns on colour. */
function scRow(o){
  var r=el('div','sc-row');
  r.appendChild(el('div','sc-top',
    '<div class="sc-lab">'+esc(o.label)+'</div>'+
    '<div class="sc-val">'+esc(o.value)+
      (o.target?' <span class="tg">/ '+esc(o.target)+'</span>':'')+'</div>'));
  var bar=el('div','sc-bar'+(o.pct==null?' unk':''));
  if(o.pct!=null){
    var fill=el('i');
    fill.style.width=Math.max(0,Math.min(100,o.pct*100)).toFixed(1)+'%';
    if(o.met) fill.className='ok';
    bar.appendChild(fill);
  }
  r.appendChild(bar);
  r.appendChild(el('div','sc-foot',
    '<div class="sc-cap">'+esc(o.cap||'')+'</div>'+
    '<div class="sc-pts'+(o.met?' live':'')+'">'+esc(o.pts||'')+'</div>'));
  return r;
}
function scGroup(h,title,rows){
  var any=rows.filter(function(x){return !!x;});
  if(!any.length) return;
  h.appendChild(el('div','news-h mono',title));
  var g=el('div','sc-grp');
  any.forEach(function(x){ g.appendChild(x); });
  h.appendChild(g);
}
function ptsLabel(n,word){
  if(n==null||!isFinite(+n)) return '';
  return +n+' '+(word||(+n===1?'pt':'pts'));
}

BUILD.service=function(b,sec){
  sec=sec||{};
  var host=el('div');b.appendChild(host);
  host.appendChild(el('div','empty','Reading the nightly numbers…'));

  loadRevel().then(function(){ paint(null); })
             .catch(function(e){ paint((e&&e.code)||String(e)); });

  function paint(fatal){
    host.innerHTML='';

    /* Targets first, because without them there is no scorecard and the REASON
       matters more than the rows do. Unreachable and unpublished are different
       facts and get different words; neither is a row at 0%. */
    if(TARGETS_ERR){
      host.appendChild(el('div','rc-fails','<h4>Could not reach the targets</h4>'+
        '<div>'+esc(TARGETS_ERR)+'</div>'+
        '<div>This is a read failure, not a month with nothing to beat. '+
        'Nothing below is scored against a benchmark.</div>'));
    } else if(!TARGETS){
      host.appendChild(el('div','rc-fails','<h4>No targets published yet</h4>'+
        '<div>bridge_data/targets does not exist.</div>'+
        '<div>The captain’s log writes it. Until it has run there is nothing '+
        'to measure against, which is not the same as missing every target.</div>'));
    }

    if(fatal){
      host.appendChild(el('div','rc-fails','<h4>Could not read the nightly numbers</h4>'+
        '<div>'+esc(fatal)+'</div>'+
        '<div>This is a read failure, not a quiet week. The benchmarks are still '+
        'listed below so you can see what is being tracked.</div>'));
    } else if(REVEL.err){
      host.appendChild(el('div','rc-fails','<h4>Partial read</h4><div>'+esc(REVEL.err)+'</div>'+
        '<div>Everything below is built only from the nights that did load, so the '+
        'pace is understated rather than wrong.</div>'));
    }

    var T    = TARGETS||{};
    var pts  = T.points||{};
    var days = fatal?[]:(REVEL.days||[]);

    /* ── last night ──────────────────────────────────────────────────────── */
    var last = days[0]||null;
    var cvT  = T.covers||{};
    var lc   = logCovers(last);
    var rec  = isFinite(+cvT.record_year)?+cvT.record_year:null;
    var covMet = !!(lc && rec && lc.n>=rec);
    var covCap;
    if(!last)      covCap='No night captured in the last '+REVEL_WINDOW+' days.';
    else if(!lc)   covCap='That night carries no cover count.';
    else if(rec==null) covCap='No record published to compare against.';
    else if(covMet)covCap='A new record. The old one was '+rec+', '+
                          shortDate(cvT.record_date||'')+'.';
    /* NO ARTICLE IN FRONT OF record_source. It used to be the constant string "nightly
       log", so the template carried its own "the" and read correctly. push_targets.py
       now names the MANAGER instead, per Sam's manager-log-only rule, and the two
       changes met at "from the Sully's log." The source string owns its own grammar;
       the default below carries the article rather than the template. Caught 2026-08-10
       by reading the rendered caption, which is the only place it could have been
       caught: every symbol was present, every test passed, and the sentence was wrong. */
    else           covCap=(rec-lc.n)+' short of the '+rec+' set '+
                          shortDate(cvT.record_date||'')+', from '+
                          (cvT.record_source||'the nightly log')+'.';
    if(lc && !lc.log) covCap+=' Counted from Revel, not the manager log, so it may '+
                              'lump parties and include to-go.';
    scGroup(host,'Last night'+(last?' · '+shortDate(last._date):''),[
      scRow({label:'Covers',
             value: lc?String(lc.n):'—',
             target: rec!=null?(rec+' record'):'',
             pct: (lc&&rec)?(lc.n/rec):null,
             met: covMet,
             pts: ptsLabel(pts.covers_record),
             cap: covCap})
    ]);

    /* ── this week ───────────────────────────────────────────────────────── */
    var wkT=T.week||{}, wb=weekBounds(DATE), iw=isoWeekOf(DATE);
    var wkDays=days.filter(function(d){return d._date>=wb.start && d._date<=wb.end;});
    var wkProd=sum(wkDays,function(d){return d.product;});
    var wkWage=sum(wkDays,function(d){return (d.labor||{}).clocked_wages;});
    var wkTgt=isFinite(+wkT.product_sales)?+wkT.product_sales:null;
    /* A target built for a different ISO week is the wrong yardstick, and the
       feeder republishes weekly. Comparing against a stale one silently is worse
       than saying the target is stale, so the row says which week it is for. */
    var wkStale=(wkT.iso_week!=null && +wkT.iso_week!==iw.week);
    var wkMet=!!(wkTgt && wkProd>=wkTgt);
    var wkCap;
    if(!wkDays.length)  wkCap='No nights captured this week yet.';
    else if(wkTgt==null)wkCap=wkDays.length+' night'+(wkDays.length===1?'':'s')+' in, '+
                              money(wkProd)+'. No weekly target published.';
    else wkCap=wkDays.length+' of 7 nights in · '+money(wkProd)+' of '+money(wkTgt)+
               ' · target is the '+(wkT.basis||'same ISO week, previous year')+
               (wkT.covers?', '+wkT.covers.toLocaleString('en-US')+' covers':'')+'.';
    if(wkStale) wkCap+=' That target was published for ISO week '+wkT.iso_week+
                       ' and this is week '+iw.week+', so it is stale.';

    var labT=T.labor||{};
    var labPct=wkProd?(wkWage/wkProd*100):null;
    var hi=isFinite(+labT.band_high)?+labT.band_high:null;
    var lo=isFinite(+labT.band_low)?+labT.band_low:null;
    var exc=isFinite(+labT.excellent_below)?+labT.excellent_below:null;
    /* At or under the top of the band is holding, and pays. BELOW the band is
       better than the band, not a failure, so it pays too — awarding nothing for
       beating the target would be perverse and is not what the points table
       means. `excellent_below` is the second, larger award on top. */
    var labHolding = labPct!=null && hi!=null && labPct<=hi;
    var labExcellent = labPct!=null && exc!=null && labPct<exc;
    var labPts = labExcellent ? ptsLabel(pts.week_labor_excellent)
                              : ptsLabel(pts.week_labor_band);
    /* The bar is scaled to hi*1.2 rather than to the band, so the top of the band
       sits at about five sixths of the track and there is visible room to be
       over it. A bar scaled to the band itself would peg at 100% the moment he
       was merely at target and could never show him going wrong. */
    var labScale = hi!=null ? hi*1.2 : null;
    var labCap;
    if(labPct==null)     labCap='No labor captured this week yet.';
    else if(lo==null)    labCap=pct(labPct)+' clocked wages over product. No band published.';
    else labCap=pct(labPct)+' of product · band is '+lo+'–'+hi+'%'+
                (exc!=null?', and under '+exc+'% pays '+ptsLabel(pts.week_labor_excellent):'')+'.';

    /* ── last week, the one that actually closed ─────────────────────────── */
    /* THE CARD HAD NO MEMORY OF A FINISHED WEEK, and that is what Sam hit on
       2026-08-10. `weekBounds()` moves at midnight on Sunday, so at 6am Monday the
       week he had just worked stopped existing and "This week" read zero nights. He
       had broken the sales bar by $8,717 and held labor at 30.0%, and the card showed
       him nothing: "I could have sworn we had 6k to go to get to 80k on the week, but
       now it says we didn't break 80."

       A live pace reading cannot answer that, because pace has no past tense. So this
       group is drawn from the SETTLED AWARD rather than recomputed from Revel, which
       matters for two reasons. The award is what was actually banked, so the card and
       the ledger can never disagree about what the week was worth. And the award
       outlives its evidence: Revel keeps 35 nights, so a recomputation would eventually
       start reporting zero for a week that was won.

       IT SHOWS WHAT IT PAID, NOT WHAT IT WAS WORTH. Every other row on this card is a
       stake, phrased in the future. This one is a receipt. That is also the persistent
       home the weekly awards did not have — before this they existed only inside a
       modal, so dismissing the payout erased the only record of it.

       IT RETIRES ITSELF once the new week has four nights in it, around Thursday. By
       then the live week is the one he can still act on, and a permanent second week
       on a 390px card is clutter competing with the thing that is still winnable. */
    var lwKey=prevIsoKey(isoKeyOf(DATE)), lwA=AWARDS['wk:'+lwKey];
    if(lwA && wkDays.length<4){
      var lwr=isoKeyRange(lwKey);
      var lwRows=[];
      if(lwA.nodata){
        /* Settled at zero because the nights never arrived, which is NOT a missed
           target and must not be drawn as one. Same rule as everywhere else here. */
        lwRows.push(scRow({label:'Product sales', value:'—', pct:null, met:false,
          cap:'Only '+(lwA.nights||0)+' of 7 nights reached the Bridge before the week '+
              'aged out of the Revel window. Not scored, rather than scored low.'}));
      } else {
        var lwScale = hi!=null ? hi*1.2 : null;
        lwRows.push(scRow({label:'Product sales',
          value: moneyK(lwA.prod), target: isFinite(lwA.tgt)?moneyK(lwA.tgt):'',
          pct: (isFinite(lwA.tgt)&&lwA.tgt)?(lwA.prod/lwA.tgt):null,
          met: !!lwA.sales,
          pts: lwA.sales?ptsLabel(pts.week_sales):'',
          cap: money(lwA.prod)+(lwA.sales
                 ? ' · beat the bar by '+money(lwA.prod-lwA.tgt)
                 : ' · '+money(lwA.tgt-lwA.prod)+' short of '+money(lwA.tgt))+'.'}));
        lwRows.push(scRow({label:'Labor',
          value: lwA.lab!=null?pct(lwA.lab):'—',
          target: (lo!=null&&hi!=null)?(lo+'–'+hi+'% band'):'',
          pct: (lwA.lab!=null&&lwScale)?(lwA.lab/lwScale):null,
          met: !!(lwA.band||lwA.exc),
          pts: lwA.exc?ptsLabel(pts.week_labor_excellent)
                      :(lwA.band?ptsLabel(pts.week_labor_band):''),
          cap: lwA.lab==null ? 'No labor captured that week.'
             : pct(lwA.lab)+' of product · '+(lwA.exc?'under the excellent line'
                 :(lwA.band?'inside the band':'over the band'))+'.'}));
      }
      scGroup(host,'Last week · '+shortDate(lwr.start)+' – '+shortDate(lwr.end)+
                   ' · banked '+(+lwA.pts||0)+(Math.abs(+lwA.pts||0)===1?' pt':' pts'), lwRows);
    }

    scGroup(host,'This week · '+shortDate(wb.start)+' – '+shortDate(wb.end),[
      scRow({label:'Product sales',
             value: wkDays.length?moneyK(wkProd):'—',
             target: wkTgt!=null?moneyK(wkTgt):'',
             pct: (wkTgt&&wkDays.length)?(wkProd/wkTgt):null,
             met: wkMet,
             pts: ptsLabel(pts.week_sales),
             cap: wkCap}),
      scRow({label:'Labor',
             value: labPct!=null?pct(labPct):'—',
             target: (lo!=null&&hi!=null)?(lo+'–'+hi+'% band'):'',
             pct: (labPct!=null&&labScale)?(labPct/labScale):null,
             met: labHolding,
             pts: labPts,
             cap: labCap})
    ]);

    /* ── this month ──────────────────────────────────────────────────────── */
    var moT=T.month||{}, noiT=T.noi||{};
    var moStart=DATE.slice(0,8)+'01';
    var moDays=days.filter(function(d){return d._date>=moStart && d._date<=DATE;});
    var moProd=sum(moDays,function(d){return d.product;});
    var moTgt=isFinite(+moT.product_sales)?+moT.product_sales:null;
    var moMet=!!(moTgt && moProd>=moTgt);
    var moName=new Date(DATE+'T12:00:00').toLocaleDateString('en-US',{month:'long'});
    var moCap;
    if(!moDays.length)   moCap='No nights captured this month yet.';
    else if(moTgt==null) moCap=moDays.length+' night'+(moDays.length===1?'':'s')+' in, '+
                               money(moProd)+'. No monthly target published.';
    else moCap=moDays.length+' night'+(moDays.length===1?'':'s')+' in · '+money(moProd)+
               ' of '+money(moTgt)+' · target is the '+
               (moT.basis||'best complete same month in the window')+
               (moT.held_by?', held by '+moT.held_by:'')+'.';

    /* ── NOI ──────────────────────────────────────────────────────────────────
       This row shipped on 2026-08-06 with the thresholds published and no actual,
       so it drew a dashed track and a question mark. That was honest and it was
       also, in Sam's words the same day, "not worth having here" — a row that
       never fills teaches him to stop reading the card. push_noi.py now writes
       bridge_data/noi with the same bottom-up build the weekly digest uses.

       FOUR STATES, drawn four different ways, and the distinctions are the whole
       point of the row:
         read failed          → says so, with the code. Not "no bonus".
         nothing published    → says nobody has written it. Not zero.
         estimated            → the projection, labelled, with its range.
         actual               → Tim's booked figure, labelled as booked.
       `estimated` is READ off the document rather than inferred, because the same
       key carries both and inference is how a projection starts being quoted as a
       fact. Points are awarded on neither: a projection must not pay, and the
       booked figure lands in a month Sam has already left. Both show the tier.

       The bar is scaled to the UPPER threshold, so clearing the lower tier fills
       about three fifths of the track and there is visible distance left to the
       one worth $3,500. Scaling to the lower tier would peg the bar at the first
       dollar of bonus and never show him the second. */
    var noiHas = !!(NOI && isFinite(+NOI.noi));
    var noiEst = !!(NOI && NOI.estimated);
    var noiVal = noiHas ? +NOI.noi : null;
    var noiTop = isFinite(+noiT.upper) ? +noiT.upper : null;
    var noiCap, noiMet=false, noiPct=null, noiTxt='?';

    if(NOI_ERR){
      noiCap='Could not reach the NOI figure ('+NOI_ERR+'). That is a read failure, '+
             'not a month that made nothing.';
    } else if(!noiHas){
      noiCap='Not published yet. ';
      if(noiT.lower!=null&&noiT.upper!=null)
        noiCap+=ptsLabel(pts.month_noi_lower)+' above '+money(noiT.lower)+', '+
                ptsLabel(pts.month_noi_upper)+' above '+money(noiT.upper)+'. ';
      noiCap+='push_noi.py writes it on the Mac; the 4am run refreshes it.';
    } else {
      noiTxt = moneyK(noiVal);
      noiMet = !!(noiT.lower!=null && noiVal>=+noiT.lower);
      // Negative months exist and a negative width is not a thing. Clamped at zero,
      // and the caption carries the real figure, which is why the clamp cannot lie.
      noiPct = noiTop ? Math.max(0, noiVal/noiTop) : null;
      var tierTxt = NOI.tier==='upper' ? 'clears the upper tier'
                  : NOI.tier==='lower' ? 'clears the lower tier'
                  : NOI.tier==='near_miss' ? 'a near miss, inside $10k of the lower tier'
                  : 'under the lower tier';
      if(noiEst){
        noiCap='ESTIMATED, not booked. '+tierTxt.charAt(0).toUpperCase()+tierTxt.slice(1)+'. ';
        if(NOI.nights_counted)
          noiCap+=NOI.nights_counted+' night'+(NOI.nights_counted===1?'':'s')+' of '+
                  (NOI.days_in_month||'?')+' so far';
        if(isFinite(+NOI.noi_low) && isFinite(+NOI.noi_high))
          noiCap+=', landing between '+moneyK(+NOI.noi_low)+' and '+moneyK(+NOI.noi_high);
        noiCap+='. ';
        if(isFinite(+NOI.noi_mtd))
          noiCap+='Banked so far '+moneyK(+NOI.noi_mtd)+'. ';
        noiCap+='Revenue minus COGS, operating expense and interest — the same build '+
                'the weekly digest runs, not Tim’s P&L.';
        if(NOI.anomaly) noiCap+=' ⚠ '+NOI.anomaly;
      } else {
        noiCap='Booked figure from the P&L. '+tierTxt.charAt(0).toUpperCase()+
               tierTxt.slice(1)+'.';
      }
      if(NOI.month && NOI.month!==DATE.slice(0,7))
        noiCap='For '+NOI.month+', not this month. '+noiCap;
      if(NOI.generated) noiCap+=' Generated '+NOI.generated+'.';
    }

    scGroup(host,'This month · '+moName,[
      scRow({label:'Product sales',
             value: moDays.length?moneyK(moProd):'—',
             target: moTgt!=null?moneyK(moTgt):'',
             pct: (moTgt&&moDays.length)?(moProd/moTgt):null,
             met: moMet,
             pts: ptsLabel(pts.month_sales_record),
             cap: moCap}),
      scRow({label: noiHas ? ('NOI'+(noiEst?' · est':' · booked')) : 'NOI',
             value: noiTxt,
             target: (noiT.lower!=null&&noiT.upper!=null)
                     ? (money(noiT.lower)+'–'+money(noiT.upper)) : '',
             pct: noiPct,
             met: noiMet,
             pts: ptsLabel(pts.month_noi_upper),
             cap: noiCap})
    ]);

    /* The caveat ships as a string on the targets doc precisely so it cannot be
       dropped here. The clocked proxy runs roughly twenty points under the P&L
       labor line and reading one as the other is the single easiest way to
       mis-read this card. */
    if(labT.caveat)
      host.appendChild(el('p','note','Labor is the '+(labT.metric||'clocked proxy')+'. '+
        labT.caveat));
    if(T.generated)
      host.appendChild(el('p','note','Benchmarks generated '+esc(T.generated)+
        '. Actuals are the last '+REVEL_WINDOW+' nights of Revel, service dates.'));

    /* The feeder's own flags stay. They are today's issues rather than last
       night's numbers, so they survived the rewrite that took the metrics off.

       THEY NOW CARRY AN AGE and the card prints it. On 2026-08-06 Sam found a flag
       here reading "August roster still blocked", raised over a week earlier and long
       dealt with. Nothing in the pipeline had ever expired one, because the 4am run
       rewrites bridge/{date} wholesale and so every flag looks a day old to the
       document carrying it. flag_age.py owns a ledger that survives the rewrite,
       stamps `since` and drops anything over seven days.

       The age is rendered rather than trusted silently: `since` is the falsifier. If a
       flag ever sits here reading "9 days" again, the ager did not run, and that is
       visible on the card instead of having to be inferred from a stale-looking
       sentence. A flag with no `since` is from a run that predates the ager and says
       nothing rather than guessing at a date. */
    (sec.flags||[]).forEach(function(f){
      var age='';
      if(f.since){
        var dd=Math.round((new Date(DATE+'T12:00:00')-new Date(f.since+'T12:00:00'))/86400000);
        age = dd<=0 ? 'new today' : (dd===1 ? 'since yesterday' : dd+' days old');
      }
      host.appendChild(el('div','mail','<div class="m-body">'+
        (age?'<div class="m-cat mono">'+esc(age)+'</div>':'')+
        '<div class="m-from">'+esc(f.title)+'</div>'+
        '<div class="m-sum">'+esc(f.detail)+'</div></div>'));
    });
    /* And the portal link stays, because "the true recap can stay as built within
       the portal" only works if there is a door to it from here. */
    if(sec.portal_url){
      var a=el('a','linkout');a.href=sec.portal_url;a.target='_blank';a.rel='noopener noreferrer';
      a.style.setProperty('--ac','var(--mint)');
      a.innerHTML='<span>'+esc(sec.portal_label||'Open the staff portal')+'</span><span class="go">→</span>';
      host.appendChild(a);
    }
  }
};

/* ══ THE BOOTHBY STUDY CARD ═══════════════════════════════════════════════════
   Built 2026-08-06 into the slot news vacated the same day. News is retired: one
   story shipped one day and three the next, and Sam's read was that it will never
   compete with Apple News.

   WHAT THIS CARD IS FOR. Six things, and Sam named them in this order: syllabus,
   study recap, study reminders, scorecard, book recommendations, and a book
   tracker he can mark finished. They are weighted here by what he will actually
   open the card FOR, which is "what am I meant to do now" rather than "how am I
   doing" — so Next up leads and the scorecard sits under it.

   WHERE THE DATA COMES FROM. `bridge_data/boothby`, written by push_boothby.py on
   the Mac. The Bridge is a browser page and cannot read `Codename: Boothby/` off
   disk, and `bridge_data` is the general-purpose collection that exists so a new
   feature adds a KEY rather than a collection and a Firestore rule.

   THE TRANSCRIPT ON DISK IS THE AUTHORITY, and the card is built so that is
   structurally true rather than a note pinned to it. Everything scored comes from
   `scorecard.entries`, which push_boothby.py copies verbatim out of
   `records/transcript.md`, and boothbyXp() reads those rows and nothing else. The
   page holds no independent pass count, so there is nothing on this side that CAN
   disagree; fixing the file fixes the score on the next push. `generated` renders
   on the card, so a projection that has fallen behind is visible rather than
   quietly believed.

   BOOKS ARE INDEPENDENT OF THE COURSE. Sam's call. Boothby recommends and tracks
   reading generally, wine or otherwise, and finishing a book is its own milestone.
   Scoping the shelf to the current month's subject would delete it every time a
   course retires. The shelf comes from bridge_data; the FINISHED marks are
   device-owned in bridge_state/_books, so republishing the shelf can never
   un-finish something he has read.

   Deliberately NO pages-read field and no daily progress entry. He already told an
   earlier design not to hand him six manual boxes, and a second daily chore is how
   a tracker stops being used inside a week. Title, mark finished, finished shelf.

   Every row here is a `label.row` with an `input.ck`, which is the same shape the
   routine steps use. Reusing it rather than inventing a checkbox style means the
   tap target, the hit animation and the focus ring are already correct. */

/* Prepared AND unsat, the only thing on this card that may carry a count. A
   segment already sat must never be offered again as new — the projection carries
   the segment file's own status header for exactly this. */
function boothbyPrepared(){
  var b=BOOTHBY||{};
  return (b.prepared||[]).filter(function(x){ return x && x.status!=='sat'; });
}
/* ── THE SHELF, AND WHO OWNS WHAT ON IT ──────────────────────────────────────
   Rebuilt 2026-08-06. Sam: "Books has nothing to click, so I don't have a way to
   add anything, or review suggestions." He was right and the diagnosis is exact:
   the old render was reachable only when the shelf was non-empty, the shelf was
   published solely by push_boothby.py, and the shelf was empty. So the section
   drew "Nothing on the shelf yet." and offered no way to make that untrue. A
   tracker whose empty state is a dead end is a tracker nobody ever fills.

   THREE POPULATIONS, and keeping them apart is the whole design:

     own          books Sam added himself. bridge_state/_books.own — DEVICE-OWNED,
                  because they are his and nothing else may write them.
     shelf        books Boothby published. bridge_data/boothby.books.shelf.
     suggestions  books Boothby is PROPOSING. bridge_data/boothby.books.suggestions.
                  These are NOT on the shelf and must never render as though they
                  were. A recommendation Sam never chose sitting in his reading
                  list is the single thing that would make the whole shelf
                  untrustworthy, and once he stops trusting it he stops reading it.
                  He accepts one onto the shelf or dismisses it, and until he does
                  one of those it lives in its own group with its own words.

   Accepting a suggestion copies it into `own`, so it survives Boothby republishing
   or withdrawing the suggestion. Dismissing records the id in `dismissed`, so the
   next push cannot resurrect something he has already said no to.

   FINISHED MARKS stay device-owned in bridge_state/_books.finished, which is what
   makes republishing a shelf unable to un-finish a book. That was already true and
   is the reason this doc exists at all. */
function boothbyBooks(){
  var b=BOOTHBY||{}, shelf=(b.books&&b.books.shelf)||[];
  var done={}; (BOOKS_DONE||[]).forEach(function(f){ if(f&&f.id) done[f.id]=f; });
  var seen={}, out=[];
  function add(x,src){
    if(!x || !x.id || seen[x.id]) return;
    seen[x.id]=1;
    out.push({id:x.id, title:x.title||'', author:x.author||'', note:x.note||'',
              src:src, done: !!done[x.id], on:(done[x.id]||{}).on||''});
  }
  // Sam's own first, so a book he added and Boothby later published keeps his row
  // and his source label rather than being silently reattributed.
  (BOOKS_OWN||[]).forEach(function(x){ add(x,'own'); });
  shelf.forEach(function(x){ add(x,'boothby'); });
  return out;
}
/* Proposed, not shelved. Filtered against BOTH the dismissal list and everything
   already on the shelf, because accepting a suggestion copies it into `own` and
   without the second filter it would then appear in both groups at once. */
function boothbySuggestions(){
  var b=BOOTHBY||{}, sug=(b.books&&b.books.suggestions)||[];
  var on={}; boothbyBooks().forEach(function(x){ on[x.id]=1; });
  var no={}; (BOOKS_NO||[]).forEach(function(id){ no[id]=1; });
  return sug.filter(function(x){ return x && x.id && !on[x.id] && !no[x.id]; });
}
/* Written to its own doc rather than through saveState, because the shelf is
   PERSISTENT and saveState writes bridge_state/{date}, which expires at the 4am
   boundary. A book finished on Tuesday must still be finished on Wednesday.
   {merge:true} so a concurrent write to another key on this doc is not clobbered.

   All three device-owned lists go in one call. They change together often enough —
   accepting a suggestion writes `own` and `dismissed` in the same gesture — that
   splitting them would only create a window where the doc disagrees with itself. */
function saveBooks(){
  if(!user) return;
  db.collection('bridge_state').doc('_books').set(
    {finished:BOOKS_DONE||[], own:BOOKS_OWN||[], dismissed:BOOKS_NO||[],
     updated_at:new Date().toISOString(), by:user.email},
    {merge:true}).catch(function(){});
}
function toggleBook(id,title){
  var at=-1;
  (BOOKS_DONE||[]).forEach(function(f,i){ if(f&&f.id===id) at=i; });
  if(at>=0) BOOKS_DONE.splice(at,1);
  else      BOOKS_DONE.push({id:id, title:title, on:DATE});
  saveBooks();
}
/* Ids for Sam's own books are minted here and never regenerated from the title,
   for the same reason punch ids are frozen in markers: retitling a book he has
   already finished would otherwise detach the finished mark and quietly un-read it. */
function addBook(title,author){
  title=String(title||'').trim();
  if(!title) return null;
  var id='own-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*4096).toString(36);
  BOOKS_OWN.push({id:id, title:title, author:String(author||'').trim(), added:DATE});
  saveBooks();
  return id;
}
function acceptBook(s){
  // Copied, not referenced. If Boothby withdraws the suggestion next week the book
  // stays on the shelf, because by then it is Sam's choice and not the suggestion.
  BOOKS_OWN.push({id:s.id, title:s.title||'', author:s.author||'', note:s.note||'',
                  added:DATE, from:'boothby'});
  saveBooks();
}
function dismissBook(id){
  if(BOOKS_NO.indexOf(id)<0) BOOKS_NO.push(id);
  saveBooks();
}
function removeOwnBook(id){
  var at=-1;
  (BOOKS_OWN||[]).forEach(function(x,i){ if(x&&x.id===id) at=i; });
  if(at>=0) BOOKS_OWN.splice(at,1);
  // The finished mark is deliberately NOT removed with it. If he re-adds the book
  // later it comes back already finished, which is true.
  saveBooks();
}

/* The desktop tile face: today's prompt plus how the course is tracking. Sam's
   pick — the face says whether something is waiting to be sat and where the course
   stands, and everything else is one tap away, the same contract as every other
   card. On mobile none of this renders: below 860px the tile is the book glyph,
   the word STUDY, and the badge. */
FACE.boothby=function(){
  var c=boothbyCourse();
  if(!c) return {stat:'—',
                 unit: BOOTHBY_ERR ? 'could not reach Boothby' : 'no course open',
                 extra:''};
  var prep=boothbyPrepared(), sc=BOOTHBY.scorecard||{};
  var rows=prep.slice(0,3).map(function(p){
    return '<div class="f-row"><span class="pip '+(p.kind==='assessment'?'high':'med')+'"></span>'+
      '<span class="t">'+esc(p.title||'')+'</span>'+
      (p.minutes?'<span class="m mono">'+esc(p.minutes+'m')+'</span>':'')+'</div>';
  }).join('');
  if(!rows) rows='<div class="f-row"><span class="t">'+
    (state.study?'Studied today. Nothing else prepared.':'Nothing prepared to sit.')+
    '</span></div>';
  return {stat: prep.length?String(prep.length):((sc.passed||0)+'/'+(c.units_total||'?')),
          unit: esc(c.title||'')+' · unit '+(c.unit_now||'?')+' of '+(c.units_total||'?'),
          extra:'<div class="f-rows">'+rows+'</div>'};
};

BUILD.boothby=function(b){
  /* A read failure and a month without a course are different facts — the single
     most important correctness property in this file — so they get different words
     and neither of them gets an empty syllabus. */
  if(BOOTHBY_ERR){
    b.appendChild(el('div','rc-fails','<h4>Could not reach Boothby</h4>'+
      '<div>'+esc(BOOTHBY_ERR)+'</div>'+
      '<div>This is a read failure, not a month without a course. Nothing below '+
      'is the state of your study.</div>'));
    return;
  }
  var c=boothbyCourse();
  if(!c){
    b.appendChild(el('div','empty','No course published yet.<br><br>'+
      'Boothby runs one subject a calendar month. When a course opens, '+
      'push_boothby.py writes it here and this card fills in.'));
    return;
  }

  /* ── The study tick, ABOVE the tabs and outside them ──────────────────────
     Sam asked for tabs, 2026-08-06: "syllabus, scorecard, next up, review, books
     should all be their own tabs inside of study, instead of long thread." The
     tick is not one of those five and it does not go inside any of them.

     It is the only control on this card that scores, and burying it in a tab makes
     it reachable only from whichever tab it was filed under. He would then have to
     be on the right tab to record that he studied, which is a way of losing points
     for a filing decision. Content goes in tabs; the card's one action sits above
     them where every tab can see it.

     Deliberately NOT pass or fail — Sam's rule, 2026-08-06: it is credit for
     sitting down. See studyXp(). And no jackpot on it, unlike intake and routine:
     those are all-or-nothing blocks that pay on a transition, and this is a single
     daily tick that would fire a full-screen payout every morning and be wallpaper
     inside a week. */
  var tb=el('div','grp'), tgb=el('div','g-body');
  tgb.style.borderTop='none'; tgb.style.paddingTop='4px';
  var trow=el('label','row');
  var tck=el('input'); tck.type='checkbox'; tck.className='ck';
  tck.checked=!!state.study;
  tck.addEventListener('change',function(){
    state.study=tck.checked;
    if(tck.checked) hit(trow);
    saveState(); paintTiles();
  });
  trow.appendChild(tck);
  trow.appendChild(el('span','r-txt','Studied today · +'+W.study));
  tgb.appendChild(trow); tb.appendChild(tgb); b.appendChild(tb);

  /* ── The tabs ─────────────────────────────────────────────────────────────
     NEXT UP LEADS AND IS THE DEFAULT, because the card gets opened for "what am I
     meant to do now" rather than "how am I doing." Then Review, which is what to
     do about the last session, then the three reference views.

     Reusing `.seg`, the segmented control Calendar and Service already use, rather
     than inventing a second tab idiom. Checked before assuming: `.seg` survived the
     scorecard rewrite that removed Service's own strip, and Calendar still builds
     one at BUILD.calendar. Five tabs need `.seg.five`, which is a padding change
     and nothing else.

     REPAINTS IN PLACE, never through paintDetail(). paintDetail rebuilds the sheet
     and resets its scroll to the top, so routing a tab switch through it would
     throw him back to the top of the card on every tap. The books tracker already
     did exactly this for exactly this reason and this follows it. */
  var TABS=[['next','Next up'],['review','Review'],['score','Scorecard'],
            ['syl','Syllabus'],['books','Books']];
  var tab='next';
  var seg=el('div','seg five');
  TABS.forEach(function(o,i){
    var bt=el('button','',o[1]); bt.setAttribute('role','tab');
    bt.setAttribute('aria-selected', i===0?'true':'false');
    bt.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation();
      tab=o[0];
      seg.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected','false');});
      bt.setAttribute('aria-selected','true');
      paint();
    });
    seg.appendChild(bt);
  });
  b.appendChild(seg);

  var host=el('div'); b.appendChild(host);
  paint();

  function paint(){
    host.innerHTML='';
    if(tab==='next')        paintNext();
    else if(tab==='review') paintReview();
    else if(tab==='score')  paintScore();
    else if(tab==='syl')    paintSyllabus();
    else                    paintBooks();

    if(BOOTHBY.generated)
      host.appendChild(el('p','note','Course state generated '+esc(BOOTHBY.generated)+
        '. If that has fallen behind the files, run push_boothby.py on the Mac.'));
  }

  /* ── 1. Next up, and the reminders, which are the same list ──────────────
     Anything already sat is filtered out by boothbyPrepared(), so nothing here can
     re-offer material he has answered.

     EACH ROW NOW OPENS TO ITS PREP. Sam, 2026-08-06: "I can start to prepare for my
     sit down study session if I have a little extra time. That way I don't have to
     walk in cold every time."

     THE ORDER IS THE DESIGN and it runs from most active to least:

       1. Warm-up   retrieval on PREVIOUS material, answer hidden until tapped
       2. What it asks   bottles, skills and the trap — no answers
       3. Tasting   the optional bottle and the one thing to check
       4. The material   last, and labelled for what it costs

     The warm-up leads because active recall is the thing that actually works and
     because it covers material he has already been examined on, so it cannot spoil
     the segment in front of him. It draws from the last review's RECALL items and
     never from its REASONING items — a missing fact wants repetition and a flashcard
     is repetition, whereas drilling a wrong model as a fact is how a wrong idea gets
     memorised. That choice is made in the study-prep task; this card just renders it.

     THE PRIMER IS LAST AND SAYS WHAT IT COSTS. Sam asked for it with the tradeoff
     named out loud: reading the material and then answering questions on it measures
     reading rather than learning. He chose it anyway, which is his call to make, so
     the honest thing is to put it at the bottom and say so at the point of tapping
     rather than to quietly leave it out or quietly pretend prep is free.

     NOTHING HERE SCORES. The study tick already pays for sitting down and a prep tick
     would be that same tick twice under another name — the third governing decision,
     that Admiral must not be reachable by spamming trivial ticks. */
  function paintNext(){
    var prep=boothbyPrepared();
    if(prep.length){
      var nb=el('div','grp'), ngb=el('div','g-body');
      ngb.style.borderTop='none'; ngb.style.paddingTop='4px';
      prep.forEach(function(p){
        var q=el('div','qa'), h=el('div','qa-h');
        h.appendChild(el('div','qa-n mono',
          esc(p.kind==='assessment'?'Exam':('U'+(p.unit||'?')+'.'+(p.segment||'?')))));
        h.appendChild(el('div','qa-t','<b>'+esc(p.title||'')+'</b>'+
          '<div class="ev-w">'+(p.prepared?'prepared '+esc(p.prepared):'')+
          (p.minutes?' · about '+esc(String(p.minutes))+' minutes':'')+'</div>'));
        var body=el('div','qa-b');
        paintPrep(p, body);
        h.appendChild(expander(body,'Prep for '+(p.title||'this segment')));
        q.appendChild(h); q.appendChild(body);
        ngb.appendChild(q);
      });
      nb.appendChild(ngb); host.appendChild(nb);
    } else {
      host.appendChild(el('div','empty','Nothing prepared to sit.<br><br>'+
        'Study prep runs Monday, Wednesday and Friday; the assessment is built Sunday.'));
    }
    host.appendChild(el('p','note','Sitting down scores '+W.study+', pass or fail. The '+
      'weekly assessment scores '+W.assess+' for a pass and nothing for a fail, and '+
      'finishing a whole course scores '+W.course+'. Both move rank rather than '+
      'today’s arc, so neither shows up in the day’s number. Prep scores nothing — '+
      'the tick is for sitting down, and paying for the warm-up too would be paying '+
      'twice for one session.'));
  }

  /* The prep block itself. Split out because "Next up" is now two jobs: the list of
     what is waiting, and what to do about it with ten spare minutes. */
  function paintPrep(p, into){
    var pr=p.prep||null;
    if(!pr){
      into.appendChild(el('div','qa-v', p.prep_error
        ? ('Prep for this one could not be read: '+esc(p.prep_error)+
           '. The segment itself is fine and ready to sit.')
        : 'No prep written for this one. Segments prepared from 2026-08-06 come with a '+
          'warm-up on your last session’s gaps, what this one will ask of you, and the '+
          'material if you want it.'));
      return;
    }

    /* 1. WARM-UP. Each question hides its own answer, because a flashcard whose answer
       is already on screen is a sentence he reads rather than a fact he retrieves, and
       retrieving it is the entire mechanism. `from` names the session and the specific
       thing he got wrong, so it reads as a follow-up rather than as a quiz. */
    if(pr.warmup && pr.warmup.length){
      into.appendChild(el('div','qa-l','Warm up · '+pr.warmup.length+' from last time'));
      into.appendChild(el('div','qa-v','Answer out loud first, then check. These are '+
        'facts you have already been marked on, so nothing here gives away the segment.'));
      pr.warmup.forEach(function(w,i){
        var row=el('div','qa'), rh=el('div','qa-h');
        rh.appendChild(el('div','qa-n mono',esc(String(i+1))));
        rh.appendChild(el('div','qa-t',esc(w.q||'')+
          (w.from?'<div class="ev-w mono">'+esc(w.from)+'</div>':'')));
        var ans=el('div','qa-b');
        ans.appendChild(el('div','qa-v said',esc(w.a||'')));
        rh.appendChild(expander(ans,'Check your answer to warm-up '+(i+1)));
        row.appendChild(rh); row.appendChild(ans);
        into.appendChild(row);
      });
    }

    /* 2. WHAT IT ASKS. The shape of the session, never its answers. The trap gets its
       own line and its own words because it is the one thing worth carrying in. */
    var a=pr.asks||{};
    if((a.bottles&&a.bottles.length)||(a.skills&&a.skills.length)||a.trap){
      into.appendChild(el('div','qa-l','What it will ask of you'));
      if(a.bottles&&a.bottles.length)
        into.appendChild(el('div','qa-v','<b>Bottles.</b> '+esc(a.bottles.join(' · '))));
      if(a.skills&&a.skills.length)
        into.appendChild(el('div','qa-v','<b>Shape.</b> '+esc(a.skills.join(' · '))));
      if(a.trap)
        into.appendChild(el('div','qa-warn',esc(a.trap)));
    }

    /* 3. TASTING. Only ever with a reason attached — the bottles are inventory, and
       "open the Boffalora" on its own is an instruction to drink stock. */
    var t=pr.tasting||{};
    if(t.bottle){
      into.appendChild(el('div','qa-l','If you can open one'));
      into.appendChild(el('div','qa-v','<b>'+esc(t.bottle)+'</b>. '+esc(t.checking||'')));
    }

    /* 4. THE MATERIAL, last, behind its own control, with the cost stated at the point
       of tapping. See the note above paintNext. */
    if(pr.primer){
      var pb=el('div','qa-b'); pb.style.marginTop='0';
      pr.primer.split(/\n\s*\n/).forEach(function(par){
        if(par.trim()) pb.appendChild(el('div','qa-v',esc(par.trim())));
      });
      var pr_h=el('div','qa-h'); pr_h.style.marginTop='11px';
      pr_h.appendChild(el('div','qa-t',
        '<b>The material itself</b><div class="ev-w">Opening this makes the segment '+
        'revision rather than a test. Sometimes that is what you want.</div>'));
      pr_h.appendChild(expander(pb,'Show the material for this segment'));
      into.appendChild(pr_h); into.appendChild(pb);
    }
  }

  /* ── 2. Review ────────────────────────────────────────────────────────────
     Sam, 2026-08-06: "Boothby should generate a review card that goes over
     everything we learned with emphasis on the things I needed help with more,
     this gets generated at the end of each study session and the assessment."

     THE WEIGHTING IS THE POINT. A flat recap of everything taught is a transcript,
     and he already has one. What earns the space is that the things he got wrong
     get more room than the things he got right.

     TWO KINDS OF WRONG, AND THEY ARE NOT THE SAME PROBLEM. Boothby's persona
     (personas/_core.md) already requires separating "did not know" from "reasoned
     and got it wrong", because a recall gap wants repetition and a reasoning gap
     wants re-teaching. Re-reading a fact you never encoded does not help; being
     re-taught a fact you already know is a waste of a morning. The review carries
     the distinction and this card renders them as two groups with different words,
     rather than flattening them into one list of mistakes.

     REVIEWS ACCUMULATE. The most recent is open; the ones behind it are reachable.
     A review is a thing to work FROM, not a receipt, so the current one leads and
     history is a list rather than an archive he has to go looking for.

     NOTHING HERE SCORES. The study tick already paid for the session that produced
     the review, and paying again for the artifact of that session would let one
     sitting bank twice. */

  /* ONE EXPANDER, SHARED BY ALL THREE OPEN-IN-PLACE SECTIONS in this card. The
     punch list's ⋯ is the same gesture and this is deliberately the same control
     rather than a second idiom: he already knows what the three dots do.

     EXPANDS IN PLACE AND NEVER THROUGH paintDetail(). paintDetail rebuilds the
     sheet and resets its scroll to the top, so opening question 9 would throw him
     back to the top of the tab every single time — which on a ten-question record
     read at 6am is the difference between a usable card and one he closes.

     preventDefault AND stopPropagation are both load-bearing even though .qa is a
     plain div rather than a <label>: these rows live inside a sheet with its own
     handlers, and the two guards cost nothing next to the class of bug they close.
     Returns the button; the caller places `body` wherever it belongs. */
  function expander(body, label){
    body.style.display='none';
    var mb=el('button','mini more','⋯');
    mb.setAttribute('aria-expanded','false');
    mb.setAttribute('aria-label',label||'Show more');
    mb.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation();
      var open=body.style.display!=='none';
      body.style.display=open?'none':'block';
      mb.classList.toggle('on',!open);
      mb.setAttribute('aria-expanded',String(!open));
    });
    return mb;
  }
  function markCls(m){
    /* Reuses the three chips the scorecard already uses rather than minting a
       fourth colour. pass reads as the transcript's pass, and an unrecognised
       mark renders as "—" with no chip rather than borrowing one. */
    return m==='pass'?'await':(m==='fail'?'reply':(m==='partial'?'note':''));
  }

  /* ── The full record behind a review ──────────────────────────────────────
     Sam, 2026-08-06: each review opens to "every question, my answer as it was
     given, the mark, and the correction."

     THE ANSWER IS THE EVIDENCE AND IT GOES IN AS GIVEN. Not cleaned up, not
     paraphrased into what he meant. The entire value of looking back at question 4
     in three weeks is seeing what he actually said, and a tidied answer destroys
     exactly the thing being kept.

     So the card DISTINGUISHES A QUOTE FROM AN ACCOUNT. `answer_recorded` false
     means nobody wrote his words down and what is shown is a description of the
     answer; it renders in italic under a different label. Presenting a paraphrase
     in the same typography as a quote would make the record unreliable in the one
     way that matters, and there is no way to tell from the words alone. */
  function paintRecord(rec, into){
    if(!rec || !rec.items || !rec.items.length) return false;
    var recon = rec.fidelity==='reconstructed';
    into.appendChild(el('div','news-h mono','The full record'));
    if(recon)
      into.appendChild(el('p','note','Reconstructed after the fact, so none of the '+
        'answers below are your words. '+esc(rec.note||'')));
    else
      into.appendChild(el('p','note','Every question, your answer as you gave it, '+
        'the mark, and the correction.'));
    var g=el('div','grp'), gb=el('div','g-body');
    gb.style.borderTop='none'; gb.style.paddingTop='4px';
    rec.items.forEach(function(it){
      var q=el('div','qa'), h=el('div','qa-h');
      h.appendChild(el('div','qa-n mono','Q'+esc(String(it.n||''))));
      h.appendChild(el('div','qa-t',esc(it.q||'')));
      var mc=markCls(it.mark);
      h.appendChild(el('div','qa-n mono','<span class="state '+mc+'">'+
        esc(mc?it.mark:'—')+'</span>'));
      var body=el('div','qa-b');
      var said=it.answer_recorded;
      body.appendChild(el('div','qa-l',said?'What you said':'What the record says you said'));
      body.appendChild(el('div','qa-v '+(said?'said':'para'),
        esc(it.answer||'')||'<span class="para">No account of this answer survives.</span>'));
      if(it.correction){
        body.appendChild(el('div','qa-l',it.mark==='pass'?'Note':'The answer'));
        body.appendChild(el('div','qa-v',esc(it.correction)));
      }
      if(it.kind)
        body.appendChild(el('div','qa-l',it.kind==='reasoning'
          ? 'Filed as a wrong model — comes back as teaching'
          : 'Filed as a missing fact — comes back as repetition'));
      h.appendChild(expander(body,'Show the answer to question '+(it.n||'')));
      q.appendChild(h); q.appendChild(body);
      gb.appendChild(q);
    });
    g.appendChild(gb); into.appendChild(g);
    return true;
  }

  function paintReview(){
    var rv=BOOTHBY.review||null;
    var past=(BOOTHBY.reviews||[]);
    if(!rv){
      host.appendChild(el('div','empty','No review yet.<br><br>'+
        'Boothby writes one at the close of every study session and every '+
        'assessment, weighted toward whatever needed the most help. The first one '+
        'lands after the next segment you sit.'));
      return;
    }

    host.appendChild(el('div','mail','<div class="m-body">'+
      '<div class="m-cat mono">'+esc(rv.date||'')+
        (rv.kind?' · '+esc(rv.kind):'')+'</div>'+
      '<div class="m-from">'+esc(rv.title||'Review')+'</div>'+
      (rv.result?'<div class="m-sum">'+esc(rv.result)+'</div>':'')+'</div>'));

    /* Reasoning gaps FIRST, above recall gaps, and that ordering is deliberate: a
       thing he reasoned his way to the wrong answer on is the one that needs a
       person, and it is the one most likely to be skipped if it is at the bottom. */
    function grp(title,items,lead,into){
      into = into || host;
      if(!items || !items.length) return;
      into.appendChild(el('div','news-h mono',title));
      if(lead) into.appendChild(el('p','note',lead));
      var g=el('div','grp'), gb=el('div','g-body');
      gb.style.borderTop='none'; gb.style.paddingTop='4px';
      items.forEach(function(w){
        var t = (typeof w==='string') ? w : (w.point||w.title||'');
        var d = (typeof w==='string') ? ''  : (w.detail||w.why||'');
        /* The question numbers this item came from. The weighted list is DERIVED
           from the record, and printing where each item came from is what makes
           that checkable rather than asserted — and it points him at the actual
           question instead of leaving him to find it. */
        var q = (typeof w==='string') ? null : (w.qs||null);
        gb.appendChild(el('div','ev',
          '<div class="ev-b"><div class="ev-n">'+esc(t)+'</div>'+
          (d?'<div class="ev-w">'+esc(d)+'</div>':'')+
          (q&&q.length?'<div class="ev-w mono">from Q'+esc(q.join(', Q'))+'</div>':'')+
          '</div>'));
      });
      g.appendChild(gb); into.appendChild(g);
    }

    grp('Needs re-teaching', rv.reasoning,
        'You reasoned to these and landed wrong. Repetition will not fix a wrong '+
        'model, so these come back as teaching rather than as flashcards.');
    grp('Needs repetition', rv.recall,
        'You did not have these. Nothing wrong with the reasoning, the fact was '+
        'not there, so these come back until it is.');
    grp('Held up', rv.solid,
        'Answered without help. Listed short, because the point of this card is '+
        'what did not.');

    if(rv.next)
      host.appendChild(el('p','note','Next: '+esc(rv.next)));

    if(!paintRecord(rv.record, host)){
      /* A review with no record is legal and is what every review written before
         2026-08-06 looks like. A record that was REFUSED by the push script is a
         different fact and says so with the reason, because a silently missing
         record and a broken one look identical from here and only one of them is
         something to go and fix. */
      host.appendChild(el('p','note', rv.record_error
        ? ('The full record for this review could not be read: '+esc(rv.record_error)+
           '. Fix the JSON block in '+esc(rv.file||'the review file')+' and push again.')
        : 'No full record behind this one. Reviews written from 2026-08-06 carry '+
          'every question, your answer and the correction.'));
    }

    /* THE ONES BEHIND IT, AND THEY OPEN. This reverses the call made this morning,
       which shipped dates and titles only with a note telling him to ask a session
       to pull one up. He asked the same evening for reviews to open to their full
       record, and a pointer he cannot follow one-handed on a phone at six in the
       morning is not a way in. Reviews accumulate and the point of the tail is to
       be able to reach the ones behind the most recent, so the tail expands in
       place to the whole review: its re-teach list, its repeat list, and its own
       full record. */
    if(past.length){
      host.appendChild(el('div','news-h mono','Earlier reviews'));
      var pb=el('div','grp'), pgb=el('div','g-body');
      pgb.style.borderTop='none'; pgb.style.paddingTop='4px';
      past.forEach(function(p){
        var q=el('div','qa'), h=el('div','qa-h');
        h.appendChild(el('div','qa-n mono',esc((p.date||'').slice(5))));
        h.appendChild(el('div','qa-t','<b>'+esc(p.title||'')+'</b>'+
          (p.result?'<div class="ev-w">'+esc(p.result)+'</div>':'')));
        var body=el('div','qa-b');
        grp('Needs re-teaching', p.reasoning, '', body);
        grp('Needs repetition', p.recall, '', body);
        grp('Held up', p.solid, '', body);
        if(p.next) body.appendChild(el('p','note','Next: '+esc(p.next)));
        if(!paintRecord(p.record, body))
          body.appendChild(el('p','note', p.record_error
            ? ('Record unreadable: '+esc(p.record_error))
            : 'No full record behind this one.'));
        h.appendChild(expander(body,'Open the review from '+(p.date||'')));
        q.appendChild(h); q.appendChild(body);
        pgb.appendChild(q);
      });
      pb.appendChild(pgb); host.appendChild(pb);
      host.appendChild(el('p','note',past.length+' earlier review'+
        (past.length===1?'':'s')+'. The files are in Boothby’s records on the Mac if '+
        'you want one read back properly.'));
    }
  }

  /* ── 3. Scorecard, straight off the transcript ───────────────────────────
     `entries` is a verbatim copy of the transcript's table. Nothing here is
     recomputed on the page, which is what makes the file the authority in
     practice rather than only in principle. */
  function paintScore(){
    var ents=(BOOTHBY.scorecard||{}).entries||[];
    if(!ents.length){
      host.appendChild(el('div','empty','No assessments sat yet.<br><br>'+
        'The transcript is empty, which is a fact about the term rather than a gap '+
        'in this card.'));
    } else {
      var sb=el('div','grp'), sgb=el('div','g-body');
      sgb.style.borderTop='none'; sgb.style.paddingTop='4px';
      ents.forEach(function(e){
        sgb.appendChild(el('div','ev',
          '<div class="ev-t mono" style="min-width:74px">'+esc(e.date||'')+'</div>'+
          '<div class="ev-b"><div class="ev-n">'+
            esc(e.assessment||('Unit '+(e.unit||'?')))+'</div>'+
            (e.mark?'<div class="ev-w">'+esc(e.mark)+'</div>':'')+'</div>'+
          '<div class="ev-t mono" style="text-align:right;min-width:52px">'+
            '<span class="state '+(e.result==='pass'?'await':'reply')+'">'+
            esc(e.result||'—')+'</span></div>'));
      });
      sb.appendChild(sgb); host.appendChild(sb);
    }
    /* WHAT RANK ACTUALLY GOT, spelled out, and it is here because the card was
       silent about it. An assessment is rank-only, so a pass moves nothing Sam can
       see on the dial the morning he sits it, and he read that silence as the
       points not having arrived. Printing the arithmetic is cheaper than explaining
       the channel again. Recomputed from the rows above rather than stored, same as
       boothbyXp(), so this line cannot disagree with the score. */
    var np=0; ents.forEach(function(e){ if(e && e.result==='pass') np++; });
    var nc=+((BOOTHBY.scorecard||{}).courses_done)||0;
    if(np||nc)
      host.appendChild(el('p','note','Rank credit from this transcript: '+
        np+(np===1?' pass':' passes')+' × '+W.assess+
        (nc?(' and '+nc+(nc===1?' course':' courses')+' completed × '+W.course):'')+
        ' = '+(np*W.assess+nc*W.course)+'. It moves the commission, not today’s arc.'));
    host.appendChild(el('p','note','The transcript on disk is the record. If it and this '+
      'ever disagree the transcript wins and this is what gets corrected — nothing '+
      'on the Bridge counts a pass on its own.'));
  }

  /* ── 4. Syllabus, and the units open ──────────────────────────────────────
     Sam, 2026-08-06: "syllabus is only really useful if the different units expand
     and allow for a slightly deeper dive."

     Three things make a unit worth opening and they are the three he would ask for:
     what it covers, what has been prepared and sat under it, and where he is in it.
     None of that is written here — the blurb is verbatim from the syllabus file and
     the segment statuses come from the segment files' own headers — because a card
     that paraphrases the syllabus is a second syllabus that can disagree with the
     first one.

     THE UNIT SHOWS ITS SAT SEGMENTS TOO, unlike the Next-up tab, which correctly
     hides anything answered. A syllabus that emptied out as he worked through it
     would be showing progress as absence. */
  function paintSyllabus(){
    var units=BOOTHBY.syllabus||[];
    if(!units.length){
      host.appendChild(el('div','empty','No syllabus published for '+esc(c.title||'this course')+'.'));
      return;
    }
    host.appendChild(el('div','news-h mono',esc(c.title||'Course')));
    var yb=el('div','grp'), ygb=el('div','g-body');
    ygb.style.borderTop='none'; ygb.style.paddingTop='4px';
    units.forEach(function(u){
      var st = u.state==='passed' ? 'await' : (u.state==='current' ? 'reply' : '');
      var segs=u.segments||[], sat=u.sat||0, ents=u.entries||[];
      var q=el('div','qa'), h=el('div','qa-h');
      h.appendChild(el('div','qa-n mono','U'+esc(String(u.n))));
      h.appendChild(el('div','qa-t','<b>'+esc(u.title||'')+'</b>'+
        (segs.length?'<div class="ev-w">'+sat+' of '+segs.length+
          ' segment'+(segs.length===1?'':'s')+' sat</div>':'')));
      if(st) h.appendChild(el('div','qa-n mono',
        '<span class="state '+st+'">'+esc(u.state)+'</span>'));
      var body=el('div','qa-b');
      if(u.blurb){
        body.appendChild(el('div','qa-l','What it covers'));
        body.appendChild(el('div','qa-v',esc(u.blurb)));
      }
      body.appendChild(el('div','qa-l','Segments'));
      if(segs.length){
        segs.forEach(function(s){
          /* "prepared" and "sat" are different facts and the two chips say so.
             A unit with three prepared and none sat is not a unit in progress. */
          body.appendChild(el('div','qa-v',
            '<span class="state '+(s.status==='sat'?'await':'note')+'">'+
            esc(s.status==='sat'?'sat':'ready')+'</span> '+esc(s.title||'')+
            (s.minutes?' <span class="ev-w mono">'+esc(String(s.minutes))+'m</span>':'')));
        });
      } else {
        body.appendChild(el('div','qa-v','Nothing prepared under this unit yet. '+
          'Study prep runs Monday, Wednesday and Friday and works forward from the '+
          'current unit, so a unit ahead of where you are is expected to be empty.'));
      }
      body.appendChild(el('div','qa-l','Where you are'));
      if(ents.length){
        ents.forEach(function(e){
          body.appendChild(el('div','qa-v',esc(e.date||'')+' · '+esc(e.assessment||'')+
            ' · '+esc(e.mark||'')+' <span class="state '+
            (e.result==='pass'?'await':'reply')+'">'+esc(e.result||'')+'</span>'));
        });
      } else if(u.state==='current'){
        body.appendChild(el('div','qa-v','This is the current unit. '+
          (sat?('You have sat '+sat+' segment'+(sat===1?'':'s')+'. '):'')+
          'Nothing on the transcript for it yet, which means the assessment has not '+
          'been passed — the transcript is the only thing that decides that.'));
      } else if(u.state==='passed'){
        body.appendChild(el('div','qa-v','Passed, and on the transcript.'));
      } else {
        body.appendChild(el('div','qa-v','Ahead of where you are. Units are worked '+
          'in order and this one opens when the current unit is passed.'));
      }
      h.appendChild(expander(body,'Open unit '+u.n));
      q.appendChild(h); q.appendChild(body);
      ygb.appendChild(q);
    });
    yb.appendChild(ygb); host.appendChild(yb);
  }

  /* ── 5. Books ────────────────────────────────────────────────────────────
     Rebuilt 2026-08-06. Sam: "Books has nothing to click, so I don't have a way to
     add anything, or review suggestions." Four things now live here and the old
     version had exactly one of them: an add field, the reading list with a
     mark-finished control per row, the finished shelf, and Boothby's suggestions
     as a separate group he can accept or dismiss.

     AN EMPTY SHELF IS AN INVITATION, NEVER NOTHING. The old empty state returned
     before rendering any control, which is why the section looked dead: the only
     way to put a book on the shelf was for a script on the Mac to publish one. The
     add field is now built BEFORE the emptiness check and outside it.

     Repaints in place for the same reason the tabs do — see paint() above. */
  function paintBooks(){
    var add=el('div','bk-add');
    var inp=el('input');
    inp.type='text'; inp.placeholder='Add a book…'; inp.setAttribute('aria-label','Add a book');
    inp.autocomplete='off'; inp.setAttribute('enterkeyhint','done');
    var abt=el('button','','Add');
    function commit(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      if(!addBook(inp.value)) return;
      inp.value='';
      paintBooks.rerender();
    }
    /* preventDefault AND stopPropagation on both. This card's rows are <label>s and
       a label forwards clicks to its control, which has already ticked an unrelated
       item off twice elsewhere in this file. */
    abt.addEventListener('click',commit);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') commit(e); });
    add.appendChild(inp); add.appendChild(abt);
    host.appendChild(add);

    var books=boothbyBooks();
    var reading=books.filter(function(x){return !x.done;});
    var fin=books.filter(function(x){return x.done;});

    if(!books.length){
      host.appendChild(el('div','empty','Nothing on the shelf yet.<br><br>'+
        'Type a title above to start one. Boothby’s recommendations show up below '+
        'as suggestions, and only reach this list if you accept them.'));
    } else {
      /* Reading first, finished below it. The shelf is a to-read list at the top and
         a record underneath, and sorting them together would bury the next book. */
      var bb=el('div','grp'), bgb=el('div','g-body');
      bgb.style.borderTop='none'; bgb.style.paddingTop='4px';
      reading.concat(fin).forEach(function(x){
        var row=el('label','row');
        var ck=el('input'); ck.type='checkbox'; ck.className='ck'; ck.checked=x.done;
        ck.addEventListener('change',function(){
          toggleBook(x.id, x.title);
          if(ck.checked) hit(row);
          paintBooks.rerender();
        });
        /* WHAT THE 4AM RUN FOUND OUT ABOUT THIS BOOK. Sam, 2026-08-06: "when a book
           gets added, it should get processed by the captains log and becomes a
           track of the actual book itself, that I can then discuss with Boothby."
           Researched CONTEXT FOR DISCUSSION, his call — no segments, no scoring, no
           progress model. A book that becomes homework is the opposite of why he
           picked it up.

           Context is looked up by id from bridge_data/boothby.books.context rather
           than read off the row, because Sam's own books live in
           bridge_state/_books.own, which is device-owned and which the 4am run is
           forbidden to write. A map keyed by id is the only shape that can carry
           research for both populations without breaking that rule.

           THREE STATES AND THEY MUST LOOK DIFFERENT. Researched, unidentifiable,
           and not-yet-processed. The third is the NORMAL state for up to a day — he
           adds a book in the evening and the run is at 4am — so it says that
           plainly instead of rendering an empty block that reads as a failure. */
        var cx=((BOOTHBY.books||{}).context||{})[x.id]||null;
        var cb=el('div','r-more');
        if(!cx){
          cb.appendChild(el('div','qa-v','Not looked at yet. The 4am captain’s log '+
            'picks up anything new on the shelf and comes back with what the book '+
            'is, its shape, and whether it connects to anything you are working on. '+
            'A book added today is normally read up overnight.'));
        } else if(cx.status==='unidentified'){
          cb.appendChild(el('div','qa-v',esc(cx.note||'')));
          cb.appendChild(el('div','qa-warn','Not identified, and left on the shelf '+
            'rather than guessed at. Correct the title and it gets picked up on the '+
            'next run.'));
        } else {
          if(cx.author){ cb.appendChild(el('div','qa-l','Author'));
            cb.appendChild(el('div','qa-v',esc(cx.author))); }
          if(cx.what){ cb.appendChild(el('div','qa-l','What it is'));
            cb.appendChild(el('div','qa-v',esc(cx.what))); }
          if(cx.shape){ cb.appendChild(el('div','qa-l','Its shape'));
            cb.appendChild(el('div','qa-v',esc(cx.shape))); }
          if(cx.connects){
            /* The label is the honest half. A book that connects to nothing says so
               under a heading that says so, because a manufactured relevance hook is
               how the retired news card published a false story. */
            cb.appendChild(el('div','qa-l',cx.connected
              ? 'Where it touches your work' : 'It does not connect, and that is fine'));
            cb.appendChild(el('div','qa-v',esc(cx.connects)));
          }
          cb.appendChild(el('p','note','Read up '+esc(cx.on||'')+
            (cx.sources&&cx.sources.length?' · '+esc(cx.sources.join(' · ')):'')+
            '. Ask Boothby about it and he has this in front of him.'));
        }
        row.appendChild(ck);
        row.appendChild(el('span','r-txt',esc(x.title)+
          (x.author?' <span class="ev-w">'+esc(x.author)+'</span>':'')+
          /* Only if the title does not already carry it. Sam types "Hyperion by Dan
             Simmons" into one field, so appending the researched author rendered
             "Hyperion by Dan Simmons Dan Simmons". Caught on screen at 390, not in
             a check — the DOM was correct by every assertion and still wrong to
             read. The title is device-owned and this card may not rewrite it, so
             the fix is to suppress the duplicate rather than to clean the title. */
          (cx&&cx.author&&!x.author&&
           x.title.toLowerCase().indexOf(cx.author.toLowerCase())<0
             ?' <span class="ev-w">'+esc(cx.author)+'</span>':'')+
          (x.src==='boothby'?' <span class="ev-w">· Boothby’s shelf</span>':'')+
          (cx&&cx.status==='unidentified'?' <span class="state reply">not found</span>':'')+
          (!cx?' <span class="state note">new</span>':'')+
          (x.done&&x.on?' <span class="mono ev-w">finished '+esc(x.on)+'</span>':'')));
        // Removing is only offered on Sam's OWN rows. A book Boothby published is
        // not his to delete from here; it comes off by being withdrawn upstream,
        // and a delete button that silently did nothing on the next push would be
        // worse than no button.
        /* The expander goes in BEFORE the remove button, so the destructive control
           stays last on the row and is not the thing his thumb lands on when he
           means to read. Same two guards as everywhere else in this file: .row is a
           <label> and a click on it reaches the checkbox, which is exactly how an
           expander ticked an unrelated item off twice here. */
        row.appendChild(expander(cb,'What we know about '+(x.title||'this book')));
        if(x.src==='own'){
          var rm=el('button','mini','✕');
          rm.title='Take this off the shelf';
          rm.addEventListener('click',function(e){
            e.preventDefault(); e.stopPropagation();
            removeOwnBook(x.id); paintBooks.rerender();
          });
          row.appendChild(rm);
        }
        row.appendChild(cb);
        bgb.appendChild(row);
      });
      bb.appendChild(bgb); host.appendChild(bb);
      if(fin.length) host.appendChild(el('p','note',fin.length+' finished. Marking a '+
        'book is device-owned and persists, so republishing the shelf cannot '+
        'un-finish it.'));
    }

    /* SUGGESTIONS ARE NOT THE SHELF. Their own group, their own words, dashed rule
       down the left, and two explicit verbs. See the comment above boothbyBooks():
       a recommendation Sam never chose sitting inside his reading list is the one
       thing that would make the whole shelf untrustworthy. */
    var sug=boothbySuggestions();
    if(sug.length){
      host.appendChild(el('div','news-h mono','Boothby suggests'));
      sug.forEach(function(s){
        var r=el('div','sug');
        r.appendChild(el('div','t','<b>'+esc(s.title||'')+'</b>'+
          (s.author?' — '+esc(s.author):'')+
          (s.note?'<span>'+esc(s.note)+'</span>':'')));
        var a=el('div','a');
        var yes=el('button','mini','+'); yes.title='Add to the shelf';
        yes.addEventListener('click',function(e){
          e.preventDefault(); e.stopPropagation();
          acceptBook(s); paintBooks.rerender();
        });
        var no=el('button','mini','✕'); no.title='Not interested';
        no.addEventListener('click',function(e){
          e.preventDefault(); e.stopPropagation();
          dismissBook(s.id); paintBooks.rerender();
        });
        a.appendChild(yes); a.appendChild(no);
        r.appendChild(a);
        host.appendChild(r);
      });
      host.appendChild(el('p','note','Suggestions are proposals, not your list. '+
        'Accepting copies the book onto your shelf, where it stays even if Boothby '+
        'later withdraws the suggestion. Dismissing is remembered.'));
    }
  }
  // Repaint the Books tab in place. Bound to the function rather than called
  // recursively so the whole tab, including the note under `generated`, is rebuilt
  // exactly the way a tab switch rebuilds it.
  paintBooks.rerender=function(){ paint(); };
};

/* ── routine ───────────────────────────────────────────── */
/* The water row. A counter, not a checkbox, which is why it is built by the page
   rather than coming through as a payload step: every `routine.steps` entry is a
   boolean and "4 of 8" is not.

   Minus as well as plus, because a mis-tap on a phone at 6am is guaranteed and a
   counter you cannot correct is a counter you stop trusting. */
/* A routine step, in either shape.

   Legacy: a plain string, one habit, one tick, no detail.
   New:    {label, detail:[...]} — still ONE habit and ONE tick, with the movements
           behind an expander rather than as five separate boxes.

   Deliberately NOT pattern-matched out of the prose. Grouping "Ankle circles" and
   "Hip circles" by reading the text would rot the first time the wording changed,
   and it would be guessing at structure the feeder can simply state. */
function stepShape(st){
  if(st && typeof st==='object')
    return {label:String(st.label||''), detail:(st.detail||[]).map(String)};
  return {label:String(st==null?'':st), detail:[]};
}

function intakeRow(){
  /* THREE THERMOMETERS, on the landing page since 2026-09-03. Sam's words: "a small
     water, firecider, multivitamin counter that I can add and remove from, with a
     sort of thermometer type visual showing progress through the day." Water fills
     by cups; the two supplements are a single tap on the tube. Scoring is untouched:
     intakeXp() still wants all three, and the payout still fires on the transition. */
  var wrap=el('div','intk-in');
  function tube(cls,pct,extra){
    return '<span class="th-tube'+(cls?' '+cls:'')+'"'+(extra||'')+'><i style="height:'+
      Math.round(pct*100)+'%"></i></span>';
  }
  function paint(){
    var c=state.water||0;
    var miss=[];
    if(c<WATER_TARGET) miss.push((WATER_TARGET-c)+' cup'+(WATER_TARGET-c===1?'':'s'));
    if(!state.cider) miss.push('fire cider');
    if(!state.vits)  miss.push('multivitamin');
    var note = miss.length ? esc(miss.join(', '))+' to go' : 'Complete · +'+W.intake;
    wrap.innerHTML=
      '<div class="intk-head"><span class="wtr-k mono">Intake</span>'+
      '<span class="intk-note'+(miss.length?'':' done')+'">'+note+'</span></div>'+
      '<div class="intk-row">'+
        '<div class="therm water'+(c>=WATER_TARGET?' full':'')+'">'+tube('',c/WATER_TARGET)+
          '<span class="th-lab mono">Water</span>'+
          '<span class="th-val">'+c+'<small>/'+WATER_TARGET+'</small></span>'+
          '<span class="th-act"><button data-d="-1" aria-label="One cup fewer">−</button>'+
          '<button data-d="1" aria-label="One more cup">+</button></span></div>'+
        '<button class="therm tog'+(state.cider?' full':'')+'" data-t="cider" aria-pressed="'+(state.cider?'true':'false')+'">'+
          tube('',state.cider?1:0)+'<span class="th-lab mono">Fire cider</span>'+
          '<span class="th-val">'+(state.cider?'✓':'·')+'</span></button>'+
        '<button class="therm tog'+(state.vits?' full':'')+'" data-t="vits" aria-pressed="'+(state.vits?'true':'false')+'">'+
          tube('',state.vits?1:0)+'<span class="th-lab mono">Multivit</span>'+
          '<span class="th-val">'+(state.vits?'✓':'·')+'</span></button>'+
      '</div>';
    wrap.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault();e.stopPropagation();
        var was=intakeXp();
        var t=btn.getAttribute('data-t');
        if(t){ state[t]=!state[t]; }
        else {
          var d=+btn.getAttribute('data-d');
          // Clamped at both ends: no credit for an eleventh cup, no negative water.
