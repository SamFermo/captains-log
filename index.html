   without touching the commission. Needs three recorded days before it says
   anything: two points is not a trend, and the old rank claimed one from two. */
/* MUST agree with xpTotal() about what a day is worth, and for two weeks it did not.
   This summed only the tick xp on a row and ignored session credit entirely, while
   xpTotal() adds it — so the rank climbed at one rate and the pace reading described a
   slower one. That is a cosmetic annoyance most of the time and a real problem once,
   because this function IS the instrument for the weights calibration: reading it low
   would have said the economy was running at target when it was running hot, and the
   whole reason thresholds were fixed before weights is that only the weights can be
   walked back.

   The denominator was wrong too. `seen++` counted ledger rows, but a day can earn
   session credit with no row at all when Sam never opened the page, and xpTotal() counts
   those. Counting distinct DATES fixes both halves.

   The words are pinned to the ladder rather than to taste: the ladder assumes ~8/day, so
   `steady` starts there and the others are set around it. If the weights change, these
   move with them — they describe the economy, they do not define it. */
function standing(){
  var cut=new Date(DATE+'T12:00:00'); cut.setDate(cut.getDate()-13);
  var ck=dayKey(cut), tot=0, seen={};
  /* winXpOn() joined this on 2026-08-10 and it is the third term, not a replacement.
     Sam's split: the weekly rows are rank-only and must stay OUT of this reading, and a
     covers record is a daily outcome and must be IN it. That distinction is carried by
     whether an award has a `d`, and winXpOn only returns the ones that do — so this
     line needs no knowledge of which awards exist, only that some of them landed on a
     date. Adding all of AWARDS here instead would put a weekly lump into the pace
     reading, which is the exact thing this function must not do: it IS the instrument
     for the weights calibration due around 2026-08-18. */
  (ledger.days||[]).forEach(function(x){
    if(x&&x.d>=ck&&x.d<=DATE){
      tot+=(typeof x.xp==='number'?x.xp:(x.closed||0))+sessionXpOn(x.d)+winXpOn(x.d);
      seen[x.d]=1;
    }
  });
  for(var d in SESSION_XP){
    if(d>=ck && d<=DATE && !seen[d]){ tot+=sessionXpOn(d)+winXpOn(d); seen[d]=1; }
  }
  /* A record night he never opened the Bridge on has no row and no session credit, and
     would otherwise be counted by xpTotal() and missed here, so the two would disagree
     about what the fortnight was worth. That divergence is exactly the bug this
     function carried for two weeks against session credit. */
  for(var wd in AWARDS){
    var aw=AWARDS[wd];
    if(aw && aw.d && aw.d>=ck && aw.d<=DATE && !seen[aw.d]){ tot+=winXpOn(aw.d); seen[aw.d]=1; }
  }
  var n=Object.keys(seen).length;
  if(n<3) return {word:null,note:n+' day'+(n===1?'':'s')+' logged'};
  var per=tot/n;
  return {word: per>=11?'excellent' : per>=8?'steady' : per>=4?'light' : 'slipping',
          per:per, note:tot+' in '+n+'d'};
}
/* Backlog direction over the last 7 days. Needs two data points; says so when it
   has one, rather than drawing a flat arrow that looks like a real reading. */
function backlogTrend(){
  var now=allPunchItems().length;
  var cut=new Date(DATE+'T12:00:00'); cut.setDate(cut.getDate()-7);
  var ck=dayKey(cut), oldest=null;
  (ledger.days||[]).forEach(function(x){
    if(x&&x.d>=ck&&x.d<DATE&&typeof x.open==='number'&&(!oldest||x.d<oldest.d)) oldest=x;
  });
  if(!oldest) return {n:now,delta:null};
  return {n:now,delta:now-oldest.open,since:oldest.d};
}
/* ── the work queue ───────────────────────────────────────────────────────────────────
   Sam taps something on his phone; he carries the queued set to a desktop session as one
   prompt; the 4am run clears whatever that session actually crossed off. There is no
   hourly drain and that is a decision, not a gap — see the lifecycle comment above
   BUILD._queue, and QUEUE-RUNNER.md for the polling design this replaced.

   Why bridge_state and not a bridge_queue collection: `match /bridge_state/{day}` already
   covers any doc id in this collection, so `_queue` needs no rules change, exactly like
   `_prefs`. It is also Sam-only read AND write, which matters: queue items quote real
   people, real appointments and real money, and none of that can sit in a collection
   anything anonymous is allowed to read.

   The 4am run reads this through Chrome on the signed-in page, the same mechanism the
   captain's log already uses to read Firestore `claims` in Step 6b. No service account, no
   private key on disk. It is the ONE sanctioned non-device writer of bridge_state and it
   may touch `_queue` only, never `{date}` and never `_streak`.

   arrayUnion, not read-modify-write: two taps in quick succession on a phone with a slow
   connection would otherwise race and the second would erase the first. */
function qid(){
  return 'q-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
}
function queueAdd(items,then){
  if(!user||!items.length)return;
  var stamped=items.map(function(it){
    return {
      id:it.id||qid(), kind:it.kind||'task', text:it.text||'',
      project:it.project||'', sender:it.sender||'', subject:it.subject||'', body:it.body||'',
      status:it.status||'queued', note:it.note||'',
      created_at:new Date().toISOString(), for_date:DATE, source:'bridge'
    };
  });
  var FV=firebase.firestore.FieldValue;
  db.collection('bridge_state').doc('_queue').set({
    items:FV.arrayUnion.apply(null,stamped),
    updated_at:new Date().toISOString(), by:user.email
  },{merge:true}).then(function(){
    queue=queue.concat(stamped);
    renderQueue();
    if(then)then(null,stamped);
  }).catch(function(e){
    // A dispatch that failed must not look like one that worked. Fall back to the clipboard
    // so the work is not simply lost.
    if(then)then(e);
  });
}
/* Drop items from the queue for good. Reachable from every item in both states,
   which is deliberate: there must be no state an item can reach that traps it.
   Read-modify-write the whole array: arrayRemove cannot match on a field, and the
   objects carry timestamps that make exact-value matching fragile. */
function queueDismiss(ids,then){
  if(!user||!ids.length){ if(then)then(null); return; }
  var keep=queue.filter(function(i){ return ids.indexOf(i.id)<0; });
  db.collection('bridge_state').doc('_queue').set({
    items:keep, updated_at:new Date().toISOString(), by:user.email
  },{merge:true}).then(function(){
    queue=keep; renderQueue(); if(then)then(null);
  }).catch(function(e){ if(then)then(e); });
}
/* Move an item between the two states. The phone owns queued -> in_progress, which
   happens when Sam copies the prompt. The 4am run owns the other direction: it drops
   in_progress items whose todo line now reads [x] and returns the rest to queued with
   stall_count bumped. */
function queueSetStatus(ids,status,note,then){
  if(!user||!ids.length){ if(then)then(null); return; }
  var next=queue.map(function(i){
    return ids.indexOf(i.id)<0 ? i
      : Object.assign({},i,{status:status, note:note!=null?note:(i.note||'')});
  });
  db.collection('bridge_state').doc('_queue').set({
    items:next, updated_at:new Date().toISOString(), by:user.email
  },{merge:true}).then(function(){
    queue=next; renderQueue(); if(then)then(null);
  }).catch(function(e){ if(then)then(e); });
}

/* ── the two states, and the ONE predicate each ───────────────────────────────
   `queued` and `in_progress`. Nothing else. `needs_sam` and `done` were removed
   on 2026-08-06 along with the polling drain whose vocabulary they were.

   These two functions exist so that the render, the pill and the copy button
   cannot disagree about what counts, which is the bug that produced "Nothing
   queued." over five visibly queued items: the copy button filtered on
   `status==='queued'` while every item Engage had ever created was written
   `needs_sam`. Two predicates over one list is the bug class. If you need a
   third reader of this array, call one of these rather than writing a filter. */
function qOpen(){
  /* Stalled first. An item the 4am run has already returned once is the one most
     likely to be forgotten, and burying it under fresh work is how it stays
     forgotten. Sort is stable below the stall count, so within a stall tier the
     array order (oldest first) survives. */
  return queue.filter(function(i){return i.status==='queued';})
    .sort(function(a,b){return (+b.stall_count||0)-(+a.stall_count||0);});
}
function qSent(){ return queue.filter(function(i){return i.status==='in_progress';}); }

function renderQueue(){
  var pill=$('#qpill'),txt=$('#qtxt');
  if(!pill)return;
  var open=qOpen(), sent=qSent();
  if(!queue.length){pill.classList.add('hide');return;}
  pill.classList.remove('hide');
  pill.classList.toggle('done',open.length===0);
  var bits=[];
  if(open.length)bits.push('<b>'+open.length+'</b> queued');
  if(sent.length)bits.push('<b>'+sent.length+'</b> in progress');
  var st=open.filter(function(i){return (+i.stall_count||0)>0;}).length;
  if(st)bits.push('<b>'+st+'</b> stalled');
  txt.innerHTML=bits.join(' · ')+' · tap to review';
}

/* ── Google Calendar prefilled-event URL ──────────────────────────────
   No API scopes, no tokens: this opens Google Calendar's own create-event screen with the
   fields filled in. Sam confirms and saves inside Google, so the app never needs write
   access to his calendar — the least-privilege way to get "add this to my calendar". */
function gcalUrl(title,details,location,startDate){
  var p=[];
  p.push('action=TEMPLATE');
  p.push('text='+encodeURIComponent(title||''));
  if(details)  p.push('details='+encodeURIComponent(details));
  if(location) p.push('location='+encodeURIComponent(location));
  if(startDate) p.push('dates='+startDate);
  return 'https://calendar.google.com/calendar/render?'+p.join('&');
}
/* An hour block starting at the next round hour, local time.
   Used for things that have no date of their own. */
function nextHourBlock(){
  var d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
  d.setMinutes(0,0,0); d.setHours(d.getHours()+1);
  function f(x){
    return x.getFullYear()+
      String(x.getMonth()+1).padStart(2,'0')+
      String(x.getDate()).padStart(2,'0')+'T'+
      String(x.getHours()).padStart(2,'0')+'0000';
  }
  var e=new Date(d.getTime()+3600000);
  return f(d)+'/'+f(e);
}

/* Two different promises, so two different buttons.
   A calendar event HAS a date and the button adds that event on that date. A punch item or
   an inbox row has no date and never did; the old button passed no `dates` at all, so Google
   opened a blank form on today carrying the right title, which reads exactly like a broken
   date lookup. It was not reading the wrong date, it was reading no date.
   Undated things now get a real one-hour block at the next round hour, which lands as
   something draggable instead of an empty form, and says so in the label. */
function calBtn(title,details,location,startDate){
  var dated=!!startDate;
  var a=el('a','mini cal'+(dated?'':' block'),dated?'▤':'⊕');
  a.href=gcalUrl(title,details,location,dated?startDate:nextHourBlock());
  a.target='_blank';a.rel='noopener noreferrer';
  a.title=dated?'Add to Google Calendar'
               :'Block an hour for this, starting at the next hour. Drag it where you want.';
  a.addEventListener('click',function(e){e.stopPropagation();});
  return a;
}

/* Open the actual message in Gmail, so the two ways to answer an email sit side
   by side: "+" queues a reply for the Mac to draft in Sam's voice, this opens the
   thread for him to write it himself.
   authuser=<address> rather than /u/0. The account index depends on the order the
   accounts were signed in and differs between his devices, so a hardcoded index
   opens the right search in the wrong mailbox. Uses the message id when the feeder
   supplies one and falls back to a search that will match the thread. */
var GMAIL_ACCOUNT='sam@sanfermoseattle.com';
function gmailBtn(m){
  var base='https://mail.google.com/mail/u/?authuser='+encodeURIComponent(GMAIL_ACCOUNT);
  var href = m.gmail_id
    ? base+'#all/'+encodeURIComponent(m.gmail_id)
    : base+'#search/'+encodeURIComponent(
        (m.subject?'subject:("'+m.subject.replace(/^(RE|Re|FWD|Fwd):\s*/,'')+'") ':'')+
        (m.sender?'from:('+m.sender+')':'')).replace(/%20/g,'+');
  var a=el('a','mini','✉');
  a.href=href; a.target='_blank'; a.rel='noopener noreferrer';
  a.title='Open this email in Gmail and reply yourself';
  a.addEventListener('click',function(e){e.stopPropagation();});
  return a;
}

/* ── recap ─────────────────────────────────────────────── */
function renderRecap(rc){
  var box=$('#recap');
  if(!rc){box.classList.add('hide');return;}
  box.classList.remove('hide');
  var needs=(rc.failures||[]).length;
  var hard=(rc.lines||[]).filter(function(l){return l.state==='fail';}).length;
  var warns=(rc.lines||[]).filter(function(l){return l.state==='warn';}).length;
  box.classList.toggle('fail',hard>0);
  box.classList.toggle('warn',hard===0&&(warns>0||needs>0));
  // Severity in the header has to match severity in the lines. Calling two warnings
  // "2 failures" cries wolf, and a header that overstates gets ignored as fast as one
  // that understates. "Failure" is reserved for a line that actually failed.
  var head = hard>0
      ? '<b>'+hard+' failure'+(hard>1?'s':'')+'</b> in the '+esc(rc.ran_at||'overnight')+' run'
      : needs>0
      ? '<b>Ran clean</b>, '+needs+' thing'+(needs>1?'s need':' needs')+' you · '+esc(rc.ran_at||'')
      : warns>0
      ? '<b>Ran clean</b>, '+warns+' to note · '+esc(rc.ran_at||'')
      : '<b>Ran clean</b> · '+esc(rc.ran_at||'');
  // When the content is a fallback, the recap belongs to THAT day's run, not to a
  // run this morning. Unlabelled, "Ran clean · 04:12 PDT" read at 1am looks like a
  // 4am job that has not happened yet reporting success.
  if(STALE) head += ' · from '+esc(STALE.weekday||STALE.label||STALE.date);
  $('#rcTitle').innerHTML=head;
  // Anything wanting attention opens the panel by itself. A problem Sam has to tap to
  // discover is a problem the brief effectively hid. Not on a stale brief though:
  // he already saw yesterday's failures yesterday, and re-opening them every night
  // after midnight is noise, which is how a useful alert becomes one that gets ignored.
  box.open = !STALE && (hard>0||needs>0);
  var b=$('#rcBody');b.innerHTML='';
  if(rc.summary) b.appendChild(el('p','note',esc(rc.summary)));
  (rc.lines||[]).forEach(function(l){
    var cls=l.state==='fail'?'rc-fail':l.state==='warn'?'rc-warn':l.state==='skip'?'rc-skip':'rc-ok';
    var mk=l.state==='fail'?'✗':l.state==='warn'?'!':l.state==='skip'?'—':'✓';
    b.appendChild(el('div','rc-line','<span class="rc-mark '+cls+'">'+mk+'</span>'+
      '<span class="rc-k">'+esc(l.label)+'</span>'+
      (l.value?'<span class="rc-v mono">'+esc(l.value)+'</span>':'')));
  });
  if(needs){
    var f=el('div','rc-fails','<h4>Needs you</h4>');
    (rc.failures||[]).forEach(function(x){f.appendChild(el('div','',esc(x)));});
    b.appendChild(f);
  }
}

/* ── the reactor ───────────────────────────────────────────────────────────
   Clock in the centre, quest board on the outer arc, day progress on the inner.
   The clock is the only continuously-running thing on the page and it repaints
   ONCE A MINUTE, not once a second: a sweeping second hand is decoration that
   breathes, and the brief for this page is that nothing idle should. */
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
/* Live, not read once. Resizing across the breakpoint has to rebuild the tiles,
   because desktop and mobile put genuinely different content in them. */
var DESKQ=window.matchMedia?window.matchMedia('(min-width:860px)'):null;
var DESKTOP=!!(DESKQ&&DESKQ.matches);
if(DESKQ){
  var onBP=function(e){ DESKTOP=e.matches; if(DATA){buildMosaic();} };
  if(DESKQ.addEventListener) DESKQ.addEventListener('change',onBP);
  else if(DESKQ.addListener) DESKQ.addListener(onBP);
}
// Must match the radii in the SVG markup and the geometry note in the CSS.
// Must match the radii in the dial SVG and the geometry note in the CSS.
var R_QUEST=68, R_DAY=57;
var C_Q=2*Math.PI*R_QUEST, C_D=2*Math.PI*R_DAY, C_SEC=2*Math.PI*53;
var lastClock='';

function laNow(){
  return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
}
var lastSec=-1;
function tickClock(){
  var d=laNow();
  var h=d.getHours(), m=d.getMinutes(), sec=d.getSeconds();

  /* The hand moves every second; the text only when the minute changes. Those are
     two different cadences and the early return below used to gate BOTH, which is
     why the dial never registered a second passing — the ring was there, nothing
     was ever moving on it.
     Rotating a group by 6deg per second, rather than restyling the dotted track,
     keeps this to one attribute write a second with no layout and no repaint of
     anything but the hand. */
  if(sec!==lastSec){
    lastSec=sec;
    var g=$('#rxSec');
    if(g) g.setAttribute('transform','rotate('+(sec*6)+' 77 77)');
    var arc=$('#rxSecArc');
    if(arc){
      var len=(sec/60)*C_SEC;
      arc.setAttribute('stroke-dasharray',len.toFixed(3)+' '+(C_SEC-len).toFixed(3));
    }
  }

  var h12=(h%12)||12, mm=String(m).padStart(2,'0');
  var key=h12+':'+mm+(h<12?'a':'p');
  if(key===lastClock) return;                 // no DOM write when nothing changed
  lastClock=key;
  paintSky(h);
  $('#rxTime').innerHTML=h12+':'+mm+'<small>'+(h<12?'AM':'PM')+'</small>';
  $('#rxDow').textContent=d.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase();
  $('#rxDate').textContent=d.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase()+
    ' · '+d.getFullYear();
  // Waking window, 05:00 to 23:00. Outside it the arc reads full or empty, which is
  // honest: at 2am there is no day left to be partway through.
  var mins=h*60+m, f=Math.max(0,Math.min(1,(mins-300)/(1380-300)));
  var arc=$('#rxDay'); if(arc) arc.style.strokeDashoffset=String(C_D*(1-f));
}
/* Numbers arrive by counting up rather than snapping. This is not only garnish:
   a value that visibly climbs from zero distinguishes "loaded" from "still loading"
   without a spinner, and it is the honest tell that the read finished. */
function countUp(node,to){
  var n=parseInt(to,10);
  if(RM||!isFinite(n)||n>999){node.textContent=to;return;}
  var from=0, t0=null, dur=520+Math.min(n,60)*6;
  function step(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur);
    var e=1-Math.pow(1-p,3);
    node.textContent=String(Math.round(from+(n-from)*e));
    if(p<1)requestAnimationFrame(step); else node.textContent=String(n);
  }
  node.textContent='0';
  requestAnimationFrame(step);
}
/* The page is read at 6am, and a fixed golden-hour palette is wrong for the one
   moment it actually gets looked at. The phase drives CSS variables only, so every
   rule downstream follows without a per-phase duplicate anywhere.
   Boundaries are deliberately not on the hour Sam reads: dawn holds from 04:00 to
   08:00 so the whole morning routine sits in one register rather than changing
   underneath him mid-brief. Written only when the phase actually changes, which is
   four DOM writes a day. */
var lastSky=null;
function skyPhase(h){
  if(h<4)  return 'night';
  if(h<8)  return 'dawn';
  if(h<16) return 'day';
  if(h<20) return 'dusk';
  return 'night';
}
function paintSky(h){
  var p=skyPhase(h);
  if(p===lastSky) return;
  lastSky=p;
  document.documentElement.setAttribute('data-sky',p);
}
// Set before the first paint so the page never flashes the default palette.
paintSky(laNow().getHours());

/* A promotion is an EVENT, not a number that quietly changes overnight. It is
   the entire payoff of a levelling system, and a rank that silently ticks from
   ENS to LTJG between two glances is worth nothing.

   Announced once, on the morning it happens, then acknowledged and gone. The
   comparison is against the rank as it stood when this load began, so a promotion
   earned by today's own check-offs still fires. On the very first run after this
   shipped there is no stored rank, so it records where Sam already stands rather
   than congratulating him on a promotion he did not just earn. */
function checkPromotion(){
  var bar=$('#promobar');
  if(!bar||!user||!DATA||promoShown) return;
  var now=rank();
  if(!PREV_RANK){ PREV_RANK=now.key; return; }
  var wasIdx=-1;
  for(var i=0;i<RANKS.length;i++) if(RANKS[i].k===PREV_RANK) wasIdx=i;
  if(wasIdx<0 || now.i<=wasIdx){ PREV_RANK=now.key; return; }
  promoShown=true; PREV_RANK=now.key;
  bar.classList.remove('hide');
  bar.innerHTML='<span class="pip"></span><span>Promoted to <b>'+esc(now.name)+'</b>. '+
    now.xp+' logged'+(now.next?', '+now.toNext+' to '+esc(now.next.name):', top of the ladder')+
    '.</span>';
  var b=el('button','','Acknowledge');
  b.addEventListener('click',function(e){e.stopPropagation();bar.classList.add('hide');});
  bar.appendChild(b);

  /* ONE FLASH, on the newly earned mark, and never again. Sam's call, 2026-08-06.
     It is driven from HERE and not from paintReactor deliberately: paintReactor
     runs on every tick and every check-off, so a flash decided in there would
     fire on every repaint for the rest of the day, which is the exact failure
     the promobar already had to be fixed for. This site is guarded twice over,
     by promoShown for the session and by the rank_key persisted in the ledger
     across loads, so a reload cannot replay it.
     The collar was drawn by the paintReactor call immediately above this one in
     all five call sites, so the mark exists by now. Last child, because the
     newest bar or pip is the rightmost one. */
  var col=$('#rxStats')&&$('#rxStats').querySelector('.rh-col');
  var mark=col&&col.lastElementChild;
  if(mark&&!RM) mark.classList.add('flash');
}

/* ══ THE JACKPOT ═══════════════════════════════════════════════════════════
   Sam's ask, 2026-08-04: when a session finishes a batch of work, the next open
   should pay out. A slot machine, not a chore.

   It pays for SESSION-closed work, and that choice is what makes it safe to fire on
   any open rather than once a day. An earlier cut paid out Sam's own ticks, which
   meant refreshing right after ticking farmed it, and the only defence was a
   once-per-day guard that also blocked the same-day payout he actually wanted.
   Paying for work a session pushed removes the exploit at the root: reloading cannot
   manufacture a close. PAID_IDS then guarantees each item is paid exactly once. */
function checkJackpot(){
  if(!user||!DATA||jackpotShown) return;
  var res=creditClosed();
  if(!res.any) return;              // nothing new to credit
  jackpotShown=true;
  /* SILENT WHEN IT PAYS NOTHING. Sam's call, 2026-08-04. Once a day's tier is spent,
     further closes still need crediting (so they are never offered twice) but they are
     worth zero — and a full-screen panel announcing zero is a letdown wearing a
     jackpot's clothes, which is the opposite of what this was built for. The items are
     still banked and still appear under "Closed for you" in the service record, so
     nothing is hidden; it just does not interrupt to say nothing happened.
     A modal means a payout. */
  if(res.award<=0) return;
  paintReactor(); checkPromotion();   // a big push can promote him
  showJackpot(res);
}

/* THE SCORING RULE IS SAM'S, and it is better than counting closes.

     closed nothing           -> 0
     closed, backlog flat/up  -> 1
     closed, backlog down 1-2 -> 2
     closed, backlog down 3+  -> 3

   Scoring the BACKLOG DELTA rather than the number of items closed is what makes this
   unfarmable, and it needs no anti-gaming rule because the metric is the anti-gaming
   rule: writing six todos and closing them raises the total by six and lowers it by
   six, so it pays the floor. His words: "there is no reason to reward equally for
   minor tasks that I could just tell you to create and then close."

   `Math.min(items.length, ...)` is the refinement on top: never pay more points than
   items actually closed, or closing one item on a day the backlog happened to drop by
   one would pay two.

   Each date is scored on its own doc, and credit lands on the DATE THE WORK HAPPENED,
   not the date he opened the app. A Monday push read on Wednesday still scores Monday. */
function creditClosed(){
  var paidSet={}; (PAID_IDS||[]).forEach(function(i){ paidSet[i]=1; });
  var byDate=[], award=0, any=false, dirty=false;
  Object.keys(CLOSED).sort().forEach(function(d){
    var doc=CLOSED[d]||{};
    var items=(doc.items||[]).filter(function(it){ return it&&it.id&&!paidSet[it.id]; });
    if(!items.length) return;
    any=true;
    var net=(typeof doc.net==='number') ? doc.net
          : ((doc.open_before||0)-(doc.open_after||0));
    var tier = net>=3 ? 3 : net>=1 ? 2 : 1;
    /* The tier caps the DAY, not the payout. Subtracting what the day has already
       earned is load-bearing: two sessions closing things on the same day each get a
       push, and without this the second one would pay the floor a second time — a day
       whose backlog went UP could quietly pay 2 or 3 by being pushed in instalments,
       which is precisely the loophole the backlog rule exists to shut. */
    var earned = SESSION_XP[d]||0;
    var room   = Math.max(0, W.sessionCap-earned);
    var pts    = Math.min(items.length, Math.max(0, tier-earned), room);
    if(pts){ SESSION_XP[d]=(SESSION_XP[d]||0)+pts; award+=pts; dirty=true; }
    byDate.push({date:d, items:items, net:net, pts:pts, tier:tier,
                 capped:(pts<Math.min(items.length,tier))});
    items.forEach(function(it){ paidSet[it.id]=1; });
  });
  if(any){
    /* Trim the bank to ids still visible in the lookback window. Left ungoverned this
       array grows forever inside a doc that is read on every single load. Anything that
       ages out can never be re-offered anyway, because its doc is no longer read. */
    var live={};
    Object.keys(CLOSED).forEach(function(d){
      (CLOSED[d].items||[]).forEach(function(it){ if(it&&it.id) live[it.id]=1; });
    });
    PAID_IDS=Object.keys(paidSet).filter(function(i){ return live[i]; });
    dirty=true;
  }
  if(dirty){
    db.collection('bridge_state').doc('_streak')
      .set({paid_ids:PAID_IDS, session_xp:SESSION_XP},{merge:true}).catch(function(){});
  }
  return {award:award, byDate:byDate, any:any};
}

/* The reels, shared by both payouts. Extracted 2026-08-05 when the intake jackpot
   landed: the digit strip, the 66px pitch and the 0.13s stagger live in one place so a
   second payout cannot drift away from the first.

   RM is honoured here, which the inline version did not do. The strip moves on a CSS
   TRANSITION, and the reduced-motion block in this file only kills `animation`, so a
   1.2s spin still played for a reader who had asked for no motion. Under RM the digit
   is placed rather than spun. */
function jpReels(award){
  var reels=el('div','jp-reels');
  reels.appendChild(el('span','jp-plus','+'));
  var strips=[];
  String(award).split('').forEach(function(dg){
    var reel=el('div','jp-reel'), strip=el('div','jp-strip');
    for(var n=0;n<=9;n++) strip.appendChild(el('b','',String(n)));
    reel.appendChild(strip); reels.appendChild(reel);
    strips.push({strip:strip,d:parseInt(dg,10)});
  });
  function land(x,i,animate){
    if(animate) x.strip.style.transitionDelay=(i*0.13)+'s';
    else x.strip.style.transition='none';
    x.strip.style.transform='translateY(-'+(x.d*66)+'px)';
  }
  if(RM){ strips.forEach(function(x,i){ land(x,i,false); }); }
  /* Next frame, not this one. Setting the transform while the node is still being
     built gives the browser no start value to animate from, and the reel just snaps. */
  else requestAnimationFrame(function(){
    strips.forEach(function(x,i){ land(x,i,true); });
  });
  return reels;
}

/* THE INTAKE PAYOUT. Same slot machine as the session jackpot, deliberately: these are
   the two things on the board that pay 3 in one go, and giving the second one its own
   visual language would make one reward look like two systems.

   IT AWARDS NOTHING. intakeXp() already folded the 3 into dayXp() the instant the third
   component landed. This announces it. Adding points here would double-count.

   Unlike the session jackpot it NEEDS a once-per-day guard, and the asymmetry is the
   whole reason the session design could go without one: a session close cannot be
   manufactured by reloading, whereas intake can be re-manufactured all afternoon by
   untapping the multivitamin and tapping it again. The guard is persisted in
   bridge_state/{date}, not held in memory, or a reload on an already-complete day would
   replay it every single time. */
function showHabitJackpot(kicker, award, why){
  var r=rank(), wrap=el('div','jp'), card=el('div','jp-card'), head=el('div','jp-head');
  head.appendChild(el('div','jp-kicker',kicker));
  head.appendChild(jpReels(award));
  head.appendChild(el('div','jp-sub', why+' <b>'+r.xp+'</b> logged, '+esc(r.name)+
    (r.next?' &middot; <b>'+r.toNext+'</b> to '+esc(r.next.name):' &middot; top of the ladder')+'.'));
  var btn=el('button','jp-btn','Collect');
  function close(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }
  btn.addEventListener('click',close);
  wrap.addEventListener('click',function(e){ if(e.target===wrap) close(); });
  /* No .jp-scroll: these payouts have no list to show. The card is a flex column whose
     head and button are both flex:0 0 auto, so it sizes to content and the max-height
     bound still applies. */
  card.appendChild(head); card.appendChild(btn);
  wrap.appendChild(card);
  document.body.appendChild(wrap);
}
function showIntakeJackpot(){
  showHabitJackpot('Intake complete', W.intake,
    '<b>'+(WATER_TARGET*WATER_OZ)+'oz</b>, fire cider and the multivitamin. All three, '+
    'which is the only way this one pays.');
}
function showRoutineJackpot(){
  var n=routineSteps().length;
  showHabitJackpot('Routine complete', W.routine,
    'All <b>'+n+'</b> ticked, start to finish. Part of it is worth nothing; '+
    'the whole of it is worth '+W.routine+'.');
}

function showJackpot(res){
  var r=rank(), wrap=el('div','jp'), card=el('div','jp-card');
  var head=el('div','jp-head'), scroll=el('div','jp-scroll');
  var total=0; res.byDate.forEach(function(g){ total+=g.items.length; });

  head.appendChild(el('div','jp-kicker','Closed while you were away'));
  head.appendChild(jpReels(res.award));

  /* showJackpot is only ever reached with award > 0 now, so there is no zero variant
     to carry. Per-DATE totals can still be 0 inside a multi-day payout — that case is
     real and is rendered below with the reason beside it. */
  head.appendChild(el('div','jp-sub',
    '<b>'+total+'</b> item'+(total===1?'':'s')+' closed for you. <b>'+r.xp+'</b> logged, '+
    esc(r.name)+
    (r.next?' &middot; <b>'+r.toNext+'</b> to '+esc(r.next.name):' &middot; top of the ladder')+'.'));

  /* WHAT it paid for, and WHY that is the number. Sam could not tick these off himself
     because he did not know what had been done -- the list is the feature, the number is
     the garnish. But the score line and the reasoning stay VISIBLE while the list itself
     collapses: 22 rows expanded is what made the first payout unreadable, and a payout
     that opens by burying its own explanation has the priorities backwards. */
  res.byDate.slice().reverse().forEach(function(g){
    var box=el('div','jp-wait');
    var why = g.net>=3 ? 'backlog down '+g.net
            : g.net>=1 ? 'backlog down '+g.net+', so 2 is the ceiling'
            : (g.net===0 ? 'backlog flat — as many opened as closed, so this pays the floor'
                         : 'backlog UP '+(-g.net)+' — more was opened than closed, so this pays the floor');
    box.innerHTML='<div style="color:var(--ink);font-weight:700;margin-bottom:5px">'+
      esc(g.date)+' &middot; '+g.items.length+' closed &middot; +'+g.pts+
      (g.capped?' (daily cap)':'')+'</div>'+
      '<div style="color:var(--ink-mute)">'+esc(why)+'</div>';
    var det=el('details','jp-det');
    det.appendChild(el('summary','', 'Show the '+g.items.length+' item'+(g.items.length===1?'':'s')));
    det.appendChild(el('div','jp-items', g.items.map(function(it){
      return '<div style="margin:4px 0">· '+esc(it.text)+'</div>'; }).join('')));
    box.appendChild(det);
    scroll.appendChild(box);
  });

  var btn=el('button','jp-btn','Collect');
  function close(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }
  btn.addEventListener('click',close);
  wrap.addEventListener('click',function(e){ if(e.target===wrap) close(); });
  card.appendChild(head); card.appendChild(scroll); card.appendChild(btn);
  wrap.appendChild(card);
  document.body.appendChild(wrap);
}

/* ══ THE WEEKLY PAYOUT ═══════════════════════════════════════════════════════
   Added 2026-08-10, and it exists because of one specific morning. Sam closed the
   week of 3–9 August having broken the weekly sales target, held labor at 30.0%
   inside the band, and set a covers record on the Saturday. He opened the Bridge on
   the Monday and got nothing, because the week had rolled over at midnight and
   there was no moment anywhere in the file that looked at a week that had ENDED.
   His words: "We didn't get any points at Sunday close."

   The scorecard has always shown pace. Pace is a live reading and a live reading has
   no memory: at 00:00 Monday `weekBounds()` moved to the new week and the finished
   one stopped existing. A card that only ever says "how are you doing" can never say
   "you did it."

   So this is the closing ceremony, and it deliberately reuses the jackpot's slot
   machine rather than inventing a second visual language. There are now three things
   on this board that pay in a lump — session work, the intake block, and a completed
   period — and giving the third its own treatment would make one reward system look
   like three.

   IT FIRES ON THE FIRST OPEN AFTER THE WEEK ENDS, not on a schedule, for the same
   reason the jackpot does: nothing on this page runs when the page is closed. Monday
   at 6am is when he looks, so Monday at 6am is when the week gets paid. */
var weeklyShown=false;
function checkWeekly(){
  if(!user||!DATA||weeklyShown) return;
  weeklyShown=true;

  /* THREE SOURCES, ONE PAYOUT. The routine week and the covers record settle
     synchronously off data already in hand; the work week needs Revel and does not.
     They are gathered into one modal rather than fired as three, because a Monday
     that opens with three stacked panels is a chore, and a chore arriving as a reward
     is exactly the failure that killed the first version of session credit. */
  var rows=[];
  var cw=creditWeeks();
  cw.weeks.forEach(function(g){
    var why = g.n===7 ? 'Every day. That is the whole thing.'
            : g.n>=4  ? g.n+' of 7. A full week pays '+W.routineWeek+'.'
                      : g.n+' of 7, under the four-day floor.';
    if(g.run>=2) why+=' '+g.run+' perfect weeks running, multiplied by '+perfectMult(g.run)+'.';
    rows.push({label:g.week+' · routine '+g.n+'/7', pts:g.pts, why:why});
  });
  /* The training week, beside the routine week it mirrors. The why-line itemises
     the four parts because a single opaque number teaches nothing about which
     lever paid — and the levers are the whole design. */
  (cw.worf||[]).forEach(function(g){
    var bits=[g.rows+'/7 rows'];
    if(g.st>0||g.pts>0) bits.push(g.st+'/3 strength');
    bits.push(g.m.toLocaleString('en-US')+'m'+(g.m>=W.metersGoal?', goal met':' of '+W.metersGoal.toLocaleString('en-US')));
    rows.push({label:g.week+' · training', pts:g.pts, why:bits.join(' · ')+'.'});
  });
  creditMonths().forEach(function(m){
    rows.push({label:m.month+' · perfect month', pts:m.pts,
               why:'Every single day of the month. Nothing else on this board pays '+W.perfectMonth+'.'});
  });
  var rec=creditCoversRecord();
  if(rec) rows.push({label:shortDate(rec.date)+' · covers record', pts:rec.pts,
                     why:rec.n+' covers, from '+rec.src+'. This one lands on the night '+
                         'itself, so it moves that day as well as the commission.'});

  creditWeekWins().then(function(w){
    (w&&w.weeks||[]).forEach(function(g){
      if(g.nodata){
        rows.push({label:g.week+' · service', pts:0,
                   why:'Only '+g.nights+' of 7 nights ever reached the Bridge and the week '+
                       'has now aged past the Revel window. Not scored, rather than scored low.'});
        return;
      }
      var bits=[];
      bits.push(money(g.prod)+' against '+money(g.tgt)+(g.sales?', beaten':', short'));
      if(g.lab!=null) bits.push('labor '+pct(g.lab)+(g.exc?', under the excellent line':(g.band?', inside the band':', over the band')));
      rows.push({label:g.week+' · service', pts:g.pts, why:bits.join(' · ')+'.'});
    });
    var award=rows.reduce(function(a,b){ return a+(+b.pts||0); },0);
    if(!rows.length) return;
    paintReactor(); checkPromotion();    // a perfect week or a record can promote him
    /* Silent when it pays nothing, exactly like the jackpot and for the same reason.
       A 3/7 week is still SETTLED above so it can never be scored twice, but a
       full-screen panel announcing zero is a letdown wearing a payout's clothes. */
    if(award<=0) return;
    /* ONE MODAL AT A TIME. A Monday can carry both a session jackpot and this, and
       stacking two full-screen panels means the second is dismissed blind by the same
       tap that closed the first. Wait for the board to clear. */
    (function show(){
      if(document.querySelector('.jp')) return setTimeout(show,400);
      showWeekly({award:award, rows:rows});
    })();
  });
}

/* A PERFECT CALENDAR MONTH. Every day in the month carries the routine, which means
   28 to 31 consecutive days without a miss. Settled once the month is over, keyed by
   month, and it is the largest single award on the board on purpose.
   Requires a row for every day: a month with a gap in the ledger is a month he did not
   open the Bridge on some day, and crediting a perfect month off incomplete evidence
   would hand out the biggest award for the thinnest proof. */
function creditMonths(){
  var rows=(ledger.days||[]).filter(function(x){ return x&&x.d; });
  if(!rows.length) return [];
  var byMonth={};
  rows.forEach(function(x){ (byMonth[x.d.slice(0,7)]=byMonth[x.d.slice(0,7)]||[]).push(x); });
  var thisMonth=DATE.slice(0,7), out=[], dirty=false;
  Object.keys(byMonth).sort().forEach(function(mk){
    if(mk>=thisMonth) return;                       // not over yet
    if(AWARDS['pm:'+mk]) return;
    var y=+mk.slice(0,4), mo=+mk.slice(5,7);
    var dim=new Date(y,mo,0).getDate();             // day 0 of next month = last of this
    var got=byMonth[mk].filter(function(x){ return !!x.rt; }).length;
    var pts=(byMonth[mk].length===dim && got===dim) ? W.perfectMonth : 0;
    AWARDS['pm:'+mk]={pts:pts, month:mk, got:got, of:dim, at:DATE};
    dirty=true;
    if(pts>0) out.push({month:mk, pts:pts, got:got, of:dim});
  });
  if(dirty) saveAwards();
  return out;
}

function showWeekly(res){
  var r=rank(), wrap=el('div','jp'), card=el('div','jp-card');
  var head=el('div','jp-head'), scroll=el('div','jp-scroll');

  head.appendChild(el('div','jp-kicker','The week is in'));
  head.appendChild(jpReels(res.award));
  head.appendChild(el('div','jp-sub',
    '<b>'+r.xp+'</b> logged, '+esc(r.name)+
    (r.next?' &middot; <b>'+r.toNext+'</b> to '+esc(r.next.name):' &middot; top of the ladder')+
    '. This is rank only, so it does not touch your daily average.'));

  /* The reason is the feature. A convex curve is not guessable from its output — 6/7
     paying 5 and 5/7 paying 2 looks arbitrary unless the run is stated — and a score
     whose arithmetic is invisible stops being believed. Same for a week that beat its
     sales bar by $9k: the bar has to be on screen or the 3 points are just a number. */
  res.rows.forEach(function(g){
    var box=el('div','jp-wait');
    box.innerHTML='<div style="color:var(--ink);font-weight:700;margin-bottom:5px">'+
      esc(g.label)+' &middot; +'+g.pts+'</div>'+
      '<div style="color:var(--ink-mute)">'+esc(g.why)+'</div>';
    scroll.appendChild(box);
  });

  var btn=el('button','jp-btn','Collect');
  function close(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }
  btn.addEventListener('click',close);
  wrap.addEventListener('click',function(e){ if(e.target===wrap) close(); });
  card.appendChild(head); card.appendChild(scroll); card.appendChild(btn);
  wrap.appendChild(card);
  document.body.appendChild(wrap);
}

function paintReactor(){
  var host=$('#rxStats'); if(!host) return;
  var arc=$('#rxQuest');
  /* A failed read is not a day with nothing on it. Printing "0 of 0" and a backlog
     of 0 here would be the dial quietly asserting a fact it does not have, which is
     the exact failure this app was built to refuse. Unknown reads as unknown. */
  if(!DATA && LOAD_ERR){
    if(arc) arc.style.strokeDashoffset=String(C_Q);
    host.className='rx-home unknown';
    host.textContent='Rank, streak and backlog are unknown while the read is failing.';
    return;
  }
  host.className='rx-home';
  var q=questSet();
  if(arc) arc.style.strokeDashoffset=String(C_Q*(1-(q.total?q.done/q.total:0)));
  var rk=rank(), sd=streakDays();

  /* THE HOME VIEW. Three lines: who Sam is, how far to the next rung, and what
     today is worth so far.

     The full rank NAME, not the abbreviation. The old strip printed "LCDR"
     because three cells had to share 311px; this line has the whole width, and
     "Lieutenant Commander" is the thing being earned. */
  var out='<div class="rh-top">'+rankCollar(rk.key)+
          '<span class="rh-name">'+esc(rk.name)+'</span>'+
          '<span class="rx-go mono">›</span></div>';

  // The arc to the next rung. At the top of the ladder there is no next, so the
  // bar reads full and says so rather than drawing an empty track forever.
  var pctSpan=Math.max(0,Math.min(1,rk.span));
  out+='<div class="rh-line"><span class="rh-bar"><i style="width:'+
       (pctSpan*100).toFixed(1)+'%"></i></span>'+
       '<span class="rh-cap">'+(rk.next
         ? '<b>'+rk.xp+'</b> / '+rk.next.at
         : '<b>'+rk.xp+'</b> · top of the ladder')+'</span></div>';

  /* TODAY, as marks against the ceiling. `20` on its own means nothing without
     knowing the ceiling is 20, which is Sam's own reason for choosing this over
     the integer. dayXp() is tick-derived and sessionXpOn adds what a session
     closed in his name — the same two sources xpTotal() adds, and added the same
     way here so this line can never disagree with the ladder above it.
     Marks are capped at the ceiling for DRAWING only. The caption prints the
     real figure, so an over-ceiling day (session credit landing on a full day)
     says 21 rather than silently rounding itself down to fit its own graphic. */
  var ceil=dayCeiling(), today=dayXp()+sessionXpOn(DATE), lit=Math.min(today,ceil), marks='';
  for(var i=0;i<ceil;i++) marks+='<i class="'+(i<lit?'on':'')+'"></i>';
  var meta='<b>'+today+'</b> today';
  meta += sd ? ' · '+sd+'d streak' : ' · no streak';
  /* Backlog comes from the punch list, so on a day with no brief it is not zero,
     it is unknown. "0 open, down 251 this week" would be a fabrication. */
  if(!DATA){
    meta+=' · backlog unknown';
  } else {
    var bl=backlogTrend();
    meta+=' · '+bl.n+' open';
    if(bl.delta!==null && bl.delta!==0)
      meta+=' <em class="'+(bl.delta>0?'dn':'')+'">'+(bl.delta>0?'+':'')+bl.delta+'</em>';
  }
  out+='<div class="rh-line"><span class="rh-marks">'+marks+'</span>'+
       '<span class="rh-cap">'+meta+'</span></div>';
  host.innerHTML=out;
}
/* Bound once, not per paint: paintReactor rewrites innerHTML on every tick and

$('#rxStats').addEventListener('click',function(){

});
// Both arcs start fully retracted so the first paint is a sweep from zero, not a
